conditional:
  # 표준 path 에 데이터가 없을 때만 읽는다 — 표준 path 가 채워진 크롤에서는 미읽음이 정상이다.
  PCIeDevice: "2026-10-19 A-8: StorageControllers/Controllers 가 없는데 드라이브가 있는 Storage 멤버의 컨트롤러 정체를 섀시 PCIeDevices 에서 찾을 때만 읽는다"
  PCIeDeviceCollection: "PCIeDevice 와 같은 조건(A-8)에서만 섀시 Chassis.PCIeDevices 링크를 따라 읽는다"
  PCIeFunction: "[판단 필요] PCIe 기능(DeviceClass/VendorId/DeviceId) — 현재 코드는 PCIeDevices 까지만 조건부로 읽고 Functions 는 따라가지 않는다"
  PCIeFunctionCollection: "PCIeFunction 과 같다 — 조건부 PCIeDevice 읽기에서도 Functions 컬렉션은 따라가지 않는다"
  PCIeSlots: "[판단 필요] PCIe 슬롯 점유표 — 슬롯 라벨은 PCIeDevice.Slot 으로 조건부 확보, 빈 슬롯 목록은 읽지 않는다"
  NetworkInterface: "2026-10-19 A-5: 섀시 NetworkAdapters 에서 카드를 하나도 얻지 못했을 때만 Systems/{id}/NetworkInterfaces 의 Links.NetworkAdapter 를 따라간다"
  NetworkInterfaceCollection: "NetworkInterface 와 같은 조건(A-5)에서만 읽는다"
  DriveCollection: "섀시 수준 Chassis/{id}/Drives — Storage 멤버가 Drives 를 주지 않을 때의 fallback 이며 StoragePools 하위 ProvidingDrives 는 범위 밖"
  Chassis: "System 이 링크하지 않는 드라이브 백플레인/컨트롤러 엔클로저 섀시(Enclosure.Internal.* · DE00C000 · Chassis/3) — 1순위 섀시에 카드/드라이브가 없을 때만 다른 섀시를 읽는다"
  PowerSubsystem: "DMTF 2020.4 신 schema — legacy Chassis/Power 가 404 일 때만 fallback 으로 읽는다 (CSUS RMC 에서 실제 사용)"
  PowerSupply: "PowerSubsystem/PowerSupplies/* — legacy Power 의 PowerSupplies[] 인라인이 있으면 읽지 않는다"
  PowerSupplyCollection: "PowerSubsystem fallback 경로에서만 읽는다"
  ThermalSubsystem: "DMTF 2020.4 신 schema — legacy Chassis/Thermal 이 404 일 때만 fallback 으로 읽는다"
  Fan: "ThermalSubsystem/Fans/* — legacy Thermal 의 Fans[] 인라인이 있으면 읽지 않는다 (RPM 은 Chassis/Sensors 의 fan 센서로 보강)"
  FanCollection: "ThermalSubsystem fallback 경로에서만 읽는다"
  SimpleStorage: "Storage → SimpleStorage → SmartStorage 순 fallback — 표준 Storage 가 있으면 읽지 않는다"
  SimpleStorageCollection: "SimpleStorage fallback 경로에서만 읽는다"
  StorageController: "Storage 본문의 StorageControllers[] 인라인이 없을 때만 Controllers 서브링크를 읽는다 (HPE iLO6 은 인라인이 없어 실제로 읽는다)"
  StorageControllerCollection: "StorageController 와 같은 조건에서만 읽는다"
  Port: "NetworkAdapter 의 Ports(신 schema)는 legacy NetworkPorts 가 없을 때만 읽는다(HPE iLO6 은 읽는다); CPU UPI 포트·Fabric/Switch 포트·RMC 관리 포트는 인벤토리 범위 밖"
  PortCollection: "Port 와 같다"
  Fabric: "Fabrics 는 CSUS/Superdome 멀티노드 토폴로지(manager_layout=rmc_primary)에서만 읽는다 — 단일노드의 PCIe/스토리지 Fabric 은 범위 밖"
  FabricCollection: "Fabric 과 같다"
  Switch: "Fabric 과 같다 — 멀티노드 토폴로지에서만 읽는다"
  SwitchCollection: "Fabric 과 같다"

path_patterns:
  # 타입은 읽지만 특정 인스턴스는 GET 전에 거른다 (types/conditional 에 없는 타입에만 적용).
  "(?i)/(Settings|Pending)/?$": "@Redfish.Settings 대기 리소스(Bios/Settings · Systems/{id}/Settings|Pending · NetworkAdapter/Port/NDF/Volume/Controller Settings) — 적용 전 설정값이라 읽지 않는다 (redfish_gather 2733행)"
  "/UpdateService/FirmwareInventory/(Installed|Current|Previous|Available|Rollback)-": "Dell FirmwareInventory 의 status 접두사 중복 표현 — 같은 컴포넌트·같은 버전은 GET 전 URI tail 로 dedup(first-seen), Previous- 는 비활성 이전 버전이라 GET 하지 않는다"
  "/UpdateService/SoftwareInventory(/|$)": "펌웨어가 아닌 소프트웨어 인벤토리 컬렉션(Cisco DeviceConnector 등) — firmware 섹션은 FirmwareInventory 만 읽는다"
  "/Systems/[^/]+/NetworkInterfaces/": "Systems/{id}/NetworkInterfaces 하위 트리(NetworkPorts·NetworkDeviceFunctions)는 섀시 NetworkAdapters 하위와 같은 자원의 거울 — A-5 fallback 에서도 Links.NetworkAdapter 만 따라간다"
  "/Volumes/Capabilities/?$": "볼륨 생성 capability 템플릿 — 실제 볼륨이 아니다"
  "/Systems/Capabilities/?$": "CompositionService 조립 capability 템플릿 — 실제 System 이 아니다"
  "/CompositionService/ResourceBlocks/[^/]+/Systems/": "ResourceBlock 안의 노드 System 거울(및 그 Processors/SubProcessors/UPI Ports/Memory/EthernetInterfaces) — 파티션 System(Systems/Partition0) 과 ResourceBlock 본문으로 같은 정보를 읽는다"
  "/SubProcessors(/|$)": "코어/스레드 단위 SubProcessor — Processor 본문의 TotalCores/TotalThreads 로 충분하다"
  "/Chassis/[^/]+/Processors(/|$)": "섀시 측 Processors 컬렉션(CSUS) — System 측 Processors 로 읽는다"
  "/StoragePools/": "StoragePools 하위(AllocatedVolumes · CapacitySources · ProvidingDrives) — Swordfish 풀 모델은 범위 밖, RAID 볼륨은 Storage/Volumes 로 읽는다"
  "/HostInterfaces/": "HostInterface 하위(HostEthernetInterfaces) — NC-SI/USB NIC 설정이라 범위 밖"
  "/Oem/Dell/(PowerMetrics|ThermalMetrics)/?$": "Dell GPU(Video.Slot.*) OEM 전력·온도 메트릭 — @odata.type 만 Power/Thermal 이고 내용은 측정값이다"
  "/NetworkAdapters/[^/]+/NetworkDeviceFunctions/?$": "어댑터 본문에 NetworkDeviceFunctions 링크가 없는 카드(HPE iLO6 BCM5719 OCP DA000000 — 리소스 디렉터리로만 열거)의 NDF 컬렉션 — 수집기는 어댑터 본문의 링크만 따른다. 링크가 있는 카드의 컬렉션·멤버는 읽는다(타입 NetworkDeviceFunction 이 가드)"
  "/NetworkAdapters/slot-[0-9]+/NetworkPorts/?$": "Lenovo XCC 는 빈 PCIe 슬롯도 NetworkAdapter(slot-N · Manufacturer/Model 공백 · 포트 0개)로 노출한다 — 수집기는 빈 슬롯 카드를 제외하므로 그 NetworkPorts 컬렉션을 따라가지 않는다 (카드가 있는 slot-9 는 읽는다)"
