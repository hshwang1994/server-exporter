# tests/reference/redfish/coverage_allowlist.yml — Redfish 커버리지 감사 허용 목록 (2026-10-19)
#
# 수집기(redfish_gather.py)가 전수 크롤 위에서 한 번도 GET 하지 않는 리소스를 @odata.type 별로 분류한다.
# 시험: tests/regression/test_redfish_coverage_audit.py · 도구: scripts/ai/redfish_coverage_diff.py
#
#   types:         의도적으로 읽지 않는 타입 → 사유. 여기 있는 타입이 미읽음이어도 정상이다.
#   conditional:   표준 path 에 데이터가 없을 때만(404 fallback · 인라인 부재 · 멀티노드 layout) 읽는 타입 → 사유.
#                  표준 path 가 데이터를 주는 크롤(Dell/HPE/Lenovo/Cisco)에서는 미읽음으로 남는 것이 정상이다.
#   path_patterns: 타입은 읽지만 특정 인스턴스를 GET 전에 거르는 경우 → path 정규식(re.search) → 사유.
#                  types/conditional 에 없는 타입의 path 에만 적용된다.
#
# 타입 이름은 @odata.type 에서 '#' 과 버전을 뗀 마지막 토큰 ('#Sensor.v1_2_0.Sensor' → 'Sensor').
# 새 타입이 미읽음으로 잡히면: 읽기 시작했거나(코드) 여기에 사유를 적어라(목록). 사유 없는 항목은 시험이 거부한다.
# `_reasons` 는 공유 사유의 YAML anchor 모음이다 — 로더는 types / conditional / path_patterns 만 읽는다.
#
# [판단 필요] 표시는 인벤토리성 정보를 담고 있지만 현재 읽지 않는 항목이다. 읽기로 결정하면 이 목록에서 지워라.

_reasons:
  sensor: &sensor "센서 읽기값(온도·전압·회전수) — 인벤토리가 아니라 상태다. Fan RPM 역색인에 필요한 fan 센서만 Thermal 수집기가 선택적으로 읽는다"
  metrics: &metrics "*Metrics 리소스 — 순간 측정값/누적 통계라 인벤토리 범위 밖"
  telemetry: &telemetry "TelemetryService 하위 — 메트릭 정의/보고/트리거라 인벤토리 범위 밖"
  logs: &logs "로그 항목/로그 서비스 — 이벤트 이력이라 인벤토리 범위 밖 (SEL/LC/IML 은 크기도 매우 크다)"
  certs: &certs "인증서·서명·키·SecureBoot 데이터베이스 — 보안 자료라 수집하지 않는다"
  schema: &schema "JSON schema / 메시지 레지스트리 파일 — 서버가 노출하는 스키마 정의일 뿐 장비 정보가 아니다"
  accounts: &accounts "계정·역할·권한·세션 — gather 는 읽지 않는다 (Account Reconcile 경로만 AccountService 를 다룬다)"
  tasks: &tasks "Task/Job 서비스 — 비동기 작업 상태라 인벤토리 범위 밖"
  events: &events "이벤트 구독/전달 — 알림 설정이라 인벤토리 범위 밖"
  media: &media "VirtualMedia · HostInterface(NC-SI/USB NIC) · SerialInterface — BMC 콘솔/매체 설정이라 인벤토리 범위 밖"
  assembly: &assembly "Assembly(FRU 세부 조립 정보) — 상위 리소스(Chassis/Processor/Memory)의 식별 필드로 충분하다"
  bootopt: &bootopt "UEFI 부트 항목/부트 소스 — 부팅 설정이라 인벤토리 범위 밖"
  license: &license "라이선스 — 하드웨어 인벤토리 아님"
  updateservice: &updateservice "UpdateService 본문은 읽지 않고 FirmwareInventory 컬렉션으로 바로 간다 (경로가 표준이라 링크를 따를 필요가 없다)"
  misc_service: &misc_service "서비스/설정 리소스 — 장비 구성 정보가 아니라 BMC 기능 설정이다"
  pools: &pools "StoragePools(Swordfish 풀/용량원/할당 볼륨) — RAID 볼륨은 Storage/Volumes 로 읽고 풀 모델은 범위 밖"
  dell_mirror: &dell_mirror "Dell OEM 거울 — 같은 정보를 표준 리소스(ComputerSystem/Chassis/Storage/UpdateService) 본문의 Oem.Dell 인라인 또는 표준 컬렉션에서 이미 읽는다"
  dell_detail: &dell_detail "[판단 필요] Dell OEM 상세(제조일·슬롯·PCI ID·NIC 모드·트랜시버·배터리 등) — 표준 리소스로 식별·용량·펌웨어는 얻지만 이 OEM 상세는 읽지 않는다"
  dell_sensor: &dell_sensor "Dell OEM 센서/롤업 상태 — 상태값이라 인벤토리 범위 밖"
  dell_service: &dell_service "Dell OEM 서비스/작업/인증서/라이선스 리소스 — BMC 기능이라 인벤토리 범위 밖"
  hpe_inventory: &hpe_inventory "[판단 필요] HPE OEM 장치/PCI 인벤토리(Chassis/1/Devices · Systems/1/PCIDevices · PCISlots) — 표준 PCIeDevices 가 비었을 때의 OEM 대안이 될 수 있으나 현재 읽지 않는다"
  hpe_update: &hpe_update "HPE 업데이트 저장소/설치 세트/보고서 — 올라온 업데이트 패키지라 설치된 펌웨어(FirmwareInventory)와 다르다"
  hpe_service: &hpe_service "HPE iLO 기능 설정(보안·SNMP·연합·백업·SSO·원격지원·라이선스 등) — 인벤토리 범위 밖"
  hpe_metrics: &hpe_metrics "HPE 전력 계측/성능 조언 — 측정값이라 인벤토리 범위 밖"
  hpe_usb: &hpe_usb "USB 포트/장치 — 사용자 지시(2026-10-19)로 범위 밖"
  lenovo_slot: &lenovo_slot "[판단 필요] Lenovo OEM 슬롯 점유 정보 — 표준 PCIeSlots 와 같은 성격이며 현재 읽지 않는다"
  lenovo_state: &lenovo_state "Lenovo OEM LED/이력 메트릭/워치독/예약 전원 — 상태·설정이라 인벤토리 범위 밖"
  lenovo_service: &lenovo_service "Lenovo OEM 서비스(DNS·LDAP·SMTP·SNMP·원격제어·부트·FoD·보안·프로필·서비스데이터) — BMC 기능이라 인벤토리 범위 밖"
  compose: &compose "CompositionService 조립 단위/액션 정보 — 멀티노드 토폴로지는 ResourceBlock 본문으로 읽고 조립 템플릿은 범위 밖"

