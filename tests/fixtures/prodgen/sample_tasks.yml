---
# sample_tasks.yml — prodgen golden fixture (YAML layer 1 + Jinja + embedded shell/PowerShell)
#   full-line comments and trailing comments are removed; data '#' is preserved.

- name: "sample | plain scalars"   # trailing comment after a quoted scalar
  ansible.builtin.set_fact:
    quoted: "a # b"                # trailing comment
    single: 'c # d'
    url: http://example.invalid/#fragment
    flow: [1, 2]  # after a flow sequence
    folded: >-
      keep # this hash is data
      second line
    literal: |
      # literal block content keeps its hash lines
      value: 1
  no_log: false

# explanatory block between tasks
#   continues here

- name: "sample | jinja comments"
  ansible.builtin.set_fact:
    computed: >-
      {%- set out = [] -%}
      {# Round N: explain why the loop exists
         and keep explaining on a second line #}
      {%- for item in [1, 2, 3] -%}
        {%- set _ = out.append(item) -%}   {#- inline whitespace-controlled comment -#}
      {%- endfor -%}
      {{ out }}

- name: "sample | shell block"
  ansible.builtin.raw: |
    #!/bin/sh
    # full-line shell comment
    export LANG=C   # trailing shell comment
    n=$#
    echo "$# args" '# not a comment' "# nor this"
    awk '{ gsub(/#/, "_"); print }' /dev/null
    case "$1" in
      "#"*) echo quoted-hash ;;   # trailing after case arm
    esac
  register: _raw
  changed_when: false

- name: "sample | argv keeps hashes"
  ansible.builtin.command: |
    printf '%s' '# literal argument'

- name: "sample | powershell block"
  ansible.windows.win_shell: |
    #requires -Version 5
    # full-line PowerShell comment
    $s = 'it''s # not a comment' + "x # y $(1 + 1)"   # trailing comment
    Get-Volume | Where-Object { $_.Size -gt 0 } | ConvertTo-Json -Compress
  register: _ps
