---

- name: "esxi-gather"
  hosts: all
  gather_facts: false
  connection: local
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/failure_reasons.yml"

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _e_ip:   "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
    _e_user: "{{ ansible_user | default('') }}"
    _e_pass: "{{ ansible_password | default('') }}"

  tasks:

    - name: "esxi | gather"
      block:

        - name: "esxi | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        - name: "esxi | run precheck"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/precheck/run_precheck.yml"
          vars:
            _precheck_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
            _precheck_channel: "esxi"
            _precheck_timeout: 1800

        - name: "esxi | abort if precheck failed"
          ansible.builtin.fail:
            msg: >-
              ESXi 호스트 연결 진단에 실패했습니다 ({{ _e_ip }}).
              단계={{ (_diagnosis | default({})).failure_stage | default('unknown') }},
              사유={{ (_diagnosis | default({})).failure_reason | default('연결 불가') }}.
              ESXi 호스트 전원, 네트워크, vSphere API(443) 포트를 확인하세요.
          when: not (_precheck_ok | bool)

        - name: "esxi | resolve credentials"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/resolve_and_load.yml"
          vars:
            _cred_target_type: "esxi"

        - name: "esxi | abort if credential set unavailable"
          ansible.builtin.fail:
            msg: >-
              Credential set 을 열 수 없습니다 (scope={{ _cred_scope | default('') | ternary(_cred_scope, _cred_reason) }},
              outcome={{ _cred_load_outcome | default('not_resolved') }}).
              se_location 값과 해당 Location 의 vault 파일, ansible-vault 복호화 키를 확인하세요.
          when: _cred_load_outcome | default('not_resolved') in
                ['not_resolved', 'credential_set_missing', 'credential_set_undecryptable']

        - name: "esxi | try credentials"
          ansible.builtin.include_tasks: tasks/try_credentials.yml
          vars:
            _e_accounts: "{{ _cred_accounts | default([]) }}"

        - name: "esxi | abort if all credentials failed"
          ansible.builtin.fail:
            msg: >-
              ESXi 자격증명 후보 {{ _e_accounts | default([]) | length }}개가 모두 실패했습니다.
              credential scope={{ _cred_scope | default('') }} 의 accounts 와 ESXi 호스트의 lockdown, local user 설정을 확인하세요.
          when:
            - (_e_accounts | default([])) | length > 0
            - not (_e_auth_ok | default(false) | bool)
          vars:
            _e_accounts: "{{ _cred_accounts | default([]) }}"

        - name: "esxi | collect facts"
          ansible.builtin.include_tasks: tasks/collect_facts.yml

        - name: "esxi | abort if facts failed"
          ansible.builtin.fail:
            msg: >-
              ESXi 정보 수집에 실패했습니다 ({{ _e_ip }}).
              사용 계정: {{ (_e_attempts_meta | default({})).used_label | default('?') }},
              시도 후보: {{ (_e_attempts_meta | default({})).attempted_count | default(0) }},
              자격 probe 통과: {{ _e_auth_ok | default(false) }}.
              가능한 원인: (1) 계정의 vSphere 권한 부족 (Read-Only / System.View 필요), (2) ESXi 펌웨어 호환성 (지원: 6.7 / 7.x / 8.x), (3) 라이선스 만료, (4) lockdown 모드.
          when: not (_e_facts_ok | bool)

        - name: "esxi | resolve hostname from raw facts"
          ansible.builtin.set_fact:
            _e_hostname: "{{ _e_raw_facts.ansible_hostname | default(none, true) or none }}"
          no_log: true

        - name: "esxi | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {{ lookup('adapter_loader',
                         channel='esxi',
                         facts={'version': _e_raw_facts.ansible_distribution_version | default('')},
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "esxi | collect config"
          ansible.builtin.include_tasks: tasks/collect_config.yml

        - name: "esxi | collect datastores"
          ansible.builtin.include_tasks: tasks/collect_datastores.yml

        - name: "esxi | collect physical disks"
          ansible.builtin.include_tasks: tasks/collect_disks.yml

        - name: "esxi | collect dns"
          ansible.builtin.include_tasks: tasks/collect_dns.yml

        - name: "esxi | normalize system/hardware/cpu/memory"
          ansible.builtin.include_tasks: tasks/normalize_system.yml

        - name: "esxi | normalize network"
          ansible.builtin.include_tasks: tasks/normalize_network.yml

        - name: "esxi | normalize storage"
          ansible.builtin.include_tasks: tasks/normalize_storage.yml

        - name: "esxi | collect network extended (P4)"
          ansible.builtin.include_tasks: tasks/collect_network_extended.yml

        - name: "esxi | collect runtime (B31/B32)"
          ansible.builtin.include_tasks: tasks/collect_runtime.yml

        - name: "esxi | build_sections"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_sections.yml"

        - name: "esxi | build_status"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_status.yml"

        - name: "esxi | build_errors"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_errors.yml"

        - name: "esxi | set output meta"
          ansible.builtin.set_fact:
            _out_target_type:       "esxi"
            _out_collection_method: "vsphere_api"
            _out_ip:                "{{ _e_ip }}"

        - name: "esxi | resolve vendor"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/resolve_vendor.yml"

        - name: "esxi | enrich diagnosis with adapter"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {{ _diagnosis | default({}) | combine({
                   'auth_success': true,
                   'details': ((_diagnosis | default({})).details | default({})
                                if (((_diagnosis | default({})).details | default({})) is mapping)
                                else {}) | combine({
                     'adapter_candidate': (_selected_adapter | default({})).adapter_id | default(none),
                     'credential_scope': (_cred_scope | default('')) or none,
                     'auth': _e_attempts_meta | default({}),
                     'esxi_version': _e_raw_facts.ansible_distribution_version | default(none),
                     'esxi_build':   _e_raw_facts.ansible_distribution_build   | default(none),
                     'product':      _e_raw_facts.ansible_distribution         | default('VMware ESXi')
                   })
                 }) }}

        - name: "esxi | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "esxi | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"

        - name: "esxi | build_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_output.yml"

        - name: "esxi | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

        - name: CHECKPOINT
          ansible.builtin.debug:
            msg: "{{ _output | to_json }}"

        - name: "esxi | addon"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/addon/run_addon.yml"
          vars:
            _addon_target: esxi
          when: lookup('env', 'ADDON_DIR') | length > 0

      rescue:
        - name: "esxi | rescue | Portal 표시용 failure_reason 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set ok = (_e_auth_ok | default(false) | bool)
                           or (_e_facts_ok | default(false) | bool) -%}
              {%- set lo = _cred_load_outcome | default('') -%}
              {%- set cred_na = (not ok)
                                and (lo in ['not_resolved', 'credential_set_missing',
                                            'credential_set_undecryptable']) -%}
              {%- if ok -%}
                {%- set reason_key = 'gather_after_auth' -%}
              {%- elif (_cred_reason | default('')) == 'unknown_location' -%}
                {%- set reason_key = 'loc_unregistered' -%}
              {%- elif lo == 'credential_set_missing' -%}
                {%- set reason_key = ('loc_vault_no_account'
                                      if (_cred_location_vault_exists | default(false) | bool)
                                      else 'loc_vault_missing') -%}
              {%- elif lo == 'credential_set_undecryptable' -%}
                {%- set reason_key = 'loc_vault_unreadable' -%}
              {%- elif lo == 'not_resolved' -%}
                {%- set reason_key = 'loc_vault_missing' -%}
              {%- elif lo == 'empty_accounts' -%}
                {%- set reason_key = 'loc_vault_no_account' -%}
              {%- else -%}
                {%- set reason_key = 'auth_unconfirmed' -%}
              {%- endif -%}
              {{ {'reachable': none, 'port_open': none, 'protocol_supported': none,
                  'auth_success': none, 'failure_stage': none, 'failure_code': none,
                  'failure_reason': none, 'details': {}}
                 | combine((_diagnosis | default({}, true))
                           if ((_diagnosis | default({}, true)) is mapping) else {})
                 | combine({'failure_reason': (_fr_catalog | failure_reason(
                                                  reason_key, 'esxi',
                                                  _cred_location | default(se_location | default('')))),
                            'failure_stage':  ('gather' if ok else 'auth'),
                            'failure_code':   ('GATHER_FAILED' if ok
                                               else ('CREDENTIAL_SET_UNAVAILABLE' if cred_na
                                                     else 'AUTH_PROBE_FAILED')),
                            'auth_success':   (true if ok else none),
                            'details':
                              {'channel': 'esxi',
                               'credential_scope': (_cred_scope | default('')) or none,
                               'auth': (_e_attempts_meta | default({}))}
                              | combine(((_diagnosis | default({}, true)).details | default({}))
                                        if (((_diagnosis | default({}, true)).details | default({}))
                                            is mapping)
                                        else {})}) }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "esxi | rescue | resolve vendor"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/resolve_vendor.yml"

        - name: "esxi | rescue | set failed vars"
          ansible.builtin.set_fact:
            _out_target_type:       "esxi"
            _out_collection_method: "vsphere_api"
            _out_ip:                "{{ _e_ip }}"
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','hardware','cpu','memory','storage','network']) }}"
            _fail_error_section:    "esxi_gather"
            _fail_error_message:    "[task: {{ ansible_failed_task.name | default('unknown') }}] {{ ansible_failed_result.msg | default('ESXi 수집 예외') }}"

        - name: "esxi | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "esxi | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'esxi',
                       'collection_method': 'vsphere_api',
                       'ip': _e_ip | default(inventory_hostname),
                       'hostname': none,
                       'vendor': none,
                       'status': 'failed',
                       'sections': {'system': 'failed', 'hardware': 'failed', 'bmc': 'not_supported', 'cpu': 'failed', 'memory': 'failed', 'storage': 'failed', 'network': 'failed', 'firmware': 'not_supported', 'users': 'not_supported', 'power': 'not_supported', 'thermal': 'not_supported'},
                       'diagnosis': {'reachable': none, 'port_open': none, 'protocol_supported': none, 'auth_success': none, 'failure_stage': 'fallback', 'failure_code': 'OUTPUT_BUILD_FAILED', 'failure_reason': _fr_catalog.output_build_failed.default, 'details': {'gather_mode': 'fallback', 'reason': '_output 미생성 (block/rescue 모두 실패)'}},
                       'meta': {'started_at': none, 'finished_at': none, 'duration_ms': none, 'adapter_id': none, 'adapter_version': none, 'ansible_version': none},
                       'correlation': {'serial_number': none, 'system_uuid': none, 'bmc_ip': none, 'host_ip': _e_ip | default(none)},
                       'errors': [{'section':'gather','message': _fr_catalog.output_build_failed.default,'detail':'_output 미생성 (block/rescue 모두 실패)'}],
                       'data': {'system': none, 'hardware': none, 'bmc': none, 'cpu': none, 'memory': none, 'storage': {'filesystems': [], 'physical_disks': [], 'datastores': [], 'controllers': [], 'logical_volumes': [], 'hbas': [], 'infiniband': [], 'summary': {'groups': [], 'grand_total_gb': 0}}, 'network': {'dns_servers': [], 'default_gateways': [], 'interfaces': [], 'adapters': [], 'ports': [], 'virtual_switches': [], 'portgroups': [], 'driver_map': [], 'summary': {'groups': []}}, 'users': [], 'firmware': [], 'power': none, 'thermal': {'temperatures': [], 'fans': []}}
                     })) | to_json }}"
