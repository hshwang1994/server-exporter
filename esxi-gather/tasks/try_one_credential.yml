---

- when:
    - not (_e_auth_ok | default(false) | bool)
    - not (_e_cred_stopped | default(false) | bool)
  block:

    - name: "esxi | try_one_credential | probe with vmware_host_facts"
      community.vmware.vmware_host_facts:
        hostname:    "{{ _e_ip }}"
        username:    "{{ _try_cred.username | default('') }}"
        password:    "{{ _try_cred.password | default('') }}"
        validate_certs: false
        schema: summary
      register:    _e_probe
      failed_when: false
      no_log: true

    - name: "esxi | try_one_credential | evaluate"
      ansible.builtin.set_fact:
        _e_probe_ok: "{{ _e_probe is defined and (_e_probe is not failed) and (_e_probe.ansible_facts is defined) }}"
      no_log: true

    - name: "esxi | try_one_credential | promote on success"
      when: _e_probe_ok | bool
      ansible.builtin.set_fact:
        ansible_user:     "{{ _try_cred.username }}"
        ansible_password: "{{ _try_cred.password }}"
        _e_user:          "{{ _try_cred.username }}"
        _e_pass:          "{{ _try_cred.password }}"
        _e_auth_ok:       true
        _e_used_account:
          username: "{{ _try_cred.username }}"
          label:    "{{ _try_cred.label    | default('unlabeled') }}"
          role:     "{{ _try_cred.role     | default('primary') }}"
        _e_probe_facts:   "{{ _e_probe.ansible_facts }}"
      no_log: true

    - name: "esxi | try_one_credential | recheck management port after failure"
      when: not (_e_probe_ok | bool)
      ansible.builtin.wait_for:
        host:    "{{ _e_ip }}"
        port:    443
        timeout: "{{ _cred_port_recheck_timeout | default(10) | int }}"
        state:   started
      register: _e_port_recheck
      failed_when: false
      changed_when: false

    - name: "esxi | try_one_credential | log failure (advisory)"
      when: not (_e_probe_ok | bool)
      ansible.builtin.debug:
        msg: >-
          esxi auth attempt failed —
          label={{ _try_cred.label | default('unlabeled') }},
          role={{ _try_cred.role   | default('primary') }}

    - name: "esxi | try_one_credential | stop candidates when the port does not connect"
      when:
        - not (_e_probe_ok | bool)
        - (_e_port_recheck.state | default('')) != 'started'
      ansible.builtin.set_fact:
        _e_cred_stopped: true
