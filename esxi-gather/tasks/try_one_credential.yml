---
# esxi-gather/tasks/try_one_credential.yml
#
# P1 (cycle 2026-04-28): 후보 자격 1개로 ESXi vSphere API 인증 시도.
# vmware_host_facts 는 read-only 이며 connection failure 시 인증 검증 적합.
# 성공 시 _e_user/_e_pass 갱신 + _e_auth_ok=true → 이후 후보 skip.
#
# 입력:
#   _try_cred : { username, password, label, role }
#   _e_ip     : ESXi 호스트 IP

# 2026-10-06 (9차): include_tasks 의 loop when 은 반복을 시작하기 전에 한꺼번에 평가된다 — 앞 시도가 켠 중단 표식은 이 block 조건만 본다.
- when:
    - not (_e_auth_ok | default(false) | bool)
    - not (_e_cred_stopped | default(false) | bool)
  block:

    - name: "esxi | try_one_credential | count attempt"
      ansible.builtin.set_fact:
        _e_cred_tries: "{{ (_e_cred_tries | default(0) | int) + 1 }}"
      no_log: true

    - name: "esxi | try_one_credential | probe with vmware_host_facts"
      # 2026-04-29 fix B40: properties: ['name'] 제거 — Ansible 2.20에서 'Found variable using
      # reserved name name' 경고 발생. 'name'은 vSphere 속성 경로지만 Ansible 내부 var 체커가
      # 오인. summary 스키마는 properties 불필요 (default 핵심 필드만).
      community.vmware.vmware_host_facts:
        hostname:    "{{ _e_ip }}"
        username:    "{{ _try_cred.username | default('') }}"
        password:    "{{ _try_cred.password | default('') }}"
        validate_certs: false
        schema: summary
      register:    _e_probe
      failed_when: false
      no_log: true

    - name: "esxi | try_one_credential | evaluate"
      ansible.builtin.set_fact:
        # Round 17 #2: failed_when:false 라 'is not failed' 는 항상 True (모듈-레벨 auth 실패도
        # failed=false 로 덮임) → 첫 후보가 무조건 promote 되어 다중 자격 fallback 무력화.
        # 4개 sibling collect 태스크(collect_facts/config/datastores/dns)와 동일하게
        # ansible_facts 존재(= 인증 성공 시에만 반환)를 positive evidence 로 추가.
        _e_probe_ok: "{{ _e_probe is defined and (_e_probe is not failed) and (_e_probe.ansible_facts is defined) }}"
      no_log: true

    - name: "esxi | try_one_credential | promote on success"
      when: _e_probe_ok | bool
      ansible.builtin.set_fact:
        ansible_user:     "{{ _try_cred.username }}"
        ansible_password: "{{ _try_cred.password }}"
        _e_user:          "{{ _try_cred.username }}"
        _e_pass:          "{{ _try_cred.password }}"
        _e_auth_ok:       true
        _e_used_account:
          username: "{{ _try_cred.username }}"
          label:    "{{ _try_cred.label    | default('unlabeled') }}"
          role:     "{{ _try_cred.role     | default('primary') }}"
        # 2026-10-03 (P5): 인증에 성공한 probe 의 facts 를 보관한다 — collect_facts.yml 이 같은
        #   모듈을 다시 부르지 않고 이 값을 쓴다. _e_probe 는 뒤 후보의 skip 결과로 덮어써지므로
        #   (skip 된 태스크도 register 한다) 성공 시점에 따로 담는다.
        _e_probe_facts:   "{{ _e_probe.ansible_facts }}"
      no_log: true

    # 2026-10-06 (9차 W06): 실패 뒤 vSphere 포트(443)에 TCP 연결을 1회 다시 확인한다. 연결되지 않으면 남은 자격 후보를 보내지 않는다
    #   (os-gather/tasks/try_one_credential.yml 과 같은 규칙 — 오류 문자열로 거부를 추측하지 않는다).
    - name: "esxi | try_one_credential | recheck management port after failure"
      when: not (_e_probe_ok | bool)
      ansible.builtin.wait_for:
        host:    "{{ _e_ip }}"
        port:    443
        timeout: "{{ _cred_port_recheck_timeout | default(10) | int }}"
        state:   started
      register: _e_port_recheck
      failed_when: false
      changed_when: false

    - name: "esxi | try_one_credential | log failure (advisory)"
      when: not (_e_probe_ok | bool)
      ansible.builtin.debug:
        msg: >-
          esxi auth attempt failed —
          label={{ _try_cred.label | default('unlabeled') }},
          role={{ _try_cred.role   | default('primary') }}

    # 이 표식은 block 조건(위)이 본다 — 켜지는 순간 같은 block 의 남은 태스크도 건너뛰므로 **마지막** 태스크로 둔다
    #   (실패 근거 기록 · 로그 · 간격이 먼저 끝나야 한다).
    - name: "esxi | try_one_credential | stop candidates when the port does not connect"
      when:
        - not (_e_probe_ok | bool)
        - (_e_port_recheck.state | default('')) != 'started'
      ansible.builtin.set_fact:
        _e_cred_stopped: true
