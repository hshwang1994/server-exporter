---
# esxi-gather/tasks/collect_network_extended.yml
#
# P4 (cycle 2026-04-29): ESXi 확장 네트워크 / 스토리지 어댑터 수집.
# vmware_host_vmnic_info / vmware_host_vmhba_info / vmware_vswitch_info /
# vmware_portgroup_info / vmware_vmkernel_info.
#
# best-effort: 일부 vCenter 권한/펌웨어에서 모듈 미지원 시 빈 결과.
#
# 출력 fragment sub-key:
#   data.network.adapters[]         — vmnic (NIC HW)
#   data.network.virtual_switches[] — vSwitch + portgroup
#   data.network.vmkernels[]        — vmkernel adapter
#   data.storage.hbas[]             — vmhba FC / FCoE / iSCSI 만 (SAS/RAID 제외 — type + driver 두 신호). vmhba 1개 = 항목 1개, 중복 제거 없음(2026-10-19)
#   data.storage.infiniband[]       — 항상 [] (2026-10-17 — 아래 참조. 종전 nmlx NIC 드라이버명 추정은 제거)
#
# 2026-10-17 (InfiniBand 전면 검증 — 계약은 docs/contract/03-fields.md 6.3.1, 결정 기록은 ADR-2026-10-17-infiniband-port-decision):
#   ESXi 에는 실제 IB 포트를 확인할 원천이 없다. 네이티브 nmlx5 드라이버는 Ethernet 전용이고(NVIDIA ESXi 인박스 드라이버 RN —
#   전 행 GbE), IB 는 SR-IOV/passthrough 로 VM 에만 간다(NVIDIA OFED for ESXi). IB 모드로 설정된 ConnectX 는 vmnic 없이 PCI
#   "Infiniband controller"(class 0x0207) 로만 보인다(Broadcom KB 381748 — uplink 가 안 보이면 Ethernet 으로 바꾸라는 안내).
#   vSphere API 의 HostRdmaDeviceCapability 도 roceV1/roceV2/iWarp 만 있고 IB 플래그가 없다. 그래서 종전 "vmnic 드라이버가
#   nmlx/mlx 면 IB/RoCE-capable" 추정 항목(_e_ext_ib)은 **Mellanox 이더넷 NIC 를 IB 로 보고하는 오탐**이라 제거했고, 이 채널의
#   storage.infiniband 는 항상 빈 목록이다 — "IB 없음" 의 확정 증거가 아니라 "이 채널은 수집하지 않는다" 는 뜻이다
#   (docs/contract/03-fields.md 6.3.1). PCI 클래스로 컨트롤러 존재만 적는 안은 모듈 변경 + 새 필드가 필요해 보류(NEXT_ACTIONS).
#   source: https://knowledge.broadcom.com/external/article/381748 (IB 모드 ConnectX 는 vmnic 미노출)
#   source: https://networking-docs.nvidia.com/vmwareesxiinboxdriversrn (nmlx5 인박스 드라이버 — Ethernet 속도만)
#   source: http://network.nvidia.com/products/adapter-software/vmware/exsi-server/ (ESXi 7.0+ IB = SR-IOV 모드)

- block:
    - name: "esxi | extended | vmnic info"
      community.vmware.vmware_host_vmnic_info:
        hostname:       "{{ _e_ip }}"
        username:       "{{ _e_user }}"
        password:       "{{ _e_pass }}"
        validate_certs: false
        esxi_hostname:  "{{ _e_ip }}"
      register:    _e_vmnic
      failed_when: false
      no_log: true

    - name: "esxi | extended | vmhba info"
      community.vmware.vmware_host_vmhba_info:
        hostname:       "{{ _e_ip }}"
        username:       "{{ _e_user }}"
        password:       "{{ _e_pass }}"
        validate_certs: false
        esxi_hostname:  "{{ _e_ip }}"
      register:    _e_vmhba
      failed_when: false
      no_log: true

    - name: "esxi | extended | vswitch info"
      community.vmware.vmware_vswitch_info:
        hostname:       "{{ _e_ip }}"
        username:       "{{ _e_user }}"
        password:       "{{ _e_pass }}"
        validate_certs: false
        esxi_hostname:  "{{ _e_ip }}"
      register:    _e_vswitch
      failed_when: false
      no_log: true

    - name: "esxi | extended | portgroup info"
      community.vmware.vmware_portgroup_info:
        hostname:       "{{ _e_ip }}"
        username:       "{{ _e_user }}"
        password:       "{{ _e_pass }}"
        validate_certs: false
        esxi_hostname:  "{{ _e_ip }}"
      register:    _e_portgroup
      failed_when: false
      no_log: true

    # BUG #4 fix (cycle production-audit 후속): hosts_*_info dict 의 top-level key 는
    # ESXi configured hostname (예: "esxi01") — _e_ip 가 아니다.
    # 또한 진짜 dict list 는 'all' (string list) 이 아니라 'vmnic_details' / 'vmhba_details'.
    # vswitch 는 dict-of-dict (key=vswitch name, value=info).
    # 키 매핑: pci→location, adapter_type→type, node_world_wide_name→node_wwn.
    # portgroups 는 별도 portgroup_info 결과를 vswitch 별로 group 해서 채운다.
    # 진단 근거: tests/scripts/diag_esxi_raw.yml 결과 (community.vmware 6.2.0 + ESXi 7.0.3).
    - name: "esxi | extended | normalize"
      ansible.builtin.set_fact:
        _e_ext_adapters: >-
          {%- set out = [] -%}
          {%- set pnic_by_dev = {} -%}
          {%- for hp in ((_e_raw_host | default({})).pnics | default([])) -%}
            {%- if hp.device | default(none) -%}{%- set _ = pnic_by_dev.update({hp.device: hp}) -%}{%- endif -%}
          {%- endfor -%}
          {%- set d = _e_vmnic.hosts_vmnics_info | default({}) -%}
          {%- set key = _e_hostname if (_e_hostname in d) else ((d.keys() | list | first) if d else none) -%}
          {%- set vmnics = (d.get(key, {}).get('vmnic_details', [])) if key else [] -%}
          {%- for n in vmnics -%}
            {# 잔류 fix (Round 12 후속): speed_mbps int 일관성. Connected 시 int (10000),
               Disconnected 시 raw "N/A" → null. 호출자 cross-channel 일관성 보장 #}
            {%- set raw_sp = n.actual_speed | default(none) -%}
            {%- set sp_int = none -%}
            {%- if raw_sp is number -%}
              {%- set sp_int = raw_sp | int -%}
            {%- elif raw_sp is string and raw_sp != 'N/A' and raw_sp -%}
              {%- set digits = raw_sp | regex_replace('[^0-9]', '') -%}
              {%- if digits -%}{%- set sp_int = digits | int -%}{%- endif -%}
            {%- endif -%}
            {%- set raw_dup = n.actual_duplex | default(none) -%}
            {%- set dup = none if (raw_dup in ['N/A', '', none]) else raw_dup -%}
            {# 2026-09-03 (B-29): OS 채널 adapters[] 와 같은 키 (id / name / manufacturer / model / driver /
               firmware_version / pci) + ESXi 가 더 아는 것(mac / link_status / speed / duplex). 제조사·모델은
               esxi_disks.host_info 의 pnic ↔ pciDevice 매핑, 없으면 vmnic_info 의 adapter 문자열. #}
            {%- set dev = n.device | default(none) -%}
            {%- set hp = pnic_by_dev.get(dev, {}) -%}
            {%- set _ = out.append({
              'id':           (hp.pci | default(none)) or (n.location | default(none)) or dev,
              'name':         dev,
              'manufacturer': hp.manufacturer | default(none),
              'model':        (hp.model | default(none)) or (n.adapter | default(none)),
              'driver':       n.driver | default(none),
              'firmware_version': none,
              'pci':          (n.location | default(none)) or (hp.pci | default(none)),
              'mac':          (n.mac | default(none)) | normalize_mac,
              'link_status':  ('up' if (n.status | default('') | lower) in ['connected','up','linkup','active','online'] else ('down' if (n.status | default('') | lower) in ['disconnected','down','linkdown','offline','disabled','inactive'] else 'unknown')),
              'speed_mbps':   sp_int,
              'duplex':       dup,
            }) -%}
          {%- endfor -%}
          {{ out }}
        # cycle 2026-05-29 (hba-ib-csus, D1=API-only): FC/iSCSI HBA 만 hbas[] 로.
        #   - 분류는 type + driver 두 신호: type(vSphere HostBusAdapter 하위 클래스 — 모듈이 'Fibre Channel' · 'iSCSI' · 'Block Adapter' ·
        #     'Parallel SCSI' 로 바꾸거나 클래스 이름을 그대로 둔다) 또는 드라이버 계열(lpfc/qlnativefc/brcmnvmefc/bfa/fnic/nfnic = FC,
        #     qlnativefcoe/brcmfcoe/qfle3f/bnx2fc/qedf = FCoE, iscsi_vmk = 소프트웨어 iSCSI).
        #     SAS/RAID 컨트롤러 (nhpsa/lsi_mr3/smartpqi/vmw_ahci/nvme...) 는 hbas 제외 (storage controller 영역).
        #   - 구 'infiniband' in type 분기는 dead-code (vmhba type 에 InfiniBand 없음) → 제거.
        #     IB 는 이 채널에서 수집하지 않는다 (2026-10-17 — 파일 헤더 참조. 종전 nmlx NIC 추론 _e_ext_ib 삭제).
        #   - 누락 필드 보강: port_type / link_speed_gbps (FC speed) / source. 빈 placeholder vmhba (device 없음) skip.
        #   2026-10-18 (HBA 전수 점검 — 계약 docs/contract/03-fields.md 6.3.1):
        #     · 하드웨어 iSCSI(클래스 InternetScsiHba) 도 iSCSI 다 — 종전 'iscsi' 부분 문자열은 클래스 이름 'internetscsi' 에 없어 조용히 빠졌다.
        #     · FCoE(클래스 FibreChannelOverEthernetHba · FCoE 드라이버) 는 port_type FCoE — 종전엔 FibreChannel 로 적었다(Redfish 는 FCoE 로 적는다).
        #     · link_status 는 up / down 둘뿐(사용자 결정 2026-10-19): status online(connected · up · linkup · active) → up, 그 밖(offline · unbound ·
        #       unknown · 없음) → down. 2026-10-18 의 "unbound · unknown · 없음 → null" 은 폐지 — 값은 항상 들어간다.
        #     · speed: vSphere HostFibreChannelHba.speed 는 "bits per second" 로 문서화됐지만 lab 값(링크 다운 = 0)으로 단위를 확인하지 못해
        #       자릿수로 정규화한다 — ≥ 1e6 → /1e9(bps), ≥ 1e3 → /1e3(Mbps), 그 밖 그대로(Gbps); 0 · 없음 → null. 실장비 미검증(사용자 결정 2026-10-17).
        #     · 중복 제거 없음(사용자 결정 2026-10-19 — 2026-10-18 의 "같은 (wwpn, wwnn) 1건" 폐지): 모듈이 준 vmhba 를 있는 그대로 전부 낸다.
        #       ESXi 7 FC-NVMe 는 포트당 SCSI vmhba + NVMe vmhba 둘을 같은 WWPN 으로 보이므로 그 포트는 2건이다(Redfish · Linux 의 "물리 포트 1개 = 1건" 과
        #       다름 — 교차 대조는 wwpn 집합으로 한다).
        #     · 8옥텟 colon-hex 가 아닌 WWN 은 wwpn/wwnn 을 null 로 두고 storage errors[] 1건(detail 에 원문) — 모듈의 WWN 문자열 변환은 자릿수가
        #       홀수거나 int64 음수면 깨진 값을 그대로 낸다. 자리표시자 location 'PCI'/'N/A' · bus 음수 → null.
        #   source: community.vmware vmware_host_vmhba_info (RETURN: device/driver/model/type/status/location/bus/node_wwn/port_wwn/speed) +
        #           vSphere API HostHostBusAdapter.status ("online" · "offline" · "unbound" · "unknown") · HostFibreChannelHba.speed (bits per second)
        #   source: https://docs.netapp.com/us-en/ontap-sanhost/nvme_esxi_7.html (FC-NVMe — 포트당 vmhba 2개, 같은 WWPN)
        #   lab: FC 링크 up · FC-NVMe · 하드웨어 iSCSI · FCoE 부재 — tests/unit/test_esxi_hba_normalize.py 의 합성 모듈 결과로만 검증 (실장비 미검증).
        _e_ext_hbas: >-
          {%- set out = [] -%}
          {%- set d = _e_vmhba.hosts_vmhbas_info | default({}) -%}
          {%- set key = _e_hostname if (_e_hostname in d) else ((d.keys() | list | first) if d else none) -%}
          {%- set vmhbas = (d.get(key, {}).get('vmhba_details', [])) if key else [] -%}
          {%- set fc_drivers = ['lpfc', 'qlnativefc', 'brcmnvmefc', 'bfa', 'fnic', 'nfnic'] -%}
          {%- set fcoe_drivers = ['qlnativefcoe', 'brcmfcoe', 'qfle3f', 'bnx2fc', 'qedf'] -%}
          {%- set iscsi_drivers = ['iscsi_vmk'] -%}
          {%- set wwn_re = '^([0-9a-f]{2}:){7}[0-9a-f]{2}$' -%}
          {# 2026-09-03 (B-22): 같은 vmhba 의 controllers[].controller_manufacturer(pciDevice vendorName) 를 vendor 로 #}
          {%- set ctrl_vendor = {} -%}
          {%- for c in (_e_raw_controllers | default([])) -%}
            {%- if c.id | default(none) -%}{%- set _ = ctrl_vendor.update({c.id: c.controller_manufacturer | default(none)}) -%}{%- endif -%}
          {%- endfor -%}
          {%- for h in vmhbas -%}
            {%- set dev = h.device | default(none) -%}
            {%- set drv = (h.driver | default('')) | lower -%}
            {%- set atype = (h.type | default('')) | lower -%}
            {%- set atype_c = atype | replace(' ', '') | replace('_', '') | replace('-', '') -%}
            {%- if dev -%}
              {%- set is_fcoe = ('fibrechanneloverethernet' in atype_c) or (drv in fcoe_drivers) -%}
              {%- set is_fc = ('fibre' in atype) or (drv in fc_drivers) or is_fcoe -%}
              {%- set is_iscsi = (not is_fc) and (('iscsi' in atype) or ('internetscsi' in atype_c) or (drv in iscsi_drivers)) -%}
              {%- if is_fc or is_iscsi -%}
                {%- set wwpn_n = (h.port_wwn | default(none)) | normalize_wwn -%}
                {%- set wwnn_n = (h.node_wwn | default(none)) | normalize_wwn -%}
                {%- set wwpn = wwpn_n if (wwpn_n is none or (wwpn_n is match(wwn_re))) else none -%}
                {%- set wwnn = wwnn_n if (wwnn_n is none or (wwnn_n is match(wwn_re))) else none -%}
                {%- set raw_sp = h.speed | default(none) -%}
                {%- set sp_gbps = none -%}
                {%- if raw_sp is number and raw_sp > 0 -%}
                  {%- set spf = raw_sp | float -%}
                  {%- set spv = (spf / 1000000000) if spf >= 1000000 else ((spf / 1000) if spf >= 1000 else spf) -%}
                  {%- set sp_gbps = (spv | int) if (spv == (spv | int)) else (spv | round(2)) -%}
                {%- endif -%}
                {%- set hs = (h.status | default('')) | string | lower | trim -%}
                {%- set loc = h.location | default(none) -%}
                {%- set bus = h.bus | default(none) -%}
                {%- set _ = out.append({
                  'name':            dev,
                  'driver':          h.driver | default(none),
                  'model':           h.model | default(none),
                  'vendor':          ctrl_vendor.get(dev, none),
                  'firmware':        none,
                  'adapter_type':    h.type | default(none),
                  'link_status':     ('up' if hs in ['online', 'connected', 'up', 'linkup', 'active'] else 'down'),
                  'wwpn':            wwpn,
                  'wwnn':            wwnn,
                  'link_speed_gbps': sp_gbps,
                  'port_type':       ('FCoE' if is_fcoe else ('FibreChannel' if is_fc else 'iSCSI')),
                  'pci':             (loc if (loc is not none and (loc | string | trim) not in ['', 'PCI', 'N/A']) else none),
                  'bus':             (bus if (bus is number and bus >= 0) else none),
                  'source':          'esxi',
                }) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        # 2026-10-18: 8옥텟 colon-hex 가 아닌 WWN 원문 (위 목록에서는 null 로 둔 값) — merge fragment 가 storage errors[] 1건으로 남긴다.
        _e_ext_hba_bad_wwn: >-
          {%- set out = [] -%}
          {%- set d = _e_vmhba.hosts_vmhbas_info | default({}) -%}
          {%- set key = _e_hostname if (_e_hostname in d) else ((d.keys() | list | first) if d else none) -%}
          {%- set vmhbas = (d.get(key, {}).get('vmhba_details', [])) if key else [] -%}
          {%- set wwn_re = '^([0-9a-f]{2}:){7}[0-9a-f]{2}$' -%}
          {%- for h in vmhbas -%}
            {%- for k in ['port_wwn', 'node_wwn'] -%}
              {%- set n = (h[k] | default(none)) | normalize_wwn -%}
              {%- if n is not none and not (n is match(wwn_re)) -%}
                {%- set _ = out.append((h.device | default('?')) ~ ':' ~ k ~ '=' ~ (h[k] | string)) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}
        _e_ext_portgroups: >-
          {%- set d = _e_portgroup.hosts_portgroup_info | default({}) -%}
          {%- set key = _e_hostname if (_e_hostname in d) else ((d.keys() | list | first) if d else none) -%}
          {{ (d.get(key, [])) if key else [] }}
      no_log: true

    # vswitch 는 dict-of-dict 구조라 별도 task — _e_ext_portgroups 에 의존 (vswitch 별 portgroups join)
    - name: "esxi | extended | build vswitch list"
      ansible.builtin.set_fact:
        _e_ext_vswitches: >-
          {%- set out = [] -%}
          {%- set d = _e_vswitch.hosts_vswitch_info | default({}) -%}
          {%- set key = _e_hostname if (_e_hostname in d) else ((d.keys() | list | first) if d else none) -%}
          {%- set vsws_dict = d.get(key, {}) if key else {} -%}
          {%- set pg_by_vsw = namespace(map={}) -%}
          {%- for pg in (_e_ext_portgroups | default([])) -%}
            {%- set vsw = pg.vswitch | default('') -%}
            {%- if vsw -%}
              {%- if vsw not in pg_by_vsw.map -%}
                {%- set _ = pg_by_vsw.map.update({vsw: []}) -%}
              {%- endif -%}
              {%- set _ = pg_by_vsw.map[vsw].append(pg.portgroup) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if vsws_dict is mapping -%}
            {%- for sw_name, sw_info in vsws_dict.items() -%}
              {%- set _ = out.append({
                'name':       sw_name,
                'num_ports':  sw_info.num_ports | default(none),
                'mtu':        sw_info.mtu       | default(none),
                'pnics':      sw_info.pnics     | default([]),
                'portgroups': pg_by_vsw.map.get(sw_name, []),
              }) -%}
            {%- endfor -%}
          {%- endif -%}
          {{ out }}
      no_log: true

    # 2026-06-30: network.summary 를 pnic(_e_ext_adapters, 실 speed 보유) 기준으로 산출.
    #   normalize_network 의 vmk 기반 summary(speed=none) 를 merge 시 덮어쓴다 (null 누출 정정).
    #   null/0 speed(down NIC) 가드 — Windows/Linux 동일 패턴.
    - name: "esxi | extended | compute summary groups (pnic)"
      ansible.builtin.set_fact:
        _e_ext_summary: >-
          {%- set ns = namespace(groups=[], seen={}) -%}
          {%- for n in (_e_ext_adapters | default([])) -%}
            {%- set sp = n.speed_mbps | default(none) -%}
            {%- if sp is not none and (sp | int) > 0 -%}
              {%- set link_up = (n.link_status | default('') | lower) in ['up','linkup'] -%}
              {%- set key = sp | string -%}
              {%- if key in ns.seen -%}
                {%- set idx = ns.seen[key] -%}
                {%- set _ = ns.groups[idx].update({'quantity': ns.groups[idx].quantity + 1, 'link_up_count': ns.groups[idx].link_up_count + (1 if link_up else 0)}) -%}
              {%- else -%}
                {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
                {%- set _ = ns.groups.append({'speed_mbps': sp, 'link_type': none, 'quantity': 1, 'link_up_count': 1 if link_up else 0}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ {'groups': ns.groups} }}
      no_log: true

    - name: "esxi | extended | merge fragment"
      ansible.builtin.set_fact:
        _data_fragment:
          network:
            adapters:         "{{ _e_ext_adapters | default([]) }}"
            virtual_switches: "{{ _e_ext_vswitches | default([]) }}"
            portgroups:       "{{ _e_ext_portgroups | default([]) }}"
            summary:          "{{ _e_ext_summary | default({'groups': []}) }}"
          storage:
            hbas:             "{{ _e_ext_hbas | default([]) }}"
            # 2026-10-17: ESXi 는 IB 를 수집하지 않는다 (파일 헤더) — 자리만 둔다 (전 채널 공통 shape)
            infiniband:       []
        _sections_supported_fragment: ['network', 'storage']
        _sections_collected_fragment: >-
          {{ (['network'] if (_e_ext_adapters | length > 0 or _e_ext_vswitches | length > 0) else [])
             + (['storage'] if ((_e_ext_hbas | default([])) | length > 0) else []) }}
        _sections_failed_fragment:    []
        # 2026-10-10 (C9): 모듈 조회 실패의 근거. failed_when: false 라 실패해도 `is failed` 는 거짓이다 — 실패는 **예상 결과 키가 없는 것**으로
        #   판정한다(msg 가 비어 있어도 실패, msg 는 원인 설명). 결과 키가 있고 비어 있으면(HBA 미설치 등) 정상이다. 섹션 상태 · 이미 확보한
        #   데이터는 그대로 두고 섹션별 1건(network: vmnic · vswitch · portgroup, storage: vmhba)을 남긴다 — success + errors 허용 계약.
        _errors_fragment: >-
          {%- set mods = [('network', 'vmnic', _e_vmnic | default({}), 'hosts_vmnics_info'),
                          ('storage', 'vmhba', _e_vmhba | default({}), 'hosts_vmhbas_info'),
                          ('network', 'vswitch', _e_vswitch | default({}), 'hosts_vswitch_info'),
                          ('network', 'portgroup', _e_portgroup | default({}), 'hosts_portgroup_info')] -%}
          {%- set texts = {'network': '네트워크 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
                           'storage': '스토리지 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.'} -%}
          {%- set out = [] -%}
          {%- for sec in ['network', 'storage'] -%}
            {%- set scopes = [] -%}
            {%- set msgs = [] -%}
            {%- for m in mods if m[0] == sec -%}
              {%- set r = m[2] if (m[2] is mapping) else {} -%}
              {%- if (r.get(m[3]) is not mapping) -%}
                {%- set _ = scopes.append(m[1]) -%}
                {%- set t = ((r.get('msg') or '') | string | replace('\n', ' ') | replace('\r', ' ') | trim) -%}
                {%- if t -%}{%- set _ = msgs.append(t) -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if scopes -%}
              {%- set _ = out.append({'section': sec, 'message': texts[sec],
                                      'detail': ('scope=' ~ (scopes | join(',')) ~ '; cause=module_failed; msg=' ~ ((msgs | first | default('none'))[:160]))}) -%}
            {%- endif -%}
          {%- endfor -%}
          {# 2026-10-18: 형식이 깨진 WWN(8옥텟 colon-hex 아님) — 항목의 wwpn/wwnn 은 null, 원문은 여기 #}
          {%- set bad = _e_ext_hba_bad_wwn | default([]) -%}
          {%- if (bad | length) > 0 -%}
            {%- set _ = out.append({'section': 'storage', 'message': texts['storage'],
                                    'detail': ('scope=vmhba; cause=malformed_wwn; count=' ~ (bad | length) ~ '; values=' ~ ((bad[:10]) | join(',')))}) -%}
          {%- endif -%}
          {{ out }}
      no_log: true
  rescue:
    - name: "esxi | extended | rescue (best-effort skip)"
      ansible.builtin.set_fact:
        _data_fragment:
          network:
            adapters:         []
            virtual_switches: []
            portgroups:       []
          storage:
            hbas:             []
            infiniband:       []
        _sections_supported_fragment: []
        _sections_collected_fragment: []
        # 확장 수집이 실패해도 기본 network 정보(normalize_network.yml)는 이미 수집돼 있다.
        # 여기서 network 를 failed 로 강등하면 과잉이라 빈 list 를 유지한다.
        _sections_failed_fragment:    []
        # 2026-08-12 (M1/N33):
        #   - section: 'esxi_network_extended' 는 schema 11 섹션 밖이라 Portal 이 어느 섹션에도
        #     묶지 못했다 → 'network' 로 정규화.
        #   - message: 개발자 용어("best-effort skip")와 커널/하이퍼바이저 내부 명칭을 빼고
        #     사용자가 무엇을 못 받았고 무엇을 확인하면 되는지로 다시 썼다.
        #   - detail: 빈 문자열 대신 null. 기술 근거(실패 태스크 msg)는 그대로 여기에 둔다.
        #   - 2026-10-18: HBA 도 이 블록에서 읽으므로 storage 에도 1건 — 종전엔 network 만 적어 hbas [] 가 "HBA 없음" 과 같았다.
        _errors_fragment:
          - section: network
            message: "네트워크 어댑터와 가상 스위치 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
            detail: >-
              {{ (ansible_failed_result.msg | default('', true) | string | trim)
                 | default(none, true) }}
          - section: storage
            message: "스토리지 어댑터 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
            detail: >-
              {{ 'scope=vmhba; cause=task_failed; msg='
                 ~ ((ansible_failed_result.msg | default('', true) | string | trim) or 'none') }}
      no_log: true

- name: "esxi | extended | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
