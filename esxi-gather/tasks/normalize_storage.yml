---
# esxi-gather/tasks/normalize_storage.yml
# _e_raw_ds → storage fragment (datastores)

- name: "esxi | normalize storage | build datastores"
  ansible.builtin.set_fact:
    # MED-11 fix: NFS/vSAN/vVOL 등 capacity 미수집 datastore 도 type/accessible 메타는
    # 보존하되 size 필드는 null 로 명시 (이전: 0 으로 출력 → 호출자가 "0 byte 빈 datastore"
    # 와 "용량 미수집" 구분 불가). cap=0 인 datastore name 은 _e_unsized_ds 에 누적 후
    # errors_fragment 로 emit.
    _e_norm_datastores: >-
      {%- set out = [] -%}
      {%- for ds in (_e_raw_ds | default([])) -%}
        {%- if ds.capacity is defined -%}
          {%- set cap  = ds.capacity  | int -%}
          {%- set free = ds.freeSpace | default(ds.free_space | default(0)) | int -%}
        {%- else -%}
          {%- set tr   = ds.total | default('0 GB', boolean=true) | string -%}
          {%- set fr   = ds.free  | default('0 GB', boolean=true) | string -%}
          {%- set tg   = (tr|regex_replace('[^0-9.]','')|default('0', boolean=true)|float)*(1024 if 'TB' in tr else 1) -%}
          {%- set fg   = (fr|regex_replace('[^0-9.]','')|default('0', boolean=true)|float)*(1024 if 'TB' in fr else 1) -%}
          {%- set cap  = (tg*1073741824)|int -%}
          {%- set free = (fg*1073741824)|int -%}
        {%- endif -%}
        {%- set total_mb = (cap /1048576)|round(0,'floor')|int -%}
        {%- set free_mb  = (free/1048576)|round(0,'floor')|int -%}
        {%- set used_mb  = total_mb - free_mb -%}
        {%- set sized = total_mb > 0 -%}
        {%- set _ = out.append({
          'name':          ds.name,
          'type':          ds.type | default(none),
          'total_mb':      total_mb if sized else none,
          'free_mb':       free_mb  if sized else none,
          'used_mb':       used_mb  if sized else none,
          'usage_percent': (used_mb/total_mb*100)|round(1) if sized else none,
          'accessible':    ds.accessible | default(none)
        }) -%}
      {%- endfor -%}
      {{ out }}
    _e_unsized_ds: >-
      {%- set names = [] -%}
      {%- for ds in (_e_raw_ds | default([])) -%}
        {%- set has_cap = (ds.capacity is defined and (ds.capacity | int) > 0) -%}
        {%- set has_total = (ds.total is defined and ((ds.total | string | regex_replace('[^0-9.]','') | default('0', boolean=true)) | float) > 0) -%}
        {%- if not (has_cap or has_total) -%}
          {%- set _ = names.append(ds.name | default('unknown')) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ names }}
  no_log: true

# cycle-016 (2026-04-29): ESXi 측은 datastore 단위 grouping (physical disk 정보 미수집, namespace pattern)
- name: "esxi | normalize storage | compute summary groups"
  ansible.builtin.set_fact:
    _e_stor_summary: >-
      {%- set ns = namespace(total=0) -%}
      {%- for ds in (_e_norm_datastores | default([])) -%}
        {%- set ns.total = ns.total + ((ds.total_mb | default(0) | int) / 1024) | round(0, 'floor') | int -%}
      {%- endfor -%}
      {{ {'groups': [], 'grand_total_gb': ns.total} }}
  no_log: true

- name: "esxi | normalize storage | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      storage:
        filesystems:     []
        # 2026-06-22: esxi_disks(pyvmomi) 가 canonical physical_disks(serial/wwn 포함) 직접 생성.
        #   datastore 와 별개 graceful — 수집 실패 시 빈 list.
        physical_disks:  "{{ _e_raw_disks | default([]) }}"
        datastores:      "{{ _e_norm_datastores }}"
        # 2026-06-22 T1: storage HBA/RAID 컨트롤러 (hostBusAdapter + pciDevice vendor)
        controllers:     "{{ _e_raw_controllers | default([]) }}"
        logical_volumes: []
        # cycle-016: datastore 합계 기반 summary (groups 빈 배열 — physical disk grouping 은 OS/Redfish 채널)
        summary:         "{{ _e_stor_summary | default({'groups': [], 'grand_total_gb': 0}) }}"
    _sections_supported_fragment: ['storage']
    _sections_collected_fragment: >-
      {{ ['storage'] if _e_ds_ok | bool else [] }}
    _sections_failed_fragment: >-
      {{ [] if _e_ds_ok | bool else ['storage'] }}
    # 2026-08-12 (C5/N32/H8): 우선순위 분기.
    #
    #  (1) datastore 모듈 자체가 실패한 경우(_e_ds_ok=false) → storage 실패 1건.
    #      종전에는 이 경우 _e_unsized_ds 가 비어 errors 가 0건이 될 수 있었고,
    #      섹션은 failed 인데 사유 칸이 공백인 결과가 Portal 로 나갔다.
    #
    #  (2) 모듈은 성공했지만 용량을 제공하지 않는 datastore 가 있는 경우 → 경고 1건.
    #      NFS / vSAN / vVOL 은 capacity 를 원래 제공하지 않는다. 즉 "정상 미제공" 이고
    #      섹션 status 는 success 를 유지한다 (build_status.yml 의 시나리오 B 공식 예).
    #      종전 message 는 envelope 내부 필드를 설명하는 개발자 메모 뒤에 datastore 이름을
    #      개수 제한 없이 붙여 문장 길이가 예측 불가였다. 이름 목록은 detail 로 내리고
    #      message 는 고정 문장 1개로 둔다. detail 은 문자열 (상한 500자).
    _errors_fragment: >-
      {%- set out = [] -%}
      {%- if not (_e_ds_ok | bool) -%}
        {%- set _ = out.append({
          'section': 'storage',
          'message': '스토리지 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
          'detail':  _e_ds_err | default(none)}) -%}
      {#- 2026-08-12: detail 은 500자 상한이지만 **개수는 항상 남긴다** (조용한 절단 금지).
          종전에는 이름 뒷부분이 표시 없이 잘려 운영자가 전량을 알 수 없었다. -#}
      {%- elif (_e_unsized_ds | default([]) | length) > 0 -%}
        {%- set _ = out.append({
          'section': 'storage',
          'message': '일부 데이터스토어가 용량 정보를 제공하지 않아 용량 값이 비어 있습니다.',
          'detail':  ('용량 미제공 데이터스토어 ' ~ (_e_unsized_ds | length) ~ '개: '
                      ~ (_e_unsized_ds | join(', ')))[:500]}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: "esxi | normalize storage | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
