---

- name: "esxi | normalize storage | build datastores"
  ansible.builtin.set_fact:
    _e_norm_datastores: >-
      {%- set out = [] -%}
      {%- for ds in (_e_raw_ds | default([])) -%}
        {%- if ds.capacity is defined -%}
          {%- set cap  = ds.capacity  | int -%}
          {%- set free = ds.freeSpace | default(ds.free_space | default(0)) | int -%}
        {%- else -%}
          {%- set tr   = ds.total | default('0 GB', boolean=true) | string -%}
          {%- set fr   = ds.free  | default('0 GB', boolean=true) | string -%}
          {%- set tu   = tr | upper -%}
          {%- set fu   = fr | upper -%}
          {%- set tmul = 1024 if 'TB' in tu else (0.0009765625 if 'MB' in tu else 1) -%}
          {%- set fmul = 1024 if 'TB' in fu else (0.0009765625 if 'MB' in fu else 1) -%}
          {%- set tg   = (tr|regex_replace('[^0-9.]','')|default('0', boolean=true)|float)*tmul -%}
          {%- set fg   = (fr|regex_replace('[^0-9.]','')|default('0', boolean=true)|float)*fmul -%}
          {%- set cap  = (tg*1073741824)|int -%}
          {%- set free = (fg*1073741824)|int -%}
        {%- endif -%}
        {%- set total_mb = (cap /1048576)|round(0,'floor')|int -%}
        {%- set free_mb  = (free/1048576)|round(0,'floor')|int -%}
        {%- set used_mb  = total_mb - free_mb -%}
        {%- set sized = total_mb > 0 -%}
        {%- set _ = out.append({
          'name':          ds.name,
          'type':          ds.type | default(none),
          'total_mb':      total_mb if sized else none,
          'free_mb':       free_mb  if sized else none,
          'used_mb':       used_mb  if sized else none,
          'usage_percent': (used_mb/total_mb*100)|round(1) if sized else none,
          'accessible':    ds.accessible | default(none)
        }) -%}
      {%- endfor -%}
      {{ out }}
    _e_unsized_ds: >-
      {%- set names = [] -%}
      {%- for ds in (_e_raw_ds | default([])) -%}
        {%- set has_cap = (ds.capacity is defined and (ds.capacity | int) > 0) -%}
        {%- set has_total = (ds.total is defined and ((ds.total | string | regex_replace('[^0-9.]','') | default('0', boolean=true)) | float) > 0) -%}
        {%- if not (has_cap or has_total) -%}
          {%- set _ = names.append(ds.name | default('unknown')) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ names }}
  no_log: true

- name: "esxi | normalize storage | compute summary groups"
  ansible.builtin.set_fact:
    _e_stor_summary: >-
      {%- set ns = namespace(groups=[], seen={}, total=0) -%}
      {%- for d in (_e_raw_disks | default([])) -%}
        {%- set cap_gb = ((d.total_mb | default(0, true)) | int / 1024) | round(0, 'floor') | int -%}
        {%- if cap_gb > 0 -%}
          {%- set mt = d.media_type | default(none) -%}
          {%- set pr = d.protocol | default(none) -%}
          {%- set md = d.model | default(none) -%}
          {%- set key = (cap_gb|string)~'|'~(mt|string)~'|'~(pr|string)~'|'~(md|string) -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set q = ns.groups[idx].quantity + 1 -%}
            {%- set _ = ns.groups[idx].update({'quantity': q, 'group_total_gb': q * cap_gb}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'unit_capacity_gb': cap_gb, 'model': md, 'media_type': mt, 'protocol': pr, 'quantity': 1, 'group_total_gb': cap_gb}) -%}
          {%- endif -%}
          {%- set ns.total = ns.total + cap_gb -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups, 'grand_total_gb': ns.total} }}
  no_log: true

- name: "esxi | normalize storage | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      storage:
        filesystems:     []
        physical_disks:  "{{ _e_raw_disks | default([]) }}"
        datastores:      "{{ _e_norm_datastores }}"
        controllers:     "{{ _e_raw_controllers | default([]) }}"
        logical_volumes: []
        summary:         "{{ _e_stor_summary | default({'groups': [], 'grand_total_gb': 0}) }}"
    _sections_supported_fragment: ['storage']
    _sections_collected_fragment: >-
      {{ ['storage'] if _e_ds_ok | bool else [] }}
    _sections_failed_fragment: >-
      {{ [] if _e_ds_ok | bool else ['storage'] }}
    _errors_fragment: >-
      {%- set out = [] -%}
      {%- if not (_e_ds_ok | bool) -%}
        {%- set _ = out.append({
          'section': 'storage',
          'message': '스토리지 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
          'detail':  _e_ds_err | default(none)}) -%}
      {%- elif (_e_unsized_ds | default([]) | length) > 0 -%}
        {%- set _ = out.append({
          'section': 'storage',
          'message': '일부 데이터스토어가 용량 정보를 제공하지 않아 용량 값이 비어 있습니다.',
          'detail':  ('용량 미제공 데이터스토어 ' ~ (_e_unsized_ds | length) ~ '개: '
                      ~ (_e_unsized_ds | join(', ')))[:500]}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: "esxi | normalize storage | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
