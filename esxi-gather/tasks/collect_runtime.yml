---

- name: "esxi | runtime | NTP info"
  community.vmware.vmware_host_ntp_info:
    hostname:       "{{ _e_ip }}"
    username:       "{{ _e_user }}"
    password:       "{{ _e_pass }}"
    validate_certs: false
    esxi_hostname:  "{{ _e_hostname | default(_e_ip, true) }}"
  register:    _e_ntp_result
  delegate_to: localhost
  failed_when: false
  no_log: true

- name: "esxi | runtime | firewall info"
  community.vmware.vmware_host_firewall_info:
    hostname:       "{{ _e_ip }}"
    username:       "{{ _e_user }}"
    password:       "{{ _e_pass }}"
    validate_certs: false
    esxi_hostname:  "{{ _e_hostname | default(_e_ip, true) }}"
  register:    _e_firewall_result
  delegate_to: localhost
  failed_when: false
  no_log: true

- name: "esxi | runtime | service info"
  community.vmware.vmware_host_service_info:
    hostname:       "{{ _e_ip }}"
    username:       "{{ _e_user }}"
    password:       "{{ _e_pass }}"
    validate_certs: false
    esxi_hostname:  "{{ _e_hostname | default(_e_ip, true) }}"
  register:    _e_service_result
  delegate_to: localhost
  failed_when: false
  no_log: true

- name: "esxi | runtime | parse all"
  ansible.builtin.set_fact:
    _e_runtime_timezone: >-
      {%- set hosts = (_e_ntp_result.hosts_ntp_info | default({})) -%}
      {%- set h = _e_hostname | default(none) -%}
      {%- set key = h if (h and hosts is mapping and h in hosts) else ((hosts.keys() | list | first) if (hosts is mapping and hosts) else none) -%}
      {%- set first_h = hosts[key] if key is not none else [] -%}
      {%- if first_h -%}{{ first_h[0].time_zone_name | default(none) }}{%- else -%}{{ none }}{%- endif -%}
    _e_runtime_ntp_servers: >-
      {%- set hosts = (_e_ntp_result.hosts_ntp_info | default({})) -%}
      {%- set h = _e_hostname | default(none) -%}
      {%- set key = h if (h and hosts is mapping and h in hosts) else ((hosts.keys() | list | first) if (hosts is mapping and hosts) else none) -%}
      {%- set first_h = hosts[key] if key is not none else [] -%}
      {%- if first_h -%}{{ first_h[0].ntp_servers | default([]) }}{%- else -%}{{ [] }}{%- endif -%}
    _e_runtime_ntp_ok: "{{ (_e_ntp_result is not failed) and (_e_ntp_result.hosts_ntp_info is defined) }}"

    _e_runtime_firewall_state: >-
      {%- set _ib = (_e_raw_host | default({})).firewall_incoming_blocked | default(none) -%}
      {%- set fws = (_e_firewall_result.hosts_firewall_info | default({})) -%}
      {%- if _ib is not none -%}
        {{ 'active' if _ib else 'inactive' }}
      {%- elif (_e_firewall_result is failed) or not fws or (fws is not mapping) -%}
        {{ none }}
      {%- else -%}
        {%- set h = _e_hostname | default(none) -%}
        {%- set key = h if (h and h in fws) else (fws.keys() | list | first) -%}
        {%- set rules = fws[key] if (fws[key] is iterable and fws[key] is not string and fws[key] is not mapping) else [] -%}
        {%- if (rules | length) == 0 -%}
          {{ none }}
        {%- else -%}
          {%- set enabled_count = (rules | selectattr('enabled','equalto',true) | list | length) -%}
          {{ 'active' if enabled_count > 0 else 'inactive' }}
        {%- endif -%}
      {%- endif -%}
    _e_runtime_fw_ok: "{{ (_e_firewall_result is not failed) and (_e_firewall_result.hosts_firewall_info is defined) }}"

    _e_runtime_ntpd_running: >-
      {%- set svcs = (_e_service_result.host_service_info | default({})) -%}
      {%- if svcs and svcs is mapping -%}
        {%- set h = _e_hostname | default(none) -%}
        {%- set key = h if (h and h in svcs) else (svcs.keys() | list | first) -%}
        {%- set svc_list = svcs[key] if (svcs[key] is iterable and svcs[key] is not string and svcs[key] is not mapping) else [] -%}
        {%- set ntp_svc = (svc_list | selectattr('key','equalto','ntpd') | list | first | default({})) -%}
        {%- if ntp_svc -%}{{ ntp_svc.running | default(none) }}{%- else -%}{{ none }}{%- endif -%}
      {%- else -%}{{ none }}{%- endif -%}
    _e_runtime_svc_ok: "{{ (_e_service_result is not failed) and (_e_service_result.host_service_info is defined) }}"
  no_log: true

- name: "esxi | runtime | merge into system fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      system:
        runtime:
          timezone:         "{{ _e_runtime_timezone | default(none) }}"
          ntp_active: >-
            {%- set r = _e_runtime_ntpd_running | default(none) -%}
            {{ (r | bool) if (r is not none and (r | string | lower) in ['true','false']) else none }}
          ntp_synchronized: null
          firewall_tool:    "esxi_firewall"
          firewall_state:   "{{ _e_runtime_firewall_state | default(none) }}"
          listening_ports:  "{{ _e_raw_listening_ports | default([]) }}"
          swap_total_mb:    null
          swap_used_mb:     null
          swap_free_mb:     null
          ntp_servers:      "{{ _e_runtime_ntp_servers | default([]) }}"
    _sections_supported_fragment: ['system']
    _sections_collected_fragment: ['system']
    _sections_failed_fragment: []
    _errors_fragment: >-
      {%- set oks = [(_e_runtime_ntp_ok | default(false) | bool), (_e_runtime_fw_ok | default(false) | bool), (_e_runtime_svc_ok | default(false) | bool)] -%}
      {%- if oks | select | list | length == 0 -%}
        {{ [{'section': 'system',
             'message': '서버 기본 정보 중 운영 환경 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  'scope=timezone,ntp,firewall; cause=all_modules_failed; msg='
                        ~ ((_e_ntp_result.msg | default('') | string | trim) or 'none')}] }}
      {%- elif oks | select | list | length < 3 -%}
        {%- set mods = [('ntp', oks[0], _e_ntp_result | default({})), ('firewall', oks[1], _e_firewall_result | default({})),
                        ('service', oks[2], _e_service_result | default({}))] -%}
        {%- set scopes = [] -%}
        {%- set msgs = [] -%}
        {%- for m in mods if not m[1] -%}
          {%- set _ = scopes.append(m[0]) -%}
          {%- set t = (((m[2].get('msg') if (m[2] is mapping) else '') or '') | string | replace('\n', ' ') | replace('\r', ' ') | trim) -%}
          {%- if t -%}{%- set _ = msgs.append(t) -%}{%- endif -%}
        {%- endfor -%}
        {{ [{'section': 'system',
             'message': '서버 기본 정보 중 운영 환경 정보 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  'scope=' ~ (scopes | join(',')) ~ '; cause=module_failed; msg=' ~ ((msgs | first | default('none'))[:160])}] }}
      {%- else -%}
        {{ [] }}
      {%- endif -%}
  no_log: true

- name: "esxi | runtime | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
