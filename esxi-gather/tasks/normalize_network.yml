---

- name: "esxi | normalize network | extract dns and gw"
  ansible.builtin.set_fact:
    _e_default_gw:  "{{ (_e_raw_host | default({})).default_gateway | default(none, true) or none }}"
    _e_default_gw6: "{{ (_e_raw_host | default({})).default_gateway_ipv6 | default(none, true) or none }}"
    _e_gw_device:   "{{ (_e_raw_host | default({})).gateway_device | default(none, true) or none }}"
    _e_dns_servers: >-
      {%- set dns_out = [] -%}
      {%- set dns_dict = _e_raw_dns | default({}) -%}
      {%- if dns_dict is mapping and (dns_dict | length > 0) -%}
        {%- set first_key = (dns_dict.keys() | list | first) -%}
        {%- set entry = dns_dict[first_key] -%}
        {%- for srv in ((entry.ip_address | default([])) if entry is mapping else []) -%}
          {%- if srv -%}{%- set _ = dns_out.append(srv | string) -%}{%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if not dns_out -%}
        {%- for srv in ((_e_raw_host | default({})).dns_servers | default([])) -%}
          {%- if srv -%}{%- set _ = dns_out.append(srv | string) -%}{%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if not dns_out -%}
        {%- set host_cfgs = (_e_raw_config | default({})).values() | list -%}
        {%- for host_cfg in host_cfgs -%}
          {%- set net_info = host_cfg.get('network_system_info', host_cfg) if host_cfg is mapping else {} -%}
          {%- set dns_cfg = (net_info.get('dns_config') if net_info is mapping else {}) | default({}, true) -%}
          {%- for srv in (dns_cfg.address | default([])) -%}
            {%- if srv -%}{%- set _ = dns_out.append(srv | string) -%}{%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endif -%}
      {{ dns_out | unique | list }}
  no_log: true

- name: "esxi | normalize network | build interfaces"
  ansible.builtin.set_fact:
    _e_norm_interfaces: >-
      {%- set out = [] -%}
      {%- set gw = _e_default_gw | default(none) -%}
      {%- set gw_dev = _e_gw_device | default(none) -%}
      {%- set v6_by_dev = {} -%}
      {%- set vnic_by_dev = {} -%}
      {%- for v in ((_e_raw_host | default({})).vnics | default([])) -%}
        {%- if v.device | default(none) -%}
          {%- set _ = v6_by_dev.update({v.device: (v.ipv6 | default([]))}) -%}
          {%- set _ = vnic_by_dev.update({v.device: v}) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set gns = namespace(gw_int=none) -%}
      {%- if gw and (gw | regex_search('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')) -%}
        {%- set go = gw.split('.') -%}
        {%- set gns.gw_int = (go[0] | int) * 16777216 + (go[1] | int) * 65536 + (go[2] | int) * 256 + (go[3] | int) -%}
      {%- endif -%}
      {%- for iface in (_e_raw_facts.ansible_interfaces | default([])) -%}
        {%- set d    = _e_raw_facts.get('ansible_' ~ iface, {}) -%}
        {%- set ipv4 = d.get('ipv4', {}) -%}
        {%- if ipv4.get('address') and
               ipv4.address != '127.0.0.1' and
               not ipv4.address.startswith('169.254.') -%}
          {%- set nm = ipv4.netmask | default('') -%}
          {%- set pns = namespace(bits=0, val=0, mask_int=0) -%}
          {%- if nm -%}
            {%- for octet in nm.split('.') -%}
              {%- set pns.val = octet | int -%}
              {%- set pns.mask_int = pns.mask_int * 256 + (octet | int) -%}
              {%- for bit in [128,64,32,16,8,4,2,1] -%}
                {%- if pns.val >= bit -%}
                  {%- set pns.bits = pns.bits + 1 -%}
                  {%- set pns.val = pns.val - bit -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set pfx = pns.bits if nm else none -%}
          {%- set ins = namespace(primary=false) -%}
          {%- if gw_dev -%}
            {%- set ins.primary = (iface == gw_dev) -%}
          {%- elif gns.gw_int is not none and nm -%}
            {%- set ao = ipv4.address.split('.') -%}
            {%- set a_int = (ao[0] | int) * 16777216 + (ao[1] | int) * 65536 + (ao[2] | int) * 256 + (ao[3] | int) -%}
            {%- set ins.primary = ((a_int // (4294967296 - pns.mask_int)) == (gns.gw_int // (4294967296 - pns.mask_int))) if (pns.mask_int < 4294967295) else (a_int == gns.gw_int) -%}
          {%- endif -%}
          {%- set addrs = [{'family':'ipv4','address':ipv4.address,
                            'prefix_length':pfx,
                            'subnet_mask': nm if nm else none,
                            'gateway': gw if (ins.primary and gw) else none}] -%}
          {%- for a6 in (v6_by_dev.get(iface, []) or []) -%}
            {%- if a6.address | default(none) -%}
              {%- set a6s = (a6.address | lower) -%}
              {%- set scope = 'link' if a6s.startswith('fe80') else ('host' if a6s == '::1' else 'global') -%}
              {%- set _ = addrs.append({'family':'ipv6','address':a6.address,
                                        'prefix_length': a6.prefix_length | default(none),
                                        'subnet_mask': none,
                                        'scope': scope,
                                        'gateway': (_e_default_gw6 | default(none)) if (ins.primary and scope == 'global') else none}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set vn = vnic_by_dev.get(iface, {}) -%}
          {%- set _ = out.append({
            'id':          iface, 'name': iface, 'kind': 'vmkernel',
            'mac':         (d.get('macaddress', none) or vn.get('mac', none)) | normalize_mac,
            'mtu':         d.get('mtu', none) if d.get('mtu', none) is not none else vn.get('mtu', none),
            'speed_mbps':  none,
            'link_status': ('up' if (ipv4.address == (_e_ip | default('')) or d.get('active', false)) else 'unknown'),
            'is_primary':  ins.primary,
            'addresses':   addrs
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "esxi | normalize network | compute summary groups"
  ansible.builtin.set_fact:
    _e_net_summary: >-
      {%- set ns = namespace(groups=[], seen={}) -%}
      {%- for n in (_e_norm_interfaces | default([])) -%}
        {%- set sp = n.speed_mbps | default(none) -%}
        {%- if sp is not none and (sp | int) > 0 -%}
          {%- set link_up = (n.link_status | default('') | lower) in ['up','linkup'] -%}
          {%- set key = sp | string -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set _ = ns.groups[idx].update({'quantity': ns.groups[idx].quantity + 1, 'link_up_count': ns.groups[idx].link_up_count + (1 if link_up else 0)}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'speed_mbps': sp, 'link_type': none, 'quantity': 1, 'link_up_count': 1 if link_up else 0}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups} }}
  no_log: true

- name: "esxi | normalize network | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      network:
        dns_servers: "{{ _e_dns_servers }}"
        default_gateways: >-
          {%- set out = [] -%}
          {%- if _e_default_gw -%}
            {%- set _ = out.append({'family':'ipv4','address':_e_default_gw}) -%}
          {%- endif -%}
          {%- if _e_default_gw6 -%}
            {%- set _ = out.append({'family':'ipv6','address':_e_default_gw6}) -%}
          {%- endif -%}
          {{ out }}
        interfaces: "{{ _e_norm_interfaces }}"
        adapters:    []
        ports:       []
        driver_map:  []
        summary: "{{ _e_net_summary | default({'groups': []}) }}"
    _sections_supported_fragment: ['network']
    _sections_collected_fragment: "{{ ['network'] if ((_e_norm_interfaces | default([])) | length > 0) else [] }}"
    _sections_failed_fragment:    "{{ [] if ((_e_norm_interfaces | default([])) | length > 0) else ['network'] }}"
    _errors_fragment: >-
      {%- set out = [] -%}
      {%- if (_e_norm_interfaces | default([])) | length == 0 -%}
        {%- set _ = out.append({'section': 'network',
             'message': '네트워크 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  'source=vmware_host_facts.ansible_interfaces; cause=no_interfaces'}) -%}
      {%- endif -%}
      {%- if (((_e_dns_servers | default([]) | length) == 0)
              and not (_e_dns_ok | default(false) | bool)) -%}
        {%- set _ = out.append({'section': 'network',
             'message': '네트워크 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  'dns_servers=[] (dns_info ok=' ~ (_e_dns_ok | default(false)) ~
                        ', config_info ok=' ~ (_e_config_ok | default(false)) ~ ')'}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: "esxi | normalize network | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
