---

- name: "redfish | reselect | 인증 후 facts 조립"
  ansible.builtin.set_fact:
    _rf_postauth_facts:
      vendor: "{{ (_rf_probe_facts | default({})).vendor | default('') }}"
      model: >-
        {{ ((_rf_raw_collect.data | default({}, true)).get('system') | default({}, true)).get('model', '')
           | default('', true) }}
      firmware: >-
        {{ ((_rf_raw_collect.data | default({}, true)).get('bmc') | default({}, true)).get('firmware_version', '')
           | default('', true) }}
  no_log: true

- name: "redfish | reselect | 종전 adapter 기억"
  when: >-
    ((_rf_postauth_facts.model | default('')) | length > 0)
    or ((_rf_postauth_facts.firmware | default('')) | length > 0)
  ansible.builtin.set_fact:
    _rf_adapter_before_reselect: "{{ (_selected_adapter | default({})).adapter_id | default('') }}"
  no_log: true

- name: "redfish | reselect | adapter 다시 고르기"
  when: >-
    ((_rf_postauth_facts.model | default('')) | length > 0)
    or ((_rf_postauth_facts.firmware | default('')) | length > 0)
  ansible.builtin.set_fact:
    _selected_adapter: >-
      {{ lookup('adapter_loader',
                 channel='redfish',
                 facts=_rf_postauth_facts,
                 repo_root=lookup('env','REPO_ROOT')) }}
  no_log: true

- name: "redfish | reselect | 1차 값 기록 (바뀐 경우만, 최초 1회)"
  when:
    - _rf_adapter_before_reselect is defined
    - _rf_adapter_first_pass is not defined
    - _rf_adapter_before_reselect != (_selected_adapter.adapter_id | default(''))
  ansible.builtin.set_fact:
    _rf_adapter_first_pass: "{{ _rf_adapter_before_reselect }}"

- name: "redfish | reselect | 결과"
  when: _rf_adapter_before_reselect is defined
  ansible.builtin.debug:
    msg: >-
      adapter {{ _rf_adapter_before_reselect }} -> {{ _selected_adapter.adapter_id | default('none') }}
      (model={{ _rf_postauth_facts.model | default('') }},
       fw={{ _rf_postauth_facts.firmware | default('') }})
