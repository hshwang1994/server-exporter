---

- name: "redfish | load_vault | adopt resolved credential sets"
  ansible.builtin.set_fact:
    _rf_standard_accounts: "{{ _cred_standard_accounts | default([]) }}"
    _rf_recovery_accounts: "{{ _cred_recovery_accounts | default([]) }}"
    _rf_accounts: "{{ _cred_accounts | default([]) }}"
    _rf_vault_scope: "{{ _cred_scope | default('') }}"
    _rf_recovery_scope: "{{ _cred_recovery_scope | default('') }}"
    _rf_vault_loaded: "{{ (_cred_standard_outcome | default('not_resolved')) == 'loaded' }}"
  no_log: true

- name: "redfish | load_vault | warn vendor unresolved"
  ansible.builtin.debug:
    msg: >-
      vendor 를 식별하지 못해 복구 계정 범위를 정하지 못했습니다
      (reason={{ _cred_reason | default('vendor_unresolved') }}).
      표준 계정은 vendor 와 무관하므로 그대로 시도합니다. 표준 계정 인증이 실패해도
      복구는 수행할 수 없습니다.
  when: (_cred_reason | default('')) == 'vendor_unresolved'

- name: "redfish | load_vault | warn standard credential set unavailable"
  ansible.builtin.debug:
    msg: >-
      표준 수집 계정을 열지 못했습니다 (scope={{ _rf_vault_scope | default('?') }},
      outcome={{ _cred_standard_outcome | default('not_resolved') }}) —
      파일 존재 여부와 ansible-vault 복호화 키를 확인하세요.
  when: (_cred_standard_outcome | default('not_resolved')) != 'loaded'

- name: "redfish | load_vault | warn recovery credential set unavailable"
  ansible.builtin.debug:
    msg: >-
      복구 계정 세트를 열지 못했습니다 (scope={{ _rf_recovery_scope | default('?') }},
      outcome={{ _cred_recovery_outcome | default('not_resolved') }}).
      표준 계정 인증이 성공하면 영향이 없지만, 실패하면 복구를 진행할 수 없습니다.
  when:
    - (_cred_reason | default('')) == 'resolved'
    - (_cred_recovery_outcome | default('not_resolved')) != 'loaded'

- name: "redfish | load_vault | summary"
  ansible.builtin.debug:
    msg: >-
      standard_scope={{ _rf_vault_scope | default('(none)') }}
      (accounts={{ _rf_standard_accounts | length }}),
      recovery_scope={{ _rf_recovery_scope | default('') | ternary(_rf_recovery_scope, '(none)') }}
      (accounts={{ _rf_recovery_accounts | length }}),
      labels={{ _rf_accounts | map(attribute='label') | list }}
