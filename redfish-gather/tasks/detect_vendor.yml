---

- name: "redfish | detect_vendor | load vendor aliases"
  ansible.builtin.set_fact:
    _va: "{{ lookup('file', lookup('env','REPO_ROOT') ~ '/common/vars/vendor_aliases.yml') | from_yaml }}"

- name: "redfish | detect_vendor | probe"
  timeout: "{{ _rf_detect_task_timeout | default(120) }}"
  redfish_gather:
    bmc_ip:     "{{ _rf_ip }}"
    username:   ""
    password:   ""
    timeout:    "{{ _rf_timeout | default(30) }}"
    verify_ssl: false
    mode:       detect
    deadline:   "{{ _rf_detect_deadline | default(90) }}"
    attempt:
      evidence_dir: "{{ lookup('env', 'SE_AUTH_EVIDENCE_DIR') }}"
      id:           "detect-0-1"
      build_id:     "{{ lookup('env', 'SE_BUILD_ID') }}"
      event_uuid:   "{{ lookup('env', 'SE_EVENT_UUID') }}"
      label:        "detect"
      role:         "anonymous"
  register:    _rf_probe_result
  failed_when: false
  ignore_errors: true
  no_log: true

- name: "redfish | detect_vendor | preserve probe evidence"
  ansible.builtin.set_fact:
    _rf_probe_notes: >-
      {%- set msgs = [] -%}
      {%- for e in (_rf_probe_result.errors | default([]))[:2] -%}
        {%- if e is mapping and e.message is defined -%}
          {%- set _ = msgs.append(e.message | string) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ('probe: ' ~ (msgs | join(' | '))) if msgs else '' }}
  no_log: true

- name: "redfish | detect_vendor | normalize vendor"
  ansible.builtin.set_fact:
    _rf_detected_vendor: >-
      {{ (_rf_probe_result.vendor | default(''))
         | canonical_vendor(_va.vendor_aliases | default({})) }}
    _rf_probe_facts:
      vendor: "{{ _rf_probe_result.vendor | default('') }}"
      firmware: >-
        {{
          (
            ((_rf_probe_result.data | default({}, true)).get('bmc') | default({}, true)).get('firmware_version', '')
            | default('', true)
          )
          or (_rf_probe_result.probe_facts | default({}, true)).get('firmware_hint', '')
          or (_rf_probe_result.probe_facts | default({}, true)).get('manager_type', '')
        }}
      model: >-
        {{
          (
            ((_rf_probe_result.data | default({}, true)).get('system') | default({}, true)).get('model', '')
            | default('', true)
          )
          or (_rf_probe_result.probe_facts | default({}, true)).get('model_hint', '')
        }}
  no_log: true
