---

- when: not (_rf_collect_ok | default(false) | bool)
  block:

    - name: "redfish | try_account | mark attempt in flight"
      ansible.builtin.set_fact:
        _rf_attempt_seq: "{{ (_rf_attempt_seq | default(0) | int) + 1 }}"
        _rf_attempt_id:  "collect-{{ ansible_loop.index | default(1) }}-{{ (_rf_attempt_seq | default(0) | int) + 1 }}"
      no_log: true

    - name: "redfish | try_account | attempt"
      redfish_gather:
        bmc_ip:         "{{ _rf_ip }}"
        username:       "{{ _try_account.username | default('') }}"
        password:       "{{ _try_account.password | default('') }}"
        timeout:        "{{ _rf_timeout }}"
        verify_ssl:     false
        manager_layout: "{{ _rf_adapter_manager_layout | default('') }}"
        attempt:
          evidence_dir: "{{ lookup('env', 'SE_AUTH_EVIDENCE_DIR') }}"
          id:           "{{ _rf_attempt_id }}"
          build_id:     "{{ lookup('env', 'SE_BUILD_ID') }}"
          event_uuid:   "{{ lookup('env', 'SE_EVENT_UUID') }}"
          label:        "{{ _try_account.label | default('unlabeled') }}"
          role:         "{{ _try_account.role | default('primary') }}"
      register:    _rf_attempt
      failed_when: false
      no_log: true

    - name: "redfish | try_account | evaluate"
      ansible.builtin.set_fact:
        _rf_attempt_ok: >-
          {{ _rf_attempt is not failed and
             (_rf_attempt.status | default('failed')) != 'failed' }}
      no_log: true

    - name: "redfish | try_account | record auth evidence"
      ansible.builtin.set_fact:
        _rf_attempt_id: ''
        _rf_auth_statuses: >-
          {{ (_rf_auth_statuses | default([]))
             + [ ((_rf_attempt | default({}, true)).auth_evidence
                  | default({}, true)).first_auth_status | default(none) ] }}
        _rf_auth_observations: >-
          {{ (_rf_auth_observations | default([]))
             + [ {'role': (_try_account.role | default('primary')),
                  'label': (_try_account.label | default('unlabeled')),
                  'status': (((_rf_attempt | default({}, true)).auth_evidence
                              | default({}, true)).first_auth_status | default(none))} ] }}

    - name: "redfish | try_account | promote on success"
      when: _rf_attempt_ok | bool
      ansible.builtin.set_fact:
        _rf_raw_collect: "{{ _rf_attempt }}"
        _rf_collect_ok:  true
        _rf_used_account:
          username: "{{ _try_account.username }}"
          label:    "{{ _try_account.label   | default('unlabeled') }}"
          role:     "{{ _try_account.role    | default('primary') }}"
        _rf_used_account_role:     "{{ _try_account.role | default('primary') }}"
        _rf_used_account_password: "{{ _try_account.password | default('') }}"
      no_log: true

    - name: "redfish | try_account | record failure evidence"
      when: not (_rf_attempt_ok | bool)
      ansible.builtin.set_fact:
        _rf_failed_attempt_notes: >-
          {{ (_rf_failed_attempt_notes | default([]))
             + [ (_try_account.role | default('primary')) ~ '/'
                 ~ (_try_account.label | default('unlabeled'))
                 ~ ': status=' ~ (_rf_attempt.status | default('?'))
                 ~ ' first_auth=' ~ (((_rf_attempt | default({}, true)).auth_evidence
                                      | default({}, true)).first_auth_status | default('none'))
                 ~ ' err=' ~ ((_rf_attempt.errors | default([]) | first | default({})).message
                              | default('-')) ] }}
      no_log: true

    - name: "redfish | try_account | log failure (advisory)"
      when: not (_rf_attempt_ok | bool)
      ansible.builtin.debug:
        msg: >-
          attempt failed — label={{ _try_account.label | default('unlabeled') }},
          role={{ _try_account.role | default('primary') }},
          username={{ _try_account.username | default('') }},
          status={{ _rf_attempt.status | default('?') }},
          vendor={{ _rf_attempt.vendor | default('?') }},
          first_error={{ (_rf_attempt.errors | default([]) | first | default({})).message | default('?') }}

    - name: "redfish | try_account | backoff on failure"
      when:
        - not (_rf_attempt_ok | bool)
        - (ansible_loop is not defined) or (ansible_loop.index < ansible_loop.length)
      ansible.builtin.command: >-
        sleep {{ _rf_auth_backoff_seconds | default(65)
                 if ((_rf_attempt.auth_evidence | default({})).first_auth_status | default(0)) == 401
                 else (_rf_transport_backoff_seconds | default(5)) }}
      delegate_to: localhost
      changed_when: false
