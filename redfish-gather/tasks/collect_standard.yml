---

- name: "redfish | collect_standard | init attempt state"
  ansible.builtin.set_fact:
    _rf_collect_ok: false
    _rf_used_account: {}
    _rf_auth_statuses: "{{ _rf_auth_statuses | default([]) }}"
    _rf_auth_observations: "{{ _rf_auth_observations | default([]) }}"
    _rf_primary_auth_rejected: "{{ _rf_primary_auth_rejected | default(false) }}"
    _rf_failed_attempt_notes: "{{ _rf_failed_attempt_notes | default([]) }}"
    _rf_attempt_id: "{{ _rf_attempt_id | default('') }}"
    _rf_attempt_seq: "{{ _rf_attempt_seq | default(0) }}"
  no_log: true

- name: "redfish | collect_standard | warn no accounts"
  ansible.builtin.debug:
    msg: >-
      표준 수집 후보 0개 (standard scope={{ _rf_vault_scope | default('?') }},
      reason={{ _cred_reason | default('?') }}).
  when: (_rf_try_accounts | default([])) | length == 0

- when: (_cred_reason | default('vendor_unresolved')) == 'vendor_unresolved'
  block:
    - name: "redfish | collect_standard | mark anonymous attempt in flight"
      ansible.builtin.set_fact:
        _rf_attempt_seq: "{{ (_rf_attempt_seq | default(0) | int) + 1 }}"
        _rf_attempt_id:  "anonymous-0-{{ (_rf_attempt_seq | default(0) | int) + 1 }}"
      no_log: true

    - name: "redfish | collect_standard | empty-credential attempt"
      timeout: "{{ _rf_task_timeout | default(600) }}"
      redfish_gather:
        bmc_ip:         "{{ _rf_ip }}"
        username:       ""
        password:       ""
        timeout:        "{{ _rf_timeout }}"
        verify_ssl:     false
        manager_layout: "{{ _rf_adapter_manager_layout | default('') }}"
        deadline:       "{{ _rf_deadline | default(540) }}"
        attempt:
          evidence_dir: "{{ lookup('env', 'SE_AUTH_EVIDENCE_DIR') }}"
          id:           "{{ _rf_attempt_id }}"
          build_id:     "{{ lookup('env', 'SE_BUILD_ID') }}"
          event_uuid:   "{{ lookup('env', 'SE_EVENT_UUID') }}"
          label:        "{{ 'no-credential' }}"
          role:         "{{ 'anonymous' }}"
      register:    _rf_raw_collect
      failed_when: false
      no_log: true

    - name: "redfish | collect_standard | set ok (empty creds)"
      ansible.builtin.set_fact:
        _rf_attempt_id: ''
        _rf_collect_ok: >-
          {{ _rf_raw_collect is not failed and
             (_rf_raw_collect.status | default('failed')) != 'failed' }}
      no_log: true

    - name: "redfish | collect_standard | mark anonymous account (empty creds)"
      when: _rf_collect_ok | bool
      ansible.builtin.set_fact:
        _rf_used_account:
          username: ""
          label: "no-credential"
          role: "anonymous"
        _rf_used_account_role: "anonymous"
      no_log: true

    - name: "redfish | collect_standard | record failure evidence (empty creds)"
      when: not (_rf_collect_ok | bool)
      ansible.builtin.set_fact:
        _rf_failed_attempt_notes: >-
          {{ (_rf_failed_attempt_notes | default([]))
             + [ 'no-credential: status='
                 ~ (_rf_raw_collect.status | default('?'))
                 ~ ' err=' ~ ((_rf_raw_collect.errors | default([]) | first | default({})).message
                              | default('-')) ] }}
      no_log: true

- name: "redfish | collect_standard | try accounts in order"
  ansible.builtin.include_tasks: try_one_account.yml
  loop: "{{ _rf_try_accounts | default([]) }}"
  loop_control:
    loop_var: _try_account
    label:    "{{ _try_account.label | default('unlabeled') }}"
    extended: true
  when:
    - (_rf_try_accounts | default([])) | length > 0
    - not (_rf_collect_ok | default(false) | bool)

- name: "redfish | collect_standard | primary 자격 거부 판정"
  ansible.builtin.set_fact:
    _rf_primary_auth_rejected: >-
      {{ ((_rf_auth_observations | default([]))
          | selectattr('role', 'eq', 'primary')
          | selectattr('status', 'eq', 401)
          | list | length) > 0 }}

- name: "redfish | collect_standard | set vendor"
  ansible.builtin.set_fact:
    _rf_vendor: >-
      {{ _rf_detected_vendor
         if (_rf_detected_vendor | default('unknown')) != 'unknown'
         else none }}
  no_log: true

- name: "redfish | collect_standard | record attempts meta"
  ansible.builtin.set_fact:
    _rf_attempts_meta:
      attempted_count: "{{ _rf_auth_observations | default([]) | length | int }}"
      used_label:      "{{ (_rf_used_account | default({})).label | default(none) }}"
      used_role:       "{{ (_rf_used_account | default({})).role  | default(none) }}"
      fallback_used: >-
        {{ (((_rf_used_account | default({})).role | default('primary')) != 'primary'
            and _rf_collect_ok | bool) | bool }}
  no_log: true
