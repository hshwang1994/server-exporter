---

- name: "redfish-gather"
  hosts: all
  gather_facts: false
  connection: local
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/failure_reasons.yml"
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/section_messages.yml"

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _rf_ip:      "{{ ansible_host | default(inventory_hostname) }}"
    _rf_timeout: 1800

  tasks:

    - name: "redfish | gather"
      block:

        - name: "redfish | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        - name: "redfish | run precheck"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/precheck/run_precheck.yml"
          vars:
            _precheck_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
            _precheck_channel: "redfish"
            _precheck_timeout: "{{ _rf_timeout }}"

        - name: "redfish | abort if precheck failed"
          ansible.builtin.fail:
            msg: >-
              Redfish 호스트 연결 진단에 실패했습니다 ({{ _rf_ip }}).
              단계={{ (_diagnosis | default({})).failure_stage | default('unknown') }},
              사유={{ (_diagnosis | default({})).failure_reason | default('연결 불가') }}.
              BMC 전원, 네트워크, Redfish API(443) 포트를 확인하세요.
          when: not (_precheck_ok | bool)

        - name: "redfish | detect vendor"
          ansible.builtin.include_tasks: tasks/detect_vendor.yml

        - name: "redfish | resolve credentials"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/resolve_and_load_redfish.yml"
          vars:
            _cred_target_type: "redfish"
            _cred_vendor: "{{ _rf_detected_vendor | default('') }}"

        - name: "redfish | load vault"
          ansible.builtin.include_tasks: tasks/load_vault.yml

        - name: "redfish | abort if credential set unavailable"
          ansible.builtin.fail:
            msg: >-
              Credential set 을 열 수 없습니다
              (standard scope={{ _cred_scope | default('') | ternary(_cred_scope, _cred_reason) }},
              outcome={{ _cred_standard_outcome | default('not_resolved') }}).
              se_location 값과 vault/common/redfish/standard.yml, ansible-vault 복호화 키를 확인하세요.
          when: >-
            (_cred_reason | default('unknown_location')) not in ['resolved', 'vendor_unresolved']
            or (_cred_standard_outcome | default('not_resolved'))
               in ['credential_set_missing', 'credential_set_undecryptable']

        - name: "redfish | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {{ lookup('adapter_loader',
                         channel='redfish',
                         facts=_rf_probe_facts | default({}),
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "redfish | adapter selected"
          ansible.builtin.debug:
            msg: "adapter={{ _selected_adapter.adapter_id | default('none') }}"

        - name: "redfish | extract manager_layout from adapter"
          ansible.builtin.set_fact:
            _rf_adapter_manager_layout: >-
              {{ ((_selected_adapter | default({})).vendor_notes | default({})).manager_layout | default('') }}

        - name: "redfish | collect standard"
          ansible.builtin.include_tasks: tasks/collect_standard.yml
          vars:
            _rf_try_accounts: "{{ _rf_standard_accounts | default([]) }}"

        - name: "redfish | reselect adapter (1차 수집 후)"
          ansible.builtin.include_tasks: tasks/reselect_adapter.yml

        - name: "redfish | account_service | 진입 조건 판정"
          ansible.builtin.set_fact:
            _rf_account_reconcile_allowed: >-
              {{ (not (_rf_collect_ok | default(false) | bool))
                 and (_rf_primary_auth_rejected | default(false) | bool)
                 and ((_rf_recovery_accounts | default([])) | length > 0) }}

        - name: "redfish | account_service (recovery → standard)"
          when: _rf_account_reconcile_allowed | bool
          ansible.builtin.include_tasks: tasks/account_service.yml

        - name: "redfish | recovery set unavailable 사실 기록"
          when:
            - not (_rf_collect_ok | default(false) | bool)
            - _rf_primary_auth_rejected | default(false) | bool
            - (_rf_recovery_accounts | default([])) | length == 0
          block:
            - name: "redfish | recovery set unavailable fragment"
              ansible.builtin.set_fact:
                _data_fragment: {}
                _sections_supported_fragment: []
                _sections_collected_fragment: []
                _sections_failed_fragment: []
                _sections_unsupported_fragment: []
                _errors_fragment:
                  - section: "account_service"
                    message: "{{ _sm_overrides.account_service }}"
                    detail: >-
                      standard credential rejected and no recovery credential set available
                      (recovery scope={{ _rf_recovery_scope | default('') | ternary(_rf_recovery_scope, _cred_reason | default('unresolved')) }},
                      outcome={{ _cred_recovery_outcome | default('not_resolved') }})

            - name: "redfish | recovery set unavailable 누적 (merge_fragment)"
              ansible.builtin.include_tasks:
                file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"

        - name: "redfish | re-collect with standard account (after recovery)"
          when:
            - _rf_account_reconcile_allowed | bool
            - (_rf_account_service_meta | default({})).recovered | default(false) | bool
            - not ((_rf_account_service_meta | default({})).dryrun | default(true) | bool)
          ansible.builtin.include_tasks: tasks/collect_standard.yml
          vars:
            _rf_try_accounts: "{{ _rf_standard_accounts | default([]) }}"

        - name: "redfish | reselect adapter (복구 후 재수집 뒤)"
          when:
            - _rf_account_reconcile_allowed | bool
            - (_rf_account_service_meta | default({})).recovered | default(false) | bool
          ansible.builtin.include_tasks: tasks/reselect_adapter.yml

        - name: "redfish | abort if collect completely failed"
          ansible.builtin.fail:
            msg: >-
              {%- set d = _diagnosis | default({}) -%}
              {%- if not (d.reachable | default(false)) -%}
              Redfish 정보 수집에 실패했습니다. BMC({{ _rf_ip }})에 도달하지 못했습니다. 네트워크 경로와 BMC 전원 상태를 확인하세요.
              {%- elif not (d.port_open | default(false)) -%}
              Redfish 정보 수집에 실패했습니다. BMC({{ _rf_ip }})의 443 포트가 열려 있지 않습니다. 방화벽 규칙과 BMC HTTPS 서비스 상태를 확인하세요.
              {%- elif not (d.protocol_supported | default(false)) -%}
              Redfish 정보 수집에 실패했습니다. BMC({{ _rf_ip }}:443)에서 예상한 Redfish API 응답을 확인하지 못했습니다. Redfish 서비스 활성화 여부와 BMC 펌웨어 호환성을 확인하세요.
              {%- else -%}
              Redfish 정보 수집에 실패했습니다 ({{ _rf_ip }}).
              네트워크/포트/Redfish API 는 정상 확인됨 (Redfish {{ d.details.redfish_version | default('?') }} / {{ d.details.product | default('Unknown') }}).
              가능한 원인은 (1) 자격증명 불일치 (credential scope={{ _cred_scope | default('?') }}, 시도된 계정 수 {{ (_rf_attempts_meta | default({})).attempted_count | default('?') }}개),
              (2) 계정 권한 부족, (3) 펌웨어 호환성 또는 OEM 경로 문제입니다.
              자세한 기술 오류는 errors 항목을 확인하세요.
              {%- endif -%}
          when: not (_rf_collect_ok | bool)

        - name: "redfish | abort if final gathering not by standard account"
          ansible.builtin.fail:
            msg: >-
              Redfish 정보 수집에 실패했습니다 ({{ _rf_ip }}).
              표준 수집 계정으로 수집을 완료하지 못했습니다
              (사용된 계정 역할={{ (_rf_used_account | default({})).role | default('unknown') }}).
              표준 계정 상태와 자격증명을 확인하세요.
          when: ((_rf_used_account | default({})).role | default('primary')) == 'recovery'

        - name: "redfish | normalize standard"
          ansible.builtin.include_tasks: tasks/normalize_standard.yml


        - name: "redfish | build_sections"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_sections.yml"

        - name: "redfish | build_status"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_status.yml"

        - name: "redfish | build_errors"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_errors.yml"

        - name: "redfish | set output meta"
          ansible.builtin.set_fact:
            _out_target_type:       "redfish"
            _out_collection_method: "redfish_api"
            _out_ip:                "{{ _rf_ip }}"
            _out_vendor: >-
              {{ ((_va | default({})).adapter_output_display | default({})).get((_selected_adapter | default({})).adapter_id | default(''))
                 or ((_va | default({})).vendor_output_display | default({})).get(_rf_vendor | default(''), _rf_vendor | default(none)) }}
            _diagnosis: >-
              {{ _diagnosis | combine({
                   'auth_success': true,
                   'details': ((_diagnosis | default({}, true)).details | default({})
                                if (((_diagnosis | default({}, true)).details | default({}))
                                    is mapping) else {}) | combine({
                     'adapter_candidate': _selected_adapter.adapter_id | default(none),
                     'adapter_first_pass': (_rf_adapter_first_pass | default(''))
                       if ((_rf_adapter_first_pass | default('')) != ''
                           and (_rf_adapter_first_pass | default('')) != (_selected_adapter.adapter_id | default('')))
                       else none,
                     'credential_scope': (_cred_scope | default('')) or none,
                     'recovery_credential_scope': (_cred_recovery_scope | default('')) or none,
                     'auth': _rf_attempts_meta | default({}),
                     'account_service': _rf_account_service_meta | default({}),
                     'multi_node_layout': (_rf_adapter_manager_layout | default('')) or none,
                     'notices': ((_rf_raw_collect | default({})).notices | default([])),
                     'rmc_activation_check':
                       (true if ((_rf_adapter_manager_layout | default('')) in ['rmc_primary', 'rmc_primary_ilo_secondary']
                                 and (_rf_collect_ok | default(false) | bool))
                        else (false if ((_rf_adapter_manager_layout | default('')) in ['rmc_primary', 'rmc_primary_ilo_secondary']
                                        and not (_rf_collect_ok | default(false) | bool))
                              else none))
                   })
                 }) }}

        - name: "redfish | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "redfish | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"

        - name: "redfish | build_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_output.yml"

        - name: "redfish | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

        - name: CHECKPOINT
          ansible.builtin.debug:
            msg: "{{ _output | to_json }}"

        - name: "redfish | addon"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/addon/run_addon.yml"
          vars:
            _addon_target: redfish
          when: lookup('env', 'ADDON_DIR') | length > 0

      rescue:
        - name: "redfish | rescue | backstop 증거 (현재 attempt 파일만)"
          ansible.builtin.set_fact:
            _rf_backstop_evidence: >-
              {{ ((lookup('file', lookup('env', 'SE_AUTH_EVIDENCE_DIR') ~ '/' ~ _rf_ip ~ '/' ~ _rf_attempt_id ~ '.json',
                          errors='ignore')
                   if ((lookup('env', 'SE_AUTH_EVIDENCE_DIR') | length) > 0) else '')
                  | default('', true))
                 | parse_auth_evidence({'build_id': lookup('env', 'SE_BUILD_ID'),
                                        'event_uuid': lookup('env', 'SE_EVENT_UUID'),
                                        'ip': _rf_ip, 'attempt_id': _rf_attempt_id}) }}
          when: (_rf_attempt_id | default('')) != ''
          no_log: true

        - name: "redfish | rescue | backstop 관측 반영"
          ansible.builtin.set_fact:
            _rf_backstop_class: >-
              {%- set ev = _rf_backstop_evidence | default({}) -%}
              {%- set st = ev.first_auth_status | default(none) -%}
              {%- set proven = (ev.valid | default(false)) and (ev.credentialed | default(false)) and (st is not none) -%}
              {%- if (_rf_attempt_id | default('')).startswith('account-') -%}recovery_stopped
              {%- elif proven and st >= 200 and st < 400 -%}auth_passed
              {%- elif proven and st == 401 -%}auth_rejected
              {%- else -%}before_auth{%- endif -%}
            _rf_auth_observations: >-
              {%- set ev = _rf_backstop_evidence | default({}) -%}
              {%- set st = ev.first_auth_status | default(none) -%}
              {%- set proven = (ev.valid | default(false)) and (ev.credentialed | default(false)) and (st is not none) -%}
              {{ (_rf_auth_observations | default([]))
                 + ([{'role': (ev.role | default('primary', true)), 'label': (ev.label | default('unlabeled', true)), 'status': st}]
                    if (proven and (_rf_attempt_id | default('')).startswith('collect-')) else []) }}
            _rf_auth_statuses: >-
              {%- set ev = _rf_backstop_evidence | default({}) -%}
              {%- set st = ev.first_auth_status | default(none) -%}
              {%- set proven = (ev.valid | default(false)) and (ev.credentialed | default(false)) and (st is not none) -%}
              {{ (_rf_auth_statuses | default([]))
                 + ([st] if (proven and (_rf_attempt_id | default('')).startswith('collect-')) else []) }}
            _rf_failed_attempt_notes: >-
              {%- set ev = _rf_backstop_evidence | default({}) -%}
              {%- set st = ev.first_auth_status | default(none) -%}
              {%- set proven = (ev.valid | default(false)) and (ev.credentialed | default(false)) and (st is not none) -%}
              {%- if proven and st >= 200 and st < 400 -%}{%- set why = 'task stopped after auth' -%}
              {%- elif proven -%}{%- set why = 'task stopped after auth status ' ~ st -%}
              {%- else -%}{%- set why = 'task stopped before auth evidence (' ~ (ev.reason | default('missing')) ~ ')' -%}{%- endif -%}
              {{ (_rf_failed_attempt_notes | default([]))
                 + [ (ev.role | default('?', true)) ~ '/' ~ (ev.label | default(_rf_attempt_id, true))
                     ~ ': status=task_stopped first_auth=' ~ (st if proven else 'none')
                     ~ ' err=' ~ why
                     ~ ((' last_request=' ~ ev.last_request) if (ev.last_request | default('')) else '') ] }}
          when: (_rf_attempt_id | default('')) != ''
          no_log: true

        - name: "redfish | rescue | 인증 거부 실증 판정"
          ansible.builtin.set_fact:
            _rf_auth_rejected: >-
              {%- set statuses = _rf_auth_statuses | default([]) -%}
              {%- set attempted = (_rf_standard_accounts | default([])) | length -%}
              {{ attempted > 0
                 and (statuses | length) == attempted
                 and (statuses | select('equalto', 401) | list | length) == attempted }}

        - name: "redfish | rescue | 자격 단계 관측 확정"
          ansible.builtin.set_fact:
            _rf_auth_outcome: >-
              {%- set st = (_rf_auth_observations | default([]))
                           | selectattr('status', 'defined') | map(attribute='status')
                           | select('integer') | list -%}
              {%- set ok_obs = st | select('ge', 200) | select('lt', 400) | list | length -%}
              {%- set tried = ((_rf_auth_observations | default([])) | length)
                              + ((_rf_failed_attempt_notes | default([])) | length) -%}
              {%- set std = _cred_standard_outcome | default(_cred_load_outcome | default('')) -%}
              {%- set cred_na = ((_cred_reason | default('')) == 'unknown_location')
                                or (std in ['credential_set_missing',
                                            'credential_set_undecryptable', 'empty_accounts'])
                                or (std == 'not_resolved'
                                    and (_cred_reason | default('')) != 'vendor_unresolved') -%}
              {%- if (_rf_collect_ok | default(false) | bool) or ok_obs > 0 -%}
              passed
              {%- elif _rf_auth_rejected | default(false) | bool -%}
              rejected
              {%- elif (_rf_backstop_class | default('')) == 'before_auth' -%}
              stopped_before_auth
              {%- elif tried > 0 -%}
              unknown
              {%- elif cred_na -%}
              credential_unavailable
              {%- else -%}
              not_attempted
              {%- endif -%}

        - name: "redfish | rescue | Portal 표시용 failure_reason 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set outcome = _rf_auth_outcome | default('not_attempted') -%}
              {%- set at_gather = outcome in ['passed', 'not_attempted', 'stopped_before_auth'] -%}
              {%- set std = _cred_standard_outcome | default(_cred_load_outcome | default('')) -%}
              {%- if outcome == 'passed' -%}
                {%- set reason_key = 'gather_after_auth' -%}
              {%- elif outcome in ['not_attempted', 'stopped_before_auth'] -%}
                {%- set reason_key = 'gather_internal' -%}
              {%- elif outcome == 'rejected' -%}
                {%- set reason_key = 'auth_rejected' -%}
              {%- elif outcome == 'credential_unavailable' -%}
                {%- if (_cred_reason | default('')) == 'unknown_location' -%}
                  {%- set reason_key = 'loc_unregistered' -%}
                {%- elif std == 'credential_set_undecryptable' -%}
                  {%- set reason_key = 'project_vault_unreadable' -%}
                {%- elif std == 'empty_accounts' -%}
                  {%- set reason_key = 'project_vault_no_account' -%}
                {%- else -%}
                  {%- set reason_key = 'project_vault_missing' -%}
                {%- endif -%}
              {%- elif std == 'empty_accounts' -%}
                {%- set reason_key = 'project_vault_no_account' -%}
              {%- else -%}
                {%- set reason_key = 'auth_unconfirmed' -%}
              {%- endif -%}
              {{ {'reachable': none, 'port_open': none, 'protocol_supported': none,
                  'auth_success': none, 'failure_stage': none, 'failure_code': none,
                  'failure_reason': none, 'details': {}}
                 | combine((_diagnosis | default({}, true))
                           if ((_diagnosis | default({}, true)) is mapping) else {})
                 | combine({'failure_stage': ('gather' if at_gather else 'auth'),
                            'failure_code': ('GATHER_FAILED' if at_gather
                                             else ('CREDENTIAL_SET_UNAVAILABLE'
                                                   if outcome == 'credential_unavailable'
                                                   else 'AUTH_PROBE_FAILED')),
                            'auth_success': (true if outcome == 'passed'
                                             else (false if outcome == 'rejected' else none)),
                            'failure_reason': (_fr_catalog | failure_reason(
                                                 reason_key, 'redfish',
                                                 _cred_location | default(se_location | default('')))),
                            'details': (((_diagnosis | default({}, true)).details | default({}))
                                        if (((_diagnosis | default({}, true)).details | default({}))
                                            is mapping)
                                        else {})
                                       | combine({'credential_scope': (_cred_scope | default('')) or none,
                                                  'recovery_credential_scope':
                                                    (_cred_recovery_scope | default('')) or none,
                                                  'auth': _rf_attempts_meta | default({}),
                                                  'account_service':
                                                    _rf_account_service_meta | default({}),
                                                  'notices':
                                           ((_rf_raw_collect | default({})).notices | default([]))})}) }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "redfish | rescue | set failed vars"
          ansible.builtin.set_fact:
            _out_target_type:       "redfish"
            _out_collection_method: "redfish_api"
            _out_ip:                "{{ _rf_ip }}"
            _out_vendor: >-
              {{ ((_va | default({})).adapter_output_display | default({})).get((_selected_adapter | default({})).adapter_id | default(''))
                 or ((_va | default({})).vendor_output_display | default({})).get(_rf_vendor | default(''), _rf_vendor | default(none)) }}
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','hardware','bmc','cpu','memory',
                                                   'storage','network','firmware','power','thermal']) }}"
            _fail_error_section:    "redfish_gather"
            _fail_error_message:    "[task: {{ ansible_failed_task.name | default('unknown') }}] {{ ansible_failed_result.msg | default('Redfish 수집 예외') }}"

        - name: "redfish | rescue | 실패 근거를 detail 로 합류"
          ansible.builtin.set_fact:
            _fail_error_detail: >-
              {%- set parts = [] -%}
              {%- set pre = _fail_error_detail | default(none) -%}
              {%- if pre is string and (pre | trim | length) > 0 -%}
                {%- set _ = parts.append(pre | trim) -%}
              {%- endif -%}
              {%- set probe = _rf_probe_notes | default('') -%}
              {%- if probe is string and (probe | trim | length) > 0 -%}
                {%- set _ = parts.append(probe | trim) -%}
              {%- endif -%}
              {%- for note in (_rf_failed_attempt_notes | default([]))[:3] -%}
                {%- set _ = parts.append(note | string) -%}
              {%- endfor -%}
              {{ (parts | join(' | ')) if parts else none }}
          no_log: true

        - name: "redfish | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "redfish | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'redfish',
                       'collection_method': 'redfish_api',
                       'ip': _rf_ip | default(inventory_hostname),
                       'hostname': none,
                       'vendor': (((_va | default({})).adapter_output_display | default({})).get((_selected_adapter | default({})).adapter_id | default('')) or ((_va | default({})).vendor_output_display | default({})).get(_rf_detected_vendor | default(''), _rf_detected_vendor | default(none))),
                       'status': 'failed',
                       'sections': {'system': 'failed', 'hardware': 'failed', 'bmc': 'failed', 'cpu': 'failed', 'memory': 'failed', 'storage': 'failed', 'network': 'failed', 'firmware': 'failed', 'users': 'not_supported', 'power': 'failed', 'thermal': 'failed'},
