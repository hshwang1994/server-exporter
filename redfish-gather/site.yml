---
# =============================================================================
# redfish-gather / site.yml  — orchestration 전용
#
# 흐름:
#   init_fragments
#   → run_precheck       (4단계 진단: ping→port→protocol→auth)
#   → detect_vendor      (_rf_detected_vendor, _rf_probe_facts)
#   → select_adapter     (adapter_loader → _selected_adapter)
#   → load_vault         (adapter 기반 credential profile)
#   → collect_standard   (_rf_raw_collect, _rf_collect_ok, _rf_vendor)
#   → normalize_standard (표준 fragment → merge)
#   → vendor adapter     (OEM fragment → merge, adapter 기반 동적 로딩)
#   → build_sections / build_status / build_errors / build_output
#   → inject schema_version
#   → OUTPUT
# =============================================================================

- name: "redfish-gather"
  hosts: all
  gather_facts: no
  connection: local
  # 2026-04-30 perf: dead-host 다수 inventory에서 host별 독립 진행 (linear 시 stuck host가 wave 막음)
  strategy: free

  # 2026-08-11 (Phase 6-B): Portal 사용자 문구 정본. rescue / always 가 문장을 직접 쓰지 않고
  # 이 변수를 참조한다 — precheck_bundle.REASON_* 와 동일 문자열 (drift 는 테스트가 막는다).
  # 2026-08-12: 섹션 단위(부분 실패) 문장 정본도 함께 로드한다. 모듈이 만든 기술 문자열은
  #   normalize_standard.yml 이 여기 라벨로 사용자 문장을 만들고 원문은 detail 로 내린다.
  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/failure_reasons.yml"
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/section_messages.yml"

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _rf_ip:      "{{ ansible_host | default(inventory_hostname) }}"
    _rf_timeout: 30

  tasks:

    - name: "redfish | gather"
      block:

        - name: "redfish | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        # ── pre-check (Phase 1) ──────────────────────────────────────────
        - name: "redfish | run precheck"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/precheck/run_precheck.yml"
          vars:
            _precheck_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
            _precheck_channel: "redfish"
            _precheck_timeout: "{{ _rf_timeout }}"

        - name: "redfish | abort if precheck failed"
          ansible.builtin.fail:
            msg: >-
              Redfish 호스트 연결 진단에 실패했습니다 ({{ _rf_ip }}).
              단계={{ (_diagnosis | default({})).failure_stage | default('unknown') }},
              사유={{ (_diagnosis | default({})).failure_reason | default('연결 불가') }}.
              BMC 전원, 네트워크, Redfish API(443) 포트를 확인하세요.
          when: not (_precheck_ok | bool)

        # ── detect vendor ────────────────────────────────────────────────
        - name: "redfish | detect vendor"
          ansible.builtin.include_tasks: tasks/detect_vendor.yml

        # ── select adapter (Phase 2) ─────────────────────────────────────
        - name: "redfish | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {{ lookup('adapter_loader',
                         channel='redfish',
                         facts=_rf_probe_facts | default({}),
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "redfish | adapter selected"
          ansible.builtin.debug:
            msg: "adapter={{ _selected_adapter.adapter_id | default('none') }}"

        # cycle 2026-05-12 (ADR-2026-05-12): HPE CSUS 3200 / Superdome Flex RMC primary
        # 멀티-노드 토폴로지 수집 활성. adapter `vendor_notes.manager_layout` 을
        # redfish_gather 모듈까지 전달. None / 미정의 vendor 는 기존 동작 100% 보존
        # (Additive only — rule 92 R2). 13 vendor 영향 0.
        #   Allowed values: '' (None) / 'rmc_primary' / 'rmc_primary_ilo_secondary'
        - name: "redfish | extract manager_layout from adapter"
          ansible.builtin.set_fact:
            _rf_adapter_manager_layout: >-
              {{ ((_selected_adapter | default({})).vendor_notes | default({})).manager_layout | default('') }}

        # ── load vault (adapter 기반) ────────────────────────────────────
        - name: "redfish | load vault"
          ansible.builtin.include_tasks: tasks/load_vault.yml

        # ── collect standard ─────────────────────────────────────────────
        - name: "redfish | collect standard"
          ansible.builtin.include_tasks: tasks/collect_standard.yml

        # 2026-04-30: precheck/diagnosis가 이미 식별한 실패 단계에 따라 specific 메시지.
        # ServiceRoot(/redfish/v1/)는 Redfish 표준상 무인증 → protocol_supported=true이면
        # 네트워크/방화벽/서비스 모두 정상 증명됨.
        #
        # 2026-08-10 (B-8 정정): 종전 4번째 분기 조건이 `auth_success is none or not auth_success`
        #   였는데, 이 시점의 auth_success 는 **항상 None** 이다 — precheck 는 인증정보를 받지
        #   않아 Stage 4 를 수행하지 않고(precheck_bundle.py:546-548, 위 :41-47 이 username/
        #   password 미전달), auth_success=true 로 덮어쓰는 태스크(:191-206)는 이 태스크보다
        #   **뒤에** 있다. 따라서 4번째 분기가 항상 잡히고 5번째(else)는 **도달 불가능**했다.
        #   결과: 펌웨어/OEM/endpoint 문제로 실패한 수집까지 전부 "인증 실패"로 보고됨.
        #
        #   또한 `_rf_collect_ok` 는 인증 테스트가 아니라 **전체 수집 결과**다
        #   (try_one_account.yml:38-40 — `_rf_attempt.status != 'failed'`). 자격증명 불일치 /
        #   권한 부족 / 5xx / timeout / schema 실패가 모두 이 한 값에 뭉개진다. 즉 이 지점에서
        #   "인증 실패"를 **확정할 근거가 없다.** 확정할 수 없는 것을 단정하지 않도록 두 분기를
        #   하나로 합치고, 확인된 사실(네트워크/API 정상)과 가능한 원인을 분리해 안내한다.
        #   원인 확정(HTTP 401 실증 배선)은 별도 Phase 영역.
        - name: "redfish | abort if collect completely failed"
          ansible.builtin.fail:
            msg: >-
              {%- set d = _diagnosis | default({}) -%}
              {%- if not (d.reachable | default(false)) -%}
              Redfish 정보 수집에 실패했습니다. BMC({{ _rf_ip }})에 도달하지 못했습니다. 네트워크 경로와 BMC 전원 상태를 확인하세요.
              {%- elif not (d.port_open | default(false)) -%}
              Redfish 정보 수집에 실패했습니다. BMC({{ _rf_ip }})의 443 포트가 열려 있지 않습니다. 방화벽 규칙과 BMC HTTPS 서비스 상태를 확인하세요.
              {%- elif not (d.protocol_supported | default(false)) -%}
              Redfish 정보 수집에 실패했습니다. BMC({{ _rf_ip }}:443)에서 예상한 Redfish API 응답을 확인하지 못했습니다. Redfish 서비스 활성화 여부와 BMC 펌웨어 호환성을 확인하세요.
              {%- else -%}
              Redfish 정보 수집에 실패했습니다 ({{ _rf_ip }}).
              네트워크/포트/Redfish API 는 정상 확인됨 (Redfish {{ d.details.redfish_version | default('?') }} / {{ d.details.product | default('Unknown') }}).
              가능한 원인은 (1) 자격증명 불일치 (vault/redfish/{{ _rf_vendor | default('<vendor>') }}.yml, 시도된 계정 수 {{ (_rf_attempts_meta | default({})).attempted_count | default('?') }}개),
              (2) 계정 권한 부족, (3) 펌웨어 호환성 또는 OEM 경로 문제입니다.
              자세한 기술 오류는 errors 항목을 확인하세요.
              {%- endif -%}
          when: not (_rf_collect_ok | bool)

        # ── P2 (cycle 2026-04-28): recovery 자격 사용 시 공통계정 자동 복구 ──
        # 사용자 결정 #4: dryrun ON default, lab 검증 후 OFF 전환
        #
        # 2026-08-11 (Phase 6-B §6 §7): 진입 조건을 좁힌다. 기능은 그대로 두고 조건만 좁힌다.
        #   종전: "primary 로 수집이 안 됐고 recovery 로 됐다" 면 무조건 BMC 계정을 고쳤다.
        #   문제: primary 실패의 원인은 자격증명 불일치만이 아니다. timeout / TLS / 5xx /
        #        일시적 네트워크 단절도 같은 모양으로 보인다. 그런 상황에서 계정을 고치면
        #        멀쩡한 공통계정의 비밀번호를 덮어쓰게 된다.
        #   신: primary 후보가 **401 로 명시적으로 거부**됐을 때만 진입한다
        #      (_rf_primary_auth_rejected — collect_standard.yml 이 역할 기준으로 판정).
        #      403(권한 부족)은 제외한다 — 인증 자체는 통과했을 수 있다.
        #
        # 이 사실을 한 곳에서만 판정해 두고, 아래 include 의 when 과 account_service.yml 의
        # 쓰기 모드가 같은 값을 본다 (§16 — "기본값이라서" 쓰기가 켜지는 경로를 없앤다).
        - name: "redfish | account_service | 진입 조건 판정"
          ansible.builtin.set_fact:
            _rf_account_reconcile_allowed: >-
              {{ (((_rf_used_account | default({})).role | default('primary')) == 'recovery')
                 and (_rf_collect_ok | default(false) | bool)
                 and (_rf_primary_auth_rejected | default(false) | bool) }}

        - name: "redfish | account_service (recovery → primary)"
          when: _rf_account_reconcile_allowed | bool
          ansible.builtin.include_tasks: tasks/account_service.yml

        # ── normalize standard ───────────────────────────────────────────
        - name: "redfish | normalize standard"
          ansible.builtin.include_tasks: tasks/normalize_standard.yml

        # ── vendor adapter (OEM 확장, adapter 기반) ──────────────────────
        # adapter에 oem_tasks가 정의된 경우만 실행 (하드코딩 벤더 목록 제거)
        #
        # 2026-06-16 (Bug B, redfish graceful degradation 복원): OEM 수집/정규화는 보조 단계다.
        #   여기서 예외가 나도 이미 수집·정규화된 표준 섹션(_merged_data / _all_sec_collected)을
        #   보존하고, 비치명 경고만 errors[]에 남긴 뒤 build_sections/build_status 정상 경로로 진행한다.
        #   (기존: 단일 top-level rescue 로 cascade → 표준 섹션까지 전부 failed [CSUS 사고]. 본 local
        #    rescue 가 adapter capabilities.graceful_degradation.on_section_fail=continue 의도를 구현.)
        #   결과: OEM 실패 시 overall status 는 표준 섹션 기준 success/partial + errors[] 경고
        #   (build_status.yml 시나리오 B). OEM 한 단계 실패가 전체를 failed 로 덮던 cascade 폐지.
        - name: "redfish | vendor adapter | OEM (graceful — 실패해도 표준 섹션 보존)"
          block:
            - name: "redfish | vendor adapter | collect OEM"
              when: ((_selected_adapter | default({})).collect | default({})).oem_tasks | default('') != ''
              ansible.builtin.include_tasks:
                file: "{{ lookup('env','REPO_ROOT') }}/{{ _selected_adapter.collect.oem_tasks }}"

            - name: "redfish | vendor adapter | normalize OEM"
              when: ((_selected_adapter | default({})).normalize | default({})).oem_tasks | default('') != ''
              ansible.builtin.include_tasks:
                file: "{{ lookup('env','REPO_ROOT') }}/{{ _selected_adapter.normalize.oem_tasks }}"
          rescue:
            - name: "redfish | vendor adapter | OEM 비치명 실패 → 경고만 (표준 섹션 유지)"
              ansible.builtin.set_fact:
                _data_fragment: {}
                _sections_supported_fragment: []
                _sections_collected_fragment: []
                _sections_failed_fragment: []
                _sections_unsupported_fragment: []
                # 2026-08-11 (Phase 6-B / §24): Portal 은 errors[].message 를 그대로 보여준다.
                # 태스크명 / raw 예외는 detail 로 내리고 message 는 사용자 문장만 남긴다.
                _errors_fragment:
                  - section: "oem"
                    # 2026-08-12: 다른 부분의 성공을 단언하는 절 제거 (failed envelope 에 합류 시 모순).
                    message: "일부 제조사 확장 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
                    detail: "[task: {{ ansible_failed_task.name | default('vendor OEM') }}] {{ ansible_failed_result.msg | default('OEM 수집/정규화 예외') }}"
            - name: "redfish | vendor adapter | OEM 경고 누적 (merge_fragment)"
              ansible.builtin.include_tasks:
                file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
        # ─────────────────────────────────────────────────────────────────

        - name: "redfish | build_sections"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_sections.yml"

        - name: "redfish | build_status"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_status.yml"

        - name: "redfish | build_errors"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_errors.yml"

        - name: "redfish | set output meta"
          ansible.builtin.set_fact:
            _out_target_type:       "redfish"
            _out_collection_method: "redfish_api"
            _out_ip:                "{{ _rf_ip }}"
            # cycle 2026-06-04 (사용자 결정): 출력 envelope vendor 표시값 매핑 (내부 canonical 유지).
            # adapter_output_display(예: redfish_hpe_csus_3200 → hpCsus) 우선, 없으면
            # vendor_output_display(hpe → hp), 둘 다 없으면 canonical 그대로.
            # _va = common/vars/vendor_aliases.yml (detect_vendor.yml 에서 로드). data-driven — rule 12 R1.
            _out_vendor: >-
              {{ ((_va | default({})).adapter_output_display | default({})).get((_selected_adapter | default({})).adapter_id | default(''))
                 or ((_va | default({})).vendor_output_display | default({})).get(_rf_vendor | default(''), _rf_vendor | default(none)) }}
            # P1: meta.auth — 사용자 결정 #3 (fallback_used 노출)
            # P2: meta.account_service — recovery 자격으로 공통계정 자동 복구 시 노출
            #
            # 2026-08-12 (H11) details.notices: 성공한 fallback / 절단 같은 **정보성 통보**.
            #   errors[] 에 넣으면 섹션이 failed 로 잡혀 status 가 partial 로 강등된다.
            #   실패가 아닌 사실은 diagnosis.details(기술 evidence / 확장 metadata 영역)에 남긴다.
            #
            # 주의: 아래 `>-` 는 YAML folded block scalar 다. 그 안에서 `#` 는 주석이 아니라
            #   **Jinja 표현식 본문**이 되어 템플릿 컴파일이 통째로 깨진다. 설명은 반드시
            #   이 자리(표현식 밖)에 쓴다.
            _diagnosis: >-
              {{ _diagnosis | combine({
                   'auth_success': true,
                   'details': ((_diagnosis | default({}, true)).details | default({})
                                if (((_diagnosis | default({}, true)).details | default({}))
                                    is mapping) else {}) | combine({
                     'adapter_candidate': _selected_adapter.adapter_id | default(none),
                     'auth': _rf_attempts_meta | default({}),
                     'account_service': _rf_account_service_meta | default({}),
                     'multi_node_layout': (_rf_adapter_manager_layout | default('')) or none,
                     'notices': ((_rf_raw_collect | default({})).notices | default([])),
                     'rmc_activation_check':
                       (true if ((_rf_adapter_manager_layout | default('')) in ['rmc_primary', 'rmc_primary_ilo_secondary']
                                 and (_rf_collect_ok | default(false) | bool))
                        else (false if ((_rf_adapter_manager_layout | default('')) in ['rmc_primary', 'rmc_primary_ilo_secondary']
                                        and not (_rf_collect_ok | default(false) | bool))
                              else none))
                   })
                 }) }}

        # ── meta & correlation (Phase 3) ─────────────────────────────────
        - name: "redfish | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "redfish | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"
        # ─────────────────────────────────────────────────────────────────

        - name: "redfish | build_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_output.yml"

        - name: "redfish | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      rescue:
        # ── Portal Grid 계약 (2026-08-10 사용자 확인) ────────────────────
        # Portal 은 실패 Grid 의 "실패 사유" 칸에 **diagnosis.failure_reason 만** 표시한다.
        # precheck 실패는 precheck_bundle 이 이미 사유를 채워 주지만, precheck 통과 후
        # 실패(수집/정규화 예외)는 종전까지 failure_reason=null 이라 **Portal 이 빈 칸**을
        # 보여줬다. 아래 태스크가 그 구멍을 막는다.
        #   - failure_reason 이 이미 있으면 건드리지 않는다 (precheck 의 구체적 사유 보존).
        #   - 7 키 base 로 시작해 _diagnosis 미정의/비-dict 상황에서도 shape 를 보장한다.
        #   - auth_success 는 손대지 않는다: 인증 거부를 관측한 근거가 없다(null 유지).
        #
        # 2026-08-10 (Phase 2) 단계/코드:
        #   여기 도달했다는 것은 precheck 를 통과했다는 뜻이다(통과 못 했으면 failure_reason 이
        #   이미 채워져 있어 when 가드가 막는다). redfish_gather 모듈은 인증과 수집을 한 작업
        #   결과로 합쳐 반환하므로(try_one_account.yml 이 보는 값은 '전체 수집 결과'),
        #   기본값은 수집 단계(gather / GATHER_FAILED)이고 auth_success 는 null 을 유지한다.
        #
        # 2026-08-11 (Phase 5-A) 인증 거부 실증 — **후보 전체 집계**:
        #   redfish_gather 가 module result 에 `auth_evidence.first_auth_status` 를 싣는다.
        #   이는 **자격증명을 실은 첫 요청**이 받은 정수 HTTP status 로, 새 요청 없이
        #   기존 응답을 관측만 한 값이다(인증 시도 횟수 불변 = 계정 잠금 위험 불변).
        #   후보마다 모듈이 별도 프로세스로 실행되므로 값도 후보별로 독립이며,
        #   try_one_account.yml 이 후보 순서대로 _rf_auth_statuses 에 누적한다.
        #
        #   전체를 "인증 거부" 로 확정하는 조건 (셋 다 만족해야 한다):
        #     (1) 실제로 시도한 후보가 1개 이상이고
        #     (2) 후보 수만큼 관측이 쌓였고 (누락된 후보가 없고)
        #     (3) 모든 후보의 첫 인증 응답이 **401** 이다
        #   → 하나라도 timeout / TLS / 403 / 200(인증은 통과) 이 섞이면 원인 미확정이라
        #     auth_success 는 null 을 유지한다. 후보 하나의 401 로 전체를 단정하지 않는다.
        #   빈 자격 경로(_rf_accounts 없음)는 (1) 에서 걸러진다 — 무자격 요청의 401 은
        #   "등록된 자격증명 거부" 가 아니다.
        - name: "redfish | rescue | 인증 거부 실증 판정"
          ansible.builtin.set_fact:
            _rf_auth_rejected: >-
              {%- set statuses = _rf_auth_statuses | default([]) -%}
              {%- set attempted = (_rf_accounts | default([])) | length -%}
              {{ attempted > 0
                 and (statuses | length) == attempted
                 and (statuses | select('equalto', 401) | list | length) == attempted }}

        # 2026-08-12 (C1 / C4): 자격 단계 관측을 **하나의 값**으로 확정한다.
        #
        #   종전 문제: 같은 set_fact 안에서 stage/code/auth_success 는 `rejected and not collected`
        #   로, failure_reason 만 `collected` 로 갈렸다. 입력이 둘이라 필연적으로 어긋났다 —
        #   rejected=false, collected=false 이면 stage=gather / code=GATHER_FAILED 인데
        #   사용자 문장은 "자격증명과 계정 권한을 확인하세요"(4번) 였다. Portal 은 문장을,
        #   대시보드는 stage/code 를 읽으므로 같은 결과를 두 소비자가 다르게 해석했다.
        #
        #   또 하나: `_rf_collect_ok` 는 인증 판정이 아니라 **전체 수집 결과**다
        #   (try_one_account.yml 의 `_rf_attempt.status != 'failed'`). 인증이 200 으로
        #   통과했어도 시리얼 확정 실패 하나로 false 가 되어 자격증명 문장이 나갔다.
        #   os/esxi 는 자격 probe 전용 결과(_os_auth_ok / _e_auth_ok)를 쓰는데 redfish 만 달랐다.
        #
        #   신: 자격 관측을 3-값으로 확정하고 4필드를 **그 하나에서만** 파생한다.
        #     passed   — 자격을 실은 요청이 통과한 직접 관측이 있다
        #                (수집 성공했거나, first_auth_status 가 2xx/3xx 인 후보가 있다)
        #     rejected — 시도한 후보 전원이 401 로 명시 거부됐다
        #     unknown  — 그 외 (timeout / TLS / 403 / 5xx / 미시도). 원인 미확정.
        #   `_rf_auth_observations` 는 try_one_account.yml 이 후보마다 쌓아 둔 값이라
        #   새 요청을 만들지 않는다 (계정 잠금 위험 불변).
        - name: "redfish | rescue | 자격 단계 관측 확정"
          ansible.builtin.set_fact:
            _rf_auth_outcome: >-
              {#- status 는 정수 또는 none(원인 미확정) 이다. none 과 비교하면 TypeError 이므로
                  정수만 남긴 뒤 범위를 본다. -#}
              {%- set st = (_rf_auth_observations | default([]))
                           | selectattr('status', 'defined') | map(attribute='status')
                           | select('integer') | list -%}
              {%- set ok_obs = st | select('ge', 200) | select('lt', 400) | list | length -%}
              {%- set tried = ((_rf_auth_observations | default([])) | length)
                              + ((_rf_failed_attempt_notes | default([])) | length) -%}
              {%- if (_rf_collect_ok | default(false) | bool) or ok_obs > 0 -%}
              passed
              {%- elif _rf_auth_rejected | default(false) | bool -%}
              rejected
              {%- elif tried > 0 -%}
              unknown
              {%- else -%}
              not_attempted
              {%- endif -%}

        # 사용자 문구는 5 문장 표준(common/vars/failure_reasons.yml)만 쓴다.
        #   passed        → gather / GATHER_FAILED / auth_success=true / 5번
        #                   ("대상 접속은 확인됐지만") — 인증된 요청 통과를 직접 관측했다.
        #   rejected      → auth / AUTH_PROBE_FAILED / false / 4번. 401 실증을 함께 남긴다.
        #   unknown       → auth / AUTH_PROBE_FAILED / null / 4번. 자격 요청은 보냈지만
        #                   원인을 확정하지 못했다 (timeout / TLS / 403 / 5xx).
        #   not_attempted → gather / GATHER_FAILED / null / 5번. 자격 요청 자체를 보내기
        #                   **전에** 멈췄다 (adapter 선택 / vault 로드 / vendor 정규화 예외 등).
        #                   CLAUDE.md §9 — failure_stage 는 '워크플로가 멈춘 위치' 다.
        #                   인증을 시도조차 안 한 실패를 auth 로 라벨링하면 관측하지 않은 것을
        #                   단정하는 것이고, 사용자에게도 자격증명을 헛되이 뒤지게 만든다.
        #                   precheck 는 통과했으므로(여기 도달 조건) "대상 접속은 확인됐지만"은 참이다.
        # → 4번 문장은 stage=auth 와만, 5번 문장은 stage=gather 와만 짝지어진다.
        - name: "redfish | rescue | Portal 표시용 failure_reason 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set outcome = _rf_auth_outcome | default('not_attempted') -%}
              {%- set at_gather = outcome in ['passed', 'not_attempted'] -%}
              {{ {'reachable': none, 'port_open': none, 'protocol_supported': none,
                  'auth_success': none, 'failure_stage': none, 'failure_code': none,
                  'failure_reason': none, 'details': {}}
                 | combine((_diagnosis | default({}, true))
                           if ((_diagnosis | default({}, true)) is mapping) else {})
                 | combine({'failure_stage': ('gather' if at_gather else 'auth'),
                            'failure_code': ('GATHER_FAILED' if at_gather
                                             else 'AUTH_PROBE_FAILED'),
                            'auth_success': (true if outcome == 'passed'
                                             else (false if outcome == 'rejected' else none)),
                            'failure_reason': (_fr_gather_failed if at_gather
                                               else _fr_credential_failed),
                            'details': (((_diagnosis | default({}, true)).details | default({}))
                                        if (((_diagnosis | default({}, true)).details | default({}))
                                            is mapping)
                                        else {})
                                       | combine({'notices':
                                           ((_rf_raw_collect | default({})).notices | default([]))})}) }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "redfish | rescue | set failed vars"
          ansible.builtin.set_fact:
            _out_target_type:       "redfish"
            _out_collection_method: "redfish_api"
            _out_ip:                "{{ _rf_ip }}"
            # cycle 2026-06-04 (사용자 결정): 출력 envelope vendor 표시값 매핑 (내부 canonical 유지).
            # adapter_output_display(예: redfish_hpe_csus_3200 → hpCsus) 우선, 없으면
            # vendor_output_display(hpe → hp), 둘 다 없으면 canonical 그대로.
            # _va = common/vars/vendor_aliases.yml (detect_vendor.yml 에서 로드). data-driven — rule 12 R1.
            _out_vendor: >-
              {{ ((_va | default({})).adapter_output_display | default({})).get((_selected_adapter | default({})).adapter_id | default(''))
                 or ((_va | default({})).vendor_output_display | default({})).get(_rf_vendor | default(''), _rf_vendor | default(none)) }}
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','hardware','bmc','cpu','memory',
                                                   'storage','network','firmware']) }}"
            _fail_error_section:    "redfish_gather"
            # 2026-05-11 debugging visibility: ansible_failed_task.name 포함 — json_only callback 으로
            # 차단된 fatal task 위치 추적용. 2026-08-11 (Phase 6-B) 부터 이 값은 errors[].message 가
            # 아니라 **errors[].detail** 로 들어간다 (build_failed_output.yml). Portal 사용자 문구는
            # diagnosis.failure_reason 을 그대로 쓴다.
            _fail_error_message:    "[task: {{ ansible_failed_task.name | default('unknown') }}] {{ ansible_failed_result.msg | default('Redfish 수집 예외') }}"

        # 2026-08-12 (N41 / N50): BMC 가 실제로 준 근거를 detail 로 살린다.
        #   종전에는 후보별 실패 status / 첫 오류와 무인증 probe 오류가 전부 버려져,
        #   완전 실패 envelope 에 "왜 실패했는지" 가 한 줄도 남지 않았다.
        #   errors[].message 는 건드리지 않는다 (5문장 정본). 기술 근거는 detail 에만.
        #   상한 3건 — Portal detail 비대화 방지 (모듈도 MAX_EXTENDED_INFO_* 로 절단 중).
        - name: "redfish | rescue | 실패 근거를 detail 로 합류"
          ansible.builtin.set_fact:
            _fail_error_detail: >-
              {%- set parts = [] -%}
              {%- set pre = _fail_error_detail | default(none) -%}
              {%- if pre is string and (pre | trim | length) > 0 -%}
                {%- set _ = parts.append(pre | trim) -%}
              {%- endif -%}
              {%- set probe = _rf_probe_notes | default('') -%}
              {%- if probe is string and (probe | trim | length) > 0 -%}
                {%- set _ = parts.append(probe | trim) -%}
              {%- endif -%}
              {%- for note in (_rf_failed_attempt_notes | default([]))[:3] -%}
                {%- set _ = parts.append(note | string) -%}
              {%- endfor -%}
              {{ (parts | join(' | ')) if parts else none }}
          no_log: true

        - name: "redfish | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "redfish | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        # rule 13 R5 / rule 20 R1: 호출자는 13 필드 envelope을 보장받음. _output 미생성 시도 13 필드 모두 채운다.
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'redfish',
                       'collection_method': 'redfish_api',
                       'ip': _rf_ip | default(inventory_hostname),
                       'hostname': _rf_ip | default(inventory_hostname),
                       'vendor': (((_va | default({})).adapter_output_display | default({})).get((_selected_adapter | default({})).adapter_id | default('')) or ((_va | default({})).vendor_output_display | default({})).get(_rf_detected_vendor | default(''), _rf_detected_vendor | default(none))),
                       'status': 'failed',
                       'sections': {},
                       'diagnosis': {'reachable': none, 'port_open': none, 'protocol_supported': none, 'auth_success': none, 'failure_stage': 'fallback', 'failure_code': 'OUTPUT_BUILD_FAILED', 'failure_reason': _fr_output_build_failed, 'details': {'gather_mode': 'fallback', 'reason': '_output 미생성 (block/rescue 모두 실패)'}},
                       'meta': {},
                       'correlation': {},
                       'errors': [{'section':'gather','message': _fr_output_build_failed,'detail':'_output 미생성 (block/rescue 모두 실패)'}],
                       'data': {}
                     })) | to_json }}"
