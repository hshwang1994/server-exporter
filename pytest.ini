[pytest]
# 2026-10-03 (Plan §9-3 G14): production 생성 tree 위에 tests/ 를 얹어 돌릴 때 `-m "not source_text"` 로 제외하는 표식.
#   source_text = 저장소 메타(git index · .claude · docs · scripts/ai · Jenkinsfile_ci) 나 소스 **주석** 을 읽는 테스트.
#   런타임 동작을 검증하는 테스트에는 붙이지 않는다 — 붙이면 G14 의 회귀 범위가 줄어든다.
markers =
    source_text: 저장소 메타·문서·소스 주석을 읽는 테스트 (production tree overlay G14 에서 제외)
    integration: 통합 테스트 (tests/integration)
    live: 실장비·실 Jenkins 가 필요한 테스트 (ci_gate 는 -m "not live")
