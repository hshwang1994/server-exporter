---
# ==============================================================================
# os.yml — OS 채널 전용 필드 정의
# ==============================================================================
# OS 채널 (Linux 는 SSH, Windows 는 WinRM) 에서만 수집 가능한 필드입니다.
# 3 채널 공통 필드는 common.yml, ESXi/Redfish 채널 전용 필드는 각각의 파일 참조.
# ==============================================================================

channel: os

sections:
  system:
    extra_fields:
      hosting_type:
        type: string
        display_name: "호스팅 유형"
        description: "virtual / baremetal / unknown (ESXi 채널은 항상 hypervisor)"
        note: "Linux: systemd-detect-virt(+DMI/virtualization fact). Windows: VM 신호 + HypervisorPresent + Hyper-V 역할. OEM 제조사 목록에 의존하지 않는다 (2026-09-03)"
        enum: [virtual, baremetal, unknown]
      vendor:
        type: string
        display_name: "시스템 제조사(원문)"
        description: "DMI sys_vendor / Win32_ComputerSystem.Manufacturer 원문. envelope.vendor 는 이 값을 vendor_aliases 로 정규화한 표시값"
        note: "hardware.vendor 와 같은 원문"

      serial_number:
        type: string
        display_name: "시리얼 번호"
        description: "DMI/WMI product_serial. NA/빈값은 null로 정규화"
        note: "채널/벤더에 따라 의미가 다를 수 있음. Linux에서 정확한 값 수집을 위해 become 권장"
      system_uuid:
        type: string
        display_name: "시스템 UUID"
        description: "DMI/WMI product_uuid. NA/빈값은 null로 정규화"
        note: "cross-channel 연결의 우선 키. Linux에서 정확한 값 수집을 위해 become 권장"
      selinux:
        type: string
        display_name: "SELinux 상태"
        description: "SELinux 모드 (enforcing/permissive/disabled/null)"
        note: "Linux 전용 (ansible_selinux.mode / getenforce). Windows는 항상 null"

  hardware:
    fields:
      vendor:
        type: string
        display_name: "벤더"
        description: "Linux: DMI sys_vendor (setup fact → /sys/class/dmi/id). Windows: Win32_ComputerSystem.Manufacturer"
      model:
        type: string
        display_name: "모델"
        description: "Linux: DMI product_name. Windows: Win32_ComputerSystem.Model"
      serial:
        type: string
        display_name: "시리얼"
        description: "system.serial_number 와 같은 값 (nPartition 접미사 정규화 포함)"
      uuid:
        type: string
        display_name: "UUID"
        description: "소문자 8-4-4-4-12 정규화 (normalize_uuid)"
      bios_version:
        type: string
        display_name: "BIOS 버전"
      bios_date:
        type: string
        display_name: "BIOS 날짜"
        description: "YYYY-MM-DD (DMI MM/DD/YYYY → 변환)"
      sku:
        type: string
        display_name: "SKU"
        note: "Windows 전용 (SystemSKUNumber). Linux 는 미수집(null)"

  storage:
    sub_sections:
      filesystems:
        display_name: "파일시스템 목록"
        item_fields:
          device:
            type: string
            display_name: "장치명"
          mount_point:
            type: string
            display_name: "마운트 포인트"
          filesystem:
            type: string
            display_name: "파일시스템 유형"
          total_mb:
            type: integer
            display_name: "전체 용량(MB)"
          used_mb:
            type: integer
            display_name: "사용 용량(MB)"
          available_mb:
            type: integer
            display_name: "여유 용량(MB)"
          usage_percent:
            type: float
            display_name: "사용률(%)"
          status:
            type: string
            display_name: "마운트 상태"
            description: "mounted / unmounted"

      physical_disks:
        display_name: "물리 디스크 목록"
        item_fields:
          device:
            type: string
          model:
            type: string
          total_mb:
            type: integer
          media_type:
            type: string
            description: "HDD / SSD / SCM. 판정 근거(lsblk rota / MSFT_PhysicalDisk.MediaType) 가 없으면 null"
          protocol:
            type: string
          health:
            type: string
            description: "OK / Warning / Critical / null (Windows HealthStatus 매핑, Linux 는 null) — Redfish 와 같은 어휘 (2026-09-03)"
          is_os_disk:
            type: boolean
            description: "OS 루트(/, Windows %SystemDrive%) 설치 디스크 여부. true/false/null (OS 채널 전용)"

  network:
    sub_sections:
      interfaces:
        display_name: "네트워크 인터페이스"
        item_fields:
          id:
            type: string
            description: "장치명 (Linux devname / Windows 어댑터 이름) — name 과 같은 축 (2026-09-03)"
          name:
            type: string
          description:
            type: string
            description: "Windows InterfaceDescription (Linux 는 미제공)"
          kind:
            type: string
            description: "os_nic (OS 채널에서 수집된 인터페이스)"
          mac:
            type: string
            description: "소문자 colon 6 octet 정규화 (normalize_mac)"
          mtu:
            type: integer
          speed_mbps:
            type: integer
          link_status:
            type: string
          is_primary:
            type: boolean
          addresses:
            type: list
            item_fields:
              family:
                type: string
              address:
                type: string
              prefix_length:
                type: integer
              subnet_mask:
                type: string
              gateway:
                type: string
              scope:
                type: string
                description: "IPv6 주소 범위 global / link / host / site (IPv4 는 키 없음)"
              scope:
                type: string
                description: "IPv6 주소 범위 global / link / host / site (IPv4 는 키 없음)"
              scope:
                type: string
                description: "IPv6 주소 범위 global / link / host / site (IPv4 는 키 없음)"

  users:
    display_name: "시스템 사용자 목록"
    item_fields:
      name:
        type: string
        display_name: "사용자명"
      uid:
        type: string
        display_name: "UID/SID"
      groups:
        type: list
        display_name: "소속 그룹"
      home:
        type: string
        display_name: "홈 디렉토리"
      last_access_time:
        type: string
        display_name: "마지막 접속 시각"
