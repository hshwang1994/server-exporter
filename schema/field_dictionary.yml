---
# ==============================================================================
# field_dictionary.yml — 출력 JSON 필드 설명 사전
# ==============================================================================
#
# 이 파일은 server-exporter 가 만들어내는 표준 JSON 의 모든 필드에 대한
# "해석 가이드" 입니다. 호출자 / 운영자 / 개발자가 같은 필드를 보고 같은 의미로
# 이해하도록 한국어 + 영어 설명을 한 곳에 모았습니다.
#
# 왜 출력 JSON 자체에 설명을 넣지 않고 별도 파일에 두는가?
#   - 출력 JSON 의 크기가 변하지 않게 하기 위해 (호출자 시스템 부담 감소)
#   - 외부 시스템이 이 파일을 1회 로드해서 필드 lookup 으로 활용 가능
#   - 코드 변경 없이 설명만 갱신 가능
#
# 누가 이 파일을 사용하나?
#   - 외부 시스템(포털 등): 필드명 기반 lookup → 사용자에게 한국어 설명 노출
#   - 운영자: "이 필드 null 은 뭔지" 검색
#   - 개발자: 새 필드 추가 시 본 파일에 1 항목 추가
#
# Path(키 경로) 표기 규칙
#   "hardware.health"          → data.hardware.health (중첩 객체 경로)
#   "physical_disks[]"         → 배열 자체에 대한 설명
#   "physical_disks[].serial"  → 배열 각 항목의 serial 필드
#   "sections.*"               → sections 객체의 모든 값 (와일드카드)
#   "status"                   → 최상위 status 필드 (data 하위 아님)
#   "correlation.host_ip"      → correlation.host_ip (최상위)
#
# 우선순위(priority) 의미
#   must — 호출자가 반드시 의미를 알아야 하는 필드 (혼동 가능성 높음)
#   nice — 설명이 있으면 좋고 없어도 사용에 지장 없음
#   skip — 의미가 자명해서 본 사전에 등록하지 않음 (예: hostname)
#
# 등록 현황 (2026-09-03 실측): Must 52 / Nice 134 / Skip 6 = 총 192 entries
#   (2026-09-03 +16 — OS/ESXi 전수 검수 후속: system.hostname/fqdn/vendor, cpu.manufacturer/max_speed_mhz/turbo_max_mhz,
#    cpu.summary.groups[].l2/l3_cache_kb, network.interfaces[].description/mac, network.dns_servers/default_gateways,
#    system.runtime.firewall_state/ntp_active/ntp_synchronized/ntp_servers. Additive, schema_version 유지.)
# (이전 표기) 2026-08-12: Must 49 / Nice 118 / Skip 6 = 총 173 entries
#   (cycle 2026-08-12 +5 — errors[] / errors[].section / errors[].message / errors[].detail 신설.
#    Portal 실패 Grid 가 실제로 읽는 값인데 종전까지 이 사전에 정의가 **0건**이라
#    형식을 강제할 근거가 없었다. Additive, schema_version 유지.)
# (이전 표기) 2026-07-02: Must 47 / Nice 115 / Skip 6 = 총 168 entries
#   (cycle 2026-05-29 +9 Nice — storage.hbas[]/infiniband[] 서브필드. Additive, schema_version 유지 D3)
#   (cycle 2026-07-02 +1 Nice — storage.physical_disks[].is_os_disk (OS 채널). Additive, schema_version 유지)
#   NOTE(2026-07-02): 직전까지 헤더가 "Nice 81 / 134" 로 stale. pre-add 실측 nice=114 (stale 81 대비 drift 33);
#     이번 cycle +1 is_os_disk → nice=115 (drift 34). must 47 / skip 6 은 일치, nice 만 additive 누적 미반영이었음.
#     본 갱신에서 실측(168)으로 정정 (DRIFT-018).
#
# 검증 (수동): tests/validate_field_dictionary.py 가 다음 5가지를 검사합니다.
#   1) 모든 entry 에 help_ko, help_en 이 함께 있는지
#   2) path 가 실제 output JSON / schema/examples 와 대응되는지
#   3) 중복 키가 없는지
#   4) priority 값이 must / nice / skip 중 하나인지
#   5) channel 배열이 [redfish, os, esxi] 안에 있는지
# ==============================================================================

fields:

  # ──────────────────────────────────────────────────────────────────────────
  # envelope 최상위 — 호출자 라우팅 / 식별 / 추적 필드
  # ──────────────────────────────────────────────────────────────────────────

  schema_version:
    type: "string"
    enum: ["1"]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      출력 envelope schema 버전. "1" 고정 (2026-04-29 기준).
      호출자는 이 버전을 보고 envelope 필드 집합을 결정.
    help_en: >-
      Output envelope schema version. Fixed "1" as of 2026-04-29.
      Callers branch on this value to determine envelope field set.

  target_type:
    type: "string"
    enum: ["os", "esxi", "redfish"]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      수집 채널. 호출자가 어느 채널 결과인지 라우팅.
    help_en: >-
      Collection channel. Callers route by this value.

  collection_method:
    type: "string"
    enum: ["agent", "vsphere_api", "redfish_api"]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      수집 방식. agent=Ansible SSH/WinRM, vsphere_api=community.vmware,
      redfish_api=stdlib HTTP+Basic Auth.
    help_en: >-
      Collection method. agent=Ansible SSH/WinRM, vsphere_api=community.vmware,
      redfish_api=stdlib HTTP+Basic Auth.

  ip:
    type: "string"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      대상 장비 IP. OS=서비스 IP, ESXi=management IP, Redfish=BMC IP.
      호출자가 inventory_json에 전달한 값과 동일.
    help_en: >-
      Target device IP. OS=service IP, ESXi=management IP, Redfish=BMC IP.

  hostname:
    type: "string|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      해석된 hostname (2026-06-16 정책). 우선순위: System.HostName → system.fqdn →
      BMC NetworkProtocol.HostName/FQDN → null. IP fallback 안 함. 출처는
      diagnosis.details.hostname_source(system|bmc|none). source=bmc 면 OS 호스트명이 아니라
      BMC(iLO/XCC/RMC) 관리명. Cisco CIMC 등 NetworkProtocol.HostName=null 이면 system 또는 null.
    help_en: >-
      Resolved hostname (2026-06-16 policy). Priority: System.HostName -> system.fqdn ->
      BMC NetworkProtocol.HostName/FQDN -> null. No IP fallback. Origin in
      diagnosis.details.hostname_source (system|bmc|none); source=bmc means the BMC management
      name, not the OS hostname. Use the separate ip field for the address.

  vendor:
    type: "string|null"
    enum: ["dell", "hp", "hpCsus", "lenovo", "supermicro", "cisco", null]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      호출자 노출용 벤더 표시값. 내부 canonical(예: 'hpe')을 vendor_aliases.yml 의
      vendor_output_display / adapter_output_display 로 매핑한 결과.
      HPE 계열 → 'hp', HPE Compute Scale-up Servers (Superdome Flex + CSUS 3200) → 'hpCsus'
      (camelCase 예외 — 2026-06-04 사용자 결정 + HPE 공식 분류 web 검증). OS 채널은 hardware 미수집 시 null.
      ESXi 는 hosting hardware 벤더.
    help_en: >-
      Caller-facing vendor display value: internal canonical (e.g. 'hpe') mapped
      via vendor_aliases.yml vendor_output_display / adapter_output_display.
      HPE family -> 'hp', HPE Compute Scale-up Servers (Superdome Flex + CSUS 3200)
      -> 'hpCsus' (camelCase exception, 2026-06-04). OS channel may be null.
      ESXi reports hosting hardware vendor.

  meta:
    type: "object"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      수집 메타데이터 (started_at/finished_at/duration_ms/adapter_id/adapter_version/ansible_version 등).
      운영 추적 + 성능 분석용.
    help_en: >-
      Collection metadata (started_at/finished_at/duration_ms/adapter_id/adapter_version/ansible_version, etc).
      Used for operations tracing and performance analysis.

  correlation:
    type: "object"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      상관관계 식별자 (serial_number/system_uuid/bmc_ip/host_ip).
      여러 채널에서 같은 장비를 식별할 때 사용.
    help_en: >-
      Correlation identifiers (serial_number/system_uuid/bmc_ip/host_ip).
      Used to correlate same device across channels.

  # ──────────────────────────────────────────────────────────────────────────
  # sections (top-level) — 수집 결과 상태
  # ──────────────────────────────────────────────────────────────────────────

  status:
    type: "string"
    enum: ["success", "partial", "failed"]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      전체 수집 결과 상태.
      success=지원하는 모든 섹션 수집 성공,
      partial=일부 섹션만 성공,
      failed=전체 실패.
      주의: success는 '수집 성공'이지 '장비 정상'이 아님.
      hardware.health가 Critical이어도 status는 success일 수 있음.
    help_en: >-
      Overall collection result.
      success=all supported sections collected,
      partial=some sections failed,
      failed=complete failure.
      Note: success means 'collection succeeded', not 'equipment is healthy'.
      hardware.health can be Critical even when status is success.

  "sections.*":
    type: "string"
    enum: ["success", "failed", "not_supported"]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      개별 섹션 수집 상태.
      success=해당 섹션 수집 성공,
      failed=수집 시도했으나 실패,
      not_supported=이 채널에서 해당 섹션을 지원하지 않음.
      예: Redfish에서 system=not_supported (OS 정보 없음),
      OS에서 bmc=not_supported (BMC 접근 불가).
    help_en: >-
      Per-section collection status.
      success=section collected,
      failed=collection attempted but failed,
      not_supported=section not available in this channel.
      Example: Redfish system=not_supported (no OS info),
      OS bmc=not_supported (no BMC access).

  # ──────────────────────────────────────────────────────────────────────────
  # errors[] — 2026-08-12 신설
  #
  # 종전에는 이 사전에 errors 항목이 **0건**이었다. Portal 실패 Grid 가 실제로 읽는
  # 값이 errors[].message 인데도 그 형식을 규정한 정본이 없어서, 채널마다 다른 타입과
  # 어휘가 섞였다 (message 가 null / 빈 문자열 / 파이썬 dict repr 이 되는 경로,
  # detail 이 string / dict / null / '' 로 혼재). 여기서 계약을 확정한다.
  # ──────────────────────────────────────────────────────────────────────────

  "errors[]":
    type: "array"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      수집 중 발생한 오류 목록. 비어 있을 수 있다.
      status 판정에는 관여하지 않는다 — 섹션 status 만으로 판정하므로
      status=success 인데 errors 가 비어 있지 않은 경우가 정상적으로 존재한다
      (예: 권한 부족으로 일부 항목만 못 읽은 경우).
      status=failed 인 결과에서는 첫 원소가 대표 사유이며 그 message 는
      diagnosis.failure_reason 과 같다.
    help_en: >-
      Errors encountered during collection. May be empty.
      Does not affect status: overall status is derived from section statuses only,
      so status=success with a non-empty errors array is a valid, intended state.
      For status=failed results the first element is the representative cause and its
      message equals diagnosis.failure_reason.

  "errors[].section":
    type: "string"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      오류가 발생한 영역. 세 종류 중 하나다.
      (1) 수집 섹션 이름 — system / hardware / bmc / cpu / memory / storage / network /
          firmware / users / power / thermal
      (2) 수집 단계 이름 — precheck / auth / gather / oem / vendor_detect /
          account_service / multi_node
      (3) 완전 실패(status=failed) 대표 오류의 채널 표시 —
          os_detect / linux_gather / windows_gather / esxi_gather / redfish_gather
          (어느 채널에서 멈췄는지. 같은 정보가 target_type 과 diagnosis.details.channel 에도 있다)
      값이 없으면 unknown.
    help_en: >-
      Area where the error occurred. One of three kinds.
      (1) Collection section name: system / hardware / bmc / cpu / memory / storage /
          network / firmware / users / power / thermal
      (2) Workflow stage name: precheck / auth / gather / oem / vendor_detect /
          account_service / multi_node
      (3) Channel marker on the representative error of a complete failure:
          os_detect / linux_gather / windows_gather / esxi_gather / redfish_gather
          (the same information is also in target_type and diagnosis.details.channel)
      Defaults to unknown.

  "errors[].message":
    type: "string"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      사용자에게 그대로 보여주는 한국어 문장. **항상 비어 있지 않은 문자열**이다
      (null / 빈 문자열 / 내부 자료구조 표현이 들어가지 않는다).
      관리 포트 번호, HTTP 상태 코드, 응답 경로, 원본 오류 문자열, 내부 변수명 같은
      기술 정보는 여기 넣지 않고 errors[].detail 에 둔다.
      전체 실패(status=failed)의 대표 문장과 섹션 단위 오류 문장은 다르다 —
      전자는 표준 대표 문장, 후자는 어느 섹션이 어떻게 됐는지를 유지한 문장이다.
    help_en: >-
      Human-readable Korean sentence shown to the user as-is. Always a non-empty string
      (never null, empty, or an internal data structure rendering).
      Technical evidence (management port numbers, HTTP status codes, resource paths,
      raw error strings, internal variable names) belongs in errors[].detail, not here.
      Representative sentences for a complete failure differ from per-section messages:
      the former is one of the standard sentences, the latter preserves section meaning.

  "diagnosis.details.notices":
    type: "array"
    priority: nice
    channel: [redfish]
    # 2026-08-12 신설. 성공한 fallback 을 errors[] 에서 뺀 자리(H11).
    # 원소는 {section, message} 2키. status 판정에 관여하지 않는다.
    help_ko: >-
      수집에 **성공했지만** 알아두면 좋은 사실 목록. 오류가 아니다.
      예: 구형 관리 모듈에서 대체 경로로 스토리지 정보를 정상 수집한 경우,
      항목 수가 너무 많아 일부만 수집한 경우, 제조사를 대체 경로로 식별한 경우.
      errors[] 가 아니므로 status 판정에 영향을 주지 않는다.
      종전에는 이런 사실이 errors[] 에 들어가 정상 수집인데도 status 가 partial 로
      떨어졌다. 원소는 {section, message} 2키이며 비어 있을 수 있다.
    help_en: >-
      Facts worth knowing about a collection that **succeeded**. Not errors.
      Examples: storage collected through a legacy fallback path on an older management
      module, a collection truncated because it exceeded the member cap, or a vendor
      identified through a fallback signal. Not part of errors[], so it never affects status.
      Previously these were recorded in errors[], which demoted successful collections to
      partial. Each element has {section, message}; the list may be empty.

  "errors[].detail":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      기술 근거. 문자열이거나 null 이다 (객체나 배열이 아니다).
      실패한 태스크 이름, 관리 포트별 원본 오류, HTTP 상태 코드, 응답 경로, 예외 종류,
      명령 종료 코드 등 운영자가 원인을 좁히는 데 쓰는 정보가 들어간다.
      자격증명 같은 비밀 정보는 절대 포함하지 않는다. 길이 상한이 있어 잘릴 수 있다.
    help_en: >-
      Technical evidence. A string or null (never an object or array).
      Contains failing task name, per-port raw errors, HTTP status codes, resource paths,
      exception types, command exit codes, and similar operator-facing detail.
      Never contains credentials or other secrets. Truncated beyond a length cap.

  # ──────────────────────────────────────────────────────────────────────────
  # hardware
  # ──────────────────────────────────────────────────────────────────────────

  hardware.health:
    type: "string|null"
    enum: ["OK", "Warning", "Critical"]
    priority: must
    channel: [redfish]
    help_ko: >-
      서버 하드웨어 전체 상태 (BMC rollup health).
      OK=모든 하위 구성요소 정상,
      Warning=일부 구성요소 주의 필요,
      Critical=장애 발생.
      이 값은 '수집 성공 여부'가 아닌 '장비 자체의 건강 상태'.
      rollup에 포함되는 하위 구성요소 범위는 벤더마다 다를 수 있음.
      null=BMC가 이 필드를 제공하지 않는 경우.
    help_en: >-
      Server hardware overall health (BMC rollup).
      OK=all subsystems healthy,
      Warning=some subsystems need attention,
      Critical=fault detected.
      This reflects equipment health, not collection success.
      Rollup scope may vary by vendor.
      null=BMC does not provide this field.

  hardware.sku:
    type: "string|null"
    priority: must
    channel: [os, redfish]
    help_ko: >-
      서버 제품 식별 번호. 벤더마다 의미가 다름.
      Lenovo=CTO 주문 번호 (예: 7Z73CTO1WW),
      HPE=파트 번호 (예: P52534-B21),
      Dell=서비스 태그 (예: 2BJ8033),
      Cisco=미제공 (null).
    help_en: >-
      Server product identifier. Meaning varies by vendor.
      Lenovo=CTO order number,
      HPE=part number,
      Dell=service tag,
      Cisco=not provided (null).

  # cycle 2026-06-15 (SCH-1/2, 사용자 승인): data.hardware 에 정상 emit 되나 사전 미정의이던
  # 식별 필드 12종 등록. Must 5(vendor/model/serial/uuid/bios_version — 전 esxi+redfish baseline
  # 보유 실측) + Nice 7. channel 은 hardware 섹션(=[esxi,redfish]) 기준, vendor OEM 전용은 [redfish].
  hardware.vendor:
    type: "string|null"
    priority: must
    channel: [os, esxi, redfish]
    help_ko: "서버 제조사 원문 (Redfish System.Manufacturer / ESXi systemInfo.vendor / OS DMI sys_vendor·Win32_ComputerSystem.Manufacturer). 예: HPE, Dell Inc., Lenovo. envelope.vendor 는 이 값을 vendor_aliases 로 정규화한 표시값."
    help_en: "Raw server vendor (Redfish System.Manufacturer / ESXi systemInfo.vendor / OS DMI sys_vendor or Win32_ComputerSystem.Manufacturer). e.g. HPE, Dell Inc., Lenovo. envelope.vendor is this value normalized via vendor_aliases."

  hardware.model:
    type: "string|null"
    priority: must
    channel: [os, esxi, redfish]
    help_ko: "서버 모델명 (Redfish System.Model). 예: HPE ProLiant Compute DL380 Gen12."
    help_en: "Server model (Redfish System.Model). e.g. HPE ProLiant Compute DL380 Gen12."

  hardware.serial:
    type: "string|null"
    priority: must
    channel: [os, esxi, redfish]
    help_ko: >-
      서버 대표 시리얼번호. 기본 원천은 Redfish System.SerialNumber 이고 빈 문자열은 null 로 정규화.
      단 Dell 은 예외 — System.SerialNumber 가 보드 제조 시리얼(CNIVC…)이라 OS SMBIOS Type 1 값과
      달라서, ServiceRoot.Oem.Dell.ServiceTag (Dell Service Tag) 를 쓴다. Dell 은 이 값을 필수로
      보고 확보하지 못하면 다른 후보로 대체하지 않고 수집을 실패시킨다 (2026-08-11 교정).
    help_en: >-
      Representative server serial. Default source is Redfish System.SerialNumber; empty string
      normalized to null. Dell is the exception — its System.SerialNumber is a board manufacturing
      serial (CNIVC…) that differs from the OS SMBIOS Type 1 value, so ServiceRoot.Oem.Dell.ServiceTag
      (Dell Service Tag) is used. For Dell this value is mandatory: if it cannot be obtained the
      collection fails rather than falling back to another candidate (corrected 2026-08-11).

  hardware.uuid:
    type: "string|null"
    priority: must
    channel: [os, esxi, redfish]
    help_ko: "시스템 UUID (Redfish System.UUID). BMC UUID(bmc.uuid)와 다름 — 서버 본체 식별자."
    help_en: "System UUID (Redfish System.UUID). Differs from BMC UUID (bmc.uuid) — server chassis identifier."

  hardware.bios_version:
    type: "string|null"
    priority: must
    channel: [os, esxi, redfish]
    help_ko: "BIOS/UEFI 펌웨어 버전 (Redfish System.BiosVersion)."
    help_en: "BIOS/UEFI firmware version (Redfish System.BiosVersion)."

  hardware.bios_date:
    type: "string|null"
    priority: nice
    channel: [os, esxi, redfish]
    help_ko: "BIOS 릴리스 날짜 (ISO 8601 YYYY-MM-DD 정규화). 벤더 OEM(예: HPE Oem.Hpe.Bios.Current.Date)에서 hoist. 미제공 시 null."
    help_en: "BIOS release date (ISO 8601 YYYY-MM-DD). Hoisted from vendor OEM (e.g. HPE Oem.Hpe.Bios.Current.Date). null when absent."

  hardware.asset_tag:
    type: "string|null"
    priority: nice
    channel: [os, redfish]
    help_ko: "자산 태그 (Redfish System.AssetTag). 미설정 시 빈 문자열→null."
    help_en: "Asset tag (Redfish System.AssetTag). Empty→null when unset."

  hardware.system_type:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "시스템 타입 (Redfish System.SystemType). 예: Physical."
    help_en: "System type (Redfish System.SystemType). e.g. Physical."

  hardware.part_number:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "서버 파트 번호 (Redfish System.PartNumber). 미제공 벤더는 null."
    help_en: "Server part number (Redfish System.PartNumber). null for vendors that omit it."

  hardware.last_reset_time:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "마지막 리셋 시각 (Redfish System.LastResetTime). 미제공 펌웨어는 null."
    help_en: "Last reset time (Redfish System.LastResetTime). null on firmware that omits it."

  hardware.boot_progress:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "부팅 진행 상태 (Redfish System.BootProgress.LastState). 예: OSRunning / None."
    help_en: "Boot progress (Redfish System.BootProgress.LastState). e.g. OSRunning / None."

  hardware.tpm:
    type: "object|null"
    priority: nice
    channel: [redfish]
    help_ko: "TPM 요약 {interface_type, firmware_version, state}. Redfish System.TrustedModules[0]에서 추출. 미장착/미제공 시 null."
    help_en: "TPM summary {interface_type, firmware_version, state}. From Redfish System.TrustedModules[0]. null when absent."

  hardware.oem:
    type: "object"
    priority: must
    channel: [os, redfish]
    help_ko: >-
      벤더 전용 확장 데이터. 키 구조가 벤더마다 완전히 다름.
      HPE: aggregate_server_health, subsystem_health, psu_redundancy 등.
      Dell: chassis_service_tag, express_service_code, rollup_status 등.
      Lenovo: product_name 등.
      Cisco: 일반적으로 비어 있음.
    help_en: >-
      Vendor-specific extended data. Key structure varies completely by vendor.
      HPE: aggregate_server_health, subsystem_health, psu_redundancy, etc.
      Dell: chassis_service_tag, express_service_code, rollup_status, etc.
      Lenovo: product_name, etc.
      Cisco: typically empty.

  # ──────────────────────────────────────────────────────────────────────────
  # memory
  # ──────────────────────────────────────────────────────────────────────────

  memory.total_basis:
    type: "string"
    enum: ["physical_installed", "os_visible", "hypervisor_visible"]
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      total_mb 값의 산출 기준.
      physical_installed=DIMM에 물리적으로 장착된 용량 (Redfish 기준),
      os_visible=운영체제가 인식하는 용량 (Linux/Windows 기준),
      hypervisor_visible=하이퍼바이저가 인식하는 용량 (ESXi 기준).
      같은 서버라도 채널에 따라 total_mb 값이 다를 수 있음.
      예: 512GB 장착 서버에서 Redfish=524288MB, OS=500000MB (예약 영역 차감).
    help_en: >-
      Basis for total_mb calculation.
      physical_installed=physically installed DIMM capacity (Redfish),
      os_visible=OS-reported capacity (Linux/Windows),
      hypervisor_visible=hypervisor-reported capacity (ESXi).
      Same server may report different total_mb depending on channel.

  memory.installed_mb:
    type: "integer|null"
    priority: must
    channel: [redfish, os]
    # cycle 2026-05-11 field-channel-refinement: ESXi channel 제거.
    # 근거: esxi_baseline.json 의 installed_mb=null (ansible_memtotal_mb 만 수집,
    # DIMM 슬롯 정보 없음). field_usage_matrix 분류 1 (수집 불가).
    help_ko: >-
      물리적으로 장착된 메모리 용량 (MB).
      Redfish 채널에서 주로 제공. OS 채널에서는 dmidecode 권한 부족 시 null 가능.
      ESXi 채널은 미수집 (ansible_memtotal_mb 만 제공) — channel 에서 제외 (cycle 2026-05-11).
      total_mb와 동일한 값일 수 있으나, total_basis가 다르면 의미가 다름.
    help_en: >-
      Physically installed memory capacity (MB).
      Primarily provided by Redfish. May be null in OS channel (dmidecode permission).
      ESXi channel excluded (cycle 2026-05-11) — ansible_memtotal_mb only.

  memory.visible_mb:
    type: "integer|null"
    priority: must
    channel: [os, esxi]
    # cycle 2026-05-11 field-channel-refinement: Redfish channel 제거.
    # 근거: Redfish spec 미정의 (Memory.v1_*.json 에 VisibleMiB 필드 없음).
    # 4 redfish baseline (dell/hpe/lenovo/cisco) 모두 null. field_usage_matrix 분류 1.
    help_ko: >-
      운영체제 또는 하이퍼바이저가 인식하는 메모리 용량 (MB).
      OS/ESXi 채널 전용. Redfish 는 BMC API spec 미정의 — channel 에서 제외 (cycle 2026-05-11).
    help_en: >-
      OS or hypervisor visible memory capacity (MB).
      OS/ESXi channels only. Redfish excluded (cycle 2026-05-11) — not defined in BMC spec.

  # cycle 2026-06-14 (DELL R740 MEM-1/MEM-2): memory.total_mb + per-DIMM slots[] 문서화.
  memory.total_mb:
    type: "integer|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      총 메모리 용량 (MB). total_basis 가 산출 기준을 규정 (Redfish=physical_installed).
      Redfish 는 per-DIMM CapacityMiB 합 또는 MemorySummary.TotalSystemMemoryGiB*1024 fallback.
      '_mb' 키지만 Redfish 채널 값은 이진 MiB (프로젝트 컨벤션, total_basis help 참조).
    help_en: >-
      Total memory capacity (MB). total_basis qualifies the basis (Redfish=physical_installed).
      Redfish = sum of per-DIMM CapacityMiB or MemorySummary.TotalSystemMemoryGiB*1024 fallback.

  "memory.slots[]":
    type: "array of object"
    priority: nice
    channel: [redfish, os]
    help_ko: >-
      장착된 DIMM 슬롯별 상세. 빈/Absent 슬롯은 제외 (장착된 모듈만). Redfish
      /Systems/<id>/Memory/* 에서 수집.
    help_en: >-
      Per-installed-DIMM detail (Absent slots excluded). From Redfish /Systems/<id>/Memory/*.

  "memory.slots[].capacity_mb":
    type: "integer|null"
    priority: nice
    channel: [redfish, os]
    help_ko: "DIMM 용량 (Memory.CapacityMiB, 이진 MiB)."
    help_en: "DIMM capacity (Memory.CapacityMiB, binary MiB)."

  "memory.slots[].speed_mhz":
    type: "integer|null"
    priority: nice
    channel: [redfish, os]
    help_ko: "DIMM 현재 동작 속도 (Memory.OperatingSpeedMhz, 현재 클럭)."
    help_en: "DIMM current operating speed (Memory.OperatingSpeedMhz)."

  "memory.slots[].type":
    type: "string|null"
    priority: nice
    channel: [redfish, os]
    help_ko: "메모리 종류 (Memory.MemoryDeviceType, 예: DDR4)."
    help_en: "Memory device type (Memory.MemoryDeviceType, e.g. DDR4)."

  "memory.slots[].base_module_type":
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "모듈 폼팩터 (Memory.BaseModuleType, 예: RDIMM/UDIMM/LRDIMM)."
    help_en: "Module form factor (Memory.BaseModuleType, e.g. RDIMM/UDIMM/LRDIMM)."

  "memory.slots[].manufacturer":
    type: "string|null"
    priority: nice
    channel: [redfish, os]
    help_ko: >-
      DIMM 제조사 (Memory.Manufacturer 정규화 — 예: 'Hynix Semiconductor'→'SK hynix'
      cross-channel canonical).
    help_en: >-
      DIMM manufacturer (Memory.Manufacturer canonicalized, e.g. 'Hynix Semiconductor'->'SK hynix').

  "memory.slots[].part_number":
    type: "string|null"
    priority: nice
    channel: [redfish, os]
    help_ko: "DIMM 파트번호 (Memory.PartNumber)."
    help_en: "DIMM part number (Memory.PartNumber)."

  "memory.slots[].rank_count":
    type: "integer|null"
    priority: nice
    channel: [redfish]
    help_ko: "DIMM rank 수 (Memory.RankCount)."
    help_en: "DIMM rank count (Memory.RankCount)."

  "memory.slots[].data_width_bits":
    type: "integer|null"
    priority: nice
    channel: [redfish]
    help_ko: "데이터 폭 비트 (Memory.DataWidthBits, 예: 64). bus_width_bits 와 별개."
    help_en: "Data width bits (Memory.DataWidthBits, e.g. 64). Distinct from bus_width_bits."

  "memory.slots[].bus_width_bits":
    type: "integer|null"
    priority: nice
    channel: [redfish]
    help_ko: "버스 폭 비트 (Memory.BusWidthBits, 예: 72 = 64 데이터 + 8 ECC)."
    help_en: "Bus width bits (Memory.BusWidthBits, e.g. 72 = 64 data + 8 ECC)."

  "memory.slots[].error_correction":
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "ECC 방식 (Memory.ErrorCorrection, 예: MultiBitECC)."
    help_en: "Error correction (Memory.ErrorCorrection, e.g. MultiBitECC)."

  "memory.slots[].locator":
    type: "string|null"
    priority: nice
    channel: [redfish, os]
    help_ko: "물리 슬롯 위치 라벨 (Memory.DeviceLocator, 예: 'DIMM A5')."
    help_en: "Physical slot locator (Memory.DeviceLocator, e.g. 'DIMM A5')."

  "memory.slots[].serial":
    type: "string|null"
    priority: nice
    channel: [redfish, os]
    help_ko: "DIMM 시리얼 (Memory.SerialNumber)."
    help_en: "DIMM serial (Memory.SerialNumber)."

  "memory.slots[].health":
    type: "string|null"
    enum: ["OK", "Warning", "Critical"]
    priority: nice
    channel: [redfish]
    help_ko: "DIMM 건강 상태 (Memory.Status.Health)."
    help_en: "DIMM health (Memory.Status.Health)."

  # ──────────────────────────────────────────────────────────────────────────
  # storage
  # ──────────────────────────────────────────────────────────────────────────

  "storage.physical_disks[]":
    type: "array of object"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      시스템 전체의 물리 디스크 목록 (중복 제거됨).
      controllers[].drives[]에도 같은 디스크가 컨트롤러별로 나타남.
      physical_disks는 컨트롤러 구분 없이 전체 디스크를 한 번만 보여줌.
      CapacityBytes=0인 드라이브 (Empty Bay, FlexFlash)는 제외됨.
    help_en: >-
      System-wide physical disk list (deduplicated).
      Same disks also appear under controllers[].drives[] grouped by controller.
      physical_disks shows all disks once without controller grouping.
      Drives with CapacityBytes=0 (Empty Bay, FlexFlash) are excluded.

  "storage.physical_disks[].id":
    type: "string|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      물리 디스크 식별자. logical_volumes[].member_drive_ids에서 참조됨.
      Redfish: Drive의 Id (예: Disk.Bay.0:Enclosure.Internal.0-1:RAID.Slot.6-1).
      OS(Linux): device path (예: /dev/sda).
      OS(Windows): DeviceID (예: \\.\PhysicalDrive0).
      ESXi: ScsiLun.canonicalName (예: naa.6f80...) — 2026-06-22부터 수집.
    help_en: >-
      Physical disk identifier. Referenced by logical_volumes[].member_drive_ids.
      Redfish: Drive Id (e.g., Disk.Bay.0:Enclosure.Internal.0-1:RAID.Slot.6-1).
      OS(Linux): device path (e.g., /dev/sda).
      OS(Windows): DeviceID (e.g., \\.\PhysicalDrive0).
      ESXi: ScsiLun.canonicalName (e.g., naa.6f80...) — collected since 2026-06-22.

  "storage.physical_disks[].serial":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      물리 디스크 시리얼 번호.
      Redfish: Drive.SerialNumber.
      OS(Linux): lsblk SERIAL (udev ID_SERIAL_SHORT) → 빈 값이면 udevadm 보강.
      OS(Windows): Get-PhysicalDisk.SerialNumber → 빈 값이면 Win32_DiskDrive.SerialNumber (hex/공백 정규화).
      ESXi: ScsiLun.alternateName[SERIALNUM] (없으면 serialNumber).
      virtio 가상디스크 / 일부 SATA 는 null 가능 (best-effort).
    help_en: >-
      Physical disk serial number.
      Redfish: Drive.SerialNumber.
      OS(Linux): lsblk SERIAL (udev ID_SERIAL_SHORT), udevadm fallback.
      OS(Windows): Get-PhysicalDisk.SerialNumber, Win32_DiskDrive.SerialNumber fallback (hex/space normalized).
      ESXi: ScsiLun.alternateName[SERIALNUM] (serialNumber fallback).
      May be null for virtio virtual disks / some SATA (best-effort).

  "storage.physical_disks[].wwn":
    type: "string|null"
    priority: nice
    channel: [os, esxi]
    help_ko: >-
      물리 디스크 WWN (World Wide Name).
      OS(Linux): lsblk WWN (udev ID_WWN; SATA/SAS=NAA `0x...`, NVMe=`eui.`).
      OS(Windows): Get-PhysicalDisk.UniqueId (UniqueIdFormat 이 EUI64/FCPHName/SCSI Name String 일 때만).
      ESXi: ScsiLun.canonicalName (naa.*).
      로컬 SATA · virtio 는 null 정상 (best-effort).
    help_en: >-
      Physical disk WWN (World Wide Name).
      OS(Linux): lsblk WWN (udev ID_WWN; SATA/SAS NAA `0x...`, NVMe `eui.`).
      OS(Windows): Get-PhysicalDisk.UniqueId when UniqueIdFormat is EUI64/FCPHName/SCSI Name String.
      ESXi: ScsiLun.canonicalName (naa.*).
      Null is normal for local SATA / virtio (best-effort).

  "storage.physical_disks[].health":
    type: "string|null"
    enum: ["OK", "Warning", "Critical"]
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      물리 디스크 건강 상태.
      Redfish: Drive.Status.Health (OK/Warning/Critical → 정규화).
      OS(Windows): Get-PhysicalDisk.HealthStatus (Healthy/Warning/Unhealthy → healthy/warning/unhealthy).
      OS(Linux): 현재 미수집(null) — smartctl 도입 시 채움 (NEXT_ACTIONS).
      ESXi: ScsiLun 미노출 (null).
    help_en: >-
      Physical disk health status.
      Redfish: Drive.Status.Health (OK/Warning/Critical, normalized).
      OS(Windows): Get-PhysicalDisk.HealthStatus (Healthy/Warning/Unhealthy → healthy/warning/unhealthy).
      OS(Linux): not collected yet (null) — pending smartctl (NEXT_ACTIONS).
      ESXi: not exposed by ScsiLun (null).

  "storage.physical_disks[].predicted_life_percent":
    type: "integer|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      SSD 남은 미디어 수명 (%).
      100=새 디스크, 0=수명 소진.
      HDD에서는 null.
      HPE는 float으로 반환되어 int로 변환됨 (예: 100.0 → 100).
    help_en: >-
      SSD remaining media life (%).
      100=new drive, 0=end of life.
      null for HDD.
      HPE returns float, normalized to int (e.g., 100.0 → 100).

  "storage.physical_disks[].is_os_disk":
    type: "boolean|null"
    priority: nice
    channel: [os]
    help_ko: >-
      이 물리 디스크에 OS 루트 파일시스템(/, Windows %SystemDrive%)이 설치돼 있는지.
      true=OS 디스크, false=OS 루트 아님,
      null=판정 불가(SAN/iSCSI/NFS 루트 또는 findmnt/Get-Partition 부재 — 거짓 false 금지).
      OS(Linux): findmnt / → lsblk -s -l 로 하위 물리 디스크 역추적. RAID/LVM/multipath 는 멤버 디스크 모두 true.
      OS(Windows): %SystemDrive% → Get-Partition.DiskNumber (WMI fallback), Win32_DiskDrive.Index 매칭.
      hardware-RAID/단일디스크=정확. software-RAID/Storage Spaces/동적미러 OS 는 가상 DiskNumber 라
      전 디스크 null (Linux 의 멤버 all-true 와 비대칭).
      OS 채널 전용 — ESXi/Redfish 미수집.
    help_en: >-
      Whether the OS root filesystem (/, Windows %SystemDrive%) resides on this disk.
      true=OS disk, false=not the OS root,
      null=undeterminable (SAN/iSCSI/NFS root, or findmnt/Get-Partition unavailable; never a false false).
      OS(Linux): findmnt / then lsblk -s -l to trace underlying physical disks; RAID/LVM/multipath members all true.
      OS(Windows): %SystemDrive% then Get-Partition.DiskNumber (WMI fallback), matched to Win32_DiskDrive.Index.
      Hardware-RAID/single-disk are accurate; software-RAID/Storage Spaces/dynamic-mirror OS yield null for all
      disks (virtual DiskNumber has no physical Index) — asymmetric with the Linux all-members-true behavior.
      OS channel only — not collected on ESXi/Redfish.

  "storage.controllers[]":
    type: "array of object"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      스토리지 컨트롤러 (RAID/SAS/SATA/NVMe/HBA) 목록.
      Redfish: StorageControllers (model/firmware/health/drives).
      OS(Linux): lspci (id=pci, controller_model=칩, driver, controller_type).
      OS(Windows): 현재 미수집([]) — Storage Spaces 도입 시 (NEXT_ACTIONS).
      ESXi: hostBusAdapter + pciDevice vendor (id=vmhba, driver, controller_type).
    help_en: >-
      Storage controllers (RAID/SAS/SATA/NVMe/HBA).
      Redfish: StorageControllers (model/firmware/health/drives).
      OS(Linux): lspci (id=pci, controller_model=chip, driver, controller_type).
      OS(Windows): not collected yet ([]) — pending Storage Spaces (NEXT_ACTIONS).
      ESXi: hostBusAdapter + pciDevice vendor (id=vmhba, driver, controller_type).

  "storage.controllers[].controller_type":
    type: "string|null"
    priority: nice
    channel: [os, esxi]
    help_ko: >-
      컨트롤러 종류. RAID/SAS/SATA/NVMe/SCSI/FC.
      OS(Linux): lspci 클래스. ESXi: hostBusAdapter 타입(Block=SATA/Serial=SAS/FibreChannel=FC).
    help_en: >-
      Controller type. RAID/SAS/SATA/NVMe/SCSI/FC.
      OS(Linux): lspci class. ESXi: hostBusAdapter type (Block=SATA/Serial=SAS/FibreChannel=FC).

  "storage.controllers[].driver":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      컨트롤러 커널 드라이버. OS(Linux): lspci 'Kernel driver in use' (예: mpi3mr/ahci/nvme).
      ESXi: hostBusAdapter.driver (예: lsi_mr3/vmw_ahci/nfnic).
    help_en: >-
      Controller kernel driver. OS(Linux): lspci 'Kernel driver in use' (e.g., mpi3mr/ahci/nvme).
      ESXi: hostBusAdapter.driver (e.g., lsi_mr3/vmw_ahci/nfnic).

  "storage.controllers[].drives[]":
    type: "array of object"
    priority: must
    channel: [redfish]
    help_ko: >-
      해당 스토리지 컨트롤러에 연결된 드라이브 목록.
      physical_disks[]와 같은 디스크가 컨트롤러별로 분류되어 나타남.
      RAID 구성 확인 시 이 경로를 사용.
    help_en: >-
      Drives attached to this storage controller.
      Same disks as physical_disks[] but grouped by controller.
      Use this path for RAID configuration analysis.

  # ──────────────────────────────────────────────────────────────────────────
  # storage — logical volumes (RAID)
  # ──────────────────────────────────────────────────────────────────────────

  "storage.logical_volumes[]":
    type: "array of object"
    priority: must
    channel: [redfish]
    help_ko: >-
      RAID 논리 볼륨 목록. Redfish /Storage/{id}/Volumes에서 수집.
      controllers[].id, physical_disks[].id와 관계를 형성:
      logical_volumes[].controller_id → controllers[].id,
      logical_volumes[].member_drive_ids → physical_disks[].id.
      OS/ESXi 채널에서는 빈 배열 [].
      HBA 모드(RAID 미구성) 서버에서도 빈 배열 [].
    help_en: >-
      RAID logical volume list. Collected from Redfish /Storage/{id}/Volumes.
      Forms relationships with controllers[].id and physical_disks[].id:
      logical_volumes[].controller_id → controllers[].id,
      logical_volumes[].member_drive_ids → physical_disks[].id.
      Empty array [] for OS/ESXi channels and HBA-mode servers.

  "storage.logical_volumes[].raid_level":
    type: "string|null"
    enum: ["RAID0", "RAID1", "RAID5", "RAID6", "RAID10", "RAID50", "JBOD"]
    priority: must
    channel: [redfish]
    help_ko: >-
      RAID 레벨. 표준 RAIDType 필드 우선 사용.
      Dell 레거시 펌웨어에서 RAIDType 미제공 시 VolumeType으로 fallback
      (Mirrored→RAID1, StripedWithParity→RAID5 등).
      null=RAID 레벨을 판별할 수 없는 경우.
    help_en: >-
      RAID level. Uses standard RAIDType field first.
      Falls back to Dell legacy VolumeType mapping when RAIDType is absent
      (Mirrored→RAID1, StripedWithParity→RAID5, etc.).
      null=RAID level could not be determined.

  "storage.logical_volumes[].member_drive_ids":
    type: "array of string"
    priority: must
    channel: [redfish]
    help_ko: >-
      이 논리 볼륨을 구성하는 물리 드라이브 Id 목록.
      physical_disks[].id와 매칭하여 물리↔논리 관계를 확인할 수 있음.
      Redfish Volume의 Links.Drives[].@odata.id에서 추출.
    help_en: >-
      List of physical drive Ids composing this logical volume.
      Match against physical_disks[].id to trace physical↔logical relationships.
      Extracted from Redfish Volume Links.Drives[].@odata.id.

  "storage.logical_volumes[].controller_id":
    type: "string|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      이 논리 볼륨이 속한 스토리지 컨트롤러의 Id.
      controllers[].id와 매칭하여 컨트롤러↔볼륨 관계를 확인할 수 있음.
    help_en: >-
      Storage controller Id that this logical volume belongs to.
      Match against controllers[].id to trace controller↔volume relationships.

  "storage.logical_volumes[].id":
    type: "string|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      논리 볼륨 식별자. Redfish Volume의 Id.
      Dell: Disk.Virtual.0:RAID.Slot.6-1 형태.
      HPE: 숫자 (예: 1).
      Lenovo: 숫자 (예: 0).
    help_en: >-
      Logical volume identifier. Redfish Volume Id.
      Dell: Disk.Virtual.0:RAID.Slot.6-1 format.
      HPE: numeric (e.g., 1).
      Lenovo: numeric (e.g., 0).

  "storage.logical_volumes[].name":
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "논리 볼륨 이름 (예: Virtual Disk 0)."
    help_en: "Logical volume name (e.g., Virtual Disk 0)."

  "storage.logical_volumes[].total_mb":
    type: "integer|null"
    priority: must
    channel: [redfish]
    # cycle 2026-06-15 (RJ-1, 사용자 결정): 키 이름은 _mb 이나 값은 실제로 MiB(이진, ÷2^20)다.
    # rename/십진 MB 재계산은 호출자 계약 breaking(rule 13 R5) → 키/값 유지, 단위는 문서로만 명시.
    help_ko: >-
      논리 볼륨 용량. **주의: 키 이름은 total_mb 이나 값은 MiB(이진)다** — CapacityBytes ÷ 2^20
      (1048576). 십진 MB(÷10^6) 아님. physical_disks 의 capacity_gb(십진 GB)와 단위계가 달라
      합산/비교 시 주의. RAID 레벨에 따라 물리 디스크 합산 용량과 다를 수 있음 (예: RAID1 2×480GB
      → 약 457GiB 볼륨). 이름/값은 호출자 계약 유지 위해 의도적으로 현행 유지.
    help_en: >-
      Logical volume capacity. **NOTE: despite the _mb name, the value is in MiB (binary)** —
      CapacityBytes / 2^20 (1048576), not decimal MB (/10^6). Differs in unit system from
      physical_disks capacity_gb (decimal GB). May differ from raw physical disk total by RAID
      level (e.g. RAID1 2×480GB → ~457GiB). Name/value intentionally kept for caller contract.

  "storage.logical_volumes[].health":
    type: "string|null"
    enum: ["OK", "Warning", "Critical"]
    priority: must
    channel: [redfish]
    help_ko: >-
      논리 볼륨 건강 상태.
      OK=정상, Warning=주의 필요, Critical=장애.
      null=BMC가 이 필드를 제공하지 않는 경우.
    help_en: >-
      Logical volume health.
      OK=healthy, Warning=attention needed, Critical=fault.
      null=BMC does not provide this field.

  "storage.logical_volumes[].state":
    type: "string|null"
    enum: ["Enabled", "Degraded", "Offline"]
    priority: must
    channel: [redfish]
    help_ko: >-
      논리 볼륨 동작 상태.
      Enabled=정상 동작, Degraded=성능 저하 (드라이브 장애 등),
      Offline=비활성.
    help_en: >-
      Logical volume operational state.
      Enabled=operating normally, Degraded=reduced performance (drive failure etc.),
      Offline=inactive.

  "storage.logical_volumes[].boot_volume":
    type: "boolean|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      부트 볼륨 여부. Dell OEM(DellVolume.BootVolumeSource)에서만 판별 가능.
      기타 벤더에서는 null.
    help_en: >-
      Whether this is a boot volume. Only determinable from Dell OEM
      (DellVolume.BootVolumeSource). null for other vendors.

  # ──────────────────────────────────────────────────────────────────────────
  # network
  # ──────────────────────────────────────────────────────────────────────────

  "network.interfaces[].link_status":
    type: "string|null"
    enum: ["up", "down", "unknown", null]
    priority: must
    channel: [redfish, os, esxi]
    # cycle 2026-06-14 (link_status 통일): 전 채널 canonical up/down/unknown.
    # redfish(_normalize_link_status)/os-linux/os-windows/esxi-interfaces 코드 일치.
    # 이전 enum ["linkup","linkdown","none"]은 코드/baseline 어느 쪽과도 불일치였음(정본=코드).
    # redfish dell/hpe/lenovo baseline 의 linkup/linkdown/none 은 stale → 실장비 재캡처 의무.
    help_ko: >-
      NIC 링크 상태 (전 채널 통일 canonical).
      up=링크 활성, down=링크 비활성(미연결/disabled/offline 포함),
      unknown=상태 미제공/판별 불가 (HPE/Cisco System NIC 등), null=필드 자체 미제공.
      Redfish의 System EthernetInterfaces는 서버 NIC 하드웨어 정보이며,
      IP 주소/게이트웨이는 일반적으로 비어 있음 (OS 수준 정보이므로).
    help_en: >-
      NIC link state (canonical, unified across all channels).
      up=link active, down=link inactive (incl. unplugged/disabled/offline),
      unknown=status not reported/undeterminable (HPE/Cisco System NICs), null=field absent.

  # ──────────────────────────────────────────────────────────────────────────
  # power
  # ──────────────────────────────────────────────────────────────────────────

  "power.power_supplies[].state":
    type: "string|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      PSU 동작 상태.
      Enabled=전원 공급 중이며 정상 동작,
      UnavailableOffline=전원 미공급 또는 장애로 비활성.
      health(OK/Warning/Critical)와는 별개 필드.
    help_en: >-
      PSU operational state.
      Enabled=powered and operating,
      UnavailableOffline=no power input or fault.
      Separate from health (OK/Warning/Critical).

  # ──────────────────────────────────────────────────────────────────────────
  # thermal (cycle 2026-06-14 Track 4) — 온도 센서 + 팬 (Chassis/Thermal)
  # ──────────────────────────────────────────────────────────────────────────

  "thermal.temperatures[]":
    type: "array of object"
    priority: nice
    channel: [redfish]
    help_ko: >-
      온도 센서 목록. Chassis/{id}/Thermal.Temperatures (또는 신 펌웨어
      ThermalSubsystem.ThermalMetrics.TemperatureReadingsCelsius). 미노출 시 빈 [].
    help_en: >-
      Temperature sensor list. From Chassis/{id}/Thermal.Temperatures (or new-firmware
      ThermalSubsystem.ThermalMetrics.TemperatureReadingsCelsius). Empty [] when unexposed.

  "thermal.temperatures[].reading_celsius":
    type: "integer|null"
    priority: nice
    channel: [redfish]
    help_ko: "현재 온도 (°C, Temperature.ReadingCelsius). 문자열 응답은 int 정규화."
    help_en: "Current temperature (°C, Temperature.ReadingCelsius). String responses normalized to int."

  "thermal.temperatures[].upper_critical":
    type: "integer|null"
    priority: nice
    channel: [redfish]
    help_ko: "상한 critical 임계값 (°C, UpperThresholdCritical). 신 schema 경로는 null."
    help_en: "Upper critical threshold (°C, UpperThresholdCritical). null on new-schema path."

  "thermal.temperatures[].physical_context":
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "센서 물리 위치 (PhysicalContext, 예: CPU/Intake/Exhaust/SystemBoard)."
    help_en: "Sensor physical context (PhysicalContext, e.g. CPU/Intake/Exhaust/SystemBoard)."

  "thermal.fans[]":
    type: "array of object"
    priority: nice
    channel: [redfish]
    help_ko: >-
      팬 목록. Chassis/{id}/Thermal.Fans (신 펌웨어는 ThermalSubsystem.Fans). 미노출 시 빈 [].
    help_en: >-
      Fan list. From Chassis/{id}/Thermal.Fans (new firmware: ThermalSubsystem.Fans). Empty [] when unexposed.

  "thermal.fans[].reading":
    type: "integer|null"
    priority: nice
    channel: [redfish]
    help_ko: "팬 속도 수치 (Reading 또는 ReadingRPM; 신 schema 는 SpeedPercent). reading_units 와 함께 해석."
    help_en: "Fan speed value (Reading or ReadingRPM; new schema SpeedPercent). Interpret with reading_units."

  "thermal.fans[].reading_units":
    type: "string|null"
    enum: ["RPM", "Percent", null]
    priority: nice
    channel: [redfish]
    help_ko: "팬 속도 단위 (RPM 또는 Percent). reading 값의 단위."
    help_en: "Fan speed unit (RPM or Percent) for the reading value."

  # ──────────────────────────────────────────────────────────────────────────
  # cpu
  # ──────────────────────────────────────────────────────────────────────────

  cpu.cores_physical:
    type: "integer|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      서버 전체의 물리 코어 합계.
      Redfish: 모든 프로세서의 TotalCores를 합산한 값.
      OS: ansible_processor_count × cores_per_socket.
      '소켓당 코어'가 아닌 '전체 코어 수'임에 주의.
    help_en: >-
      Total physical cores across all sockets.
      Redfish: sum of TotalCores from all processors.
      OS: ansible_processor_count × cores_per_socket.
      Note: this is total cores, not per-socket.

  # ──────────────────────────────────────────────────────────────────────────
  # firmware
  # ──────────────────────────────────────────────────────────────────────────

  "firmware[].category":
    type: "string"
    priority: nice
    channel: [redfish]
    # cycle 2026-06-15 (SCHEMA-07): normalize_standard.yml _rf_firmware_categorized 가 id/name
    # substring 으로 추론. hpe_csus_3200 baseline 이 이미 emit (정본). enum 은 help 참조.
    help_ko: >-
      펌웨어 컴포넌트 분류 (id/name 추론). 값:
      bios/cpld/tpm/diagnostic/lifecycle/driver_pack/backplane/drive/
      service_module/bmc/nic/storage_controller/psu/other 중 하나.
    help_en: >-
      Inferred firmware component category (from id/name). One of:
      bios/cpld/tpm/diagnostic/lifecycle/driver_pack/backplane/drive/
      service_module/bmc/nic/storage_controller/psu/other.

  "firmware[].pending":
    type: "boolean"
    priority: nice
    channel: [redfish]
    # cycle 2026-06-15: gather_firmware 가 id 에 'pending' 포함 시 true (Lenovo XCC pending fw).
    # pending=true + version=null 은 정상(의도된 보류), pending=false + version=null 은 데이터 누락.
    help_ko: "펌웨어 적용 보류 여부 (Redfish id 에 'Pending' 포함 시 true)."
    help_en: "Whether the firmware is pending application (id contains 'Pending')."

  "firmware[].component":
    type: "string|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      펌웨어 소프트웨어 식별자 (Redfish SoftwareId).
      벤더마다 형식이 다름.
      Lenovo: "BMC-AFBT-10" 형태,
      Dell: 숫자 ID "101548",
      HPE: 숫자 또는 UUID,
      Cisco: 슬롯명.
      raw 값이 문자열 "null"인 경우 None으로 변환됨.
    help_en: >-
      Firmware software identifier (Redfish SoftwareId).
      Format varies by vendor.
      Raw string "null" is converted to None.

  # ──────────────────────────────────────────────────────────────────────────
  # users (DRIFT-004 cycle-006 신규)
  # ──────────────────────────────────────────────────────────────────────────

  "users[]":
    type: "array of object"
    priority: must
    channel: [os]
    help_ko: >-
      OS 채널 사용자 계정 목록.
      Linux: getent passwd 결과.
      Windows: Get-LocalUser cmdlet 결과.
      Redfish/ESXi: 수집 안 함 ([] 빈 배열).
    help_en: >-
      OS-channel user account list.
      Linux: getent passwd output. Windows: Get-LocalUser cmdlet output.
      Not collected for Redfish/ESXi (empty []).

  "users[].name":
    type: "string"
    priority: must
    channel: [os]
    help_ko: >-
      사용자 계정 이름.
      Linux: passwd 첫 필드.
      Windows: SamAccountName.
    help_en: >-
      User account name.
      Linux: passwd first field. Windows: SamAccountName.

  "users[].uid":
    type: "string|integer"
    priority: must
    channel: [os]
    help_ko: >-
      사용자 ID.
      Linux: 정수 UID (예: 0 = root).
      Windows: SID 문자열 (예: S-1-5-21-...).
    help_en: >-
      User ID.
      Linux: integer UID (e.g., 0 = root). Windows: SID string.

  "users[].groups":
    type: "array of string"
    priority: nice
    channel: [os]
    help_ko: >-
      소속 그룹 목록.
      Linux: getent group으로 추출. Windows: 로컬 그룹.
      Vendor-specific 또는 미수집 환경에서는 [].
    help_en: >-
      Group membership list.
      Linux: getent group. Windows: local groups.
      [] when vendor-specific or unavailable.

  "users[].home":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: >-
      홈 디렉터리 경로.
      Linux: passwd 6번째 필드 (예: /root, /home/<user>).
      Windows: 프로파일 경로 (예: C:\Users\<user>).
    help_en: >-
      Home directory path.
      Linux: passwd 6th field. Windows: profile path.

  "users[].last_access_time":
    type: "string|null"
    priority: skip
    channel: [os]
    help_ko: >-
      마지막 로그인/접근 시각 (ISO8601). 수집 환경에 따라 null.
      현재 baseline에서는 보편적 미수집 (null).
    help_en: >-
      Last login/access timestamp (ISO8601). Often null.

  # ──────────────────────────────────────────────────────────────────────────
  # bmc / correlation
  # ──────────────────────────────────────────────────────────────────────────

  bmc.ip:
    type: "string|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      BMC 관리 인터페이스의 IPv4 주소.
      Manager의 EthernetInterfaces에서 추출.
      서버 운영체제의 IP 주소가 아닌 BMC 전용 관리 IP.
    help_en: >-
      BMC management interface IPv4 address.
      Extracted from Manager's EthernetInterfaces.
      This is the BMC management IP, not the server OS IP.

  # cycle 2026-06-14 (DELL R740 BMC-1): bmc.* 하위 필드 문서화. 모듈이 emit 하나
  # 미문서였던 필드(호출자 계약 보강). 출처 = Manager 리소스(/Managers/<id>) + 그 자체 NIC.
  bmc.firmware_version:
    type: "string|null"
    priority: must
    channel: [redfish]
    help_ko: >-
      BMC(iDRAC/iLO/XCC/CIMC) 펌웨어 버전. Manager.FirmwareVersion 에서 추출
      (FirmwareInventory 의 BMC 항목이 아닌 Manager 자체 보고 값 — 더 권위).
    help_en: >-
      BMC firmware version from Manager.FirmwareVersion (the Manager's own reported
      value, not a FirmwareInventory entry).

  bmc.model:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 모델 문자열 (Manager.Model, 예: '14G Monolithic')."
    help_en: "BMC model string (Manager.Model, e.g. '14G Monolithic')."

  bmc.manager_type:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "Manager 유형 (Manager.ManagerType, 예: BMC/EnclosureManager/RackManager)."
    help_en: "Manager type (Manager.ManagerType, e.g. BMC/EnclosureManager/RackManager)."

  bmc.name:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      BMC 표시명 (벤더 라벨: iDRAC/iLO/XCC/CIMC). 호출자 노출용 친화 이름이며
      Manager.Name 원문과 다를 수 있음 (의도된 벤더 표시값).
    help_en: >-
      BMC display label (iDRAC/iLO/XCC/CIMC). Caller-friendly name; may differ from
      raw Manager.Name (intended vendor label).

  bmc.health:
    type: "string|null"
    enum: ["OK", "Warning", "Critical"]
    priority: must
    channel: [redfish]
    help_ko: "BMC 자체 건강 상태 (Manager.Status.Health). 장비 하드웨어 health 와 별개."
    help_en: "BMC self health (Manager.Status.Health). Distinct from server hardware health."

  bmc.state:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 동작 상태 (Manager.Status.State, 예: Enabled)."
    help_en: "BMC operational state (Manager.Status.State, e.g. Enabled)."

  bmc.power_state:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 전원 상태 (Manager.PowerState). 서버 전원(hardware.power_state)과 다름."
    help_en: "BMC power state (Manager.PowerState). Differs from server power (hardware.power_state)."

  bmc.uuid:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      Manager UUID (Manager.UUID/ServiceIdentification). System.UUID(hardware.uuid)와
      다른 값 — 혼동 주의 (BMC 식별자이지 서버 식별자 아님).
    help_en: >-
      Manager UUID (Manager.UUID). Different from System.UUID (hardware.uuid) —
      identifies the BMC, not the server.

  bmc.mac_address:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 관리 NIC 의 MAC. Manager 자체 EthernetInterface 에서 추출 (System NIC 아님)."
    help_en: "BMC management NIC MAC, from the Manager's own EthernetInterface (not a System NIC)."

  bmc.dns_name:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 호스트명 (Manager NIC 의 HostName, 예: iDRAC-<ServiceTag>)."
    help_en: "BMC hostname (Manager NIC HostName, e.g. iDRAC-<ServiceTag>)."

  bmc.datetime:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 현재 시각 ISO8601 (Manager.DateTime). datetime_offset 와 함께 해석."
    help_en: "BMC current time ISO8601 (Manager.DateTime). Interpret with datetime_offset."

  bmc.datetime_offset:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 시간대 오프셋 (Manager.DateTimeLocalOffset, 예: '-05:00')."
    help_en: "BMC timezone offset (Manager.DateTimeLocalOffset, e.g. '-05:00')."

  bmc.timezone:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 시간대 이름 (벤더 OEM, 예: 'CST6CDT'). 없으면 null."
    help_en: "BMC timezone name (vendor OEM, e.g. 'CST6CDT'). null when absent."

  bmc.last_reset_time:
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: "BMC 마지막 리셋 시각 ISO8601 (벤더 OEM). 없으면 null."
    help_en: "BMC last reset time ISO8601 (vendor OEM). null when absent."

  bmc.oem:
    type: "object"
    priority: nice
    channel: [redfish]
    help_ko: >-
      BMC 벤더 OEM 확장. 키 구조 벤더별 상이 (Dell: idrac_url/idrac_ipmi_version/
      idrac_last_update_time/idrac_last_inventory_time 등). Manager.Oem.<Vendor> 에서 추출.
    help_en: >-
      BMC vendor OEM extension. Keys vary by vendor (Dell: idrac_url/idrac_ipmi_version/
      idrac_last_update_time/idrac_last_inventory_time, etc.). From Manager.Oem.<Vendor>.

  correlation.host_ip:
    type: "string"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      수집 대상 장비의 IP 주소.
      Redfish 채널: BMC IP와 동일 (Redfish는 BMC를 통해 수집하므로 서버 OS IP를 알 수 없음).
      OS 채널: 서버 운영체제의 IP.
      ESXi 채널: ESXi 호스트의 IP.
      Redfish에서 host_ip와 bmc_ip가 같은 것은 정상.
    help_en: >-
      IP address of the gather target.
      Redfish: equals BMC IP (Redfish collects via BMC, cannot determine server OS IP).
      OS: server OS IP.
      ESXi: ESXi host IP.
      host_ip equaling bmc_ip in Redfish is expected behavior.

  # ──────────────────────────────────────────────────────────────────────────
  # diagnosis
  # ──────────────────────────────────────────────────────────────────────────

  diagnosis.auth_success:
    type: "boolean|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      인증 성공 여부.
      true=인증 성공 후 수집 완료,
      false=인증 실패,
      null=인증 단계가 실행되지 않았거나 확인 불가.
      null은 '실패'가 아니라 '미확인' 의미.
    help_en: >-
      Authentication verification result.
      true=auth succeeded and collection completed,
      false=auth failed,
      null=auth stage was not executed or inconclusive.
      null means 'not verified', not 'failed'.

  # ══════════════════════════════════════════════════════════════════════════
  # Nice to Have — 설명이 있으면 좋지만 없어도 사용 가능
  # ══════════════════════════════════════════════════════════════════════════

  hardware.power_state:
    type: "string|null"
    enum: ["On", "Off", "PoweringOn", "PoweringOff"]
    priority: nice
    channel: [redfish]
    help_ko: >-
      서버 전원 상태. On=전원 켜짐, Off=전원 꺼짐.
      PoweringOn/PoweringOff는 전환 중 상태.
    help_en: >-
      Server power state. On/Off are steady states.
      PoweringOn/PoweringOff are transitional.

  "storage.physical_disks[].failure_predicted":
    type: "boolean|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      SMART 기반 디스크 고장 예측. true=조만간 고장 예상, false=정상.
      CapacityBytes=0인 드라이브(FlexFlash 등)는 필터로 제외됨.
    help_en: >-
      SMART-based drive failure prediction. true=failure expected, false=healthy.
      Drives with CapacityBytes=0 (FlexFlash etc.) are filtered out.

  "network.interfaces[].kind":
    type: "string"
    enum: ["server_nic", "os_nic", "vmkernel"]
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      NIC 유형. server_nic=Redfish에서 수집한 서버 NIC 하드웨어,
      os_nic=OS에서 수집한 네트워크 인터페이스,
      vmkernel=ESXi vmkernel 포트.
    help_en: >-
      NIC type. server_nic=server NIC hardware from Redfish,
      os_nic=OS-level network interface,
      vmkernel=ESXi vmkernel port.

  meta.duration_ms:
    type: "integer|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      수집 소요 시간 (밀리초). 해당 호스트 1대의 수집 시간.
      배치 실행 시 전체 시간이 아닌 개별 호스트 시간.
    help_en: >-
      Collection duration (milliseconds). Per-host collection time,
      not total batch time.

  diagnosis.failure_stage:
    type: "string|null"
    # 2026-08-10 (Phase 2): "gather" 추가 — 연결/인증 단계를 통과한 뒤 실제 수집·정규화에서
    # 중단된 경우. 종전에는 이 경우 null 이라 precheck 실패와 구분하려면 errors[].section
    # 문자열을 파싱해야 했다. enum 확장(additive)이며 기존 5 값의 의미는 불변.
    enum: ["reachable", "port", "protocol", "auth", "gather", "fallback"]
    priority: nice
    channel: [redfish, os, esxi]
    # cycle 2026-05-11 field-channel-refinement: conditional 필드 — channel 유지.
    # success status baseline 에서 항상 null (실패하지 않음). 실패 status fixture
    # 추가 시 채워짐. field_usage_matrix 자동 분류 1 (모든 baseline null) 은
    # success-only baseline 한계 — conditional 분류 (channel 축소 안 함).
    help_ko: >-
      **실행이 중단된 단계** (원인이 아니다). status=failed 시만 채워지는 conditional 필드.
      reachable=대상 접근 단계, port=관리 포트 연결 확인 단계, protocol=기대 프로토콜 확인 단계,
      auth=자격증명 확인 단계, gather=연결·인증 통과 후 수집/정규화 단계,
      fallback=정상 결과 객체 생성 자체를 완료하지 못함.
      null=실패하지 않았거나 전체 실패 단계가 적용되지 않는 결과.
      실제 원인 확정 여부는 auth_success / failure_code / errors[].detail 로 표현한다.
    help_en: >-
      **Stage at which execution stopped** (not the root cause). Conditional field.
      reachable=target reachability step, port=management port check step,
      protocol=expected-protocol check step, auth=credential check step,
      gather=collection/normalization step after connectivity and auth passed,
      fallback=could not complete normal output construction.
      null=no failure, or overall failure stage not applicable.
      Whether the cause is confirmed is expressed by auth_success / failure_code / errors[].detail.

  diagnosis.failure_code:
    type: "string|null"
    enum: ["DNS_RESOLUTION_FAILED", "TCP_CONNECT_FAILED", "TCP_CONNECTION_REFUSED",
           "PROTOCOL_CHECK_FAILED", "AUTH_PROBE_FAILED", "CREDENTIAL_SET_UNAVAILABLE",
           "GATHER_FAILED", "OUTPUT_BUILD_FAILED"]
    priority: nice
    channel: [redfish, os, esxi]
    # 2026-08-10 (Phase 2) 신설. 외부 시스템이 실패 종류로 분기할 때 문자열 메시지를 파싱하지
    # 않도록 하는 **안정 식별자**. 정상 결과에서도 키는 존재하고 값만 null (shape 고정).
    # Raw Exception 종류(SOCKET_TIMEOUT / SSL_ERROR / HTTP_500 등)를 code 로 만들지 않는다 —
    # 그 정보는 errors[].detail 과 diagnosis.details 에 보존한다.
    #
    # 2026-08-12: CREDENTIAL_SET_UNAVAILABLE 추가 (additive — 기존 7 값의 의미 불변).
    #   Credential 선택이 Location 축을 갖게 되면서 "해당 Location/Vendor 의 credential set
    #   자체가 없어 인증을 시도조차 못 한" 상태가 생겼다. 이것을 AUTH_PROBE_FAILED 로 뭉개면
    #   소비 시스템이 두 상황을 구분할 수 없고, 운영자도 엉뚱한 곳(대상 장비 계정)을 뒤진다.
    #   이름을 NOT_FOUND 가 아니라 UNAVAILABLE 로 한 이유: 이 code 는 파일 부재뿐 아니라
    #   복호화 실패와 scope 미결정(미등록 Location 등)까지 포함한다. 파일을 찾았지만 열지
    #   못한 경우에 NOT_FOUND 는 사실과 다르다. 또 NOT_FOUND 는 HTTP 404 로 오독되기 쉬운데,
    #   이 저장소는 HTTP status 모양의 code 를 의도적으로 만들지 않는다(위 문단).
    help_ko: >-
      실패 종류의 안정 식별자. **conditional 필드** — status=failed 시만 채워짐.
      DNS_RESOLUTION_FAILED=주소 해석 실패로 TCP 연결 시도 자체를 못 함,
      TCP_CONNECT_FAILED=TCP 연결 실패 (timeout / no route 등. 장비 다운으로 확정하지 않음),
      TCP_CONNECTION_REFUSED=명시적 TCP 거부(RST)를 관측,
      PROTOCOL_CHECK_FAILED=기대한 프로토콜 응답 확인 실패,
      AUTH_PROBE_FAILED=자격증명을 실제로 보냈으나 확인 단계에서 중단 (인증 거부 확정은 auth_success 가 표현),
      CREDENTIAL_SET_UNAVAILABLE=해당 Location/대상의 자격증명 세트를 열 수 없어 **인증 미시도**
      (auth_success 는 항상 null. 조치는 대상 계정이 아니라 자격증명 배치 확인),
      GATHER_FAILED=연결·인증 통과 후 수집/정규화 실패,
      OUTPUT_BUILD_FAILED=정상 결과 객체 생성 실패 (fallback).
      기본 매핑은 failure_stage 와 1:1 이나, OS 채널의 포트 감지 실패만 예외로
      stage=port + code=TCP_CONNECT_FAILED 다 (wait_for 는 RST 를 관측하지 못하기 때문).
      CREDENTIAL_SET_UNAVAILABLE 도 stage=auth 다 — stage 는 원인이 아니라 멈춘 위치다.
    help_en: >-
      Stable identifier for the failure kind, for system-side branching without parsing
      human-readable messages. Conditional field (populated when status=failed).
      Raw exception kinds (socket timeout, SSL error, HTTP 500) are deliberately NOT codes;
      that detail stays in errors[].detail and diagnosis.details.
      AUTH_PROBE_FAILED means credentials were actually sent; CREDENTIAL_SET_UNAVAILABLE
      means no credential set could be opened, so authentication was never attempted
      (auth_success is always null there).
      Mapping to failure_stage is 1:1 except the OS port-detection path, which is
      stage=port with code=TCP_CONNECT_FAILED because wait_for cannot observe RST.

  # ══════════════════════════════════════════════════════════════════════════
  # Do Not Help (skip) — 의미가 자명하여 등록하되 설명은 최소한
  # ══════════════════════════════════════════════════════════════════════════

  "storage.physical_disks[].media_type":
    type: "string|null"
    enum: ["SSD", "HDD", "SCM"]
    priority: skip
    channel: [redfish, os, esxi]
    help_ko: "디스크 유형. SSD 또는 HDD."
    help_en: "Disk media type. SSD or HDD."

  "storage.physical_disks[].protocol":
    type: "string|null"
    enum: ["SATA", "SAS", "NVMe", "SCSI", "USB", "RAID", "iSCSI", "FibreChannel", "IDE", "SD", "MMC", "HDC", "1394"]
    priority: skip
    channel: [redfish, os, esxi]
    help_ko: "디스크 연결 프로토콜."
    help_en: "Disk connection protocol."

  cpu.architecture:
    type: "string|null"
    priority: skip
    # cycle 2026-06-15 (SCHEMA-05): redfish 도 cpu.architecture emit — normalize_standard.yml:503
    # (ProcessorArchitecture) + 5 redfish baseline 이 정본. channel 에 redfish 누락이던 것 정정.
    channel: [redfish, os, esxi]
    help_ko: "CPU 아키텍처 (예: x86_64)."
    help_en: "CPU architecture (e.g., x86_64)."

  system.hosting_type:
    type: "string"
    enum: ["virtual", "baremetal", "unknown", "hypervisor"]
    priority: must
    channel: [os, esxi]
    help_ko: >-
      호스팅 유형.
      virtual=가상머신(VMware/KVM/Hyper-V 등의 guest),
      baremetal=물리 서버에 직접 설치된 OS,
      unknown=판별 근거 부족 또는 신호 충돌,
      hypervisor=ESXi 채널 (호스트 자체가 하이퍼바이저).
      OS 채널은 OEM 제조사 목록 없이 판정한다 (Linux systemd-detect-virt / Windows HypervisorPresent+Hyper-V 역할, 2026-09-03).
    help_en: >-
      Hosting type.
      virtual=VM guest (VMware/KVM/Hyper-V etc.),
      baremetal=OS installed directly on physical server,
      unknown=insufficient evidence or conflicting signals,
      hypervisor=ESXi channel (the host itself is a hypervisor).
      OS channel decides without an OEM vendor list (Linux systemd-detect-virt / Windows HypervisorPresent + Hyper-V role, 2026-09-03).

  system.uptime_seconds:
    type: "integer|null"
    priority: skip
    channel: [os, esxi]
    help_ko: "서버 가동 시간 (초)."
    help_en: "Server uptime in seconds."

  "firmware[].updateable":
    type: "boolean"
    priority: skip
    channel: [redfish]
    help_ko: "펌웨어 업데이트 가능 여부."
    help_en: "Whether firmware is updateable."

  # ──────────────────────────────────────────────────────────────────────────
  # Group Summary — 단위용량 × 수량 × 그룹총량 (storage / network 그룹 단위 합계)
  # ──────────────────────────────────────────────────────────────────────────

  "cpu.summary":
    type: "object"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      CPU 그룹 summary. groups[]={model, sockets, cores_per_socket, total_cores}.
      같은 model 의 socket 들을 합쳐 보여준다 — 운영 가시성용.
    help_en: >-
      CPU group summary. groups[]={model, sockets, cores_per_socket, total_cores}.
      Aggregates sockets sharing the same model for operational visibility.

  "memory.summary":
    type: "object"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      메모리 그룹 summary. groups[]={unit_capacity_gb, type, quantity, group_total_gb}
      + grand_total_gb. 같은 단위 용량 DIMM 의 수량 + 총량 + 전체 총량.
    help_en: >-
      Memory group summary. groups[]={unit_capacity_gb, type, quantity, group_total_gb}
      + grand_total_gb. Quantity, group total, and grand total of DIMMs by capacity.

  "storage.summary":
    type: "object"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      디스크 그룹 summary. groups[]={unit_capacity_gb, media_type, protocol, quantity,
      group_total_gb} + grand_total_gb. 같은 단위 용량/미디어 디스크의 수량 + 총량.
    help_en: >-
      Disk group summary. groups[]={unit_capacity_gb, media_type, protocol, quantity,
      group_total_gb} + grand_total_gb. Quantity and totals by capacity/media.

  "network.summary":
    type: "object"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      NIC 그룹 summary. groups[]={speed_mbps, model, manufacturer, link_type, quantity, link_up_count}
      + adapter_count + port_count + primary_speed_mbps.
      주의 (NETAD-1): summary.port_count 는 host EthernetInterface(=network.interfaces) 수이며,
      network.ports[] 길이(NetworkPorts, FC 포함 물리 포트)와 다를 수 있다 — 동일시 금지.
    help_en: >-
      NIC group summary. groups[]={speed_mbps, model, manufacturer, link_type, quantity, link_up_count}
      + adapter_count + port_count + primary_speed_mbps.
      Note (NETAD-1): summary.port_count counts host EthernetInterfaces (=network.interfaces),
      which may differ from len(network.ports[]) (physical NetworkPorts incl. FC) — do not equate.

  # ──────────────────────────────────────────────────────────────────────────
  # NIC / HBA / InfiniBand 깊이 (어댑터 단위 / 포트 단위 정보)
  # ──────────────────────────────────────────────────────────────────────────

  "network.adapters[]":
    type: "object[]"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      NIC 카드 (NetworkAdapters) 정보. id/name/manufacturer/model/part_number/
      serial_number/firmware_version. ESXi 의 vmnic 도 포함.
    help_en: >-
      NIC card (NetworkAdapters) info. id/name/manufacturer/model/part_number/
      serial_number/firmware_version. Includes ESXi vmnic.

  "network.adapters[].firmware_version":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      NIC 펌웨어 버전.
      Redfish: NetworkAdapter.Controllers.FirmwarePackageVersion.
      OS(Linux): ethtool -i firmware-version (pci 매칭, 예: bnxt_en 229.2.52.0).
      가상 NIC / 미노출 드라이버는 null.
    help_en: >-
      NIC firmware version.
      Redfish: NetworkAdapter.Controllers.FirmwarePackageVersion.
      OS(Linux): ethtool -i firmware-version (matched by pci, e.g., bnxt_en 229.2.52.0).
      Null for virtual NICs / drivers not exposing it.

  "network.ports[]":
    type: "object[]"
    priority: nice
    channel: [redfish]
    help_ko: >-
      NIC port-level 정보. adapter_id/port_id/link_status/current_link_speed_mbps/
      port_type (Ethernet/FibreChannel/InfiniBand).
    help_en: >-
      NIC port-level info. adapter_id/port_id/link_status/current_link_speed_mbps/
      port_type (Ethernet/FibreChannel/InfiniBand).

  "network.virtual_switches[]":
    type: "object[]"
    priority: nice
    channel: [esxi]
    help_ko: "ESXi vSwitch 목록 (name/num_ports/mtu/pnics/portgroups)."
    help_en: "ESXi vSwitch list (name/num_ports/mtu/pnics/portgroups)."

  "network.driver_map[]":
    type: "object[]"
    priority: nice
    channel: [os]
    help_ko: >-
      Linux interface → driver / VLAN ID / bond master 매핑.
      /sys/class/net 기반 raw fallback.
    help_en: >-
      Linux interface → driver / VLAN id / bond master mapping.
      Sourced from /sys/class/net (raw fallback).

  # ──────────────────────────────────────────────────────────────────────────
  # network bonding / teaming / bridge 토폴로지 (cycle 2026-06-15 OS bond 보강)
  # ──────────────────────────────────────────────────────────────────────────

  "network.bonds[]":
    type: "object[]"
    priority: nice
    channel: [os]
    # Linux bond. python_ok(shell)·raw fallback 동일 수집 (filter_plugins/network_topology.py).
    # 소스: /sys/class/net/*/bonding + /proc/net/bonding + ip -d link (다중 소스 병합).
    # RHEL/Rocky/Alma/CentOS/Oracle/Ubuntu/Debian/SUSE 공통. bond 없으면 빈 [].
    help_ko: >-
      Linux 본딩 인터페이스 목록. 각 항목:
      name/mode/active_slave/primary/miimon/lacp_rate/xmit_hash_policy/ad_select/
      addresses(bond 자체 IP)/slaves[]. bond 없으면 빈 []. Windows 는 teams[] 사용.
    help_en: >-
      Linux bonding interfaces. Each:
      name/mode/active_slave/primary/miimon/lacp_rate/xmit_hash_policy/ad_select/
      addresses(bond's own IP)/slaves[]. Empty [] when no bond. Windows uses teams[].

  "network.bonds[].mode":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: >-
      본딩 모드 (balance-rr/active-backup/balance-xor/broadcast/802.3ad/
      balance-tlb/balance-alb). /sys/class/net/<bond>/bonding/mode.
    help_en: >-
      Bonding mode (balance-rr/active-backup/balance-xor/broadcast/802.3ad/
      balance-tlb/balance-alb). From /sys/class/net/<bond>/bonding/mode.

  "network.bonds[].slaves[]":
    type: "object[]"
    priority: nice
    channel: [os]
    help_ko: >-
      본딩 멤버(slave) NIC. 각 항목: name/state(active|backup)/mii_status/
      perm_hwaddr(물리 고유 MAC)/speed_mbps/link_failure_count/mtu/link_status.
    help_en: >-
      Bond member (slave) NICs. Each: name/state(active|backup)/mii_status/
      perm_hwaddr(physical MAC)/speed_mbps/link_failure_count/mtu/link_status.

  "network.teams[]":
    type: "object[]"
    priority: nice
    channel: [os]
    # Windows LBFO(Get-NetLbfoTeam) + SET(Get-NetSwitchTeam). team 없으면 빈 [].
    # Linux teamd 팀도 동일 키로 노출(드묾). bond(Linux)/team(Windows) 채널 키 일관.
    help_ko: >-
      Windows 팀(LBFO/SET) 목록. 각 항목:
      name/team_type(lbfo|set)/teaming_mode/load_balancing/lacp_timer/status/members[].
      팀 없으면 빈 []. Linux 본딩은 bonds[] 사용.
    help_en: >-
      Windows teams (LBFO/SET). Each:
      name/team_type(lbfo|set)/teaming_mode/load_balancing/lacp_timer/status/members[].
      Empty [] when none. Linux bonding uses bonds[].

  "network.bridges[]":
    type: "object[]"
    priority: nice
    channel: [os]
    help_ko: >-
      Linux 브리지 목록. 각 항목: name/members[](브리지 포트). 브리지 없으면 빈 [].
    help_en: >-
      Linux bridges. Each: name/members[] (bridge ports). Empty [] when none.

  "network.interfaces[].bond_role":
    type: "string|null"
    enum: ["master", "slave", null]
    priority: nice
    channel: [os]
    help_ko: >-
      이 인터페이스의 본딩 역할. master=bond 인터페이스(IP 보유),
      slave=물리 멤버 NIC(보통 IP 없음). 비본딩 NIC 는 키 부재(또는 null).
      Windows 는 team_role(master|member) 사용.
    help_en: >-
      Bonding role of this interface. master=bond interface (holds IP),
      slave=physical member NIC (usually no IP). Absent/null for non-bonded NICs.
      Windows uses team_role(master|member).

  "network.interfaces[].bond_master":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "이 slave NIC 이 속한 bond 이름. slave 가 아니면 키 부재."
    help_en: "Bond name this slave NIC belongs to. Absent when not a slave."

  "network.interfaces[].slave_state":
    type: "string|null"
    enum: ["active", "backup", null]
    priority: nice
    channel: [os]
    help_ko: >-
      bond 멤버 상태 (active|backup). 802.3ad 는 보통 전 멤버 active.
      ip -d link 의 bond_slave state 권위. slave 가 아니면 키 부재.
    help_en: >-
      Bond member state (active|backup). 802.3ad usually all active.
      Authoritative from `ip -d link`. Absent when not a slave.

  "network.interfaces[].bond_mode":
    type: "string|null"
    priority: nice
    channel: [os]
    # bond master 인터페이스에 인라인 노출 (bonds[].mode 와 동일값 — 편의용 미러).
    help_ko: "bond master 인터페이스의 본딩 모드 (bonds[].mode 미러). master 아니면 키 부재."
    help_en: "Bonding mode on the bond master interface (mirrors bonds[].mode). Absent otherwise."

  "network.interfaces[].active_slave":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "bond master 의 현재 active slave (bonds[].active_slave 미러). master 아니면 키 부재."
    help_en: "Current active slave of the bond master (mirrors bonds[].active_slave). Absent otherwise."

  "network.interfaces[].bond_slaves":
    type: "array of string"
    priority: nice
    channel: [os]
    help_ko: "bond master 의 멤버 NIC 이름 목록 (bonds[].slaves[].name 미러). master 아니면 키 부재."
    help_en: "Member NIC names of the bond master (mirrors bonds[].slaves[].name). Absent otherwise."

  # --- addresses[] alias/secondary 메타 (Linux OS, ip -j/-o addr · ifconfig 다중 소스) ---
  # 기존 5 키(family/address/prefix_length/subnet_mask/gateway)에 Additive 로 추가.
  # bonds[].addresses[] 도 동일 키 (bond master 인터페이스 addresses 미러).
  "network.interfaces[].addresses[].label":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: >-
      이 IP 의 ip addr label. alias 면 'bond1:1' 같은 'dev:N' 형태,
      일반 주소면 부모 인터페이스명(예: bond1).
      Windows 는 alias 라벨 개념이 없어 항상 인터페이스명.
    help_en: >-
      IP label from `ip addr`. For an alias this is the 'dev:N' form (e.g. 'bond1:1');
      for a normal address it is the parent interface name (e.g. bond1).
      Windows has no alias labels, so it is always the interface name.
  "network.interfaces[].addresses[].parent_interface":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: >-
      이 주소가 실제 바인딩된 인터페이스(ip 의 dev). bond alias(bond1:1)는
      별도 인터페이스가 아니라 parent bond 의 추가 IP 이므로 parent=bond1.
    help_en: >-
      Interface this address is actually bound to (the `ip` dev). A bond alias
      (bond1:1) is not a separate interface — it is an extra IP on the parent bond,
      so parent_interface=bond1.
  "network.interfaces[].addresses[].is_alias":
    type: "boolean|null"
    priority: nice
    channel: [os]
    help_ko: >-
      label 이 parent_interface 와 다르면 true (예: bond1:1). 일반 주소는 false.
      Windows 는 alias 라벨이 없어 항상 false.
    help_en: >-
      true when label differs from parent_interface (e.g. bond1:1); false for a normal address.
      Windows has no alias labels, so always false.
  "network.interfaces[].addresses[].scope":
    type: "string|null"
    enum: ["global", "link", "host", "site", null]
    priority: nice
    channel: [os, esxi]
    help_ko: >-
      주소 범위 (ip addr 의 scope). global=라우팅 가능, link=링크 로컬(IPv6 fe80::),
      host=호스트 로컬(loopback). 기존 IPv6 주소의 scope 와 동일 키.
    help_en: >-
      Address scope (from `ip addr`). global=routable, link=link-local (IPv6 fe80::),
      host=host-local (loopback). Same key already used for IPv6 addresses.
  "network.interfaces[].addresses[].is_secondary":
    type: "boolean|null"
    priority: nice
    channel: [os]
    help_ko: >-
      같은 서브넷 2번째+ IPv4 주소. 다른 서브넷 alias 는 secondary 가 아니므로 false.
      Linux 는 커널 secondary 플래그(ip addr) 직접 사용. Windows 는 커널 플래그 API 부재 →
      같은 인터페이스+같은 서브넷 2번째+ IPv4 로 controller-side 파생 (best-effort).
    help_en: >-
      2nd+ IPv4 address in the same subnet. A different-subnet alias is not a secondary, so false.
      Linux uses the kernel secondary flag (`ip addr`) directly; Windows lacks that kernel API and
      derives it controller-side (2nd+ IPv4 on the same interface+subnet, best-effort).
  "network.bonds[].addresses[].label":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "bond 자체 IP 의 label (bond master 인터페이스 addresses 미러). alias 면 'bondX:N'."
    help_en: "Label of the bond's own IP (mirrors the bond master interface addresses). 'bondX:N' for an alias."
  "network.bonds[].addresses[].parent_interface":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "bond 자체 IP 가 바인딩된 인터페이스(=bond 이름)."
    help_en: "Interface the bond's own IP is bound to (= the bond name)."
  "network.bonds[].addresses[].is_alias":
    type: "boolean|null"
    priority: nice
    channel: [os]
    help_ko: "bond 자체 IP 가 alias(bondX:N)면 true. primary 면 false."
    help_en: "true when the bond's own IP is an alias (bondX:N); false for the primary."
  "network.bonds[].addresses[].scope":
    type: "string|null"
    enum: ["global", "link", "host", "site", null]
    priority: nice
    channel: [os]
    help_ko: "bond 자체 IP 의 scope (global/link/host)."
    help_en: "Scope of the bond's own IP (global/link/host)."
  "network.bonds[].addresses[].is_secondary":
    type: "boolean|null"
    priority: nice
    channel: [os]
    help_ko: "bond 자체 IP 가 커널 secondary(같은 서브넷 2번째+ IPv4)면 true. 보통 false."
    help_en: "true when the bond's own IP is a kernel secondary (2nd+ IPv4 in the same subnet); usually false."

  "network.interfaces[].vlan_id":
    type: "integer|null"
    priority: nice
    channel: [os]
    help_ko: "VLAN 인터페이스의 VLAN ID (802.1Q). VLAN 아니면 키 부재."
    help_en: "VLAN ID (802.1Q) of a VLAN interface. Absent when not a VLAN."

  "network.interfaces[].vlan_parent":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "VLAN 의 부모 인터페이스 (예: bond0). VLAN 아니면 키 부재."
    help_en: "Parent interface of the VLAN (e.g. bond0). Absent when not a VLAN."

  "network.interfaces[].team_role":
    type: "string|null"
    enum: ["master", "member", null]
    priority: nice
    channel: [os]
    help_ko: >-
      Windows 팀 역할. master=팀 NIC(IP 보유), member=물리 멤버 NIC(IP 없음).
      비teamed NIC 는 키 부재. Linux 본딩은 bond_role 사용.
    help_en: >-
      Windows team role. master=team NIC (holds IP), member=physical member NIC.
      Absent for non-teamed NICs. Linux bonding uses bond_role.

  "network.interfaces[].team_master":
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "이 member NIC 이 속한 Windows 팀 이름. member 아니면 키 부재."
    help_en: "Windows team name this member NIC belongs to. Absent when not a member."

  "storage.hbas[]":
    type: "object[]"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      FC HBA 목록. wwpn/link_status/link_speed_gbps/port_type. Linux 는
      /sys/class/fc_host, Windows 는 Get-InitiatorPort, ESXi 는 vmware_host_vmhba_info,
      Redfish 는 NetworkPorts PortType=FibreChannel 분류.
    help_en: >-
      FC HBA list. wwpn/link_status/link_speed_gbps/port_type. Sources:
      Linux=/sys/class/fc_host, Windows=Get-InitiatorPort, ESXi=vmware_host_vmhba_info,
      Redfish=NetworkPorts PortType=FibreChannel classification.

  "storage.infiniband[]":
    type: "object[]"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      InfiniBand 어댑터 목록. node_guid/link_status/rate. 벤더/펌웨어 노출
      여부에 따라 빈 list 가능 (best-effort).
    help_en: >-
      InfiniBand adapter list. node_guid/link_status/rate. May be empty depending
      on vendor/firmware exposure (best-effort).

  # ── HBA / InfiniBand 서브필드 (cycle 2026-05-29 hba-ib-csus, Additive Nice) ──
  # 전 채널 통일 shape (canonical) — 호출자가 채널 무관하게 같은 키로 파싱.
  # source 필드로 출처 식별 (redfish / os / esxi). lab 부재 vendor 는 사이트 실측 시 정정.

  "storage.hbas[].wwpn":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      FC HBA World Wide Port Name. 소문자 colon-hex 8-octet 정규화
      (cross-channel 매칭 키). 미연결/미노출 시 null.
      Redfish=NetworkDeviceFunction.FibreChannel.WWPN, Linux=/sys/class/fc_host/*/port_name,
      Windows=Get-InitiatorPort.PortAddress, ESXi=vmhba port_wwn.
    help_en: >-
      FC HBA World Wide Port Name. Normalized lowercase colon-hex 8-octet
      (cross-channel match key). null when unlinked/unexposed.

  "storage.hbas[].wwnn":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      FC HBA World Wide Node Name. Lenovo/Supermicro/일부 OS 에서 null 가능.
    help_en: >-
      FC HBA World Wide Node Name. May be null (Lenovo/Supermicro/some OS).

  "storage.hbas[].port_type":
    type: "string"
    enum: ["FibreChannel", "FCoE", "iSCSI"]
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      HBA 포트 유형. Redfish 는 Port.PortProtocol / NetDevFuncType 에서 도출
      (PortType enum 아님 — FC/IB 값 없음). iSCSI 는 소프트/하드 initiator.
    help_en: >-
      HBA port type. Redfish derives from Port.PortProtocol / NetDevFuncType
      (NOT PortType enum — has no FC/IB members). iSCSI = soft/hw initiator.

  "storage.hbas[].link_speed_gbps":
    type: "number|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      FC 링크 협상 속도 (Gbps). 미연결/미노출 시 null (정상 — error 아님).
    help_en: >-
      Negotiated FC link speed (Gbps). null when unlinked/unexposed (normal, not an error).

  "storage.hbas[].source":
    type: "string"
    enum: ["redfish", "os", "esxi"]
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      이 HBA 항목의 수집 출처 채널. 동일 물리 HBA 가 여러 채널에서 보일 수 있어
      (Redfish + OS) 호출자가 wwpn 으로 cross-channel 상관 + source 로 출처 구분.
    help_en: >-
      Collection source channel for this HBA entry. Same physical HBA may appear
      across channels; callers correlate by wwpn and distinguish origin via source.

  "storage.infiniband[].node_guid":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      InfiniBand HCA Node GUID. Redfish=NetworkDeviceFunction.InfiniBand.NodeGUID,
      Linux=/sys/class/infiniband/*/node_guid. **Windows 는 표준 API 부재 → null**
      (날조 금지 — best-effort). ESXi 는 native IB 미노출 → null.
    help_en: >-
      InfiniBand HCA Node GUID. Redfish/Linux expose it; Windows has no standard
      API (null, best-effort); ESXi does not expose native IB (null).

  "storage.infiniband[].rate":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      IB 링크 속도 사람 표기 (예: "200 Gb/sec (4X HDR)"). 숫자 비교는 rate_gbps 사용.
    help_en: >-
      Human-readable IB link rate (e.g., "200 Gb/sec (4X HDR)"). Use rate_gbps for numeric.

  "storage.infiniband[].rate_gbps":
    type: "number|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      IB 링크 속도 숫자 (Gbps) — source-of-truth (200=HDR/NDR200, 400=NDR).
      rate 문자열에서 파싱 또는 Redfish CurrentSpeedGbps.
    help_en: >-
      Numeric IB link speed (Gbps) — source of truth (200=HDR/NDR200, 400=NDR).

  "storage.infiniband[].source":
    type: "string"
    enum: ["redfish", "os", "esxi"]
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      이 IB 항목의 수집 출처 채널. 표준 서버의 IB 정본은 OS 채널 (ibstat/sysfs);
      Redfish 는 NVIDIA BlueField BMC 등 한정. ESXi 는 nmlx NIC best-effort 추론.
    help_en: >-
      Collection source channel for this IB entry. OS channel (ibstat/sysfs) is the
      authoritative source for standard servers; Redfish limited to e.g. NVIDIA BlueField BMC.

  # ──────────────────────────────────────────────────────────────────────────
  # 운영 런타임 정보 (NTP / firewall / listening ports / swap)
  # ──────────────────────────────────────────────────────────────────────────

  "system.runtime":
    type: "object"
    priority: nice
    channel: [os, esxi]
    # cycle 2026-05-11 field-channel-refinement F5: OS channel 추가 (Linux + Windows 빌더 구현).
    # 9 필드 통일 shape (Linux/Windows/ESXi 동일):
    #   timezone(str) / ntp_active(bool) / ntp_synchronized(bool) /
    #   firewall_tool(str) / firewall_state(str) / listening_ports(str[]) /
    #   swap_total_mb(int) / swap_used_mb(int) / swap_free_mb(int)
    # Windows pagefile = Linux swap 등가 (swap_*_mb 로 표현 — Win32_PageFileUsage).
    # 정본 빌더:
    #   - os-gather/tasks/linux/gather_system.yml (raw 명령 — Python+raw fallback 양쪽)
    #   - os-gather/tasks/windows/gather_system.yml (Win32_PageFileUsage / Get-NetFirewallProfile)
    #   - esxi-gather (기존 — ESXi firewall 한정)
    help_ko: >-
      운영 런타임 정보. timezone, ntp_active/synchronized, firewall_tool/state,
      listening_ports[], swap_total/used/free_mb (9 필드 통일).
      Linux: firewalld/ufw/nftables/iptables 감지. Windows: windows_firewall + pagefile.
      ESXi: firewall_tool="esxi_firewall" 만 (런타임 상세 미수집).
      best-effort: 수집 불가 시 null/[].
    help_en: >-
      OS runtime info — 9 unified fields. timezone, ntp_active/synchronized,
      firewall_tool/state, listening_ports, swap_total/used/free_mb.
      Linux: firewalld/ufw/nftables/iptables detection. Windows: pagefile as swap_*_mb.
      ESXi: firewall_tool only (runtime detail not collected).
      Best-effort: null/[] when unavailable.

  # ──────────────────────────────────────────────────────────────────────────
  # cycle 2026-05-12 (ADR-2026-05-12) — RMC 멀티-노드 토폴로지
  # HPE CSUS 3200 / Superdome Flex 처럼 단일 진입점이 N개 Manager / N개 nPartition /
  # N개 Chassis 노출. adapter `vendor_notes.manager_layout` 정의 vendor 만 활성.
  # 기타 13 vendor 는 `data.multi_node = null` (Additive — envelope shape 변경 0).
  # ──────────────────────────────────────────────────────────────────────────

  "multi_node":
    type: "object|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      RMC 산하 멀티-노드 토폴로지 컨테이너. HPE CSUS 3200 / Superdome Flex 처럼 단일
      진입점이 N개 Manager / N개 nPartition / N개 Chassis 노출 환경에서 활성.
      adapter vendor_notes.manager_layout 미정의 vendor 는 null. 기존 data.system /
      data.bmc / ... 등 9 section path 는 Partition0 representative 로 유지 (Additive
      only — rule 92 R2).
    help_en: >-
      RMC multi-node topology container. Active for single-aggregated-controller
      environments like HPE CSUS 3200 / Superdome Flex. null when adapter
      vendor_notes.manager_layout not defined. Existing data.system/data.bmc/...
      paths retained as Partition0 representative (Additive only — rule 92 R2).

  "multi_node.enabled":
    type: "boolean"
    priority: nice
    channel: [redfish]
    help_ko: "멀티-노드 토폴로지 수집 활성 여부 (true / false / null)."
    help_en: "Multi-node topology collection enabled flag (true / false / null)."

  "multi_node.layout":
    type: "string|null"
    enum: [null, "rmc_primary", "rmc_primary_ilo_secondary"]
    priority: nice
    channel: [redfish]
    help_ko: >-
      Manager 토폴로지 레이아웃. rmc_primary = RMC 단일 진입점 (CSUS 3200).
      rmc_primary_ilo_secondary = RMC + 각 compute module iLO 5 보조 (Superdome Flex).
    help_en: >-
      Manager topology layout. rmc_primary = RMC sole entry (CSUS 3200).
      rmc_primary_ilo_secondary = RMC + per-compute-module iLO 5 secondary (Superdome Flex).

  "multi_node.summary":
    type: "object"
    priority: nice
    channel: [redfish]
    help_ko: >-
      partition_count / manager_count / chassis_count / representative_partition.
      호출자가 멀티-노드 규모 파악 시 사용.
    help_en: >-
      partition_count / manager_count / chassis_count / representative_partition.
      Used by callers to gauge multi-node scale.

  "multi_node.partitions[]":
    type: "object[]"
    priority: nice
    channel: [redfish]
    help_ko: >-
      Partition 별 system / cpu / memory / storage / network 수집 결과 리스트. 각
      entry: id (Partition0/Partition1) / system_uri / system / cpu / memory / storage / network.
    help_en: >-
      Per-partition collection results. Each entry: id / system_uri / system /
      cpu / memory / storage / network.

  "multi_node.managers[]":
    type: "object[]"
    priority: nice
    channel: [redfish]
    help_ko: >-
      Manager 별 bmc 수집 결과 리스트. 각 entry: id (RMC/PDHC0/Bay1.iLO5) / uri /
      role (primary/secondary) / bmc dict. bmc.name 은 라벨 분기 결과 (RMC / PDHC / iLO).
    help_en: >-
      Per-manager bmc results. Each entry: id (RMC/PDHC0/Bay1.iLO5) / uri /
      role (primary/secondary) / bmc dict. bmc.name reflects label classification.

  "multi_node.chassis[]":
    type: "object[]"
    priority: nice
    channel: [redfish]
    help_ko: >-
      Chassis 별 hardware/power 수집 결과 리스트. 각 entry: id / uri / kind
      (base/expansion/compute_module) / chassis_type / manufacturer / model /
      serial_number / part_number / power.
    help_en: >-
      Per-chassis hardware/power results. Each entry: id / uri / kind / chassis_type /
      manufacturer / model / serial_number / part_number / power.

  "diagnosis.details.credential_scope":
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    # 2026-08-12 신설. Credential 선택이 Location 축을 갖게 되면서(vault/<loc>/...),
    #   실패했을 때 **어떤 자격증명 세트를 열었는지** 를 결과만 보고 알 수 있어야 한다.
    #   종전에는 그 정보가 envelope 어디에도 없어, 자격증명 배치 문제인지 대상 계정
    #   문제인지 구분하려면 Jenkins 콘솔 로그를 봐야 했다.
    #   top-level 13 필드는 건드리지 않는다 — details 는 기술 evidence / 확장 metadata
    #   영역이다 (CLAUDE.md §11).
    #   **Secret 이 아니다**: location / channel / vendor 조합 문자열뿐이며 username /
    #   password / 파일 내용은 어떤 형태로도 포함되지 않는다.
    help_ko: >-
      사용된 자격증명 세트의 범위 식별자. 형식은 `<location>/<channel>[/<os_type|vendor>]`
      (예: ic/os/linux, ic/esxi, ic/redfish/dell). 범위를 결정하지 못한 경우 null.
      경로/범위 정보일 뿐이며 계정 정보는 포함하지 않는다.
      실패 진단 시 "자격증명 배치 문제" 와 "대상 계정 문제" 를 가르는 단서로 쓴다.
    help_en: >-
      Scope identifier of the credential set used, formatted as
      `<location>/<channel>[/<os_type|vendor>]` (e.g. ic/os/linux, ic/redfish/dell);
      null when the scope could not be determined. Contains no account material —
      only the selection axes. Use it to tell credential-placement problems apart
      from target-account problems.

  "diagnosis.details.recovery_credential_scope":
    type: "string|null"
    priority: nice
    channel: [redfish]
    # 2026-08-12 신설 (Redfish 전용). 표준 수집 계정과 복구 계정은 **선택축이 다르다**:
    #   표준  = 전역 1개          → credential_scope        = common/redfish/standard
    #   복구  = location + vendor → recovery_credential_scope = <loc>/redfish/<vendor>
    #   한 필드에 담으면 "무엇으로 수집했는지" 와 "무엇으로 복구를 시도했는지" 가 섞인다.
    #   실제로 그 혼동 때문에 복구 계정으로 수집한 결과가 정상 결과로 나가고 있었다.
    #   OS / ESXi 에는 복구 개념 자체가 없어 이 필드가 나타나지 않는다.
    #   **Secret 이 아니다**: location / vendor 조합 문자열뿐이다.
    help_ko: >-
      표준 수집 계정 복구에 사용할 자격증명 세트의 범위 식별자 (Redfish 전용).
      형식은 `<location>/redfish/<vendor>` (예: ic/redfish/dell). vendor 를 식별하지
      못했거나 복구 세트를 정하지 못하면 null. 수집 자체는 `credential_scope`(표준 계정)
      로 수행되며, 이 값은 복구 경로에만 쓰인다. 계정 정보는 포함하지 않는다.
    help_en: >-
      Scope identifier of the recovery credential set (Redfish only), formatted as
      `<location>/redfish/<vendor>` (e.g. ic/redfish/dell); null when the vendor is
      unidentified or no recovery scope could be determined. Gathering itself always
      uses the standard account in `credential_scope`; this scope is used only to
      create or repair that standard account. Contains no account material.

  "diagnosis.details.hostname_source":
    type: "string"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: >-
      hostname 출처 (2026-06-16). system = System.HostName/fqdn(OS 호스트명) / bmc =
      BMC NetworkProtocol.HostName(관리 컨트롤러 이름, OS 호스트명 아님) / none = 둘 다 없어
      hostname=null. 호출자가 hostname 을 OS 호스트명으로 단정하면 안 되는지 판단용.
    help_en: >-
      Origin of hostname (2026-06-16). system = System.HostName/fqdn (OS hostname) / bmc =
      BMC NetworkProtocol.HostName (management-controller name, not the OS hostname) / none =
      neither present, hostname=null. Lets callers know whether hostname is a true OS name.

  "diagnosis.details.multi_node_layout":
    type: "string|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      adapter vendor_notes.manager_layout 값 노출. 호출자가 multi_node 활성 여부를
      diagnosis 만으로 확인 가능.
    help_en: >-
      Mirrors adapter vendor_notes.manager_layout. Allows callers to detect
      multi-node activation from diagnosis without inspecting data.multi_node.

  "diagnosis.details.rmc_activation_check":
    type: "boolean|null"
    priority: nice
    channel: [redfish]
    help_ko: >-
      RMC Redfish API 활성화 검사 결과. manager_layout=rmc_* 환경에서 collect 성공
      시 true / 실패 시 false / 비-RMC 환경 시 null. HPE community 7200359 같은
      사이트 RMC 비활성 / 라이선스 부재 사고 진단 hint.
    help_en: >-
      RMC Redfish API activation check. true on success / false on failure under
      manager_layout=rmc_* / null for non-RMC environments. Diagnostic hint for
      site RMC deactivation cases (cf. HPE community 7200359).

  # ── 2026-09-03 OS/ESXi 전수 검수 후속 — 선언 없이 emit 되던 필드 / 의미가 채널마다 달랐던 필드 ──
  system.hostname:
    type: "string|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      짧은 호스트명 (첫 라벨). Linux uname -n / Windows COMPUTERNAME(DNSHostName) /
      ESXi dnsConfig.hostName / Redfish System.HostName. 장비가 제공하지 않으면 null —
      IP 로 대체하지 않는다. envelope.hostname 1순위 후보.
    help_en: >-
      Short host name (first label). Linux uname -n / Windows COMPUTERNAME / ESXi dnsConfig.hostName /
      Redfish System.HostName. null when the target does not provide one — never the IP.
      First candidate for envelope.hostname.

  system.fqdn:
    type: "string|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      hostname + 설정된 도메인 (Linux hostname -d / uname -n 의 도메인부, Windows AD 도메인 또는 기본 DNS 접미사,
      ESXi dnsConfig.domainName). 도메인이 없으면 null. resolver(getfqdn) 결과가 아니다 (2026-09-03 통일).
    help_en: >-
      hostname + configured domain (Linux hostname -d / domain part of uname -n, Windows AD domain or primary
      DNS suffix, ESXi dnsConfig.domainName). null when no domain is configured. Not a resolver (getfqdn) result.

  system.vendor:
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "시스템 제조사 원문 (DMI sys_vendor / Win32_ComputerSystem.Manufacturer). hardware.vendor 와 같은 값. 센티널(System manufacturer 등)은 null."
    help_en: "Raw system vendor (DMI sys_vendor / Win32_ComputerSystem.Manufacturer). Same as hardware.vendor. Placeholders (e.g. 'System manufacturer') become null."

  cpu.manufacturer:
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: "CPU 제조사 정규화값 (Intel / AMD). Linux /proc/cpuinfo vendor_id, Windows Win32_Processor.Manufacturer, ESXi cpuPkg.vendor 또는 브랜드 문자열."
    help_en: "Normalized CPU manufacturer (Intel / AMD). Linux /proc/cpuinfo vendor_id, Windows Win32_Processor.Manufacturer, ESXi cpuPkg.vendor or brand string."

  cpu.max_speed_mhz:
    type: "integer|null"
    priority: must
    channel: [redfish, os, esxi]
    help_ko: >-
      정격(base) 클럭 MHz — 3채널 공통 정의 (2026-09-03). Linux cpufreq base_frequency → 브랜드 문자열 "@ N.NNGHz",
      Windows Win32_Processor.MaxClockSpeed, ESXi cpuInfo.hz, Redfish Processor.MaxSpeedMHz(벤더 보고값).
      터보 최대 클럭은 cpu.turbo_max_mhz. 종전 Linux 는 lscpu 'CPU max MHz'(터보) 를 냈다.
    help_en: >-
      Rated (base) clock in MHz — one definition across channels (2026-09-03). Linux cpufreq base_frequency
      then brand string "@ N.NNGHz", Windows Win32_Processor.MaxClockSpeed, ESXi cpuInfo.hz, Redfish
      Processor.MaxSpeedMHz (vendor reported). Turbo max is cpu.turbo_max_mhz.

  cpu.turbo_max_mhz:
    type: "integer|null"
    priority: nice
    channel: [os, esxi]
    help_ko: "터보/부스트 최대 클럭 MHz. Linux lscpu 'CPU max MHz' / cpufreq cpuinfo_max_freq. Windows/ESXi 는 API 가 제공하지 않아 null."
    help_en: "Turbo/boost max clock in MHz. Linux lscpu 'CPU max MHz' / cpufreq cpuinfo_max_freq. null on Windows/ESXi (not exposed by the API)."

  cpu.summary.groups[].l2_cache_kb:
    type: "integer|null"
    priority: nice
    channel: [os]
    help_ko: "소켓당 L2 캐시 KB (2026-09-03 통일). Linux lscpu '(N instances)' 표기는 인스턴스 합계를 소켓 수로 나눈다. 0 이나 미보고는 null."
    help_en: "L2 cache per socket in KB (unified 2026-09-03). Linux lscpu '(N instances)' totals are divided by socket count. 0 or unreported is null."

  cpu.summary.groups[].l3_cache_kb:
    type: "integer|null"
    priority: nice
    channel: [os]
    help_ko: "소켓당 L3 캐시 KB. Linux lscpu '(N instances)' 합계는 소켓 수로 나누고, 구버전 lscpu 는 값 그대로(소켓당). fallback /proc/cpuinfo cache size."
    help_en: "L3 cache per socket in KB. Linux lscpu '(N instances)' totals are divided by socket count; older lscpu already reports per socket. Fallback /proc/cpuinfo cache size."

  network.interfaces[].description:
    type: "string|null"
    priority: nice
    channel: [os]
    help_ko: "Windows InterfaceDescription (예: 'vmxnet3 Ethernet Adapter #2'). id/name 은 어댑터 이름이다 (2026-09-03 — 종전 id 가 이 설명 문자열이었다)."
    help_en: "Windows InterfaceDescription (e.g. 'vmxnet3 Ethernet Adapter #2'). id/name are the adapter name (2026-09-03 — id used to carry this string)."

  network.interfaces[].mac:
    type: "string|null"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: "MAC 주소 — 소문자 colon 6 octet (aa:bb:cc:dd:ee:ff) 로 정규화 (normalize_mac, 2026-09-03). 전부 0 이면 null."
    help_en: "MAC address normalized to lowercase colon-separated 6 octets (normalize_mac, 2026-09-03). All-zero becomes null."

  network.dns_servers:
    type: "string[]"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: "설정된 DNS 서버 주소 목록 (IPv4/IPv6). Linux resolv.conf(systemd-resolved 포함), Windows Get-DnsClientServerAddress, ESXi dnsConfig.address."
    help_en: "Configured DNS server addresses (IPv4/IPv6). Linux resolv.conf (incl. systemd-resolved), Windows Get-DnsClientServerAddress, ESXi dnsConfig.address."

  network.default_gateways:
    type: "object[]"
    priority: nice
    channel: [redfish, os, esxi]
    help_ko: "기본 게이트웨이 목록 [{family, address}]. Linux ip route default, Windows Get-NetRoute 0.0.0.0/0 및 ::/0, ESXi ipRouteConfig.defaultGateway(+ipV6DefaultGateway). is_primary 인터페이스의 addresses[].gateway 와 같은 값."
    help_en: "Default gateways [{family, address}]. Linux ip route default, Windows Get-NetRoute 0.0.0.0/0 and ::/0, ESXi ipRouteConfig.defaultGateway (+ipV6DefaultGateway). Same value as addresses[].gateway on the primary interface."

  system.runtime.firewall_state:
    type: "string|null"
    enum: ["active", "inactive"]
    priority: nice
    channel: [os, esxi]
    help_ko: "방화벽 상태 — active / inactive / null (조회 실패). Linux firewalld/ufw/nftables/iptables, Windows 프로필 중 하나라도 Enabled, ESXi ruleset enabled. 종전 도구별 원문(running / enabled)을 통일 (2026-09-03)."
    help_en: "Firewall state — active / inactive / null (query failed). Linux firewalld/ufw/nftables/iptables, Windows any profile Enabled, ESXi ruleset enabled. Tool-specific raw values (running / enabled) unified 2026-09-03."

  system.runtime.ntp_active:
    type: "boolean|null"
    priority: nice
    channel: [os, esxi]
    help_ko: "시간 동기화 서비스 실행 여부 (Linux timedatectl NTP / chronyd·ntpd·systemd-timesyncd, Windows W32Time, ESXi ntpd). 조회 실패는 null."
    help_en: "Whether the time sync service is running (Linux timedatectl NTP / chronyd, ntpd, systemd-timesyncd, Windows W32Time, ESXi ntpd). null when the query failed."

  system.runtime.ntp_synchronized:
    type: "boolean|null"
    priority: nice
    channel: [os, esxi]
    help_ko: "시계가 실제로 동기화됐는지 (Linux timedatectl NTPSynchronized, Windows w32tm /query /source 가 외부 원본). ESXi 는 vSphere API 가 알려주지 않아 항상 null (2026-09-03 — 종전 ntpd 실행 여부를 잘못 냈다)."
    help_en: "Whether the clock is actually synchronized (Linux timedatectl NTPSynchronized, Windows w32tm /query /source is an external source). Always null on ESXi — the vSphere API does not expose it (2026-09-03)."

  system.runtime.ntp_servers:
    type: "string[]"
    priority: nice
    channel: [esxi]
    help_ko: "ESXi 에 설정된 NTP 서버 목록 (vmware_host_ntp_info). Additive."
    help_en: "NTP servers configured on ESXi (vmware_host_ntp_info). Additive."
