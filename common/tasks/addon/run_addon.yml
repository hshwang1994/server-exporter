---

- name: "addon | locate"
  ansible.builtin.set_fact:
    _addon_dir: "{{ lookup('env', 'ADDON_DIR') }}"
    _addon_data_out: {}
    _addon_errors_out: []

- name: ADDON_START
  ansible.builtin.set_fact:
    _addon_phase: started
  when: _addon_dir | length > 0

- name: "addon | record missing add-on"
  when:
    - _addon_dir | length > 0
    - not ((_addon_dir ~ '/tasks/main.yml') is file)
  block:
    - name: "addon | missing add-on error"
      ansible.builtin.set_fact:
        _addon_errors_out:
          - section: addon
            message: "추가 수집 구성을 찾지 못해 추가 수집을 실행하지 않았습니다. 추가 수집 설치 경로를 확인하세요."
            detail: "ADDON_DIR={{ _addon_dir }}; cause=addon_entry_not_found"

- name: "addon | run"
  when:
    - _addon_dir | length > 0
    - (_addon_dir ~ '/tasks/main.yml') is file
  ignore_unreachable: true
  block:
    - name: "addon | reset result"
      ansible.builtin.set_fact:
        _addon_result: {}
        _addon_errors: []

    - name: "addon | include add-on"
      ansible.builtin.include_role:
        name: "{{ _addon_dir }}"

    - name: "addon | result"
      ansible.builtin.set_fact:
        _addon_data_out: >-
          {{ {'addon': _addon_result} if (_addon_result | default({}) | length > 0) else {} }}
        _addon_errors_out: >-
          {{ [{'section': 'addon',
               'message': '추가 수집 중 처리하지 못한 항목이 있습니다. 추가 수집 설정과 수집 로그를 확인하세요.',
               'detail': _addon_errors | join(' | ')}]
             if (_addon_errors | default([]) | length > 0) else [] }}

  rescue:
    - name: "addon | failure"
      ansible.builtin.set_fact:
        _addon_data_out: {}
        _addon_errors_out:
          - section: addon
            message: "추가 수집 중 오류가 발생했습니다. 추가 수집 설정과 수집 로그를 확인하세요."
            detail: >-
              {{ 'cause=addon_failed; task=' ~ (ansible_failed_task.name | default('')) ~ '; '
                 ~ (ansible_failed_result.msg | default('') | string) }}

- name: "addon | combine guard"
  when: _addon_dir | length > 0
  block:
    - name: "addon | combine into output"
      ansible.builtin.set_fact:
        _output: >-
          {{ _output | combine({
               'data':   (((_output.data | default({})) if ((_output.data | default({})) is mapping) else {})
                          | combine(_addon_data_out | default({}))),
               'errors': ((_output.errors | default([])) + (_addon_errors_out | default([]) | normalize_errors)),
               'meta':   (((_output.meta | default({})) if ((_output.meta | default({})) is mapping) else {})
                          | combine({
                              'finished_at': now(utc=true).isoformat() + 'Z',
                              'duration_ms': ((now(utc=true).timestamp()
                                               - (_started_epoch | default(now(utc=true).timestamp()) | float)) * 1000) | int
                            }))
             }) }}
      when:
        - _addon_dir | length > 0
        - _output is defined
        - _output is mapping

  rescue:
    - name: "addon | combine failure"
      ansible.builtin.set_fact:
        _output: >-
          {{ _output | combine({
               'errors': ((_output.errors | default([])) + [{
                   'section': 'addon',
                   'message': '추가 수집 결과를 기본 결과에 합치지 못했습니다. 기본 수집 결과는 그대로입니다.',
                   'detail': ('cause=addon_combine_failed; ' ~ (ansible_failed_result.msg | default('') | string))[:2000]
                 }])
             }) }}
      when:
        - _output is defined
        - _output is mapping

- name: ADDON_DONE
  ansible.builtin.set_fact:
    _addon_phase: done
  when: _addon_dir | length > 0
