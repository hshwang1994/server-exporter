---
# common/tasks/addon/run_addon.yml
#
# 고객별 추가 수집(Add-on)을 부르는 범용 hook. 각 채널 site.yml 이 **조립(build_*)과 CHECKPOINT 뒤**, OUTPUT 앞에서 include 한다.
# Add-on 은 별도 디렉터리의 Ansible role 이고, 인증 · 연결이 끝난 상태에서 그 연결을 그대로 쓴다.
#
# 2026-10-03 (Plan §6-1 D8): 종전에는 조립 **앞**에서 fragment 를 만들어 merge_fragment 로 합쳤다. 그러면 Add-on 도중
# 강제 종료되는 host 는 이미 모은 기본 수집 결과까지 잃었다. 지금은 조립이 끝난 `_output` 을 콜백이 CHECKPOINT 로 보존한
# 뒤 Add-on 을 돌리고, 결과를 `_output` 의 세 곳(data.addon · errors[] 1건 · meta.finished_at/duration_ms)에만 결합한다.
# status · sections · diagnosis 는 CHECKPOINT 값 그대로다. 콜백은 `ADDON_START` / `ADDON_DONE` 태스크 이름으로 진행
# 이벤트를 남겨, OUTPUT 이 없는 host 를 복원할 때 "Add-on 중 중단" 과 "조립 뒤 emit 실패" 를 구분한다.
#
# 넘기는 값   : ADDON_DIR(환경변수), _addon_target(linux | windows | esxi | redfish), se_host_input(hostvar).
#               Add-on 은 _merged_data.system.hostname 도 읽는다 — 이 이름이 바뀌면 Add-on 의 hosts · when.hostname_contains 가 조용히 꺼진다.
# 돌려받는 값 : _addon_result(dict → data.addon), _addon_errors(list → errors[] 1건). 이 두 변수만 읽는다.
#
# Add-on 이 무엇을 하든 status · sections · diagnosis 는 바뀌지 않는다 — 조립이 끝난 뒤에 돌고, 실패는 rescue 가 errors[]
# 1건으로 가둔다. role 안 태스크 하나하나에 `timeout`(기본 300 s, `_addon_task_timeout`)을 건다 — hang 한 태스크 하나를 끊는
# 장치이지 role 전체 · loop 누적 상한이 아니다 (Plan §6-3). 전체 제한은 Jenkins Gather 단계의 예산이 맡는다.
# 계약: docs/develop/07-addon-hook.md

- name: "addon | locate"
  ansible.builtin.set_fact:
    _addon_dir: "{{ lookup('env', 'ADDON_DIR') }}"
    _addon_data_out: {}
    _addon_errors_out: []

# 콜백 진행 이벤트 — 이름 완전일치(callback_plugins/json_only.py). 비용은 host 당 set_fact 1회다.
- name: ADDON_START
  ansible.builtin.set_fact:
    _addon_phase: started
  when: _addon_dir | length > 0

- name: "addon | record missing add-on"
  when:
    - _addon_dir | length > 0
    - not ((_addon_dir ~ '/tasks/main.yml') is file)
  block:
    - name: "addon | missing add-on error"
      ansible.builtin.set_fact:
        _addon_errors_out:
          - section: addon
            message: "추가 수집 구성을 찾지 못해 추가 수집을 실행하지 않았습니다. 추가 수집 설치 경로를 확인하세요."
            detail: "ADDON_DIR={{ _addon_dir }}; cause=addon_entry_not_found"

- name: "addon | run"
  when:
    - _addon_dir | length > 0
    - (_addon_dir ~ '/tasks/main.yml') is file
  # 연결이 끊긴 호스트는 block/rescue 를 건너뛰고 play 에서 빠진다. Add-on 도중 끊겨도 이미
  # 모은 기본 수집 결과를 잃지 않도록 호스트를 유지한다 (try_one_credential.yml 과 같은 이유).
  ignore_unreachable: true
  block:
    - name: "addon | reset result"
      ansible.builtin.set_fact:
        _addon_result: {}
        _addon_errors: []

    - name: "addon | include add-on"
      ansible.builtin.include_role:
        name: "{{ _addon_dir }}"
        apply:
          # role 안 **태스크 각각**의 상한. 발동하면 그 태스크가 실패해 아래 rescue 로 온다 (2026-10-03 WSL 실측:
          # include_role apply.timeout 은 task 단위로 적용된다). 원격 자식 프로세스는 남을 수 있다 — Add-on 자체의 명령별 제한이 1차다.
          timeout: "{{ _addon_task_timeout | default(300) | int }}"

    - name: "addon | result"
      ansible.builtin.set_fact:
        _addon_data_out: >-
          {{ {'addon': _addon_result} if (_addon_result | default({}) | length > 0) else {} }}
        _addon_errors_out: >-
          {{ [{'section': 'addon',
               'message': '추가 수집 중 처리하지 못한 항목이 있습니다. 추가 수집 설정과 수집 로그를 확인하세요.',
               'detail': _addon_errors | join(' | ')}]
             if (_addon_errors | default([]) | length > 0) else [] }}

  rescue:
    - name: "addon | failure"
      ansible.builtin.set_fact:
        _addon_data_out: {}
        _addon_errors_out:
          - section: addon
            message: "추가 수집 중 오류가 발생했습니다. 추가 수집 설정과 수집 로그를 확인하세요."
            detail: >-
              {{ 'cause=addon_failed; task=' ~ (ansible_failed_task.name | default('')) ~ '; '
                 ~ (ansible_failed_result.msg | default('') | string) }}

# 조립된 _output 에 결합한다. 손대는 곳은 data.addon · errors[] · meta.finished_at/duration_ms 뿐이다 —
# status · sections · diagnosis · 기존 data 는 CHECKPOINT 값 그대로. errors 는 build_errors 와 같은 normalize_errors 필터를
# 거친다 (detail 2000자 절단 등 같은 규칙). finished_at/duration_ms 는 Add-on 시간까지 포함한 값으로 갱신한다.
- name: "addon | combine into output"
  ansible.builtin.set_fact:
    _output: >-
      {{ _output | combine({
           'data':   (((_output.data | default({})) if ((_output.data | default({})) is mapping) else {})
                      | combine(_addon_data_out | default({}))),
           'errors': ((_output.errors | default([])) + (_addon_errors_out | default([]) | normalize_errors)),
           'meta':   (((_output.meta | default({})) if ((_output.meta | default({})) is mapping) else {})
                      | combine({
                          'finished_at': now(utc=true).isoformat() + 'Z',
                          'duration_ms': ((now(utc=true).timestamp()
                                           - (_started_epoch | default(now(utc=true).timestamp()) | float)) * 1000) | int
                        }))
         }) }}
  when:
    - _addon_dir | length > 0
    - _output is defined
    - _output is mapping

- name: ADDON_DONE
  ansible.builtin.set_fact:
    _addon_phase: done
  when: _addon_dir | length > 0
