---

- name: "normalize | resolve vendor | load aliases"
  ansible.builtin.set_fact:
    _rv_aliases: "{{ lookup('file', lookup('env','REPO_ROOT') ~ '/common/vars/vendor_aliases.yml') | from_yaml }}"
  no_log: true

- name: "normalize | resolve vendor"
  ansible.builtin.set_fact:
    _out_vendor: >-
      {%- set hw = ((_merged_data | default({})).hardware | default({}, true)) or {} -%}
      {%- set raw = hw.vendor | default(none) -%}
      {%- set raw_s = (raw | string | trim) if raw is not none else '' -%}
      {%- set canon = (raw_s | canonical_vendor(_rv_aliases.vendor_aliases | default({}))) if raw_s else 'unknown' -%}
      {%- set disp = _rv_aliases.vendor_output_display | default({}) -%}
      {%- set hyp = {'vmware': ['vmware'], 'qemu': ['qemu', 'kvm', 'red hat'], 'microsoft': ['microsoft'], 'xen': ['xen']} -%}
      {%- if canon != 'unknown' -%}{{ disp.get(canon, canon) }}
      {%- else -%}
        {%- set ns = namespace(v=none) -%}
        {%- for k, sigs in hyp.items() -%}
          {%- for s in sigs -%}
            {%- if ns.v is none and s in (raw_s | lower) -%}{%- set ns.v = k -%}{%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {{ ns.v }}
      {%- endif -%}
  no_log: true
