---
# common/tasks/normalize/build_output.yml
#
# 누적된 fragment 와 공통 빌더 결과로 최종 _output 을 조립한다.
# 항상 가장 마지막에 호출한다.
#
# 사전 호출 필요:
#   build_sections.yml → _norm_sections
#   build_status.yml   → _out_status
#   build_errors.yml   → _norm_errors
#
# 입력 변수:
#   _out_target_type       : str
#   _out_collection_method : str
#   _out_ip                : str
#   _out_vendor            : str|null
#   _out_status            : str
#   _norm_sections         : dict
#   _norm_errors           : list
#   _merged_data           : dict — merge_fragment 누적 결과
#
# 출력 변수:
#   _output : dict — 최종 표준 JSON (OUTPUT 태스크로 방출)

# 2026-08-12 (H12 / N96): status=failed 인데 diagnosis.failure_* 가 전부 null 인
# envelope 이 **정상 경로**로 만들어지던 구멍을 막는다.
#   경로: build_sections 의 '미분류 → failed' 분기 또는 supported 섹션 0건 / success 0건
#         → build_status 가 _out_status='failed' → 그런데 이 경로는 rescue 가 아니라
#         정상 build_output 을 지나므로 성공 경로 diagnosis(failure_* 전부 null)가 그대로 실렸다.
#   CLAUDE.md §9 "실패인데 failure_reason=null 인 Result 를 만들지 않는다" 위반.
#
# 여기서만 채운다 (3채널 최종 조립이 이 파일 하나로 수렴하므로 site.yml 4곳에 복제하지 않는다).
# 값 근거: 이 지점에 도달했다 = precheck 를 통과하고 수집까지 진행했다 → 멈춘 단계는 gather.
#   예외 없이 끝났는데 성공 섹션이 0개라는 뜻이므로 문장은 gather_no_data 다 (2026-09-21).
#   precheck 가 이미 사유를 채웠으면(정상적으로는 여기 도달 불가) 건드리지 않는다.
#   auth_success 는 손대지 않는다 — 인증 거부를 관측한 근거가 없다.
- name: "normalize | build_output | ensure failed diagnosis"
  ansible.builtin.set_fact:
    _diagnosis: >-
      {{ {'reachable': none, 'port_open': none, 'protocol_supported': none,
          'auth_success': none, 'failure_stage': none, 'failure_code': none,
          'failure_reason': none, 'details': {}}
         | combine((_diagnosis | default({}, true))
                   if ((_diagnosis | default({}, true)) is mapping) else {})
         | combine({'failure_stage':  'gather',
                    'failure_code':   'GATHER_FAILED',
                    'failure_reason': _fr_catalog.gather_no_data.default}) }}
  when:
    - (_out_status | default('')) == 'failed'
    - ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

# 2026-10-13 (H12 후속): 위 guard 가 문장을 채워도 `_norm_errors` 는 섹션 오류 그대로라 errors[0].message ≠ failure_reason 이었다.
#   Portal 실패 Grid 는 errors[].message 를 읽고, 계약은 "failed 봉투의 첫 원소는 대표 사유이며 message 는 diagnosis.failure_reason 과
#   같다" (schema/field_dictionary.yml errors[] · docs/contract/03-fields.md 4-1 · 04). rescue 경로(build_failed_output.yml)와 같은
#   규칙으로 대표 오류를 errors[0] 에 두고 섹션 오류는 뒤에 보존한다 — 완전히 같은 원소만 제외 · 상한 10 · 절단 표시.
#   errors[0].message 가 이미 그 문장이면 아무것도 하지 않는다 (멱등). 채널 표시는 rescue 와 같다(<linux|windows|esxi|redfish>_gather).
#   detail 에는 섹션 결과만 적는다 (비밀 · 원격 출력 없음). 문장은 여기서 새로 정의하지 않는다 — diagnosis.failure_reason 을 그대로 복사한다.
- name: "normalize | build_output | ensure representative error"
  vars:
    _bo_diag: "{{ (_diagnosis | default({}, true)) if ((_diagnosis | default({}, true)) is mapping) else {} }}"
    _bo_reason: "{{ (_bo_diag.failure_reason | default('', true)) | string | trim }}"
    _bo_errors: "{{ ((_norm_errors | default([])) if ((_norm_errors | default([])) is not string) else []) | normalize_errors }}"
    _bo_sections: "{{ _norm_sections if ((_norm_sections | default(none)) is mapping) else {} }}"
    _bo_rep:
      section: "{{ (_os_type | default(_out_target_type | default('gather', true), true)) ~ '_gather' }}"
      message: "{{ _bo_reason }}"
      detail: >-
        {%- set supported = [] -%}
        {%- set failed = [] -%}
        {%- for s, v in _bo_sections.items() -%}
          {%- if v != 'not_supported' -%}{%- set _ = supported.append(s) -%}{%- endif -%}
          {%- if v == 'failed' -%}{%- set _ = failed.append(s) -%}{%- endif -%}
        {%- endfor -%}
        {{ 'success_sections=0; supported=' ~ ((supported | join(',')) if supported else '(none)')
           ~ '; failed=' ~ ((failed | join(',')) if failed else '(none)') }}
  ansible.builtin.set_fact:
    _norm_errors: >-
      {%- set merged = [_bo_rep] + (_bo_errors | reject('equalto', _bo_rep) | list) -%}
      {%- set shown = merged[:10] -%}
      {%- set dropped = (merged | length) - (shown | length) -%}
      {{ shown + ([{'section': 'gather', 'message': _fr_errors_truncated,
                    'detail': '표시하지 않은 오류 ' ~ dropped ~ '건 (수집 로그를 확인하세요)'}] if dropped > 0 else []) }}
  when:
    - (_out_status | default('')) == 'failed'
    - (_bo_reason | length) > 0
    - ((_bo_errors | length) == 0) or (((_bo_errors | first | default({})).message | default('')) != _bo_reason)

# hostname 정책 (2026-06-16, 사용자 확정):
#   우선순위: System.HostName(OS) → system.fqdn → BMC NetworkProtocol.HostName/FQDN → null.
#   - IP fallback 금지 ("없는 건 없는 것"). 단 BMC 관리명(iLO/XCC/RMC)은 IP 와 달리 장비 고정
#     실명이라 System.HostName 부재 시 fallback 허용. BMC 공장기본명(ILOSGHD3KHHRP 등)이 섞일 수
#     있어 diagnosis.details.hostname_source(system|bmc|none) 로 출처 표시.
#   - Cisco CIMC 등 NetworkProtocol.HostName=null vendor 는 bmc fallback 도 null → graceful.
#   - bmc.network_hostname 은 redfish 전용. OS/ESXi 는 _merged_data.bmc 부재 → system 우선/none.
- name: "normalize | build_output | resolve hostname + source"
  ansible.builtin.set_fact:
    _out_hostname: >-
      {{ ((_merged_data.system | default({})).hostname | default(none))
         or ((_merged_data.system | default({})).fqdn | default(none))
         or ((_merged_data.bmc | default({})).network_hostname | default(none))
         or none }}
    _out_hostname_source: >-
      {%- set _sysh = ((_merged_data.system | default({})).hostname | default(none))
                      or ((_merged_data.system | default({})).fqdn | default(none)) -%}
      {%- set _bmch = (_merged_data.bmc | default({})).network_hostname | default(none) -%}
      {{ 'system' if _sysh else ('bmc' if _bmch else 'none') }}

- name: "normalize | build_output"
  ansible.builtin.set_fact:
    _output: "{{ {
      'target_type':       _out_target_type,
      'collection_method': _out_collection_method,
      'ip':                _out_ip,
      'hostname':          _out_hostname,
      'vendor':            (_out_vendor | default(none, true)),
      'status':            _out_status,
      'sections':          _norm_sections,
      'diagnosis':         (((_diagnosis | default({}, true))
                             if ((_diagnosis | default({}, true)) is mapping) else {})
                            | combine({'details':
                                ((((_diagnosis | default({}, true)).details | default({}))
                                  if (((_diagnosis | default({}, true)).details | default({}))
                                      is mapping) else {})
                                 | combine({'hostname_source': _out_hostname_source}))})),
      'meta':              _meta              | default(none),
      'correlation':       _correlation       | default(none),
      'errors':            _norm_errors,
      'data':              _merged_data
    } }}"
