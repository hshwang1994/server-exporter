---

- name: "normalize | build_output | ensure failed diagnosis"
  ansible.builtin.set_fact:
    _diagnosis: >-
      {{ {'reachable': none, 'port_open': none, 'protocol_supported': none,
          'auth_success': none, 'failure_stage': none, 'failure_code': none,
          'failure_reason': none, 'details': {}}
         | combine((_diagnosis | default({}, true))
                   if ((_diagnosis | default({}, true)) is mapping) else {})
         | combine({'failure_stage':  'gather',
                    'failure_code':   'GATHER_FAILED',
                    'failure_reason': _fr_catalog.gather_no_data.default}) }}
  when:
    - (_out_status | default('')) == 'failed'
    - ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

- name: "normalize | build_output | resolve hostname + source"
  ansible.builtin.set_fact:
    _out_hostname: >-
      {{ ((_merged_data.system | default({})).hostname | default(none))
         or ((_merged_data.system | default({})).fqdn | default(none))
         or ((_merged_data.bmc | default({})).network_hostname | default(none))
         or none }}
    _out_hostname_source: >-
      {%- set _sysh = ((_merged_data.system | default({})).hostname | default(none))
                      or ((_merged_data.system | default({})).fqdn | default(none)) -%}
      {%- set _bmch = (_merged_data.bmc | default({})).network_hostname | default(none) -%}
      {{ 'system' if _sysh else ('bmc' if _bmch else 'none') }}

- name: "normalize | build_output"
  ansible.builtin.set_fact:
    _output: "{{ {
      'target_type':       _out_target_type,
      'collection_method': _out_collection_method,
      'ip':                _out_ip,
      'hostname':          _out_hostname,
      'vendor':            (_out_vendor | default(none, true)),
      'status':            _out_status,
      'sections':          _norm_sections,
      'diagnosis':         (((_diagnosis | default({}, true))
                             if ((_diagnosis | default({}, true)) is mapping) else {})
                            | combine({'details':
                                ((((_diagnosis | default({}, true)).details | default({}))
                                  if (((_diagnosis | default({}, true)).details | default({}))
                                      is mapping) else {})
                                 | combine({'hostname_source': _out_hostname_source}))})),
      'meta':              _meta              | default(none),
      'correlation':       _correlation       | default(none),
      'errors':            _norm_errors,
      'data':              _merged_data
    } }}"
