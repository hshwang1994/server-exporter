---

- name: "normalize | validate REPO_ROOT"
  ansible.builtin.assert:
    that:
      - lookup('env', 'REPO_ROOT') | length > 0
    fail_msg: >-
      REPO_ROOT 환경변수가 설정되지 않았습니다.
      Jenkins 에서 REPO_ROOT=${WORKSPACE} 를 설정하거나,
      수동 실행 시 export REPO_ROOT=/path/to/repo 를 먼저 수행하세요.

- name: "normalize | init_fragments | timestamp"
  ansible.builtin.set_fact:
    _started_at:    "{{ now(utc=true).isoformat() + 'Z' }}"
    _started_epoch: "{{ '%.6f' | format(now(utc=true).timestamp()) }}"
  no_log: true

- name: "normalize | init_fragments"
  ansible.builtin.set_fact:
    _merged_data:
      system:   null
      hardware: null
      bmc:      null
      cpu:      null
      memory:   null
      storage:
        filesystems:     []
        physical_disks:  []
        datastores:      []
        controllers:     []
        logical_volumes: []
        hbas:            []
        infiniband:      []
        summary:
          groups:         []
          grand_total_gb: 0
      network:
        dns_servers:      []
        default_gateways: []
        interfaces:       []
        adapters:         []
        ports:            []
        virtual_switches: []
        portgroups:       []
        driver_map:       []
        summary:
          groups: []
      users:    []
      firmware: []
      power:    null
      thermal:
        temperatures: []
        fans:         []
    _all_sec_supported:   []
    _all_sec_collected:   []
    _all_sec_failed:      []
    _all_sec_unsupported: []
    _all_errors:          []
  no_log: true
