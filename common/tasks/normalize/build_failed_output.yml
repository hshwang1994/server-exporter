---

- name: "normalize | build_failed_output | build sections"
  ansible.builtin.set_fact:
    _norm_sections: >-
      {%- set all_sec = ['system','hardware','bmc','cpu','memory',
                         'storage','network','firmware','users','power','thermal'] -%}
      {%- set supported = _fail_sec_supported | default([]) -%}
      {%- set collected = _all_sec_collected | default([]) -%}
      {%- set failed = _all_sec_failed | default([]) -%}
      {%- set out = {} -%}
      {%- for s in all_sec -%}
        {%- if s in supported -%}
          {%- set _ = out.update({s: ('success' if (s in collected and s not in failed) else 'failed')}) -%}
        {%- else -%}
          {%- set _ = out.update({s: 'not_supported'}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _norm_errors:
      - section:  "{{ _fail_error_section | default('gather') }}"
        message: >-
          {%- set d = _diagnosis | default({}, true) -%}
          {%- set reason = (d.failure_reason | default(none)) if (d is mapping) else none -%}
          {%- if reason is string and (reason | trim | length) > 0 -%}
          {{- reason | trim -}}
          {%- else -%}
          {{- _fr_catalog.output_build_failed.default -}}
          {%- endif -%}
        detail: >-
          {%- set parts = [] -%}
          {%- set dt = _fail_error_detail | default(none) -%}
          {%- set ms = _fail_error_message | default(none) -%}
          {%- if dt is string and (dt | trim | length) > 0 -%}
          {%- set _ = parts.append(dt | trim) -%}
          {%- endif -%}
          {%- if ms is string and (ms | trim | length) > 0 -%}
          {%- set _ = parts.append(ms | trim) -%}
          {%- endif -%}
          {{ (parts | join(' | ')) if parts else none }}
    _out_status: >-
      {%- set supported = _fail_sec_supported | default([]) -%}
      {%- set collected = _all_sec_collected | default([]) -%}
      {%- set failed = _all_sec_failed | default([]) -%}
      {%- set ok = supported | select('in', collected) | reject('in', failed) | list -%}
      {{ 'partial' if (ok | length) > 0 else 'failed' }}

- name: "normalize | build_failed_output | keep section errors"
  ansible.builtin.set_fact:
    _fail_errors: >-
      {%- set rep = _norm_errors | list -%}
      {%- set rep_first = rep | first | default({}) -%}
      {%- set kept = [] -%}
      {%- for e in (_all_errors | default([]) | normalize_errors) -%}
        {%- if not (e.message == (rep_first.message | default(''))
                    and (e.detail | default(none)) == (rep_first.detail | default(none))) -%}
          {%- set _ = kept.append(e) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set merged = rep + kept -%}
      {%- set shown = merged[:10] -%}
      {%- set dropped = (merged | length) - (shown | length) -%}
      {%- if dropped > 0 -%}
        {%- set _ = shown.append({
          'section': 'gather',
          'message': _fr_errors_truncated,
          'detail': '표시하지 않은 오류 ' ~ dropped ~ '건 (수집 로그를 확인하세요)'}) -%}
      {%- endif -%}
      {{ shown }}

- name: "normalize | build_failed_output | build fallback meta & correlation"
  ansible.builtin.set_fact:
    _meta: "{{ _meta | default({
      'started_at':      _started_at | default(none),
      'finished_at':     now(utc=true).isoformat() + 'Z',
      'duration_ms':     none,
      'adapter_id':      (_selected_adapter | default({})).adapter_id | default(none),
      'adapter_version': (_selected_adapter | default({})).version | default(none),
      'ansible_version': ansible_version.full | default('unknown')
    }) }}"
    _correlation: >-
      {%- if _correlation is defined -%}
        {{ _correlation }}
      {%- else -%}
        {%- set md = _merged_data | default({}) -%}
        {%- set hw = md.hardware | default(none) if md is mapping else none -%}
        {%- set sy = md.system | default(none) if md is mapping else none -%}
        {%- set bm = md.bmc | default(none) if md is mapping else none -%}
        {{ {'serial_number': ((hw.serial | default(none)) if hw is mapping else ((sy.serial_number | default(none)) if sy is mapping else none)),
            'system_uuid':   (((hw.uuid | default(none)) if hw is mapping else ((sy.system_uuid | default(none)) if sy is mapping else none)) | normalize_uuid),
            'bmc_ip':        ((bm.ip | default(none)) if bm is mapping else none),
            'host_ip':       _out_ip | default(none)} }}
      {%- endif -%}

- name: "normalize | build_failed_output | resolve hostname + source"
  ansible.builtin.set_fact:
    _out_hostname: >-
      {%- set md = _merged_data | default({}) -%}
      {%- set sy = (md.system | default({}, true)) if md is mapping else {} -%}
      {%- set bm = (md.bmc | default({}, true)) if md is mapping else {} -%}
      {{ ((sy.hostname | default(none)) if sy is mapping else none)
         or ((sy.fqdn | default(none)) if sy is mapping else none)
         or ((bm.network_hostname | default(none)) if bm is mapping else none)
         or none }}
    _out_hostname_source: >-
      {%- set md = _merged_data | default({}) -%}
      {%- set sy = (md.system | default({}, true)) if md is mapping else {} -%}
      {%- set bm = (md.bmc | default({}, true)) if md is mapping else {} -%}
      {%- set sysh = ((sy.hostname | default(none)) if sy is mapping else none) or ((sy.fqdn | default(none)) if sy is mapping else none) -%}
      {%- set bmch = (bm.network_hostname | default(none)) if bm is mapping else none -%}
      {{ 'system' if sysh else ('bmc' if bmch else 'none') }}

- name: "normalize | build_failed_output | assemble output"
  ansible.builtin.set_fact:
    _output: "{{ {
      'target_type':       _out_target_type       | default('unknown'),
      'collection_method': _out_collection_method | default('unknown'),
      'ip':                _out_ip                | default(inventory_hostname),
      'hostname':          _out_hostname | default(none),
      'vendor':            _out_vendor | default(none, true),
      'status':            _out_status | default('failed'),
      'sections':          _norm_sections,
      'diagnosis':         (((_diagnosis | default({}, true))
                             if ((_diagnosis | default({}, true)) is mapping) else {})
                            | combine({'details':
                                ((((_diagnosis | default({}, true)).details | default({}))
                                  if (((_diagnosis | default({}, true)).details | default({}))
                                      is mapping) else {})
                                 | combine({'hostname_source': _out_hostname_source | default('none')}))})),
      'meta':              _meta              | default(none),
      'correlation':       _correlation       | default(none),
      'errors':            _fail_errors | default(_norm_errors),
      'data': _merged_data | default({
        'system':   none, 'hardware': none, 'bmc': none,
        'cpu':      none, 'memory':   none,
        'storage':  {'filesystems':[], 'physical_disks':[],
                     'datastores':[], 'controllers':[], 'logical_volumes':[],
                     'hbas':[], 'infiniband':[],
                     'summary': {'groups': [], 'grand_total_gb': 0}},
        'network':  {'dns_servers':[], 'default_gateways':[], 'interfaces':[],
                     'adapters':[], 'ports':[], 'virtual_switches':[],
                     'portgroups':[], 'driver_map':[],
                     'summary': {'groups': []}},
        'users':    [], 'firmware': [], 'power': none,
        'thermal':  {'temperatures': [], 'fans': []}
      })
    } }}"
