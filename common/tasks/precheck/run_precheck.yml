---
# ==============================================================================
# run_precheck.yml — 통합 사전 진단 실행
# ==============================================================================
# 수집 전 대상 호스트의 연결 상태를 진단합니다.
#
# 필수 입력 변수:
#   _precheck_channel: "redfish" | "os" | "esxi"
#   _precheck_host:    대상 IP 주소
#
# 선택 입력 변수:
#   _precheck_ports:      포트 목록 (기본: 채널별 기본값)
#   _precheck_username:   인증 사용자명
#   _precheck_password:   인증 비밀번호
#   _precheck_timeout_port:     포트 타임아웃 (기본: 3.0)
#   _precheck_timeout_protocol: 프로토콜 타임아웃 (기본: 15.0)
#   _precheck_timeout_auth:     인증 타임아웃 (기본: 8.0)
#   _precheck_timeout:          protocol/auth 공통 타임아웃 — 개별 값 미지정 시 적용.
#                               (port 는 빠른 dead-host 감지 유지 위해 적용 제외 — Round 17 #4)
#   _precheck_icmp_probe:       TCP 전 포트 무응답일 때 ICMP Echo 로 도달성을 한 번 더
#                               확인할지 (기본 true — 모듈 기본값). false 면 종전 TCP 전용.
#   _precheck_timeout_icmp:     ICMP Echo 1회 타임아웃 (기본 1.0). TCP 무응답 경로에서만 소비.
#
# 출력 변수:
#   _precheck_result:  precheck_bundle 모듈 반환값
#   _precheck_ok:      전체 진단 통과 여부 (bool)
#   _diagnosis:        공통 diagnosis 딕셔너리
#   _fail_error_detail: 진단 실패 시 원본 기술 오류 문자열 (없으면 none)
#                       → build_failed_output.yml:49 이 errors[0].detail 로 emit.
#                       2026-08-10 이전에는 이 변수를 set 하는 코드가 저장소에 하나도 없어
#                       precheck 가 이미 확보한 상세 오류(DNS 해석 실패 / TCP timeout /
#                       연결 거부 / HTTP status / TLS 오류)가 최종 결과에 도달하지 못했다.
# ==============================================================================

- name: "precheck | 대상 호스트 연결 진단"
  precheck_bundle:
    host: "{{ _precheck_host }}"
    channel: "{{ _precheck_channel }}"
    ports: "{{ _precheck_ports | default(omit) }}"
    # Round 17 #4: 호출자가 넘기는 _precheck_timeout(redfish=_rf_timeout, esxi=30) 이 기존엔
    # 어디서도 읽히지 않아 dead → protocol/auth 가 항상 15/8 로 고정(느린 BMC 에서 false-negative).
    # protocol/auth 의 fallback 으로 연결. port 는 빠른 dead-host 감지 위해 3.0 유지(미연결).
    timeout_port: "{{ _precheck_timeout_port | default(3.0) }}"
    timeout_protocol: "{{ _precheck_timeout_protocol | default(_precheck_timeout | default(15.0)) }}"
    timeout_auth: "{{ _precheck_timeout_auth | default(_precheck_timeout | default(8.0)) }}"
    username: "{{ _precheck_username | default(omit) }}"
    password: "{{ _precheck_password | default(omit) }}"
    # 2026-08-10 (Phase 3-A): OS 채널은 Stage 3(프로토콜 확인)을 수행하지 않는다.
    # 종전 os-gather 의 wait_for 기반 감지가 TCP 개방만 확인했고, 이번 통합 범위는 구조
    # 정렬이지 SSH/WinRM 실제 프로토콜 검증 도입이 아니기 때문이다. 미지정 시 true(기존 동작).
    probe_protocol: "{{ _precheck_probe_protocol | default(true) }}"
    # 2026-08-10 (Phase 3-A 보정): 포트당 재시도 간격. 미지정 시 0 = 단일 시도(기존 동작).
    # OS 만 wait_for 의 폴링 의미를 보존하려고 1.0 을 넘긴다.
    port_poll_interval: "{{ _precheck_port_poll_interval | default(0.0) }}"
    # 2026-09-03 (사용자 지시): reachable = 관리 TCP 응답 OR ICMP Echo 응답.
    #   기본값 정본은 모듈 argument_spec(icmp_probe=true / timeout_icmp=1.0)이라 여기서는
    #   omit 로 넘긴다 — 값을 두 곳에 적어 두면 한쪽만 바뀌어도 조용히 어긋난다.
    #   ICMP 는 Gate 가 아니다: TCP 가 응답하면 호출 자체가 없고, ICMP 무응답은
    #   아무것도 실패시키지 않는다 (전용 failure_code 없음).
    icmp_probe: "{{ _precheck_icmp_probe | default(omit) }}"
    timeout_icmp: "{{ _precheck_timeout_icmp | default(omit) }}"
  delegate_to: localhost
  register: _precheck_raw
  no_log: true

# rule 95 R1 #5 ok: failure_stage 부재 = 진단 통과 (Jinja2 expression 안 주석은 syntax error 유발 — YAML 주석으로 분리)
- name: "precheck | 진단 결과 저장"
  ansible.builtin.set_fact:
    _precheck_result: "{{ _precheck_raw }}"
    # 2026-08-10 (Phase 3-A): protocol 확인을 **수행한 경우에만** protocol_supported 를 요구한다.
    #   probe_protocol=false (OS 채널) 로 부르면 protocol_checked=false 가 돌아오고,
    #   protocol_supported 는 "확인 안 함" 을 뜻하는 초기값 False 로 남는다. 이때까지
    #   실패로 보면 정상 OS 호스트가 전부 진단 실패가 된다.
    #   redfish / esxi 는 protocol_checked 가 없거나 true 라 default(true) 로 조건이 그대로 유지된다.
    _precheck_ok: >-
      {{
        _precheck_raw.reachable | default(false) | bool
        and _precheck_raw.port_open | default(false) | bool
        and (_precheck_raw.protocol_supported | default(false) | bool
             or not (_precheck_raw.protocol_checked | default(true) | bool))
        and (_precheck_raw.failure_stage is none or _precheck_raw.failure_stage | default('') == '')
      }}

- name: "precheck | 공통 diagnosis 생성"
  ansible.builtin.set_fact:
    _diagnosis: "{{ _precheck_raw | build_diagnosis(_precheck_channel) }}"

# 2026-08-10: precheck 의 detail 을 실패 경로(build_failed_output.yml:49)까지 전달.
#   build_diagnosis() 는 detail 을 diagnosis 에 싣지 않는다 (diagnosis_mapper.py:38-42 —
#   "errors[0].detail 에 이미 존재" 전제). 그런데 그 errors[0].detail 을 채우는
#   _fail_error_detail 을 set 하는 코드가 저장소에 없어 전제가 성립하지 않았다.
#   본 태스크가 그 전제를 실제로 성립시킨다 — 신규 필드/키 추가 없음(Additive 아님, 값만).
#   precheck 성공 시 _precheck_raw.detail 은 None 이라 이후 gather 단계 실패에는 영향 없음.
- name: "precheck | 실패 detail 을 errors[].detail 로 전달"
  ansible.builtin.set_fact:
    _fail_error_detail: "{{ _precheck_raw.detail | default(none) }}"

- name: "precheck | 진단 실패 시 로그 출력"
  ansible.builtin.debug:
    msg: >-
      [진단 실패] {{ _precheck_host }}:
      단계={{ _precheck_raw.failure_stage | default('unknown') }},
      사유={{ _precheck_raw.failure_reason | default('알 수 없음') }}
  when: not (_precheck_ok | bool)
