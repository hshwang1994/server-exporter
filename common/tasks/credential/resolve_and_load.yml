---

- name: "credential | resolve scope"
  ansible.builtin.set_fact:
    _cred_resolved: >-
      {{ lookup('credential_resolver',
                location=se_location | default(''),
                target_type=_cred_target_type,
                os_type=_cred_os_type | default(''),
                vendor=_cred_vendor | default(''),
                repo_root=lookup('env','REPO_ROOT')) }}

- name: "credential | expose scope"
  ansible.builtin.set_fact:
    _cred_scope: "{{ _cred_resolved.credential_scope | default('') }}"
    _cred_reason: "{{ _cred_resolved.reason | default('unknown_location') }}"
    _cred_vault_relpath: "{{ _cred_resolved.vault_relpath | default('') }}"
    _cred_location: "{{ se_location | default('') }}"
    _cred_location_vault_exists: false

- name: "credential | not resolved"
  ansible.builtin.set_fact:
    _cred_accounts: []
    _cred_become_password: ""
    _cred_load_outcome: "not_resolved"
  when: _cred_reason != 'resolved'

- name: "credential | resolved"
  when: _cred_reason == 'resolved'
  block:
    - name: "credential | load vault file"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/load_one.yml"
      vars:
        _cl_relpath: "{{ _cred_vault_relpath }}"

    - name: "credential | normalize accounts"
      ansible.builtin.set_fact:
        _cred_accounts: "{{ _cl_vault_data | default({}) | credential_accounts }}"
        _cred_become_password: >-
          {{ (_cl_vault_data | default({})).ansible_become_password | default('') }}
      no_log: true

    - name: "credential | classify load outcome"
      ansible.builtin.set_fact:
        _cred_load_outcome: >-
          {{ 'empty_accounts'
             if ((_cl_outcome | default('not_resolved')) == 'loaded'
                 and (_cred_accounts | length) == 0)
             else (_cl_outcome | default('not_resolved')) }}

    - name: "credential | location vault dir"
      when: _cred_load_outcome == 'credential_set_missing'
      ansible.builtin.stat:
        path: "{{ lookup('env','REPO_ROOT') }}/vault/{{ _cred_scope.split('/') | first }}"
      delegate_to: localhost
      become: false
      register: _cred_loc_dir_stat

    - name: "credential | expose location vault dir"
      when: _cred_load_outcome == 'credential_set_missing'
      ansible.builtin.set_fact:
        _cred_location_vault_exists: "{{ (_cred_loc_dir_stat.stat | default({})).isdir | default(false) }}"

- name: "credential | summary"
  ansible.builtin.debug:
    msg: >-
      credential_scope={{ _cred_scope | default('') | ternary(_cred_scope, '(unresolved: ' ~ _cred_reason ~ ')') }},
      outcome={{ _cred_load_outcome | default('not_resolved') }},
      accounts={{ _cred_accounts | default([]) | length }},
      labels={{ _cred_accounts | default([]) | map(attribute='label') | list }}
