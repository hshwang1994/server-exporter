---

- name: "credential | redfish | resolve scopes"
  ansible.builtin.set_fact:
    _cred_resolved: >-
      {{ lookup('credential_resolver',
                location=se_location | default(''),
                target_type='redfish',
                vendor=_cred_vendor | default(''),
                repo_root=lookup('env','REPO_ROOT')) }}

- name: "credential | redfish | expose scopes"
  ansible.builtin.set_fact:
    _cred_scope: "{{ _cred_resolved.standard_credential_scope | default('') }}"
    _cred_standard_relpath: "{{ _cred_resolved.standard_vault_relpath | default('') }}"
    _cred_recovery_scope: "{{ _cred_resolved.recovery_credential_scope | default('') or '' }}"
    _cred_recovery_relpath: "{{ _cred_resolved.recovery_vault_relpath | default('') or '' }}"
    _cred_reason: "{{ _cred_resolved.reason | default('unknown_location') }}"
    _cred_location: "{{ se_location | default('') }}"

- name: "credential | redfish | load standard vault"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/load_one.yml"
  vars:
    _cl_relpath: "{{ _cred_standard_relpath }}"

- name: "credential | redfish | adopt standard"
  ansible.builtin.set_fact:
    _cred_standard_accounts: "{{ _cl_vault_data | default({}) | credential_standard_accounts }}"
    _cred_standard_outcome: >-
      {{ 'empty_accounts'
         if ((_cl_outcome | default('not_resolved')) == 'loaded'
             and ((_cl_vault_data | default({}) | credential_standard_accounts) | length) == 0)
         else (_cl_outcome | default('not_resolved')) }}
  no_log: true

- name: "credential | redfish | load recovery vault"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/load_one.yml"
  vars:
    _cl_relpath: "{{ _cred_recovery_relpath }}"

- name: "credential | redfish | adopt recovery"
  ansible.builtin.set_fact:
    _cred_recovery_accounts: "{{ _cl_vault_data | default({}) | credential_recovery_accounts }}"
    _cred_recovery_outcome: >-
      {{ 'empty_accounts'
         if ((_cl_outcome | default('not_resolved')) == 'loaded'
             and ((_cl_vault_data | default({}) | credential_recovery_accounts) | length) == 0)
         else (_cl_outcome | default('not_resolved')) }}
  no_log: true

- name: "credential | redfish | merge candidates"
  ansible.builtin.set_fact:
    _cred_accounts: >-
      {{ (_cred_standard_accounts | default([]))
         | credential_redfish_candidates(_cred_recovery_accounts | default([])) }}
    _cred_load_outcome: "{{ _cred_standard_outcome }}"
    _cred_become_password: ""
  no_log: true

- name: "credential | redfish | summary"
  ansible.builtin.debug:
    msg: >-
      standard_scope={{ _cred_scope }} ({{ _cred_standard_outcome }},
      accounts={{ _cred_standard_accounts | default([]) | length }}),
      recovery_scope={{ _cred_recovery_scope | default('') | ternary(_cred_recovery_scope, '(none: ' ~ _cred_reason ~ ')') }}
      ({{ _cred_recovery_outcome }}, accounts={{ _cred_recovery_accounts | default([]) | length }}),
      labels={{ _cred_accounts | default([]) | map(attribute='label') | list }}
