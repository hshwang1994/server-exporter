---
# ==============================================================================
# common/tasks/credential/load_one.yml — vault 파일 1개 로딩 (재사용 단위)
# ==============================================================================
# 입력:
#   _cl_relpath : 저장소 상대 경로 (예: 'vault/ic/redfish/dell.yml').
#                 빈 문자열이면 "열 대상이 없다" 는 뜻이고 outcome=not_resolved 다.
#
# 출력 (고정 이름 — 호출 직후 호출자가 자기 이름으로 옮겨 담는다):
#   _cl_vault_data       : 복호화된 vault 내용 (dict). 실패 시 {}
#   _cl_outcome          : loaded | credential_set_missing
#                        | credential_set_undecryptable | not_resolved
#
# 왜 파일을 나눴나:
#   Redfish 는 표준 vault 와 recovery vault **두 개**를 연다. 같은 로딩 절차를 두 번
#   복제하면 no_log 누락 / cacheable 혼입 같은 실수가 한쪽에만 생긴다. 한 벌만 둔다.
#
# 원칙 (resolve_and_load.yml 와 동일):
#   - Secret 을 다루는 태스크는 전부 `no_log: true`
#   - `cacheable` 을 쓰지 않는다 (rule 27 R6 — vault 변경 자동 반영)
#   - 여기서 fail 하지 않는다. 판정 결과만 넘긴다 (rule 11 — envelope 보존)
# ==============================================================================

- name: "credential | load_one | reset"
  ansible.builtin.set_fact:
    _cl_vault_data: {}
    _cl_outcome: "not_resolved"
    _cl_stat: {}
    _cl_load: {}
  no_log: true

# 주의 — `include_vars` 의 `name:` 대상은 **set_fact 로 쓰는 이름과 달라야 한다.**
#   Ansible 변수 우선순위에서 set_fact 가 include_vars 보다 높다. 같은 이름을 쓰면
#   위 reset 의 set_fact({}) 가 include_vars 결과를 영구히 가려서 **모든 채널의
#   인증 후보가 0개**가 된다 (2026-08-12 실측: OS/ESXi/Redfish 전 채널 수집 실패).
#   그래서 로딩은 `_cl_included` 에 받고, 노출용 `_cl_vault_data` 는 set_fact 로 만든다.
- name: "credential | load_one | open"
  when: (_cl_relpath | default('')) | length > 0
  block:
    # 파일 부재와 복호화 실패를 구분하려고 include_vars 앞에 둔다.
    # delegate_to: localhost — vault 는 controller(=Jenkins agent) 파일이고
    # 이 시점에 대상 인증은 아직 없다.
    - name: "credential | load_one | stat"
      ansible.builtin.stat:
        path: "{{ lookup('env','REPO_ROOT') }}/{{ _cl_relpath }}"
      delegate_to: localhost
      become: false
      register: _cl_stat

    - name: "credential | load_one | include vars"
      ansible.builtin.include_vars:
        file: "{{ lookup('env','REPO_ROOT') }}/{{ _cl_relpath }}"
        name: _cl_included
      no_log: true
      failed_when: false
      register: _cl_load
      when: _cl_stat.stat.exists | default(false)

    - name: "credential | load_one | classify"
      ansible.builtin.set_fact:
        _cl_outcome: >-
          {{ 'credential_set_missing'
             if not (_cl_stat.stat.exists | default(false))
             else ('credential_set_undecryptable'
                   if (_cl_load is defined and _cl_load is failed)
                   else 'loaded') }}

    # 이번 호출에서 **실제로 읽은** 경우에만 내용을 노출한다.
    #   `_cl_included` 는 include_vars 변수라 다음 호출에서 include 가 skip 되면
    #   직전 파일 내용이 그대로 남는다. Redfish 는 표준/복구 두 번 부르므로,
    #   복구 파일이 없을 때 표준 vault 내용이 복구 후보로 새는 사고가 된다.
    - name: "credential | load_one | expose"
      ansible.builtin.set_fact:
        _cl_vault_data: "{{ _cl_included | default({}) if _cl_outcome == 'loaded' else {} }}"
      no_log: true
