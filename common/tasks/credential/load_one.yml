---

- name: "credential | load_one | reset"
  ansible.builtin.set_fact:
    _cl_vault_data: {}
    _cl_outcome: "not_resolved"
    _cl_stat: {}
    _cl_load: {}
  no_log: true

- name: "credential | load_one | open"
  when: (_cl_relpath | default('')) | length > 0
  block:
    - name: "credential | load_one | stat"
      ansible.builtin.stat:
        path: "{{ lookup('env','REPO_ROOT') }}/{{ _cl_relpath }}"
      delegate_to: localhost
      become: false
      register: _cl_stat

    - name: "credential | load_one | include vars"
      ansible.builtin.include_vars:
        file: "{{ lookup('env','REPO_ROOT') }}/{{ _cl_relpath }}"
        name: _cl_included
      no_log: true
      ignore_errors: true
      register: _cl_load
      when: _cl_stat.stat.exists | default(false)

    - name: "credential | load_one | classify"
      ansible.builtin.set_fact:
        _cl_outcome: >-
          {{ 'credential_set_missing'
             if not (_cl_stat.stat.exists | default(false))
             else ('credential_set_undecryptable'
                   if (_cl_load is defined and _cl_load is failed)
                   else 'loaded') }}

    - name: "credential | load_one | expose"
      ansible.builtin.set_fact:
        _cl_vault_data: "{{ _cl_included | default({}) if _cl_outcome == 'loaded' else {} }}"
      no_log: true
