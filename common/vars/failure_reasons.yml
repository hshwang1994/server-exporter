---

_fr_catalog:

  ip_invalid:
    default: "대상 IP가 올바르지 않습니다. 개더링 대상 IP를 확인하세요."

  target_unreachable:
    default: "대상 서버가 응답하지 않습니다. 서버 전원 상태와 네트워크 연결을 확인하세요."

  port_silent:
    default: "대상 서버와 통신은 되지만 관리 포트에 연결할 수 없습니다. 방화벽과 접속 설정을 확인하세요."

  port_refused:
    os: "OS 접속이 거부되었습니다. 대상 서버의 OS 원격 접속 설정과 방화벽을 확인하세요."
    esxi: "ESXi 접속이 거부되었습니다. 대상 서버의 ESXi 접속 설정과 방화벽을 확인하세요."
    redfish: "Redfish 접속이 거부되었습니다. 대상 장비의 Redfish 접속 설정과 방화벽을 확인하세요."
    default: "관리 포트 접속이 거부되었습니다. 대상의 접속 설정과 방화벽을 확인하세요."

  protocol_unconfirmed:
    os: "접속한 대상에서 OS 원격 접속 응답을 확인하지 못했습니다. 대상 종류와 OS 원격 접속 설정을 확인하세요."
    esxi: "접속한 대상에서 ESXi 응답을 확인하지 못했습니다. 대상 종류와 ESXi 서비스 상태를 확인하세요."
    redfish: "접속한 대상에서 Redfish 응답을 확인하지 못했습니다. 대상 종류와 Redfish 서비스 설정을 확인하세요."
    default: "접속한 대상에서 필요한 응답을 확인하지 못했습니다. 대상 종류와 접속 설정을 확인하세요."

  loc_unregistered:
    default: "해당 위치({loc})가 개더링 프로젝트에 등록되지 않았습니다."
  loc_vault_missing:
    default: "해당 위치({loc})에 Vault가 등록되지 않았습니다."
  loc_vault_unreadable:
    default: "해당 위치({loc})의 Vault를 읽을 수 없습니다."
  loc_vault_no_account:
    os: "해당 위치({loc})의 Vault에 OS용 계정이 없습니다."
    esxi: "해당 위치({loc})의 Vault에 ESXi용 계정이 없습니다."
    default: "해당 위치({loc})의 Vault에 계정이 없습니다."
  project_vault_missing:
    default: "개더링 프로젝트에 Vault가 등록되지 않았습니다."
  project_vault_unreadable:
    default: "개더링 프로젝트의 Vault를 읽을 수 없습니다."
  project_vault_no_account:
    default: "개더링 프로젝트의 Vault에 Redfish 표준 계정이 없습니다."

  auth_unconfirmed:
    os: "해당 위치({loc})의 Vault 계정으로 대상 OS에 로그인하지 못했습니다."
    esxi: "해당 위치({loc})의 Vault 계정으로 대상 ESXi에 로그인하지 못했습니다."
    redfish: "개더링 표준 계정으로 대상 Redfish에 인증하지 못했습니다."
    default: "해당 위치({loc})의 Vault 계정으로 대상에 로그인하지 못했습니다."
  auth_rejected:
    redfish: "대상 Redfish 계정과 개더링 표준 계정이 다르거나 권한이 없습니다."

  gather_after_auth:
    os: "대상 OS에는 로그인했지만 정보를 가져오지 못했습니다."
    esxi: "대상 ESXi에는 로그인했지만 정보를 가져오지 못했습니다."
    redfish: "대상 Redfish 인증은 성공했지만 정보를 가져오지 못했습니다."
    default: "대상에는 접속했지만 정보를 가져오지 못했습니다."
  gather_connection_lost:
    default: "정보 수집 중 대상 서버와 연결이 끊겼습니다."
  gather_no_data:
    default: "대상 서버에서 수집된 정보가 없습니다."
  gather_internal:
    default: "개더링 프로젝트에서 정보 수집 중 오류가 발생했습니다."

  output_build_failed:
    default: "개더링 프로젝트에서 수집 결과를 만들지 못했습니다."

_fr_code_keys:
  DNS_RESOLUTION_FAILED:      [ip_invalid]
  TARGET_UNREACHABLE:         [target_unreachable]
  TCP_CONNECT_FAILED:         [port_silent]
  TCP_CONNECTION_REFUSED:     [port_refused]
  PROTOCOL_CHECK_FAILED:      [protocol_unconfirmed]
  CREDENTIAL_SET_UNAVAILABLE: [loc_unregistered, loc_vault_missing, loc_vault_unreadable,
                               loc_vault_no_account, project_vault_missing,
                               project_vault_unreadable, project_vault_no_account]
  AUTH_PROBE_FAILED:          [auth_unconfirmed, auth_rejected, loc_vault_no_account,
                               project_vault_no_account]
  GATHER_FAILED:              [gather_after_auth, gather_connection_lost, gather_no_data,
                               gather_internal]
  OUTPUT_BUILD_FAILED:        [output_build_failed]

_fr_errors_truncated: "표시하지 않은 오류가 더 있습니다."
