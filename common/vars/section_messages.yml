---
# common/vars/section_messages.yml
#
# 섹션 단위(부분 실패) errors[].message 정본 — 2026-08-12 신설.
#
# 왜 별도 파일인가
# ----------------
# common/vars/failure_reasons.yml 의 문장은 **완전 실패(status=failed)** 대표 사유다.
# status=partial / success 에서 나오는 섹션 단위 오류를 그 문장으로 통일하면 안 된다 —
# "대상에 접속할 수 없습니다" 는 접속이 된 상태에서 CPU 만 못 읽은 결과를 설명하지 못한다.
# 그래서 섹션 문장은 **섹션 의미를 유지**하되 같은 품질 규칙을 지키도록 여기에 모은다.
#
# 품질 규칙 (failure_reasons.yml 과 동일)
#   금지: 관리 포트 번호 / IP / HTTP status / timeout 초 / URI / raw stderr / 예외 문자열 /
#         Ansible 태스크명·변수명 / 영문 내부 enum / 긴 대시(—) / 가운데점(·)
#   기술 근거는 errors[].detail 에만 남긴다.
#   tests/e2e/test_section_message_contract.py 가 이 파일과 production 문장을 함께 검사한다.
#
# 사용처
#   redfish-gather/tasks/normalize_standard.yml  (모듈이 만든 기술 문자열 → 사용자 문장 치환)
#   redfish-gather/tasks/account_service.yml
#   (os / esxi 는 섹션당 문장이 1~2개뿐이라 해당 태스크에 직접 쓴다. 품질은 같은 계약 테스트가 검사한다.)

# ── 섹션 → 사용자용 한글 라벨 ────────────────────────────────────────────────
# schema/sections.yml 의 display_name 과 의미가 같아야 한다 (계약 테스트가 대조).
# 조사(를/을) 문제를 피하려고 문장 템플릿은 라벨 뒤에 공백 + "수집에" 형태로만 이어붙인다.
_sm_labels:
  system:            "서버 기본 정보"
  hardware:          "하드웨어 정보"
  bmc:               "관리 모듈 정보"
  cpu:               "CPU 정보"
  memory:            "메모리 정보"
  storage:           "스토리지 정보"
  network:           "네트워크 정보"
  firmware:          "펌웨어 목록"
  users:             "사용자 계정 목록"
  power:             "전원 정보"
  thermal:           "온도/팬 정보"
  # 채널 내부 보조 이름 (schema 11 섹션 밖). errors[].section 은 _sm_section_map 으로
  # 정규화하지만, 문장이 정확하려면 라벨은 원래 의미를 유지해야 한다.
  processors:        "CPU 정보"
  network_adapters:  "네트워크 카드 상세 정보"
  boot:              "부팅 설정 정보"
  log_services:      "관리 모듈 로그 정보"
  vendor_detect:     "제조사 식별 정보"
  account_service:   "표준 관리 계정 정보"
  oem:               "제조사 확장 정보"
  multi_node:        "다중 노드 구성 정보"
  gather:            "서버 정보"
  unknown:           "서버 정보"

# ── errors[].section 정규화 매핑 ─────────────────────────────────────────────
# 목적: 같은 사건을 채널마다 다른 이름으로 부르지 않게 한다 (M3).
#   schema 11 섹션에 대응되는 것은 그 이름으로 바꾸고, 대응되지 않는 workflow 단계는
#   원래 이름을 유지한다 (vendor_detect / account_service / oem / gather / precheck / auth).
#   종전에는 processors / network_adapters / multi_node.* 가 raw 이름 그대로 나가서
#   Portal 이 섹션별로 오류를 묶을 때 어디에도 붙지 않았다.
_sm_section_map:
  processors:        cpu
  network_adapters:  network
  boot:              system
  log_services:      bmc

# ── 조치 안내 (문장 뒷부분) ──────────────────────────────────────────────────
_sm_advice:
  default:    "대상 상태와 수집 로그를 확인하세요."
  privilege:  "수집 계정의 권한을 확인하세요."
  service:    "관리 서비스 설정과 상태를 확인하세요."
  account:    "계정 상태와 권한을 확인하세요."

# ── 기본 문장 템플릿 ─────────────────────────────────────────────────────────
# "<라벨> 수집에 실패한 항목이 있습니다. <조치>"
#   partial(일부 실패)과 full(전부 실패) 어느 쪽에도 거짓이 되지 않는 표현을 고른다.
#   섹션 전체 실패 여부는 envelope 의 sections.<name> 이 이미 정확히 표현한다.
_sm_tpl_suffix: " 수집에 실패한 항목이 있습니다. "

# ── 섹션별 전용 문장 (기본 템플릿이 어색한 곳만) ─────────────────────────────
_sm_overrides:
  vendor_detect:   "대상의 제조사 정보를 확인하지 못했습니다. 관리 서비스 설정과 상태를 확인하세요."
  account_service: "표준 관리 계정을 정리하지 못했습니다. 계정 상태와 권한을 확인하세요."
  # 2026-08-12: "표준 항목은 정상 수집되었습니다" 같은 **다른 부분의 성공을 단언하는 절**을 뺐다.
  #   이 문장은 status=failed envelope 의 errors[] 로도 합류할 수 있어(build_failed_output 이
  #   누적 오류를 보존한다) 같은 화면에 "수집 실패" 와 "정상 수집 완료" 가 함께 뜬다.
  #   표준 항목의 성공 여부는 envelope 의 sections 가 이미 정확히 표현한다.
  oem:             "일부 제조사 확장 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
