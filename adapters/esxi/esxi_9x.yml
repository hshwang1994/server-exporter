---
# ── Origin metadata (rule 96 R1) ──────────────────────────────────────────────
# Vendor: VMware ESXi 9.x
# Firmware: tested_against ["9.0.0"]
# Origin: 실장비 실측 — lab 5대 (10.100.64.91~95, Dell PowerEdge R760 위 ESXi 9.0.0).
#         version 문자열은 community.vmware 의 `ansible_distribution_version` 원본이고
#         저장소가 가공하지 않는다 (esxi-gather/site.yml:141).
# Last sync: 2026-08-13 (hshwang1994)
# Notes: priority 는 esxi_8x 와 같은 100 이다. 더 높이면 안 된다 —
#        tests/unit/test_adapter_selection_facts_r17.py 가 "facts 가 비면 esxi_8x" 를
#        고정하고 있고, 그건 인증 실패로 버전을 못 얻은 상황의 계약이다. 동률이면
#        adapter_loader 의 stable sort + 파일명 알파벳 순으로 esxi_8x 가 유지된다.
#        버전이 9.x 로 들어오면 esxi_8x 는 version_patterns 불일치로 -9999 실격이라
#        이 adapter 가 단독 1위가 된다. 즉 동률이어도 판정은 갈린다.
# ──────────────────────────────────────────────────────────────────────────────
adapter_id: esxi_9x
priority: 100

match:
  version_patterns: ["^9\\."]

capabilities:
  sections_supported:
    - system
    - hardware
    - cpu
    - memory
    - storage
    - network
    # 2026-10-19 (사용자 승인 — ADR-2026-10-19-esxi-sensors-and-linux-iscsi): vSphere runtime.healthSystemRuntime.systemHealthInfo.numericSensorInfo
    #   (HostNumericSensorInfo — vSphere API 전 버전) → power(PSU · 소비전력) · thermal(온도 · 팬). 센서 공급자(CIM/IPMI)가 없는 호스트는
    #   모듈이 available=false 를 돌려주고 두 섹션은 not_supported 가 된다. 실측: tests/reference/esxi 덤프 3대(ESXi 7, 센서 126).
    - power
    - thermal

vendor_notes:
  # design_hints: 기록용 설계 메모 — 코드가 읽지 않는다. 2026-10-11 adapter 절 정리(ADR-2026-10-11-adapter-key-cleanup)에서 종전
  # collect/graceful_degradation/auth/diagnosis/capabilities 하위 값 중 경로 복제가 아닌 것을 옮겨 두었다.
  design_hints:
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - storage
