---
# ── Origin metadata (rule 96 R1) ──────────────────────────────────────────────
# Vendor: Debian 계열 Linux (Ubuntu / Debian)
# Firmware: tested_against ["Ubuntu 24.04"]
# Origin: 실 검증 — Round 4 (복잡 토폴로지 실증, docs/reference/live-validation.md Round 4)
# Last sync: 2026-04-27 (hshwang1994)
# Notes: priority=50 — linux_rhel / linux_suse와 같은 priority. distribution_patterns로 분기.
# ──────────────────────────────────────────────────────────────────────────────
adapter_id: os_linux_ubuntu
priority: 50

match:
  os_type: linux
  distribution_patterns: ["Ubuntu", "Debian"]

capabilities:
  sections_supported:
    - system
    - hardware
    - cpu
    - memory
    - storage
    - network
    - users

vendor_notes:
  # design_hints: 기록용 설계 메모 — 코드가 읽지 않는다. 2026-10-11 adapter 절 정리(ADR-2026-10-11-adapter-key-cleanup)에서 종전
  # collect/graceful_degradation/auth/diagnosis/capabilities 하위 값 중 경로 복제가 아닌 것을 옮겨 두었다.
  design_hints:
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    graceful_degradation_optional_sections:
    - users
