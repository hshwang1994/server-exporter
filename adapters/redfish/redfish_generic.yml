---
# ── Origin metadata (rule 96 R1) ──────────────────────────────────────────────
# Vendor: DMTF Redfish standard (generic fallback)
# Firmware: tested_against [] — DMTF Redfish 1.x 표준
# Origin: DMTF Redfish Specification (https://www.dmtf.org/standards/redfish)
# Last sync: 2026-04-27 (hshwang1994)
# Notes: priority=0 — vendor-specific adapter (dell_idrac9, hpe_ilo5, ...) 매치 실패 시 fallback.
#        OEM 추출 없이 standard schema만 (Oem.* 미사용).
# ──────────────────────────────────────────────────────────────────────────────
adapter_id: redfish_generic
priority: 0
generic: true

match: {}

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

vendor_notes:
  # design_hints: 기록용 설계 메모 — 코드가 읽지 않는다. 2026-10-11 adapter 절 정리(ADR-2026-10-11-adapter-key-cleanup)에서 종전
  # collect/graceful_degradation/auth/diagnosis/capabilities 하위 값 중 경로 복제가 아닌 것을 옮겨 두었다.
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: 이 장비는 Redfish를 지원하지 않거나 구현이 제한적입니다.
