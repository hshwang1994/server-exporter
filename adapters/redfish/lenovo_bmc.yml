---
adapter_id: redfish_lenovo_bmc
channel: redfish
priority: 10

match:
  vendor: ["Lenovo", "LENOVO", "IBM"]

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

collect:
  strategy: standard_only
  standard_tasks: "redfish-gather/tasks/collect_standard.yml"

normalize:
  standard_tasks: "redfish-gather/tasks/normalize_standard.yml"

credentials:
  profile: "lenovo"
  fallback_profiles: []
  recovery_accounts:
    - { vault_label: lenovo_fallback, role: recovery }
    - { vault_label: lenovo_current,  role: recovery }
    - { vault_label: lenovo_factory,  role: recovery }

auth:
  preferred: [basic]

graceful_degradation:
  on_section_fail: continue
  on_auth_fail: abort
  critical_sections: [system, hardware]
  optional_sections: [firmware, power]

diagnosis:
  protocol_name: redfish
  not_supported_message: "Lenovo 장비이나 Redfish를 지원하지 않습니다 (구세대 BMC 추정)."
