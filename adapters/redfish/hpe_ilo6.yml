---
adapter_id: redfish_hpe_ilo6
priority: 100

match:
  vendor: ["HPE", "Hewlett Packard Enterprise"]
  firmware_patterns: ["iLO.*6", "^1\\.[5-9]"]

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power


vendor_notes:
  storage_controller_method: controllers_sublink
  indicator_led_field: LocationIndicatorActive
  fan_reading_units: Percent
  nic_data_limited: true
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    auth_preferred:
    - session
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: HPE iLO 6 장비 — Redfish 완전 지원 (Gen11).

