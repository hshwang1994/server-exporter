---
adapter_id: redfish_hpe_superdome_flex
channel: redfish
priority: 101

match:
  vendor: ["HPE", "Hewlett Packard Enterprise"]
  model_patterns:
    - "^Superdome Flex 280.*"
    - "^Superdome Flex(?! 280).*"
    - ".*Superdome.*Flex.*"
  firmware_patterns:
    - "^[23]\\.[0-9]+\\..*"
    - "iLO.*5"

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

collect:
  strategy: standard_only
  standard_tasks: "redfish-gather/tasks/collect_standard.yml"

normalize:
  standard_tasks: "redfish-gather/tasks/normalize_standard.yml"

credentials:
  profile: "hpe"
  fallback_profiles: []
  recovery_accounts:
    - { vault_label: hpe_fallback, role: recovery }
    - { vault_label: hpe_current,  role: recovery }
    - { vault_label: hpe_factory,  role: recovery }

auth:
  preferred: [session, basic]

graceful_degradation:
  on_section_fail: continue
  on_auth_fail: abort
  critical_sections: [system, hardware, bmc]
  optional_sections: [firmware, power, storage, network]

vendor_notes:
  multi_partition: true
  multi_node_support: true
  systems_id_pattern: "Partition*"
  manager_layout: "rmc_primary_ilo_secondary"
  rmc_firmware_min: "2.0"
  ilo5_firmware_min: "2.0"
  npar_firmware_bundles: true

diagnosis:
  protocol_name: redfish
  not_supported_message: >-
    HPE Superdome Flex / Flex 280 — RMC + iLO 5 dual-manager, multi-partition (nPAR).
    cycle 2026-05-12 (ADR-2026-05-12) — 전 partition / 전 manager / 전 chassis 수집 활성.
    data.multi_node 컨테이너에 partitions / managers / chassis 리스트 노출 (Additive).
