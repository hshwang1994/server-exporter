---
adapter_id: redfish_hpe_superdome_flex
priority: 101

match:
  vendor: ["HPE", "Hewlett Packard Enterprise"]
  model_patterns:
    - "^Superdome Flex 280.*"
    - "^Superdome Flex(?! 280).*"
    - ".*Superdome.*Flex.*"
  firmware_patterns:
    - "^[23]\\.[0-9]+\\..*"
    - "iLO\\s*5\\b"

capabilities:
  sections_supported:
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power
    - thermal

vendor_notes:
  multi_partition: true
  multi_node_support: true
  systems_id_pattern: "Partition*"
  manager_layout: "rmc_primary_ilo_secondary"
  rmc_firmware_min: "2.0"
  ilo5_firmware_min: "2.0"
  npar_firmware_bundles: true
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    - bmc
    graceful_degradation_optional_sections:
    - firmware
    - power
    - storage
    - network
    auth_preferred:
    - session
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: HPE Superdome Flex / Flex 280 — RMC + iLO 5 dual-manager, multi-partition (nPAR). cycle 2026-05-12
      (ADR-2026-05-12) — 전 partition / 전 manager / 전 chassis 수집 활성. data.multi_node 컨테이너에 partitions / managers / chassis 리스트
      노출 (Additive).

