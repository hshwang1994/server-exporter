---
adapter_id: redfish_cisco_cimc
priority: 100

match:
  vendor: ["Cisco", "Cisco Systems Inc", "Cisco Systems Inc.", "Cisco Systems", "cisco"]
  firmware_patterns: ["^[4-6]\\.", "CIMC.*[4-6]"]
  model_patterns:
    - "UCSC-C[0-9]+[ -]M[4-8]"
    - "C220[ -]M[4-8]"
    - "C240[ -]M[4-8]"
    - "C480[ -]M[4-8]"
    - "UCS-S3260.*"
    - "S3260.*"
    - "TA-UNODE.*"

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

vendor_notes:
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: 이 장비는 Redfish를 지원하지 않거나 구현이 제한적입니다.
