---
adapter_id: redfish_lenovo_xcc
priority: 100

match:
  vendor: ["Lenovo", "LENOVO"]
  firmware_patterns:
    - "XCC"
    - "AFBT*"
    - "TAOT*"
    - "USX*"
  model_patterns:
    - "ThinkSystem.*V2"
    - "ThinkSystem.*V3"
    - "ThinkSystem.*"

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

vendor_notes:
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    auth_preferred:
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: Lenovo XCC 장비 — Redfish 완전 지원.
