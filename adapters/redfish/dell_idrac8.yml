---
adapter_id: redfish_dell_idrac8
priority: 50

match:
  vendor: ["Dell", "Dell Inc.", "DELL"]
  firmware_patterns: ["iDRAC.*8", "^2\\.", "^3\\."]

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

vendor_notes:
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    auth_preferred:
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: Dell iDRAC 8 장비 — Redfish 제한적 지원 (power 섹션 미지원 가능).
