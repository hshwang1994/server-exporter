---
adapter_id: redfish_hpe_ilo7
priority: 120

match:
  vendor: ["HPE", "Hewlett Packard Enterprise"]
  firmware_patterns: ["iLO\\s*7\\b", "^\\d+\\.\\d+\\.\\d+", "^1\\.1[0-9]"]
  model_patterns:
    - "ProLiant DL360 Gen12"
    - "ProLiant DL380 Gen12"
    - "ProLiant DL580 Gen12"
    - "ProLiant ML350 Gen12"
    - "ProLiant Compute DL360 Gen12"
    - "ProLiant Compute DL380 Gen12"

capabilities:
  sections_supported:
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power
    - thermal

vendor_notes:
  storage_controller_method: controllers_sublink
  indicator_led_field: LocationIndicatorActive
  fan_reading_units: Percent
  nic_data_limited: false
  generation: gen12
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    auth_preferred:
    - session
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: HPE iLO 7 장비 (Gen12) — Redfish 완전 지원 가정 (lab 부재 — web sources 기반).

