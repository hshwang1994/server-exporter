---
adapter_id: redfish_hpe_ilo5
priority: 90

match:
  vendor: ["HPE", "Hewlett Packard Enterprise"]
  firmware_patterns: ["iLO\\s*5\\b", "^2\\.[0-9]"]

capabilities:
  sections_supported:
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power
    - thermal

vendor_notes:
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    auth_preferred:
    - session
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: HPE iLO 5 장비 — Redfish 완전 지원.
