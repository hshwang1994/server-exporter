---
adapter_id: redfish_quanta_qct_bmc
channel: redfish
priority: 80

match:
  vendor: ["Quanta", "QUANTA", "Quanta Computer", "Quanta Computer Inc.", "Quanta Cloud Technology", "QCT"]
  model_patterns:
    - "QuantaGrid.*"
    - "QuantaPlex.*"
    - "D54Q.*"
    - "D52BQ.*"

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power
  oem_strategy: "none"

collect:
  strategy: standard_only
  standard_tasks: "redfish-gather/tasks/collect_standard.yml"

normalize:
  standard_tasks: "redfish-gather/tasks/normalize_standard.yml"

credentials:
  profile: "quanta"
  fallback_profiles: []
  recovery_accounts:
    - { vault_label: quanta_factory, role: recovery }

auth:
  preferred: [basic]

graceful_degradation:
  on_section_fail: continue
  on_auth_fail: abort
  critical_sections: [system, hardware]
  optional_sections: [firmware, power]

vendor_notes:
  bmc_name: "BMC"
  base_platform: openbmc
  oem_namespace: "Oem.Quanta_Computer_Inc"
  oem_namespace_fallback: "Oem.QCT"
  oem_namespace_openbmc: "Oem.OpenBmc"
  vault_status: "created (2026-05-11 M-A4)"
  expected_models:
    - "QuantaGrid D54Q-2U"
    - "QuantaGrid D52BQ-2U"
    - "QuantaPlex T42S-2U"

diagnosis:
  protocol_name: redfish
  not_supported_message: "Quanta QCT BMC 장비 (OpenBMC 기반) — Redfish 표준 호환 가정 (lab 부재 — web sources 기반)."
