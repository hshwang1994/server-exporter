---
adapter_id: redfish_inspur_isbmc
channel: redfish
priority: 80

match:
  vendor: ["Inspur", "INSPUR", "Inspur Information Technology Company Limited", "Inspur Information", "Inspur Systems"]
  model_patterns:
    - "NF5280.*"
    - "NF8480.*"
    - "NF5466.*"
    - "TS860.*"
    - "SA5212.*"

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

collect:
  strategy: standard_only
  standard_tasks: "redfish-gather/tasks/collect_standard.yml"

normalize:
  standard_tasks: "redfish-gather/tasks/normalize_standard.yml"

credentials:
  profile: "inspur"
  fallback_profiles: []
  recovery_accounts:
    - { vault_label: inspur_factory, role: recovery }

auth:
  preferred: [basic]

graceful_degradation:
  on_section_fail: continue
  on_auth_fail: abort
  critical_sections: [system, hardware]
  optional_sections: [firmware, power]

vendor_notes:
  bmc_name: "ISBMC"
  oem_namespace: "Oem.Inspur"
  vault_status: "created (2026-05-11) — vault/<loc>/redfish/inspur.yml"
  expected_models:
    - "NF5280M5"
    - "NF5280M6"
    - "NF5280LM6"
    - "NF8480M6"

diagnosis:
  protocol_name: redfish
  not_supported_message: "Inspur ISBMC 장비 — Redfish 표준 호환 가정 (lab 부재 — web sources 기반)."
