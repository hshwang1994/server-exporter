---
adapter_id: redfish_dell_idrac
priority: 10

match:
  vendor: ["Dell", "Dell Inc.", "DELL"]

capabilities:
  sections_supported:
    - system
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power

vendor_notes:
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    auth_preferred:
    - session
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: Dell 장비이나 Redfish를 지원하지 않습니다 (iDRAC 7 등 구 세대 추정).
