---
adapter_id: redfish_hpe_csus_3200
priority: 102

match:
  vendor: ["HPE", "Hewlett Packard Enterprise"]
  model_patterns:
    - "^Compute Scale-up Server 3200.*"
    - "^HPE Compute Scale-up Server.*3200.*"
    - ".*Compute Scale-up Server 3200.*"
    - ".*CSUS.*3200.*"
  firmware_patterns:
    - "^1\\.[0-9]+\\..*"
    - "^[34]\\.[0-9]+\\..*"

capabilities:
  sections_supported:
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power
    - thermal

vendor_notes:
  multi_partition: true
  multi_node_support: true
  systems_id_pattern: "Partition*"
  manager_layout: "rmc_primary"
  rmc_firmware_min: "1.0"
  npar_firmware_bundles: true
  socket_module: "4-socket"
  memory_dimm: "DDR5"
  oneview_supported: true
  composition_service: true
  fabrics_flexgrid: true
  chassis_thermal: true
  manager_log_services: true
  partition_boot_order: true
  design_hints:
    collect_strategy: standard_only
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    - bmc
    graceful_degradation_optional_sections:
    - firmware
    - power
    - storage
    - network
    auth_preferred:
    - session
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: HPE Compute Scale-up Server 3200 (CSUS 3200) — RMC + PDHC 관리, multi-partition (nPAR). cycle
      2026-05-12 (ADR-2026-05-12) — 전 partition / 전 manager / 전 chassis 수집 활성. cycle 2026-06-09 (ADR-2026-06-09) — partitions[].boot
      / chassis[].thermal / managers[].log_services / multi_node.composition (ResourceBlocks) / multi_node.fabrics (FlexGrid)
      추가. data.multi_node 컨테이너에 노출 (Additive). lab 부재 — 사이트 실측 시 model_patterns / firmware_patterns / OEM schema 정정 의무.

