---
adapter_id: redfish_huawei_ibmc
priority: 80

match:
  vendor: ["Huawei", "HUAWEI", "Huawei Technologies Co., Ltd.", "Huawei Technologies"]
  model_patterns:
    - "FusionServer.*"
    - "2288H V[5-9]"
    - "2288X V[5-9]"
    - "2488H V[5-9]"
    - "1288H V[5-9]"
    - "RH.*"
    - "XH.*"
    - "BH.*"
    - "Atlas.*"
    - ".*Atlas 800.*"
    - ".*Atlas 500.*"
  firmware_patterns:
    - "(?:^|[^0-9.])1\\."
    - "(?:^|[^0-9.])2\\."
    - "(?:^|[^0-9.])3\\."
    - "(?:^|[^0-9.])4\\."
    - "(?:^|[^0-9.])5\\."

capabilities:
  sections_supported:
    - hardware
    - bmc
    - cpu
    - memory
    - storage
    - network
    - firmware
    - power
    - thermal

vendor_notes:
  bmc_name: "iBMC"
  manager_uri_hint: "/redfish/v1/Managers/iBMC"
  oem_namespace: "Oem.Huawei"
  vault_status: "created (2026-05-11 M-A1) — vault/<loc>/redfish/huawei.yml"
  expected_models:
    - "FusionServer Pro 2288H V5"
    - "FusionServer Pro 2288X V5"
    - "FusionServer Pro 2488H V5"
    - "FusionServer Pro 1288H V6"
    - "Atlas 800 (AI training)"
  generation_matrix:
    "1.x": "DSP0268 v1.0 부분 / OEM 약함 / SimpleStorage / Power legacy"
    "2.x": "DSP0268 v1.4+ / Oem.Huawei 강화 / standard storage / Power legacy"
    "3.x": "DSP0268 v1.8+ / PowerSubsystem 부분 도입"
    "4.x": "DSP0268 v1.10+ / 표준 가까움 / PowerSubsystem 완전"
    "5.x": "DSP0268 v1.13+ / Atlas AI 서버 분기"
  design_hints:
    collect_strategy: standard_only
    collect_storage_strategy: standard_with_simple_fallback
    collect_power_strategy: subsystem_with_legacy_fallback
    graceful_degradation_on_section_fail: continue
    graceful_degradation_on_auth_fail: abort
    graceful_degradation_critical_sections:
    - system
    - hardware
    graceful_degradation_optional_sections:
    - firmware
    - power
    auth_preferred:
    - basic
    diagnosis_protocol_name: redfish
    diagnosis_not_supported_message: Huawei iBMC 장비 — Redfish 표준 호환 가정 (lab 부재 — web sources 기반).
    capabilities_redfish_version: 1.0+
    capabilities_power_subsystem: conditional
    capabilities_storage_strategy: conditional
    capabilities_oem_strategy: none
    capabilities_oem_namespace: Oem.Huawei

metadata:
  vendor: huawei
  generation: ibmc
  generation_year: "2014-2024+"
  redfish_introduction: "DSP0268 v1.0+ (1.x) ~ v1.13+ (5.x)"
  origin: "https://support.huawei.com/enterprise/en/doc/EDOC1000163550/41dfb258/ibmc"
  lab_status: "부재 — 사용자 명시 2026-05-01"
  next_action: "lab 도입 후 별도 cycle — generation 별 capability 실측 보정 (rule 50 R2 단계 10 / rule 96 R1-C)"
