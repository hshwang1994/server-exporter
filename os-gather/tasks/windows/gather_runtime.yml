---
# os-gather/tasks/windows/gather_runtime.yml
#
# P5 sub-phase b (cycle 2026-04-29): Windows 운영 런타임 정보.
# w32tm / Get-NetFirewallProfile / Get-NetTCPConnection / Win32_PageFileUsage.
# best-effort: 일부 cmdlet 미설치 / 권한 부족 시 빈 값.
#
# 출력 sub-key: data.system.runtime
#
# 2026-09-03 (OS/ESXi 전수 검수 후속 — B-31/B-32): 이 파일이 Windows system.runtime 의 **단일 구현**이다.
#   종전에는 gather_system.yml 이 같은 9 키를 다른 의미로 먼저 만들고 여기서 통째로 덮어썼다.
#   - ntp_synchronized / ntp_active: 모르면 null (false 단정 금지)
#   - firewall_state: 프로필을 하나도 못 읽으면 null (종전 'inactive' — 보안 필드 거짓 단정)
#   - listening_ports: 상한 50 절단 제거
#   - swap_*_mb: pagefile 조회 실패 시 null (0 placeholder 금지)
#   - rescue: 9 키를 모두 null 로 낸다 (다른 곳이 runtime 을 만들지 않으므로 키가 사라지면 안 된다)
#
# 2026-10-03 (P4 — Windows 원격 호출 통합, win_shell 4 → 1):
#   - 종전 네 호출(timezone + NTP / firewall profiles / listening TCP ports / pagefile) 을 스크립트 하나로
#     합쳤다. 출력 = JSON 문서 1개, 구성요소(ntp / firewall / ports / pagefile) = { ok, error, rows, data }.
#     구성요소 본문에서 종료 오류가 나면 그 구성요소만 ok=false + error 로 남고 나머지는 그대로 채워진다
#     (예: Get-NetFirewallProfile 이 예외를 던지면 firewall 만 실패, 아래 errors[] scope=firewall 은 종전과 같다).
#   - "split document" 가 문서를 종전 호출별 register 모양(_w_rt_ntp / _w_rt_fw / _w_rt_ports / _w_rt_pagefile
#     의 stdout · stdout_lines · rc) 으로 되돌린다. 그 아래 parse · fragment · rescue 는 종전 그대로다.
#     rc 는 그 구성요소가 따로 실행됐다면 냈을 값이다 — 스크립트 전체가 실패하면 그 rc,
#     구성요소에서 종료 오류가 났으면 1 (powershell.exe -EncodedCommand 의 종료 코드), 아니면 0.
#     pagefile 조회 실패(-ErrorAction Stop) 가 rc≠0 → swap_* null 이 되는 종전 판정도 그대로 이어진다.

- block:
    - name: "windows | runtime | timezone + NTP + firewall + ports + pagefile"
      ansible.windows.win_shell: |
        function Invoke-SeComponent($Doc, [string]$Name, [scriptblock]$Body) {
          $c = [ordered]@{ ok = $true; error = $null; rows = (New-Object System.Collections.ArrayList); data = $null }
          $Doc[$Name] = $c
          try { $null = & $Body $c }
          catch { $c.ok = $false; $c.error = [string]$_.Exception.Message; if (-not $c.error) { $c.error = [string]$_ } }
        }
        $doc = [ordered]@{}
        Invoke-SeComponent $doc 'ntp' {
          param($c)
          # windows-audit (2026-04-29):
          #   1) timezone: Windows TZ ID → IANA 매핑 (Linux 표기와 일관). 매핑 없으면 raw 유지.
          #   2) NTP: w32tm /query /status 출력은 OS locale 의존 (en/ko/ja/...).
          #      → w32tm /query /source (locale-free) 로 동기화 원본을 본다.
          $tzId = $null
          try { $tzId = (Get-TimeZone -ErrorAction Stop).Id } catch { $tzId = $null }
          $tzMap = @{
            'Korea Standard Time' = 'Asia/Seoul'
            'Tokyo Standard Time' = 'Asia/Tokyo'
            'China Standard Time' = 'Asia/Shanghai'
            'Singapore Standard Time' = 'Asia/Singapore'
            'India Standard Time' = 'Asia/Kolkata'
            'Pacific Standard Time' = 'America/Los_Angeles'
            'Mountain Standard Time' = 'America/Denver'
            'Central Standard Time' = 'America/Chicago'
            'Eastern Standard Time' = 'America/New_York'
            'Hawaiian Standard Time' = 'Pacific/Honolulu'
            'Alaskan Standard Time' = 'America/Anchorage'
            'GMT Standard Time' = 'Europe/London'
            'W. Europe Standard Time' = 'Europe/Berlin'
            'Romance Standard Time' = 'Europe/Paris'
            'Central European Standard Time' = 'Europe/Warsaw'
            'Russian Standard Time' = 'Europe/Moscow'
            'AUS Eastern Standard Time' = 'Australia/Sydney'
            'New Zealand Standard Time' = 'Pacific/Auckland'
            'UTC' = 'UTC'
          }
          $tzIana = if ($tzId -and $tzMap.ContainsKey($tzId)) { $tzMap[$tzId] } else { $tzId }

          $svc = Get-Service -Name W32Time -ErrorAction SilentlyContinue
          # 서비스 조회 실패(null) 와 미실행(false) 을 구분한다.
          $svc_running = if ($svc) { [bool]($svc.Status -eq 'Running') } else { $null }

          # Locale-free sync detection: 조회 실패 → null, 로컬 클럭/free-running → false, 외부 원본 → true
          $source = $null
          $is_synced = $null
          try {
            $src = w32tm /query /source 2>$null
            if ($LASTEXITCODE -eq 0 -and $src) {
              $source = ($src | Select-Object -First 1).ToString().Trim()
              $is_synced = [bool]($source -and $source -ne 'Local CMOS Clock' -and $source -notmatch 'Free-running')
            }
          } catch {}

          # last sync timestamp from w32tm (locale-aware best-effort, multiple language patterns)
          $sync = ''
          try {
            $w32tm = w32tm /query /status 2>$null
            if ($w32tm) {
              $patterns = @(
                'Last Successful Sync Time',
                'Letzter erfolgreicher Synchronisierungszeitpunkt'
              )
              foreach ($p in $patterns) {
                $line = ($w32tm | Select-String -SimpleMatch $p | Select-Object -First 1)
                if ($line) {
                  $sync = ($line.ToString() -split ':\s*', 2)[1]
                  break
                }
              }
            }
          } catch {}

          # ISO normalize: locale-aware string -> UTC ISO 8601
          $sync_iso = $null
          if ($sync) {
            try { $sync_iso = ([datetime]::Parse($sync.Trim())).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } catch {}
          }

          $c.data = @{
            timezone      = $tzIana
            timezone_raw  = $tzId
            w32time_running = $svc_running
            source        = $source
            synced        = $is_synced
            last_sync     = $sync_iso
          }
        }
        Invoke-SeComponent $doc 'firewall' {
          param($c)
          if (Get-Command Get-NetFirewallProfile -ErrorAction SilentlyContinue) {
            # D-03 (2026-10-10): 유효 정책(GPO 적용 뒤) — PersistentStore(로컬 설정)가 아니라 ActiveStore 를 읽는다
            Get-NetFirewallProfile -PolicyStore ActiveStore | ForEach-Object {
              [void]$c.rows.Add([PSCustomObject]@{
                profile = $_.Name
                enabled = [bool]$_.Enabled
                default_inbound  = [string]$_.DefaultInboundAction
                default_outbound = [string]$_.DefaultOutboundAction
              })
            }
          }
        }
        Invoke-SeComponent $doc 'ports' {
          param($c)
          if (Get-Command Get-NetTCPConnection -ErrorAction SilentlyContinue) {
            Get-NetTCPConnection -State Listen |
              Select-Object -ExpandProperty LocalPort -Unique |
              Sort-Object |
              ForEach-Object { [void]$c.rows.Add($_) }
          }
        }
        Invoke-SeComponent $doc 'pagefile' {
          param($c)
          # 조회 성공 + pagefile 없음 = 빈 rows (합계 0 이 사실). 조회 자체 실패는 ok=false (종전 rc≠0).
          $pf = @(Get-CimInstance Win32_PageFileUsage -ErrorAction Stop)
          $pf | ForEach-Object {
            [void]$c.rows.Add([PSCustomObject]@{
              name        = $_.Name
              size_mb     = [int]$_.AllocatedBaseSize
              used_mb     = [int]$_.CurrentUsage
              peak_mb     = [int]$_.PeakUsage
            })
          }
        }
        try { $doc | ConvertTo-Json -Depth 8 -Compress }
        catch { '{"_error":' + (ConvertTo-Json ([string]$_.Exception.Message) -Compress) + '}' }
      register:    _w_rt_doc_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "windows | runtime | parse document"
      ansible.builtin.set_fact:
        _w_rt_doc: >-
          {{ (_w_rt_doc_raw.stdout | default('') | trim | from_json)
             if (_w_rt_doc_raw.stdout | default('') | trim | length > 0) else {} }}
      no_log: true

    # 문서 → 종전 호출별 register 모양 (stdout / stdout_lines / rc — rc 규칙은 파일 머리말).
    #   _w_rt_ntp      : 종전 "timezone + NTP"      — stdout = 구성요소 data 의 JSON (없으면 '')
    #   _w_rt_fw       : 종전 "firewall profiles"   — stdout_lines = 프로필마다 JSON 한 줄
    #   _w_rt_ports    : 종전 "listening TCP ports" — stdout_lines = 포트 번호 문자열 한 줄씩
    #   _w_rt_pagefile : 종전 "pagefile (swap)"     — stdout_lines = pagefile 마다 JSON 한 줄
    - name: "windows | runtime | split document"
      ansible.builtin.set_fact:
        _w_rt_ntp: >-
          {%- set d = _w_rt_doc if (_w_rt_doc is mapping) else {} -%}
          {%- set c = d.get('ntp') if (d.get('ntp') is mapping) else {} -%}
          {%- set v = c.get('data') -%}
          {%- set s = (v | to_json) if (v is mapping) else '' -%}
          {%- set out = {'stdout': s, 'stdout_lines': ([s] if s else [])} -%}
          {%- if _w_rt_doc_raw.rc is defined -%}
            {%- set r = _w_rt_doc_raw.rc -%}
            {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
          {%- endif -%}
          {{ out }}
        _w_rt_fw: >-
          {%- set d = _w_rt_doc if (_w_rt_doc is mapping) else {} -%}
          {%- set c = d.get('firewall') if (d.get('firewall') is mapping) else {} -%}
          {%- set rows = c.get('rows') -%}
          {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
          {%- set lines = rows | map('to_json') | list -%}
          {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
          {%- if _w_rt_doc_raw.rc is defined -%}
            {%- set r = _w_rt_doc_raw.rc -%}
            {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
          {%- endif -%}
          {{ out }}
        _w_rt_ports: >-
          {%- set d = _w_rt_doc if (_w_rt_doc is mapping) else {} -%}
          {%- set c = d.get('ports') if (d.get('ports') is mapping) else {} -%}
          {%- set rows = c.get('rows') -%}
          {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
          {%- set lines = rows | map('string') | list -%}
          {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
          {%- if _w_rt_doc_raw.rc is defined -%}
            {%- set r = _w_rt_doc_raw.rc -%}
            {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
          {%- endif -%}
          {{ out }}
        _w_rt_pagefile: >-
          {%- set d = _w_rt_doc if (_w_rt_doc is mapping) else {} -%}
          {%- set c = d.get('pagefile') if (d.get('pagefile') is mapping) else {} -%}
          {%- set rows = c.get('rows') -%}
          {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
          {%- set lines = rows | map('to_json') | list -%}
          {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
          {%- if _w_rt_doc_raw.rc is defined -%}
            {%- set r = _w_rt_doc_raw.rc -%}
            {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
          {%- endif -%}
          {{ out }}
      no_log: true

    - name: "windows | runtime | parse + build fragment"
      ansible.builtin.set_fact:
        _w_rt_ntp_obj: >-
          {{ (_w_rt_ntp.stdout | default('') | trim | from_json)
             if (_w_rt_ntp.stdout | default('') | trim | length > 0)
             else {} }}
        _w_rt_fw_list: >-
          {%- set out = [] -%}
          {%- for line in (_w_rt_fw.stdout_lines | default([])) -%}
            {%- if line | trim -%}
              {%- set _ = out.append(line | from_json) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _w_rt_ports_list: >-
          {%- set out = [] -%}
          {%- for line in (_w_rt_ports.stdout_lines | default([])) -%}
            {%- if (line | trim).isdigit() -%}
              {%- set _ = out.append(line | trim | int) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _w_rt_pagefile_list: >-
          {%- set out = [] -%}
          {%- for line in (_w_rt_pagefile.stdout_lines | default([])) -%}
            {%- if line | trim -%}
              {%- set _ = out.append(line | from_json) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _w_rt_pagefile_ok: "{{ (_w_rt_pagefile.rc | default(1)) | int == 0 }}"
      no_log: true

    # cycle-016 Phase P 후속: Linux 와 키 일관성 통일
    - name: "windows | runtime | merge fragment"
      ansible.builtin.set_fact:
        _data_fragment:
          system:
            runtime:
              timezone:         "{{ _w_rt_ntp_obj.timezone | default(none, true) or none }}"
              # W32Time 서비스 실행 여부. 조회 실패(null) 는 null.
              ntp_active: >-
                {%- set r = _w_rt_ntp_obj.w32time_running | default(none) -%}
                {{ (r | bool) if (r is not none and (r | string | lower) in ['true','false']) else none }}
              # windows-audit: locale-independent (w32tm /query /source) — Korean/Japanese 서버에서도 정확.
              # 조회 실패 → null (false 단정 금지).
              ntp_synchronized: >-
                {%- set r = _w_rt_ntp_obj.synced | default(none) -%}
                {{ (r | bool) if (r is not none and (r | string | lower) in ['true','false']) else none }}
              firewall_tool:    "windows_firewall"
              # 프로필을 하나도 못 읽으면 null. 하나라도 enabled 면 active, 전부 disabled 면 inactive.
              firewall_state: >-
                {# Round 19 (R19-1): plain set 은 for-loop 밖으로 전파되지 않아 any_enabled 가
                   항상 false → firewall_state 가 모든 호스트에서 'inactive' 오보(보안 필드).
                   인접 swap_* 와 동일하게 namespace 사용 (loop-scoping fix). #}
                {%- set ns = namespace(any=false) -%}
                {%- for fw in _w_rt_fw_list -%}
                  {%- if fw.enabled | default(false) -%}{%- set ns.any = true -%}{%- endif -%}
                {%- endfor -%}
                {%- if (_w_rt_fw_list | length) == 0 -%}{{ none }}
                {%- else -%}{{ 'active' if ns.any else 'inactive' }}
                {%- endif -%}
              listening_ports: >-
                {%- set out = [] -%}
                {%- for p in (_w_rt_ports_list | default([])) -%}
                  {%- set _ = out.append(p | string) -%}
                {%- endfor -%}
                {{ out }}
              # production-audit (2026-04-29): Jinja2 loop scoping 버그 수정 — namespace pattern (cycle-016 memory/storage와 일치)
              # 기존: `{% set total = total + ... %}` 는 loop 종료 시 마지막 iteration 값만 보존 → 합계가 아닌 마지막 pagefile 크기만 emit
              swap_total_mb: >-
                {%- if not (_w_rt_pagefile_ok | bool) -%}{{ none }}
                {%- else -%}
                {%- set ns = namespace(t=0) -%}
                {%- for pf in (_w_rt_pagefile_list | default([])) -%}
                  {%- set ns.t = ns.t + (pf.size_mb | default(0) | int) -%}
                {%- endfor -%}
                {{ ns.t }}
                {%- endif -%}
              swap_used_mb: >-
                {%- if not (_w_rt_pagefile_ok | bool) -%}{{ none }}
                {%- else -%}
                {%- set ns = namespace(u=0) -%}
                {%- for pf in (_w_rt_pagefile_list | default([])) -%}
                  {%- set ns.u = ns.u + (pf.used_mb | default(0) | int) -%}
                {%- endfor -%}
                {{ ns.u }}
                {%- endif -%}
              swap_free_mb: >-
                {%- if not (_w_rt_pagefile_ok | bool) -%}{{ none }}
                {%- else -%}
                {%- set ns = namespace(t=0, u=0) -%}
                {%- for pf in (_w_rt_pagefile_list | default([])) -%}
                  {%- set ns.t = ns.t + (pf.size_mb | default(0) | int) -%}
                  {%- set ns.u = ns.u + (pf.used_mb | default(0) | int) -%}
                {%- endfor -%}
                {{ ns.t - ns.u }}
                {%- endif -%}
              # Windows-specific 부가 정보 (Linux 키 외 추가 — 일관성 유지하면서 풍부함 보존)
              firewall_profiles: "{{ _w_rt_fw_list }}"
              pagefiles:        "{{ _w_rt_pagefile_list }}"
              ntp_last_sync:    "{{ _w_rt_ntp_obj.last_sync | default(none, true) or none }}"
        _sections_supported_fragment: ['system']
        _sections_collected_fragment: ['system']
        _sections_failed_fragment:    []
        # 네 조회 중 실패한 것이 있으면 사유를 남긴다 (섹션 status 는 유지 — 시나리오 B).
        _errors_fragment: >-
          {%- set failed = [] -%}
          {%- if (_w_rt_ntp.rc | default(1)) | int != 0 -%}{%- set _ = failed.append('timezone,ntp') -%}{%- endif -%}
          {%- if (_w_rt_fw.rc | default(1)) | int != 0 -%}{%- set _ = failed.append('firewall') -%}{%- endif -%}
          {%- if (_w_rt_ports.rc | default(1)) | int != 0 -%}{%- set _ = failed.append('listening_ports') -%}{%- endif -%}
          {%- if not (_w_rt_pagefile_ok | bool) -%}{%- set _ = failed.append('pagefile') -%}{%- endif -%}
          {%- if failed -%}
            {{ [{'section': 'system',
                 'message': '서버 기본 정보 중 운영 환경 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
                 'detail': 'scope=' ~ (failed | join(',')) ~ '; os=windows; cause=command_failed'}] }}
          {%- else -%}{{ [] }}
          {%- endif -%}
      no_log: true
  rescue:
    - name: "windows | runtime | rescue (all-null runtime)"
      ansible.builtin.set_fact:
        # 2026-09-03: 이 파일이 runtime 의 단일 구현이므로 예외 시에도 9 키를 null 로 낸다
        #   (키가 빠지면 호출자 계약(system.runtime 9 키) 이 깨진다). 섹션 status 는 유지한다.
        _data_fragment:
          system:
            runtime:
              timezone:         null
              ntp_active:       null
              ntp_synchronized: null
              firewall_tool:    "windows_firewall"
              firewall_state:   null
              listening_ports:  []
              swap_total_mb:    null
              swap_used_mb:     null
              swap_free_mb:     null
        _sections_supported_fragment: ['system']
        _sections_collected_fragment: []
        _sections_failed_fragment:    []
        # M1: Linux 와 **같은 문장** (linux/gather_system.yml). OS 구분은 detail 로만 남긴다.
        _errors_fragment:
          - section: system
            message: "서버 기본 정보 중 운영 환경 정보를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
            detail: >-
              {{ 'scope=timezone,ntp,firewall,listening_ports,pagefile; os=windows; cause=task_failed; msg='
                 ~ ((ansible_failed_result.msg | default('') | string | trim) or 'none') }}
      no_log: true

- name: "windows | runtime | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
