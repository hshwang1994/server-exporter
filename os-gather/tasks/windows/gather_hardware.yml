---

- name: "windows | hardware | Win32_ComputerSystem + Win32_BIOS"
  ansible.windows.win_shell: |
    $cimErrors = @()
    function Get-SeErrText($Errs) {
      $e = @($Errs)[0]
      if ($null -eq $e) { return '' }
      if ($e -is [System.Management.Automation.ErrorRecord]) { return [string]$e.Exception.Message }
      if ($e -is [System.Exception]) { return [string]$e.Message }
      return [string]$e
    }
    $csErr = $null;   $cs     = Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue -ErrorVariable csErr
    if ($csErr)   { $cimErrors += ('Win32_ComputerSystem: ' + (Get-SeErrText $csErr)) }
    $cspErr = $null;  $csp    = Get-CimInstance Win32_ComputerSystemProduct -ErrorAction SilentlyContinue -ErrorVariable cspErr
    if ($cspErr)  { $cimErrors += ('Win32_ComputerSystemProduct: ' + (Get-SeErrText $cspErr)) }
    $biosErr = $null; $bios   = Get-CimInstance Win32_BIOS -ErrorAction SilentlyContinue -ErrorVariable biosErr
    if ($biosErr) { $cimErrors += ('Win32_BIOS: ' + (Get-SeErrText $biosErr)) }
    $encErr = $null;  $sysenc = Get-CimInstance Win32_SystemEnclosure -ErrorAction SilentlyContinue -ErrorVariable encErr
    if ($encErr)  { $cimErrors += ('Win32_SystemEnclosure: ' + (Get-SeErrText $encErr)) }

    $uuid = if ($cs.UUID) { $cs.UUID }
            elseif ($csp -and $csp.UUID) { $csp.UUID }
            else { $null }
    if ($uuid -in @('', '00000000-0000-0000-0000-000000000000', 'FFFFFFFF-FFFF-FFFF-FFFF-FFFFFFFFFFFF')) { $uuid = $null }

    $skuRaw = if ($cs.SystemSKUNumber) { [string]$cs.SystemSKUNumber } elseif ($csp -and $csp.SKUNumber) { [string]$csp.SKUNumber } else { '' }
    $sku = if (-not $skuRaw -or $skuRaw.Trim() -in @('','Default string','To Be Filled By O.E.M.','Not Specified','None','NA','N/A','SKU','System SKU')) { $null } else { $skuRaw.Trim() }

    $assetRaw = if ($sysenc) { [string]$sysenc.SMBIOSAssetTag } else { '' }
    $asset = if (-not $assetRaw -or $assetRaw -in @('No Asset Tag','Default string','Asset Tag','Not Specified','To Be Filled By O.E.M.','None','NA','N/A')) { $null } else { $assetRaw }

    $chassisMap = @{
      1='Other'; 2='Unknown'; 3='Desktop'; 4='Low Profile Desktop'; 5='Pizza Box';
      6='Mini Tower'; 7='Tower'; 8='Portable'; 9='Laptop'; 10='Notebook';
      11='Hand Held'; 12='Docking Station'; 13='All in One'; 14='Sub Notebook';
      15='Space-saving'; 16='Lunch Box'; 17='Main Server Chassis'; 18='Expansion Chassis';
      19='SubChassis'; 20='Bus Expansion Chassis'; 21='Peripheral Chassis';
      22='RAID Chassis'; 23='Rack Mount Chassis'; 24='Sealed-case PC';
      25='Multi-system Chassis'; 26='Compact PCI'; 27='Advanced TCA'; 28='Blade';
      29='Blade Enclosure'; 30='Tablet'; 31='Convertible'; 32='Detachable';
      33='IoT Gateway'; 34='Embedded PC'; 35='Mini PC'; 36='Stick PC'
    }
    $chassis = $null
    if ($sysenc -and $sysenc.ChassisTypes) {
      $first = @($sysenc.ChassisTypes)[0]
      if ($first -and $chassisMap.ContainsKey([int]$first)) { $chassis = $chassisMap[[int]$first] }
    }

    $biosDate = $null
    if ($bios.ReleaseDate) {
      try { $biosDate = ([datetime]$bios.ReleaseDate).ToString('yyyy-MM-dd') }
      catch { $biosDate = [string]$bios.ReleaseDate }
    }

    $biosSerRaw = [string]$bios.SerialNumber
    $biosSer = if (-not $biosSerRaw -or $biosSerRaw -in @('NA','N/A','None','Not Specified','To Be Filled By O.E.M.','System Serial Number','Default string','0','00000000')) { $null } else { $biosSerRaw }

    [PSCustomObject]@{
      vendor        = $cs.Manufacturer
      model         = $cs.Model
      system_family = $cs.SystemFamily
      uuid          = $uuid
      sku           = $sku
      total_memory  = $cs.TotalPhysicalMemory
      bios_vendor   = $bios.Manufacturer
      bios_version  = $bios.SMBIOSBIOSVersion
      bios_release  = $biosDate
      bios_serial   = $biosSer
      asset_tag     = $asset
      chassis_type  = $chassis
      power_state   = [string]$cs.PowerState
      cim_errors    = $cimErrors
    } | ConvertTo-Json -Compress
  register: _w_hw_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | hardware | parse + build fragment"
  ansible.builtin.set_fact:
    _w_hw_data: >-
      {%- if _w_hw_raw.stdout is defined and _w_hw_raw.stdout | trim | length > 0 -%}
      {{ _w_hw_raw.stdout | from_json }}
      {%- else -%}
      {}
      {%- endif -%}
  no_log: true

- name: "windows | hardware | normalize serial (nPartition 접미사)"
  vars:
    _w_hw_vendor_hint: "{{ _w_hw_data.vendor | default('', true) }}"
    _w_hw_model_hint: "{{ _w_hw_data.model | default('', true) }}"
  ansible.builtin.set_fact:
    _w_hw_serial: >-
      {{ ((_w_hw_data.bios_serial | default('')) | dmi_sentinel_null('serial')
          | normalize_os_serial(_w_hw_vendor_hint, _w_hw_model_hint))
         or (_w_serial_val | default(none)) }}
    _w_hw_ok: "{{ ((_w_hw_data.vendor | default('', true)) | string | trim | length > 0) or ((_w_hw_data.model | default('', true)) | string | trim | length > 0) or ((_w_hw_data.bios_version | default('', true)) | string | trim | length > 0) }}"
  no_log: true

- name: "windows | hardware | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      hardware:
        vendor:       "{{ _w_hw_data.vendor       | default(none, true) or none }}"
        model:        "{{ _w_hw_data.model        | default(none, true) or none }}"
        serial:       "{{ _w_hw_serial | default(none) }}"
        uuid:         "{{ ((_w_hw_data.uuid | default(none, true)) or (_w_uuid_val | default(none))) | normalize_uuid }}"
        sku:          "{{ _w_hw_data.sku          | default(none, true) or none }}"
        asset_tag:    "{{ _w_hw_data.asset_tag    | default(none, true) or none }}"
        system_family: "{{ _w_hw_data.system_family | default(none, true) or none }}"
        chassis_type: "{{ _w_hw_data.chassis_type | default(none, true) or none }}"
        bios_version: "{{ _w_hw_data.bios_version | default(none, true) or none }}"
        bios_vendor:  "{{ _w_hw_data.bios_vendor  | default(none, true) or none }}"
        bios_date:    "{{ _w_hw_data.bios_release | default(none, true) or none }}"
        total_memory_bytes: "{{ _w_hw_data.total_memory | default(none, true) or none }}"
        oem:          {}
    _sections_supported_fragment: ['hardware']
    _sections_collected_fragment: "{{ ['hardware'] if (_w_hw_ok | bool) else [] }}"
    _sections_failed_fragment:    "{{ [] if (_w_hw_ok | bool) else ['hardware'] }}"
    _errors_fragment: >-
      {%- set cim_errs = (_w_hw_data.cim_errors | default([])) if ((_w_hw_data.cim_errors | default([])) is sequence and (_w_hw_data.cim_errors | default([])) is not string) else [] -%}
      {{ ([] if (_w_hw_ok | bool) else [{
           'section': 'hardware',
           'message': '하드웨어 정보 수집에 실패했습니다. 수집 계정의 권한을 확인하세요.',
           'detail':  ('source=Win32_ComputerSystem,Win32_BIOS; cause=no_output; rc=' ~ (_w_hw_raw.rc | default('none')))}])
         + ([{
           'section': 'hardware',
           'message': '하드웨어 정보 중 일부를 수집하지 못했습니다. 수집 계정의 권한을 확인하세요.',
           'detail':  ('source=cim; cause=call_failed; ' ~ ((cim_errs | map('string') | join(' | ')) | truncate(500, true)))}]
            if ((_w_hw_ok | bool) and (cim_errs | length > 0)) else []) }}
  no_log: true

- name: "windows | hardware | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
