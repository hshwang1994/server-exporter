---

- name: "windows | memory | Win32_PhysicalMemory (total + slots)"
  ansible.windows.win_shell: |
    function Invoke-SeComponent($Doc, [string]$Name, [scriptblock]$Body) {
      $c = [ordered]@{ ok = $true; error = $null; rows = (New-Object System.Collections.ArrayList); data = $null }
      $Doc[$Name] = $c
      try { $null = & $Body $c }
      catch { $c.ok = $false; $c.error = [string]$_.Exception.Message; if (-not $c.error) { $c.error = [string]$_ } }
    }
    $doc = [ordered]@{}
    $mem = @()
    Invoke-SeComponent $doc 'read_physical_memory' {
      param($c)
      $seErr = $null
      $script:mem = @(Get-CimInstance Win32_PhysicalMemory -ErrorAction SilentlyContinue -ErrorVariable seErr)
      if ($seErr) { throw $seErr[0] }
    }
    Invoke-SeComponent $doc 'total' {
      param($c)
      if (-not $doc['read_physical_memory'].ok) { return }
      if ($mem.Count -gt 0) {
        $c.data = [math]::Round(($mem | Measure-Object -Property Capacity -Sum).Sum / 1MB, 0)
      }
    }
    Invoke-SeComponent $doc 'slots' {
      param($c)
      $mem | ForEach-Object {
        $smt = [int]$_.SMBIOSMemoryType
        $type = switch ($smt) {
          1 {"Other"} 3 {"DRAM"} 4 {"EDRAM"} 5 {"VRAM"} 6 {"SRAM"} 7 {"RAM"} 8 {"ROM"} 9 {"Flash"}
          10 {"EEPROM"} 11 {"FEPROM"} 12 {"EPROM"} 13 {"CDRAM"} 14 {"3DRAM"} 15 {"SDRAM"} 16 {"SGRAM"}
          17 {"RDRAM"} 18 {"DDR"} 19 {"DDR2"} 20 {"DDR2 FB-DIMM"} 24 {"DDR3"} 25 {"FBD2"}
          26 {"DDR4"} 27 {"LPDDR"} 28 {"LPDDR2"} 29 {"LPDDR3"} 30 {"LPDDR4"} 31 {"Logical non-volatile device"}
          32 {"HBM"} 33 {"HBM2"} 34 {"DDR5"} 35 {"LPDDR5"} 36 {"HBM3"}
          default { $null }
        }
        if (-not $type) {
          $mt = [int]$_.MemoryType
          $type = switch ($mt) { 20 {"DDR"} 21 {"DDR2"} 22 {"DDR2 FB-DIMM"} 24 {"DDR3"} 26 {"DDR4"} default { $null } }
        }
        $speedRaw = if ($_.ConfiguredClockSpeed -and [int]$_.ConfiguredClockSpeed -gt 0) { [int]$_.ConfiguredClockSpeed }
                    elseif ($_.Speed -and [int]$_.Speed -gt 0) { [int]$_.Speed }
                    else { $null }
        $serRaw = [string]$_.SerialNumber
        $mfrRaw = [string]$_.Manufacturer
        $is_virtual_mem = $mfrRaw -match '(?i)vmware|hyper-?v|microsoft|qemu|kvm|virtual|xen'
        $serNorm = if (-not $serRaw -or $serRaw -match '^0+$' -or
                       ($is_virtual_mem -and $serRaw -match '^0{6,}\d?$') -or
                       $serRaw -in @('NA','N/A','None','Not Specified','To Be Filled By O.E.M.','SerNum0','SerNum1','SerNum2','SerNum3')) { $null } else { $serRaw }
        $cap = $(if ($_.Capacity -and [int64]$_.Capacity -gt 0) { [int]([math]::Round($_.Capacity / 1MB, 0)) } else { $null })
        [void]$c.rows.Add([PSCustomObject]@{
          capacity_mb  = $cap
          type         = $type
          speed_mhz    = $speedRaw
          slot         = $_.DeviceLocator
          manufacturer = $_.Manufacturer
          part_number  = $_.PartNumber
          serial       = $serNorm
        })
      }
      if (-not $doc['read_physical_memory'].ok) { throw $doc['read_physical_memory'].error }
    }
    try { $doc | ConvertTo-Json -Depth 8 -Compress }
    catch { '{"_error":' + (ConvertTo-Json ([string]$_.Exception.Message) -Compress) + '}' }
  register: _w_mem_doc_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | memory | parse document"
  ansible.builtin.set_fact:
    _w_mem_doc: >-
      {{ (_w_mem_doc_raw.stdout | default('') | trim | from_json)
         if (_w_mem_doc_raw.stdout | default('') | trim | length > 0) else {} }}
  no_log: true

- name: "windows | memory | split document"
  ansible.builtin.set_fact:
    _w_mem_raw: >-
      {%- set d = _w_mem_doc if (_w_mem_doc is mapping) else {} -%}
      {%- set c = d.get('total') if (d.get('total') is mapping) else {} -%}
      {%- set v = c.get('data') -%}
      {%- set s = (v | string) if (v is not none) else '' -%}
      {%- set out = {'stdout': s, 'stdout_lines': ([s] if s else [])} -%}
      {%- if _w_mem_doc_raw.rc is defined -%}
        {%- set r = _w_mem_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
    _w_mem_slots_raw: >-
      {%- set d = _w_mem_doc if (_w_mem_doc is mapping) else {} -%}
      {%- set c = d.get('slots') if (d.get('slots') is mapping) else {} -%}
      {%- set rows = c.get('rows') -%}
      {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
      {%- set lines = rows | map('to_json') | list -%}
      {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
      {%- if _w_mem_doc_raw.rc is defined -%}
        {%- set r = _w_mem_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: "windows | memory | parse slots + grouping"
  ansible.builtin.set_fact:
    _w_mem_read_failed: >-
      {%- set d = _w_mem_doc if (_w_mem_doc is mapping) else {} -%}
      {%- set r = d.get('read_physical_memory') -%}
      {{ (r is mapping) and (r.get('ok') is sameas false) }}
    _w_mem_read_error: >-
      {%- set d = _w_mem_doc if (_w_mem_doc is mapping) else {} -%}
      {%- set r = d.get('read_physical_memory') -%}
      {{ ((((r.get('error') if (r is mapping) else '') or '') | string) | replace('\n', ' ') | replace('\r', ' '))[:160] }}
    _w_mem_slots: >-
      {%- set out = [] -%}
      {%- for line in (_w_mem_slots_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set s = line | from_json -%}
          {%- set mfr = (s.manufacturer | trim) if s.manufacturer else none -%}
          {%- set _ = out.append({
            'capacity_mb': (s.capacity_mb | int) if (s.capacity_mb is defined and s.capacity_mb is not none) else none,
            'type': s.type | default(none),
            'speed_mhz': s.speed_mhz | default(none),
            'slot': s.slot | default(none),
            'locator': s.slot | default(none),
            'manufacturer': (mfr | jedec_to_vendor) if mfr else none,
            'part_number': (s.part_number | trim) if s.part_number else none,
            'serial': (s.serial | trim) if s.serial else none
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | memory | summary + totals"
  ansible.builtin.set_fact:
    _w_mem_summary: >-
      {%- set ns = namespace(groups=[], seen={}, total=0) -%}
      {%- for s in (_w_mem_slots | default([])) -%}
        {%- set cap_mb = s.capacity_mb | default(none) -%}
        {%- if cap_mb is not none and (cap_mb | int) > 0 -%}
          {%- set cap_gb = ((cap_mb | int) / 1024) | round(0, 'common') | int -%}
          {%- set t = s.type | default(none) -%}
          {%- set sp = s.speed_mhz | default(none) -%}
          {%- set mfr = s.manufacturer | default(none) -%}
          {%- set pn = s.part_number | default(none) -%}
          {%- set key = (cap_gb|string)~'|'~(t|string)~'|'~(sp|string)~'|'~(mfr|string)~'|'~(pn|string) -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set q = ns.groups[idx].quantity + 1 -%}
            {%- set _ = ns.groups[idx].update({'quantity': q, 'group_total_gb': q * cap_gb}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'unit_capacity_gb': cap_gb, 'type': t, 'speed_mhz': sp, 'manufacturer': mfr, 'part_number': pn, 'quantity': 1, 'group_total_gb': cap_gb}) -%}
          {%- endif -%}
          {%- set ns.total = ns.total + cap_gb -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups, 'grand_total_gb': ns.total} }}
    _w_mem_phys_mb: >-
      {%- set v = (_w_mem_raw.stdout | default('', true)) | string | trim -%}
      {{ (v | int) if (v.isdigit() and (v | int) > 0 and not (_w_mem_read_failed | default(false) | bool)) else none }}
    _w_mem_vis_mb: >-
      {%- set v = ansible_memtotal_mb | default(none) -%}
      {{ (v | int) if (v is not none and (v | string).isdigit() and (v | int) > 0) else none }}
  no_log: true

- name: "windows | memory | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      memory:
        total_mb: >-
          {%- set p = _w_mem_phys_mb | default(none) -%}
          {%- set v = _w_mem_vis_mb | default(none) -%}
          {{ p if p is not none else v }}
        total_basis: >-
          {%- set p = _w_mem_phys_mb | default(none) -%}
          {%- set v = _w_mem_vis_mb | default(none) -%}
          {{ 'physical_installed' if p is not none else ('os_visible' if v is not none else none) }}
        installed_mb: "{{ _w_mem_phys_mb | default(none) }}"
        visible_mb:   "{{ _w_mem_vis_mb | default(none) }}"
        free_mb:      "{{ ansible_memfree_mb | default(none) }}"
        slots:        "{{ _w_mem_slots | default([]) }}"
        summary: >-
          {%- set sm = _w_mem_summary | default({'groups': [], 'grand_total_gb': 0}) -%}
          {%- set p = _w_mem_phys_mb | default(none) -%}
          {%- set v = _w_mem_vis_mb | default(none) -%}
          {%- if (_w_mem_read_failed | default(false) | bool) and (sm.groups | default([]) | length) > 0 -%}{{ {'groups': sm.groups, 'grand_total_gb': none} }}
          {%- elif (sm.grand_total_gb | default(0)) > 0 -%}{{ sm }}
          {%- elif p is not none -%}{{ {'groups': sm.groups, 'grand_total_gb': ((p / 1024) | round(0, 'common') | int)} }}
          {%- elif v is not none -%}{{ {'groups': sm.groups, 'grand_total_gb': ((v / 1024) | round(0, 'common') | int)} }}
          {%- else -%}{{ {'groups': [], 'grand_total_gb': none} }}
          {%- endif -%}
    _sections_supported_fragment: ['memory']
    _sections_collected_fragment: "{{ ['memory'] if ((_w_mem_phys_mb | default(none)) is not none or (_w_mem_vis_mb | default(none)) is not none) else [] }}"
    _sections_failed_fragment:    "{{ [] if ((_w_mem_phys_mb | default(none)) is not none or (_w_mem_vis_mb | default(none)) is not none) else ['memory'] }}"
    _errors_fragment: >-
      {%- set p = _w_mem_phys_mb | default(none) -%}
      {%- set v = _w_mem_vis_mb | default(none) -%}
      {%- set setup_ok = (_w_setup_ok | default(true) | bool) -%}
      {%- set setup_note = ('' if setup_ok else ('; setup=failed; error=' ~ (_w_setup_detail | default('', true)))) -%}
      {%- set rf = (_w_mem_read_failed | default(false) | bool) -%}
      {%- set rerr = _w_mem_read_error | default('', true) -%}
      {%- if p is not none and v is none -%}
        {{ [{'section': 'memory',
             'message': '메모리 정보 중 OS 가 인식한 용량을 읽지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  ('source=setup(ansible_memtotal_mb); cause=' ~ ('no_value' if setup_ok else 'facts_failed') ~ '; effect=visible_mb,free_mb=null' ~ setup_note)}] }}
      {%- elif p is not none -%}{{ [] }}
      {%- elif v is not none and rf -%}
        {{ [{'section': 'memory',
             'message': '메모리 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  ('source=Win32_PhysicalMemory; cause=read_failed; fallback=os_visible; slots=' ~ ((_w_mem_slots | default([])) | length)
                         ~ (('; error=' ~ rerr) if rerr else ''))}] }}
      {%- elif v is not none -%}
        {{ [{'section': 'memory',
             'message': '메모리 정보 중 일부를 수집하지 못했습니다. 수집 계정의 권한을 확인하세요.',
             'detail':  ('source=Win32_PhysicalMemory; cause=no_output; fallback=os_visible; rc=' ~ (_w_mem_raw.rc | default('none')))}] }}
      {%- else -%}
        {{ [{'section': 'memory',
             'message': '메모리 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
             'detail':  ('source=Win32_PhysicalMemory,setup; cause=' ~ ('read_failed' if rf else 'no_output')
                         ~ (('; error=' ~ rerr) if (rf and rerr) else '') ~ '; rc=' ~ (_w_mem_raw.rc | default('none')) ~ setup_note)}] }}
      {%- endif -%}
  no_log: true

- name: "windows | memory | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
