---
# os-gather/tasks/windows/gather_cpu.yml → data.cpu fragment
# cycle-016 Phase O: Win32_Processor 풍부 필드 (manufacturer/max_clock/L2/L3/architecture) 추가

- name: "windows | cpu | collect Win32_Processor 상세"
  ansible.windows.win_shell: |
    # windows-audit (2026-04-29): VMware/일부 BIOS는 Name 필드를 ALL CAPS로 노출
    # ("INTEL(R) XEON(R) SILVER 4510"). Linux 표기와 일관 위해 정규화.
    function Normalize-CpuModel($n) {
      if (-not $n) { return $null }
      # 이미 소문자 포함이면 그대로 (사람 손으로 다듬어진 표기).
      if ($n -cmatch '[a-z]') { return $n }
      $tokens = @{
        'INTEL'='Intel'; 'XEON'='Xeon'; 'CORE'='Core'; 'PENTIUM'='Pentium'; 'CELERON'='Celeron';
        'SILVER'='Silver'; 'GOLD'='Gold'; 'PLATINUM'='Platinum'; 'BRONZE'='Bronze';
        'EPYC'='EPYC'; 'RYZEN'='Ryzen'; 'THREADRIPPER'='Threadripper';
        'GENUINE'='Genuine'; 'AUTHENTIC'='Authentic';
        'PROCESSOR'='Processor'; 'GHZ'='GHz'; 'MHZ'='MHz'
      }
      $out = $n
      foreach ($k in $tokens.Keys) {
        $out = $out -creplace ('\b' + [Regex]::Escape($k) + '\b'), $tokens[$k]
      }
      return $out
    }
    $cpus = @(Get-CimInstance Win32_Processor)
    $procs = @($cpus | ForEach-Object {
      [PSCustomObject]@{
        socket_designation = $_.SocketDesignation
        name               = (Normalize-CpuModel $_.Name)
        manufacturer       = $_.Manufacturer
        cores              = [int]$_.NumberOfCores
        logical            = [int]$_.NumberOfLogicalProcessors
        max_clock_mhz      = [int]$_.MaxClockSpeed
        # [int]$null → 0 (PowerShell) 이라 미보고(null) 캐시가 0 으로 날조됨 (L2 가 VM 에서 null
        # 인데 0 보고, 2026-06-26 site 실측) → 값 존재 시에만 cast, 없으면 null 유지 (날조 금지).
        l2_cache_kb        = $(if ($null -ne $_.L2CacheSize) { [int]$_.L2CacheSize } else { $null })
        l3_cache_kb        = $(if ($null -ne $_.L3CacheSize) { [int]$_.L3CacheSize } else { $null })
        processor_id       = $_.ProcessorId
        architecture_code  = [int]$_.Architecture
      }
    })
    @{
      sockets   = $cpus.Count
      cores     = ($cpus | Measure-Object -Property NumberOfCores -Sum).Sum
      logical   = ($cpus | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
      model     = (Normalize-CpuModel ($cpus | Select-Object -First 1 -ExpandProperty Name))
      manufacturer  = ($cpus | Select-Object -First 1 -ExpandProperty Manufacturer)
      max_clock_mhz = ($cpus | Select-Object -First 1 -ExpandProperty MaxClockSpeed)
      processors = $procs
    } | ConvertTo-Json -Depth 4 -Compress
  register: _w_cpu_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | cpu | parse"
  ansible.builtin.set_fact:
    _w_cpu_data: >-
      {%- if _w_cpu_raw.stdout is defined and _w_cpu_raw.stdout | trim | length > 0 -%}
      {{ _w_cpu_raw.stdout | from_json }}
      {%- else -%}
      {}
      {%- endif -%}
  no_log: true

# cycle-016 Phase O 후속: Linux 와 일관 — manufacturer 정규화 (GenuineIntel → Intel)
- name: "windows | cpu | compute summary groups"
  ansible.builtin.set_fact:
    _w_cpu_summary: >-
      {%- set ns = namespace(groups=[], seen={}) -%}
      {# Round 17 #8: PS5.1 ConvertTo-Json 단일 원소 배열 → object collapse 방어 (gather_storage.yml 동일).
         단일 소켓 호스트(흔한 케이스)에서 processors 가 dict 가 되어 for 가 KEY(문자열)를 순회 →
         p.name/cores/manufacturer 가 Undefined → summary 가 model='unknown'/cores=0 으로 corrupt. #}
      {%- set _procs = _w_cpu_data.processors | default([]) -%}
      {%- if _procs is mapping -%}{%- set _procs = [_procs] -%}{%- endif -%}
      {%- for p in _procs -%}
        {%- set m = p.name | default('unknown') -%}
        {# Round 16: JSON null/비-str manufacturer 시 'X' in None → TypeError (host 전체 rescue
           collapse). default('') 는 undefined 만 치환 → (.. or '') | string 로 str 강제. #}
        {%- set raw_mfr = (p.manufacturer | default('') or '') | string -%}
        {%- set mfr = none -%}
        {%- if 'GenuineIntel' in raw_mfr or 'Intel' in raw_mfr -%}{%- set mfr = 'Intel' -%}
        {%- elif 'AuthenticAMD' in raw_mfr or 'AMD' in raw_mfr -%}{%- set mfr = 'AMD' -%}
        {%- elif raw_mfr -%}{%- set mfr = raw_mfr -%}
        {%- endif -%}
        {%- if m in ns.seen -%}
          {%- set idx = ns.seen[m] -%}
          {# Round 15: 같은 model 중복 시 cores_per_socket 도 재계산 (Redfish _normalize_cpu_raw 의 same-model grouping 과 일관 — 혼합 코어 same-model 평균) #}
          {%- set _nt = ns.groups[idx].total_cores + (p.cores | default(0) | int) -%}
          {%- set _nsk = ns.groups[idx].sockets + 1 -%}
          {%- set _ = ns.groups[idx].update({'sockets': _nsk, 'total_cores': _nt, 'cores_per_socket': (_nt // _nsk)}) -%}
        {%- else -%}
          {%- set _ = ns.seen.update({m: ns.groups | length}) -%}
          {%- set _ = ns.groups.append({
            'model': m,
            'manufacturer': mfr,
            'max_speed_mhz': p.max_clock_mhz | default(none),
            'l2_cache_kb': p.l2_cache_kb | default(none),
            'l3_cache_kb': p.l3_cache_kb | default(none),
            'sockets': 1,
            'cores_per_socket': p.cores | default(0) | int,
            'total_cores': p.cores | default(0) | int
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups} }}
  no_log: true

- name: "windows | cpu | set fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      cpu:
        sockets:         "{{ _w_cpu_data.sockets  | default(none) }}"
        cores_physical:  "{{ _w_cpu_data.cores    | default(none) }}"
        logical_threads: "{{ _w_cpu_data.logical  | default(ansible_processor_vcpus | default(none)) }}"
        model:           "{{ _w_cpu_data.model    | default(none) }}"
        manufacturer: >-
          {# Round 16: JSON null/비-str manufacturer 시 'X' in None → TypeError 방어 (위 summary 와 동일). #}
          {%- set v = (_w_cpu_data.manufacturer | default('') or '') | string -%}
          {%- if 'GenuineIntel' in v or 'Intel' in v -%}Intel
          {%- elif 'AuthenticAMD' in v or 'AMD' in v -%}AMD
          {%- elif v -%}{{ v }}
          {%- else -%}{{ none }}
          {%- endif -%}
        max_speed_mhz:   "{{ _w_cpu_data.max_clock_mhz | default(none) }}"
        architecture: >-
          {%- set _arch = ansible_architecture | default('') -%}
          {%- if _arch in ['x86_64', 'AMD64', 'amd64'] -%}x86_64
          {%- elif '64' in _arch -%}x86_64
          {%- elif _arch in ['i386', 'i686', 'x86'] -%}i386
          {%- elif '32' in _arch or '86' in _arch -%}i386
          {%- elif _arch -%}{{ _arch }}
          {%- else -%}{{ none }}
          {%- endif -%}
        summary:         "{{ _w_cpu_summary | default({'groups': []}) }}"
    _sections_supported_fragment: ['cpu']
    _sections_collected_fragment: ['cpu']
    _sections_failed_fragment:    []
    _errors_fragment:             []
  no_log: true

- name: "windows | cpu | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
