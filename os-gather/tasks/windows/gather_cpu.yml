---

- name: "windows | cpu | collect Win32_Processor 상세"
  ansible.windows.win_shell: |
    function Normalize-CpuModel($n) {
      if (-not $n) { return $null }
      if ($n -cmatch '[a-z]') { return $n }
      $tokens = @{
        'INTEL'='Intel'; 'XEON'='Xeon'; 'CORE'='Core'; 'PENTIUM'='Pentium'; 'CELERON'='Celeron';
        'SILVER'='Silver'; 'GOLD'='Gold'; 'PLATINUM'='Platinum'; 'BRONZE'='Bronze';
        'EPYC'='EPYC'; 'RYZEN'='Ryzen'; 'THREADRIPPER'='Threadripper';
        'GENUINE'='Genuine'; 'AUTHENTIC'='Authentic';
        'PROCESSOR'='Processor'; 'GHZ'='GHz'; 'MHZ'='MHz'
      }
      $out = $n
      foreach ($k in $tokens.Keys) {
        $out = $out -creplace ('\b' + [Regex]::Escape($k) + '\b'), $tokens[$k]
      }
      return $out
    }
    $cpus = @(Get-CimInstance Win32_Processor)
    $procs = @($cpus | ForEach-Object {
      [PSCustomObject]@{
        socket_designation = $_.SocketDesignation
        name               = (Normalize-CpuModel $_.Name)
        manufacturer       = $_.Manufacturer
        cores              = $(if ($null -ne $_.NumberOfCores) { [int]$_.NumberOfCores } else { $null })
        logical            = $(if ($null -ne $_.NumberOfLogicalProcessors) { [int]$_.NumberOfLogicalProcessors } else { $null })
        max_clock_mhz      = $(if ($_.MaxClockSpeed -and [int]$_.MaxClockSpeed -gt 0) { [int]$_.MaxClockSpeed } else { $null })
        l2_cache_kb        = $(if ($_.L2CacheSize -and [int]$_.L2CacheSize -gt 0) { [int]$_.L2CacheSize } else { $null })
        l3_cache_kb        = $(if ($_.L3CacheSize -and [int]$_.L3CacheSize -gt 0) { [int]$_.L3CacheSize } else { $null })
        processor_id       = $_.ProcessorId
        architecture_code  = [int]$_.Architecture
      }
    })
    $coreSum = ($cpus | Where-Object { $null -ne $_.NumberOfCores } | Measure-Object -Property NumberOfCores -Sum).Sum
    $logSum  = ($cpus | Where-Object { $null -ne $_.NumberOfLogicalProcessors } | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
    @{
      sockets   = $cpus.Count
      cores     = $(if ($null -ne $coreSum -and $coreSum -gt 0) { [int]$coreSum } else { $null })
      logical   = $(if ($null -ne $logSum -and $logSum -gt 0) { [int]$logSum } else { $null })
      model     = (Normalize-CpuModel ($cpus | Select-Object -First 1 -ExpandProperty Name))
      manufacturer  = ($cpus | Select-Object -First 1 -ExpandProperty Manufacturer)
      max_clock_mhz = $(if ($cpus.Count -gt 0 -and $cpus[0].MaxClockSpeed -and [int]$cpus[0].MaxClockSpeed -gt 0) { [int]$cpus[0].MaxClockSpeed } else { $null })
      processors = $procs
    } | ConvertTo-Json -Depth 4 -Compress
  register: _w_cpu_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | cpu | parse"
  ansible.builtin.set_fact:
    _w_cpu_data: >-
      {%- if _w_cpu_raw.stdout is defined and _w_cpu_raw.stdout | trim | length > 0 -%}
      {{ _w_cpu_raw.stdout | from_json }}
      {%- else -%}
      {}
      {%- endif -%}
  no_log: true

- name: "windows | cpu | compute summary groups"
  ansible.builtin.set_fact:
    _w_cpu_summary: >-
      {%- set ns = namespace(groups=[], seen={}) -%}
      {%- set _procs = _w_cpu_data.processors | default([]) -%}
      {%- if _procs is mapping -%}{%- set _procs = [_procs] -%}{%- endif -%}
      {%- for p in _procs -%}
        {%- set m = (p.name | default(none, true)) or none -%}
        {%- set raw_mfr = (p.manufacturer | default('') or '') | string -%}
        {%- set mfr = none -%}
        {%- if 'GenuineIntel' in raw_mfr or 'Intel' in raw_mfr -%}{%- set mfr = 'Intel' -%}
        {%- elif 'AuthenticAMD' in raw_mfr or 'AMD' in raw_mfr -%}{%- set mfr = 'AMD' -%}
        {%- elif raw_mfr -%}{%- set mfr = raw_mfr -%}
        {%- endif -%}
        {%- set cores = (p.cores | int) if (p.cores is defined and p.cores is not none) else none -%}
        {%- set mkey = m | string -%}
        {%- if mkey in ns.seen -%}
          {%- set idx = ns.seen[mkey] -%}
          {%- set _prev = ns.groups[idx].total_cores -%}
          {%- set _nt = (_prev + cores) if (_prev is not none and cores is not none) else none -%}
          {%- set _nsk = ns.groups[idx].sockets + 1 -%}
          {%- set _ = ns.groups[idx].update({'sockets': _nsk, 'total_cores': _nt, 'cores_per_socket': ((_nt // _nsk) if _nt is not none else none)}) -%}
        {%- else -%}
          {%- set _ = ns.seen.update({mkey: ns.groups | length}) -%}
          {%- set _ = ns.groups.append({
            'model': m,
            'manufacturer': mfr,
            'max_speed_mhz': p.max_clock_mhz | default(none),
            'turbo_max_mhz': none,
            'l2_cache_kb': p.l2_cache_kb | default(none),
            'l3_cache_kb': p.l3_cache_kb | default(none),
            'sockets': 1,
            'cores_per_socket': cores,
            'total_cores': cores
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups} }}
    _w_cpu_ok: "{{ ((_w_cpu_data.sockets | default(0, true)) | int > 0) or ((_w_cpu_data.model | default('', true)) | string | trim | length > 0) }}"
  no_log: true

- name: "windows | cpu | set fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      cpu:
        sockets:         "{{ (_w_cpu_data.sockets | int) if ((_w_cpu_data.sockets | default(0, true)) | int > 0) else none }}"
        cores_physical:  "{{ _w_cpu_data.cores    | default(none) }}"
        logical_threads: >-
          {%- set l = _w_cpu_data.logical | default(none) -%}
          {{ l if l is not none else (ansible_processor_vcpus | default(none)) }}
        model:           "{{ _w_cpu_data.model    | default(none, true) or none }}"
        manufacturer: >-
          {%- set v = (_w_cpu_data.manufacturer | default('') or '') | string -%}
          {%- if 'GenuineIntel' in v or 'Intel' in v -%}Intel
          {%- elif 'AuthenticAMD' in v or 'AMD' in v -%}AMD
          {%- elif v -%}{{ v }}
          {%- else -%}{{ none }}
          {%- endif -%}
        max_speed_mhz:   "{{ _w_cpu_data.max_clock_mhz | default(none) }}"
        turbo_max_mhz:   null
        architecture: >-
          {%- set _a2 = (ansible_architecture2 | default('', true)) | string | trim -%}
          {%- set _arch = (ansible_architecture | default('', true)) | string -%}
          {%- if _a2 -%}{{ _a2 }}
          {%- elif _arch in ['x86_64', 'AMD64', 'amd64'] -%}x86_64
          {%- elif 'ARM' in (_arch | upper) and '64' in _arch -%}aarch64
          {%- elif '64' in _arch -%}x86_64
          {%- elif _arch in ['i386', 'i686', 'x86'] -%}i386
          {%- elif '32' in _arch or '86' in _arch -%}i386
          {%- elif _arch -%}{{ _arch }}
          {%- else -%}{{ none }}
          {%- endif -%}
        summary:         "{{ _w_cpu_summary | default({'groups': []}) }}"
    _sections_supported_fragment: ['cpu']
    _sections_collected_fragment: "{{ ['cpu'] if (_w_cpu_ok | bool) else [] }}"
    _sections_failed_fragment:    "{{ [] if (_w_cpu_ok | bool) else ['cpu'] }}"
    _errors_fragment: >-
      {{ [] if (_w_cpu_ok | bool) else [{
           'section': 'cpu',
           'message': 'CPU 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Win32_Processor; cause=no_output; rc=' ~ (_w_cpu_raw.rc | default('none')))}] }}
  no_log: true

- name: "windows | cpu | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
