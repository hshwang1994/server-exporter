---
# os-gather/tasks/windows/gather_network.yml → data.network fragment

- name: "windows | network | dns and gateway"
  ansible.windows.win_shell: |
    $gw  = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
            Sort-Object RouteMetric | Select-Object -First 1).NextHop
    $dns = @(Get-DnsClientServerAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
             Where-Object { $_.ServerAddresses } |
             ForEach-Object { $_.ServerAddresses } | Select-Object -Unique)
    [PSCustomObject]@{
      gw  = $gw
      dns = $dns
    } | ConvertTo-Json -Compress
  register: _w_net_meta_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | network | parse meta"
  ansible.builtin.set_fact:
    _w_norm_net_meta: >-
      {%- if _w_net_meta_raw.stdout is defined and _w_net_meta_raw.stdout | trim | length > 0 -%}
      {{ _w_net_meta_raw.stdout | from_json }}
      {%- else -%}
      {}
      {%- endif -%}
  no_log: true

- name: "windows | network | interfaces"
  ansible.windows.win_shell: |
    # production-audit (2026-04-29): primary InterfaceIndex 1회 조회 (기존: IP마다 Get-NetRoute 재호출 — O(N))
    # + interface_index 출력 → 그룹핑 키로 사용 (MAC null/이름 변동 시 NIC가 분리되는 버그 차단)
    $gw = '{{ _w_norm_net_meta.gw | default("") }}'
    $primary_idx = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
                    Sort-Object RouteMetric | Select-Object -First 1).InterfaceIndex
    Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
    Where-Object { $_.IPAddress -notlike '169.*' -and $_.IPAddress -ne '127.0.0.1' } |
    ForEach-Object {
      $addr    = $_
      $adapter = Get-NetAdapter -InterfaceIndex $addr.InterfaceIndex -ErrorAction SilentlyContinue
      $isGw    = $adapter -and ($adapter.InterfaceIndex -eq $primary_idx)
      [PSCustomObject]@{
        id              = $adapter.InterfaceDescription
        name            = $addr.InterfaceAlias
        interface_index = [int]$addr.InterfaceIndex
        mac             = $adapter.MacAddress
        mtu             = $adapter.MtuSize
        speed_mbps      = $(if ($adapter.Speed) { [math]::Round($adapter.Speed / 1000000, 0) } else { $null })
        status          = $adapter.Status
        is_primary      = $isGw
        address         = $addr.IPAddress
        prefix          = $addr.PrefixLength
        gateway         = $(if ($isGw) { $gw } else { $null })
      } | ConvertTo-Json -Compress
    }
  register: _w_iface_raw
  changed_when: false
  failed_when: false
  no_log: true

# Round 16: JSON null status(미surface adapter)는 'is defined' 통과 → None|lower='none' 누설.
#           truthy 체크로 None/''/undefined 모두 'unknown' fallback (memory/cpu fix 동일 class).
- name: "windows | network | normalize interfaces"
  ansible.builtin.set_fact:
    _w_norm_interfaces: >-
      {%- set grouped = {} -%}
      {%- for line in (_w_iface_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set n = line | from_json -%}
          {# production-audit: InterfaceIndex로 그룹핑 — 단일 NIC의 multi-IP가 분리되지 않도록 #}
          {%- set key = (n.interface_index | default(n.mac | default(n.name))) | string -%}
          {# windows-audit (2026-04-29): prefix_length → subnet_mask 자동 계산 (Linux 일관) #}
          {%- set p = n.prefix | default(0) | int -%}
          {%- set mask = none -%}
          {%- if p > 0 and p <= 32 -%}
            {# Round 15: p>0 가드(위 if)로 (1 if p==0 ...) 는 dead branch — 제거 (동작 동일) #}
            {%- set bits = 4294967296 - (2 ** (32 - p)) -%}
            {%- set mask = '%d.%d.%d.%d' % ((bits // 16777216) % 256, (bits // 65536) % 256, (bits // 256) % 256, bits % 256) -%}
          {%- endif -%}
          {%- set addr = {
              'family':        'ipv4',
              'address':       n.address,
              'prefix_length': n.prefix | default(none),
              'subnet_mask':   mask,
              'gateway':       n.gateway | default(none)
          } -%}
          {%- if key in grouped -%}
            {%- set _ = grouped[key]['addresses'].append(addr) -%}
            {%- if n.is_primary | default(false) -%}
              {%- set _ = grouped[key].update({'is_primary': true}) -%}
            {%- endif -%}
          {%- else -%}
            {%- set _ = grouped.update({key: {
              'id':          n.id   | default(n.name),
              'name':        n.name,
              'kind':        'os_nic',
              'mac':         n.mac  | default(none),
              'mtu':         n.mtu  | default(none),
              'speed_mbps':  n.speed_mbps | default(none),
              'link_status': ('up' if (n.status | default('') | lower) in ['up','connected','linkup','active'] else ('down' if (n.status | default('') | lower) in ['down','disconnected','disabled','offline','linkdown','not present','notpresent'] else 'unknown')),
              'is_primary':  n.is_primary | default(false),
              'addresses':   [addr]
            }}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ grouped.values() | list }}
  no_log: true

# cycle-016 Phase P: Linux 와 일관 — driver_map 추가 + adapters/ports 빈 list
- name: "windows | network | NIC driver map (Get-NetAdapter)"
  ansible.windows.win_shell: |
    Get-NetAdapter | Where-Object { $_.Status -eq 'Up' -or $_.MediaConnectionState -eq 'Connected' } | ForEach-Object {
      [PSCustomObject]@{
        name           = $_.Name
        driver         = $_.DriverDescription
        driver_version = $_.DriverVersion
        # driver_date 는 parse(_w_driver_map)에서 미사용(폐기) 필드였고, 값이 [string] 으로 올 때
        # String.ToString('yyyy-MM-dd') 오버로드 예외 → ForEach 전체 중단 → driver_map 통째 []
        # 였음 (LBFO 멀티플렉서가 string 반환, 2026-06-26 site 실측). canonical driver_map
        # (=Linux: name/driver/vlan_id/bond_master)에 없는 필드라 수집 제거 (root cause 제거).
        vlan_id        = $_.VlanID
        bond_master    = $null
      } | ConvertTo-Json -Compress
    }
  register: _w_drvmap_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | network | parse driver_map"
  ansible.builtin.set_fact:
    _w_driver_map: >-
      {%- set out = [] -%}
      {%- for line in (_w_drvmap_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set d = line | from_json -%}
          {%- set _ = out.append({
            'name': d.name | default(none),
            'driver': d.driver | default(none),
            'driver_version': d.driver_version | default(none),
            'vlan_id': (d.vlan_id | int) if d.vlan_id else none,
            'bond_master': none
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

# Teaming 수집 (LBFO + Switch Embedded Teaming). Teaming 없는 서버에서도 빈 [] 로 graceful.
- name: "windows | network | teaming (LBFO + SET)"
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'SilentlyContinue'
    function Emit($tag,$o){ if($o){ Write-Output ($tag + ' ' + ($o | ConvertTo-Json -Compress -Depth 4)) } }
    function Has($n){ return [bool](Get-Command $n -ErrorAction SilentlyContinue) }
    # adapter 보조 맵 (name -> mac/status/speed) — team member NIC enrichment 용
    if (Has 'Get-NetAdapter') {
      foreach($a in @(Get-NetAdapter)){
        Emit 'WADP' ([PSCustomObject]@{ name=$a.Name; mac=$a.MacAddress;
          status=[string]$a.Status;
          speed_mbps=$(if($a.Speed){ [math]::Round($a.Speed/1000000,0) } else { $null }) })
      }
    }
    # LBFO Teaming (Get-NetLbfoTeam / Get-NetLbfoTeamMember) — 모듈 없는 SKU 는 graceful skip
    if (Has 'Get-NetLbfoTeam') {
      foreach($t in @(Get-NetLbfoTeam)){
        Emit 'LBFOTEAM' ([PSCustomObject]@{ name=$t.Name; teaming_mode=[string]$t.TeamingMode;
          load_balancing=[string]$t.LoadBalancingAlgorithm; lacp_timer=[string]$t.LacpTimer;
          status=[string]$t.Status; members=@($t.Members | ForEach-Object { [string]$_ }) })
      }
    }
    if (Has 'Get-NetLbfoTeamMember') {
      foreach($m in @(Get-NetLbfoTeamMember)){
        Emit 'LBFOMEMBER' ([PSCustomObject]@{ name=$m.Name; team=[string]$m.Team;
          admin_mode=[string]$m.AdministrativeMode })
      }
    }
    # 팀 tNIC (Get-NetLbfoTeamNic) — 팀 위 VLAN(Linux bond0.100 대응). default tNIC 는 VlanID 없음(=팀 자체).
    if (Has 'Get-NetLbfoTeamNic') {
      foreach($tn in @(Get-NetLbfoTeamNic)){
        Emit 'LBFOTEAMNIC' ([PSCustomObject]@{ name=$tn.Name; team=[string]$tn.Team;
          vlan_id=$tn.VlanID; default=[bool]$tn.Default })
      }
    }
    # Switch Embedded Teaming (Get-NetSwitchTeam / Get-NetSwitchTeamMember)
    if (Has 'Get-NetSwitchTeam') {
      foreach($s in @(Get-NetSwitchTeam)){
        Emit 'SETTEAM' ([PSCustomObject]@{ name=$s.Name;
          members=@($s.Members | ForEach-Object { [string]$_ }) })
      }
    }
    if (Has 'Get-NetSwitchTeamMember') {
      foreach($sm in @(Get-NetSwitchTeamMember)){
        Emit 'SETMEMBER' ([PSCustomObject]@{ name=$sm.Name; team=[string]$sm.Team })
      }
    }
  register: _w_teams_raw
  changed_when: false
  failed_when: false
  no_log: true

# Teaming 토폴로지 정규화 (filter_plugins/network_topology.py — build_windows_network)
- name: "windows | network | normalize teaming topology"
  ansible.builtin.set_fact:
    _w_net_topo: "{{ _w_norm_interfaces | build_windows_network(_w_teams_raw.stdout_lines | default([])) }}"
  no_log: true

# cycle-016: network.summary grouping (speed_mbps 기준)
# 2026-06-30: enriched _w_net_topo.interfaces 기준 + 팀 VLAN tNIC / 팀 member 제외.
#   - VLAN tNIC(vlan_id 보유)은 부모 팀과 같은 물리 대역 공유 → 별도 NIC 로 세면 이중 카운트
#     (site 10.100.64.120 실측: LabTeam1 + 'LabTeam1 - VLAN 100' 둘 다 20G / 같은 팀 LabTeam1).
#   - team member 는 팀 aggregate(20G)에 이미 포함 → 중복 방지로 제외.
#   field_dictionary: summary = 'NIC 그룹' → 논리 NIC 1개당 1회. (teaming 정규화 후 vlan_id/team_role 필요)
- name: "windows | network | compute summary groups"
  ansible.builtin.set_fact:
    _w_net_summary: >-
      {%- set ns = namespace(groups=[], seen={}) -%}
      {%- for n in (_w_net_topo.interfaces | default([])) -%}
        {%- set sp = n.speed_mbps | default(none) -%}
        {# VLAN tNIC(같은 물리 대역) / 팀 member(aggregate 중복) / speed 없는 NIC 제외 #}
        {%- if (n.vlan_id | default(none)) is none
               and (n.team_role | default('')) != 'member'
               and sp is not none and (sp | int) > 0 -%}
          {%- set link_up = (n.link_status | default('') | lower) in ['up','linkup'] -%}
          {%- set key = sp | string -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set _ = ns.groups[idx].update({'quantity': ns.groups[idx].quantity + 1, 'link_up_count': ns.groups[idx].link_up_count + (1 if link_up else 0)}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'speed_mbps': sp, 'link_type': none, 'quantity': 1, 'link_up_count': 1 if link_up else 0}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups} }}
  no_log: true

# driver_map[].bond_master 채움 (team member -> team 매핑; 비teamed 는 none 유지)
- name: "windows | network | driver_map bond_master from teaming"
  ansible.builtin.set_fact:
    _w_driver_map_final: >-
      {%- set owner = {} -%}
      {%- for t in (_w_net_topo.teams | default([])) -%}
        {%- for m in t.members -%}{%- set _ = owner.update({m.name: t.name}) -%}{%- endfor -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for d in (_w_driver_map | default([])) -%}
        {%- set _ = out.append(d | combine({'bond_master': owner.get(d.name)})) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | network | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      network:
        dns_servers: "{{ _w_norm_net_meta.dns | default([]) }}"
        default_gateways: >-
          {%- set out = [] -%}
          {%- set gw = _w_norm_net_meta.gw | default(none) -%}
          {%- if gw -%}{%- set _ = out.append({'family':'ipv4','address':gw}) -%}{%- endif -%}
          {{ out }}
        interfaces: "{{ _w_net_topo.interfaces }}"
        adapters:    []
        ports:       []
        driver_map:  "{{ _w_driver_map_final | default(_w_driver_map | default([])) }}"
        # bond/bridge 는 Windows 미해당(빈 []), teams 는 LBFO/SET (Additive — 기존 필드 불변)
        bonds:    "{{ _w_net_topo.bonds }}"
        bridges:  "{{ _w_net_topo.bridges }}"
        teams:    "{{ _w_net_topo.teams }}"
        summary: "{{ _w_net_summary | default({'groups': []}) }}"
    _sections_supported_fragment: ['network']
    _sections_collected_fragment: ['network']
    _sections_failed_fragment:    []
    _errors_fragment:             []
  no_log: true

- name: "windows | network | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
