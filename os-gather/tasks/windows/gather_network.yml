---

- name: "windows | network | snapshot (routes + adapters + addresses + dns)"
  ansible.windows.win_shell: |
    function Invoke-SeComponent($Doc, [string]$Name, [scriptblock]$Body) {
      $c = [ordered]@{ ok = $true; error = $null; rows = (New-Object System.Collections.ArrayList); data = $null }
      $Doc[$Name] = $c
      try { $null = & $Body $c }
      catch { $c.ok = $false; $c.error = [string]$_.Exception.Message; if (-not $c.error) { $c.error = [string]$_ } }
    }
    $doc = [ordered]@{}
    $routes = $null
    $na = $null
    $dns = $null
    function Get-SeRealError($Errs) { @($Errs | Where-Object { [string]$_.CategoryInfo.Category -ne 'ObjectNotFound' }) }
    Invoke-SeComponent $doc 'read_routes' {
      param($c)
      $seErr = $null
      $script:routes = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0','::/0' -ErrorAction SilentlyContinue -ErrorVariable seErr)
      $real = Get-SeRealError $seErr
      if ($real) { throw $real[0] }
    }
    Invoke-SeComponent $doc 'read_adapters' {
      param($c)
      $seErr = $null
      $script:na = @(Get-NetAdapter -ErrorAction SilentlyContinue -ErrorVariable seErr)
      $real = Get-SeRealError $seErr
      if ($real) { throw $real[0] }
    }
    Invoke-SeComponent $doc 'read_dns' {
      param($c)
      $seErr = $null
      $script:dns = @(Get-DnsClientServerAddress -AddressFamily IPv4,IPv6 -ErrorAction SilentlyContinue -ErrorVariable seErr |
                      Where-Object { $_.ServerAddresses } |
                      ForEach-Object { $_.ServerAddresses } | Select-Object -Unique)
      $real = Get-SeRealError $seErr
      if ($real) { throw $real[0] }
    }
    $def4 = $routes | Where-Object { $_.DestinationPrefix -eq '0.0.0.0/0' } | Sort-Object RouteMetric | Select-Object -First 1
    $def6 = $routes | Where-Object { $_.DestinationPrefix -eq '::/0' } | Sort-Object RouteMetric | Select-Object -First 1
    $naByIdx = @{}
    foreach ($a in @($na)) { if ($null -ne $a) { $naByIdx[[string]$a.InterfaceIndex] = $a } }
    Invoke-SeComponent $doc 'meta' {
      param($c)
      $gw  = $def4.NextHop
      $gw6 = $def6.NextHop
      if ($gw6 -and ($gw6 -eq '::')) { $gw6 = $null }
      $c.data = [PSCustomObject]@{
        gw  = $gw
        gw6 = $gw6
        dns = $dns
      }
    }
    Invoke-SeComponent $doc 'interfaces' {
      param($c)
      $m = $doc['meta']
      $gw  = if ($m.data -and $m.data.gw)  { [string]$m.data.gw }  else { '' }
      $gw6 = if ($m.data -and $m.data.gw6) { [string]$m.data.gw6 } else { '' }
      $primary_idx = $def4.InterfaceIndex
      $ipErr = $null
      Get-NetIPAddress -AddressFamily IPv4,IPv6 -ErrorAction SilentlyContinue -ErrorVariable ipErr |
      Where-Object { $_.IPAddress -notlike '169.254.*' -and $_.IPAddress -ne '127.0.0.1' -and $_.IPAddress -ne '::1' } |
      ForEach-Object {
        $addr    = $_
        $adapter = $naByIdx[[string]$addr.InterfaceIndex]
        $isGw    = [bool]($adapter -and ($adapter.InterfaceIndex -eq $primary_idx))
        $fam     = if ([string]$addr.AddressFamily -eq 'IPv6') { 'ipv6' } else { 'ipv4' }
        [void]$c.rows.Add([PSCustomObject]@{
          id              = $(if ($adapter) { [string]$adapter.Name } else { [string]$addr.InterfaceAlias })
          name            = $(if ($adapter) { [string]$adapter.Name } else { [string]$addr.InterfaceAlias })
          description     = $(if ($adapter) { [string]$adapter.InterfaceDescription } else { $null })
          interface_index = [int]$addr.InterfaceIndex
          mac             = $(if ($adapter) { [string]$adapter.MacAddress } else { $null })
          mtu             = $(if ($adapter) { $adapter.MtuSize } else { $null })
          speed_mbps      = $(if ($adapter -and $adapter.Speed) { [math]::Round($adapter.Speed / 1000000, 0) } else { $null })
          status          = $(if ($adapter) { [string]$adapter.Status } else { $null })
          is_primary      = $isGw
          family          = $fam
          address         = [string]$addr.IPAddress
          prefix          = [int]$addr.PrefixLength
          gateway         = $(if ($isGw) { if ($fam -eq 'ipv6') { $gw6 } else { $gw } } else { $null })
        })
      }
      $real = Get-SeRealError $ipErr
      if ($real) { throw $real[0] }
    }
    Invoke-SeComponent $doc 'driver_map' {
      param($c)
      if ((-not $doc['read_adapters'].ok) -and (@($na).Count -eq 0)) { throw $doc['read_adapters'].error }
      $na | Where-Object { $_.Status -eq 'Up' -or $_.MediaConnectionState -eq 'Connected' } | ForEach-Object {
        [void]$c.rows.Add([PSCustomObject]@{
          name           = $_.Name
          driver         = $_.DriverDescription
          driver_version = $_.DriverVersion
          vlan_id        = $_.VlanID
          bond_master    = $null
        })
      }
    }
    Invoke-SeComponent $doc 'adapters' {
      param($c)
      $ErrorActionPreference = 'SilentlyContinue'
      $hw = @{}
      try {
        foreach ($h in @(Get-NetAdapterHardwareInfo)) {
          $pci = $null
          if ($null -ne $h.Bus -and $null -ne $h.Device -and $null -ne $h.Function) {
            $pci = ('{0:x4}:{1:x2}:{2:x2}.{3}' -f [int]$h.Segment, [int]$h.Bus, [int]$h.Device, [int]$h.Function)
          }
          $hw[[string]$h.Name] = $pci
        }
      } catch { }
      foreach ($a in @(Get-NetAdapter -Physical)) {
        $mfr = $null
        try {
          if ($a.PnPDeviceID) {
            $pnp = Get-PnpDevice -InstanceId $a.PnPDeviceID
            if ($pnp -and $pnp.Manufacturer) { $mfr = [string]$pnp.Manufacturer }
          }
        } catch { }
        if (-not $mfr -and $a.DriverProvider -and ([string]$a.DriverProvider -ne 'Microsoft')) { $mfr = [string]$a.DriverProvider }
        [void]$c.rows.Add([PSCustomObject]@{
          name         = [string]$a.Name
          model        = [string]$a.InterfaceDescription
          manufacturer = $mfr
          driver       = [string]$a.DriverDescription
          driver_version = [string]$a.DriverVersion
          mac          = [string]$a.MacAddress
          pci          = $(if ($hw.ContainsKey([string]$a.Name)) { $hw[[string]$a.Name] } else { $null })
          status       = [string]$a.Status
          speed_mbps   = $(if ($a.Speed) { [math]::Round($a.Speed / 1000000, 0) } else { $null })
        })
      }
    }
    try { $doc | ConvertTo-Json -Depth 8 -Compress }
    catch { '{"_error":' + (ConvertTo-Json ([string]$_.Exception.Message) -Compress) + '}' }
  register: _w_net_doc_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | network | parse document"
  ansible.builtin.set_fact:
    _w_net_doc: >-
      {{ (_w_net_doc_raw.stdout | default('') | trim | from_json)
         if (_w_net_doc_raw.stdout | default('') | trim | length > 0) else {} }}
  no_log: true

- name: "windows | network | split document"
  ansible.builtin.set_fact:
    _w_net_meta_raw: >-
      {%- set d = _w_net_doc if (_w_net_doc is mapping) else {} -%}
      {%- set c = d.get('meta') if (d.get('meta') is mapping) else {} -%}
      {%- set v = c.get('data') -%}
      {%- set s = (v | to_json) if (v is mapping) else '' -%}
      {%- set out = {'stdout': s, 'stdout_lines': ([s] if s else [])} -%}
      {%- if _w_net_doc_raw.rc is defined -%}
        {%- set r = _w_net_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
    _w_iface_raw: >-
      {%- set d = _w_net_doc if (_w_net_doc is mapping) else {} -%}
      {%- set c = d.get('interfaces') if (d.get('interfaces') is mapping) else {} -%}
      {%- set rows = c.get('rows') -%}
      {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
      {%- set lines = rows | map('to_json') | list -%}
      {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
      {%- if _w_net_doc_raw.rc is defined -%}
        {%- set r = _w_net_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
    _w_drvmap_raw: >-
      {%- set d = _w_net_doc if (_w_net_doc is mapping) else {} -%}
      {%- set c = d.get('driver_map') if (d.get('driver_map') is mapping) else {} -%}
      {%- set rows = c.get('rows') -%}
      {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
      {%- set lines = rows | map('to_json') | list -%}
      {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
      {%- if _w_net_doc_raw.rc is defined -%}
        {%- set r = _w_net_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
    _w_adapters_raw: >-
      {%- set d = _w_net_doc if (_w_net_doc is mapping) else {} -%}
      {%- set c = d.get('adapters') if (d.get('adapters') is mapping) else {} -%}
      {%- set rows = c.get('rows') -%}
      {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
      {%- set lines = rows | map('to_json') | list -%}
      {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
      {%- if _w_net_doc_raw.rc is defined -%}
        {%- set r = _w_net_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: "windows | network | parse meta"
  ansible.builtin.set_fact:
    _w_norm_net_meta: >-
      {%- if _w_net_meta_raw.stdout is defined and _w_net_meta_raw.stdout | trim | length > 0 -%}
      {{ _w_net_meta_raw.stdout | from_json }}
      {%- else -%}
      {}
      {%- endif -%}
  no_log: true

- name: "windows | network | normalize interfaces"
  ansible.builtin.set_fact:
    _w_norm_interfaces: >-
      {%- set grouped = {} -%}
      {%- for line in (_w_iface_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set n = line | from_json -%}
          {%- set key = (n.interface_index | default(n.mac | default(n.name))) | string -%}
          {%- set fam = (n.family | default('ipv4')) | lower -%}
          {%- set p = n.prefix | default(0) | int -%}
          {%- set mask = none -%}
          {%- if fam == 'ipv4' and p > 0 and p <= 32 -%}
            {%- set bits = 4294967296 - (2 ** (32 - p)) -%}
            {%- set mask = '%d.%d.%d.%d' % ((bits // 16777216) % 256, (bits // 65536) % 256, (bits // 256) % 256, bits % 256) -%}
          {%- endif -%}
          {%- if fam == 'ipv6' -%}
            {%- set a6 = ((n.address | default('')) | string).split('%')[0] | lower -%}
            {%- set scope = 'link' if a6.startswith('fe80') else ('host' if a6 == '::1' else 'global') -%}
            {%- set addr = {
                'family':        'ipv6',
                'address':       a6,
                'prefix_length': (p if p > 0 else none),
                'subnet_mask':   none,
                'scope':         scope,
                'gateway':       (n.gateway | default(none, true)) or none
            } -%}
          {%- else -%}
            {%- set addr = {
                'family':        'ipv4',
                'address':       n.address,
                'prefix_length': (p if p > 0 else none),
                'subnet_mask':   mask,
                'gateway':       (n.gateway | default(none, true)) or none
            } -%}
          {%- endif -%}
          {%- if key in grouped -%}
            {%- set _ = grouped[key]['addresses'].append(addr) -%}
            {%- if n.is_primary | default(false) -%}
              {%- set _ = grouped[key].update({'is_primary': true}) -%}
            {%- endif -%}
          {%- else -%}
            {%- set _ = grouped.update({key: {
              'id':          (n.id | default(none, true)) or n.name,
              'name':        n.name,
              'description': (n.description | default(none, true)) or none,
              'kind':        'os_nic',
              'mac':         (n.mac | default(none, true)) | normalize_mac,
              'mtu':         n.mtu  | default(none),
              'speed_mbps':  n.speed_mbps | default(none),
              'link_status': ('up' if (n.status | default('', true) | lower) in ['up','connected','linkup','active'] else ('down' if (n.status | default('', true) | lower) in ['down','disconnected','disabled','offline','linkdown','not present','notpresent'] else 'unknown')),
              'is_primary':  n.is_primary | default(false),
              'addresses':   [addr]
            }}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for g in grouped.values() -%}
        {%- set a4 = g.addresses | selectattr('family', 'equalto', 'ipv4') | list -%}
        {%- set a6 = g.addresses | selectattr('family', 'equalto', 'ipv6') | list -%}
        {%- set _ = g.update({'addresses': a4 + a6}) -%}
        {%- set _ = out.append(g) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | network | parse driver_map"
  ansible.builtin.set_fact:
    _w_driver_map: >-
      {%- set out = [] -%}
      {%- for line in (_w_drvmap_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set d = line | from_json -%}
          {%- set _ = out.append({
            'name': d.name | default(none),
            'driver': d.driver | default(none),
            'driver_version': d.driver_version | default(none),
            'vlan_id': (d.vlan_id | int) if d.vlan_id else none,
            'bond_master': none
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | network | parse adapters"
  ansible.builtin.set_fact:
    _w_adapters: >-
      {%- set out = [] -%}
      {%- for line in (_w_adapters_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set a = line | from_json -%}
          {%- set pci = (a.pci | default(none, true)) or none -%}
          {%- set _ = out.append({
            'id':           pci if pci else (a.name | default(none)),
            'name':         a.name | default(none),
            'manufacturer': (a.manufacturer | default(none, true)) or none,
            'model':        (a.model | default(none, true)) or none,
            'driver':       (a.driver | default(none, true)) or none,
            'driver_version': (a.driver_version | default(none, true)) or none,
            'firmware_version': none,
            'pci':          pci,
            'mac':          (a.mac | default(none, true)) | normalize_mac,
            'link_status':  ('up' if (a.status | default('', true) | lower) in ['up','connected'] else ('down' if (a.status | default('', true) | lower) in ['down','disconnected','disabled','not present','notpresent'] else 'unknown')),
            'speed_mbps':   a.speed_mbps | default(none)
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | network | teaming (LBFO + SET)"
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'SilentlyContinue'
    function Emit($tag,$o){ if($o){ Write-Output ($tag + ' ' + ($o | ConvertTo-Json -Compress -Depth 4)) } }
    function Has($n){ return [bool](Get-Command $n -ErrorAction SilentlyContinue) }
    if (Has 'Get-NetAdapter') {
      foreach($a in @(Get-NetAdapter)){
        Emit 'WADP' ([PSCustomObject]@{ name=$a.Name;
          mac=$(if($a.MacAddress){ ([string]$a.MacAddress).Replace('-',':').ToLower() } else { $null });
          status=[string]$a.Status;
          speed_mbps=$(if($a.Speed){ [math]::Round($a.Speed/1000000,0) } else { $null }) })
      }
    }
    if (Has 'Get-NetLbfoTeam') {
      foreach($t in @(Get-NetLbfoTeam)){
        Emit 'LBFOTEAM' ([PSCustomObject]@{ name=$t.Name; teaming_mode=[string]$t.TeamingMode;
          load_balancing=[string]$t.LoadBalancingAlgorithm; lacp_timer=[string]$t.LacpTimer;
          status=[string]$t.Status; members=@($t.Members | ForEach-Object { [string]$_ }) })
      }
    }
    if (Has 'Get-NetLbfoTeamMember') {
      foreach($m in @(Get-NetLbfoTeamMember)){
        Emit 'LBFOMEMBER' ([PSCustomObject]@{ name=$m.Name; team=[string]$m.Team;
          admin_mode=[string]$m.AdministrativeMode })
      }
    }
    if (Has 'Get-NetLbfoTeamNic') {
      foreach($tn in @(Get-NetLbfoTeamNic)){
        Emit 'LBFOTEAMNIC' ([PSCustomObject]@{ name=$tn.Name; team=[string]$tn.Team;
          vlan_id=$tn.VlanID; default=[bool]$tn.Default })
      }
    }
    if (Has 'Get-NetSwitchTeam') {
      foreach($s in @(Get-NetSwitchTeam)){
        Emit 'SETTEAM' ([PSCustomObject]@{ name=$s.Name;
          members=@($s.Members | ForEach-Object { [string]$_ }) })
      }
    }
    if (Has 'Get-NetSwitchTeamMember') {
      foreach($sm in @(Get-NetSwitchTeamMember)){
        Emit 'SETMEMBER' ([PSCustomObject]@{ name=$sm.Name; team=[string]$sm.Team })
      }
    }
  register: _w_teams_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | network | normalize teaming topology"
  ansible.builtin.set_fact:
    _w_net_topo: "{{ _w_norm_interfaces | build_windows_network(_w_teams_raw.stdout_lines | default([])) }}"
  no_log: true

- name: "windows | network | compute summary groups"
  ansible.builtin.set_fact:
    _w_net_summary: >-
      {%- set ns = namespace(groups=[], seen={}) -%}
      {%- for n in (_w_net_topo.interfaces | default([])) -%}
        {%- set sp = n.speed_mbps | default(none) -%}
        {%- if (n.vlan_id | default(none)) is none
               and (n.team_role | default('')) != 'member'
               and sp is not none and (sp | int) > 0 -%}
          {%- set link_up = (n.link_status | default('') | lower) in ['up','linkup'] -%}
          {%- set key = sp | string -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set _ = ns.groups[idx].update({'quantity': ns.groups[idx].quantity + 1, 'link_up_count': ns.groups[idx].link_up_count + (1 if link_up else 0)}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'speed_mbps': sp, 'link_type': none, 'quantity': 1, 'link_up_count': 1 if link_up else 0}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups} }}
  no_log: true

- name: "windows | network | driver_map bond_master from teaming"
  ansible.builtin.set_fact:
    _w_driver_map_final: >-
      {%- set owner = {} -%}
      {%- for t in (_w_net_topo.teams | default([])) -%}
        {%- for m in t.members -%}{%- set _ = owner.update({m.name: t.name}) -%}{%- endfor -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for d in (_w_driver_map | default([])) -%}
        {%- set _ = out.append(d | combine({'bond_master': owner.get(d.name)})) -%}
      {%- endfor -%}
      {{ out }}
    _w_net_ok: "{{ ((_w_net_topo.interfaces | default([])) | length > 0) }}"
  no_log: true

- name: "windows | network | component status"
  ansible.builtin.set_fact:
    _w_net_parts_failed: >-
      {%- set d = _w_net_doc if (_w_net_doc is mapping) else {} -%}
      {%- set out = [] -%}
      {%- for k in ['read_routes', 'read_adapters', 'read_dns', 'meta', 'interfaces', 'driver_map', 'adapters'] -%}
        {%- if (d.get(k) is mapping) and (d.get(k).get('ok') is sameas false) -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {%- if (d | length == 0) or ('_error' in d) or (((_w_net_doc_raw.rc | default(0)) or 0) | int != 0) -%}
        {%- set _ = out.append('script') -%}
      {%- endif -%}
      {{ out }}
    _w_net_parts_error: >-
      {%- set d = _w_net_doc if (_w_net_doc is mapping) else {} -%}
      {%- set errs = [] -%}
      {%- for k in ['read_routes', 'read_adapters', 'read_dns', 'meta', 'interfaces', 'driver_map', 'adapters'] -%}
        {%- if (d.get(k) is mapping) and (d.get(k).get('ok') is sameas false) and d.get(k).get('error') -%}
          {%- set _ = errs.append(k ~ ': ' ~ (d.get(k).get('error') | string)) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ((errs | first | default('', true)) | replace('\n', ' ') | replace('\r', ' '))[:160] }}
  no_log: true

- name: "windows | network | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      network:
        dns_servers: "{{ _w_norm_net_meta.dns | default([]) }}"
        default_gateways: >-
          {%- set out = [] -%}
          {%- set gw = (_w_norm_net_meta.gw | default(none, true)) or none -%}
          {%- set gw6 = (_w_norm_net_meta.gw6 | default(none, true)) or none -%}
          {%- if gw -%}{%- set _ = out.append({'family':'ipv4','address':gw}) -%}{%- endif -%}
          {%- if gw6 -%}{%- set _ = out.append({'family':'ipv6','address':gw6}) -%}{%- endif -%}
          {{ out }}
        interfaces: "{{ _w_net_topo.interfaces }}"
        adapters:    "{{ _w_adapters | default([]) }}"
        ports:       []
        driver_map:  "{{ _w_driver_map_final | default(_w_driver_map | default([])) }}"
        bonds:    "{{ _w_net_topo.bonds }}"
        bridges:  "{{ _w_net_topo.bridges }}"
        teams:    "{{ _w_net_topo.teams }}"
        summary: "{{ _w_net_summary | default({'groups': []}) }}"
    _sections_supported_fragment: ['network']
    _sections_collected_fragment: "{{ ['network'] if (_w_net_ok | bool) else [] }}"
    _sections_failed_fragment:    "{{ [] if (_w_net_ok | bool) else ['network'] }}"
    _errors_fragment: >-
      {{ ([] if (_w_net_ok | bool) else [{
           'section': 'network',
           'message': '네트워크 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Get-NetIPAddress,Get-NetAdapter; cause=no_output; rc=' ~ (_w_iface_raw.rc | default('none'))
                       ~ (('; parts=' ~ (_w_net_parts_failed | join(','))) if (_w_net_parts_failed | default([]) | length > 0) else ''))}])
         + ([{
           'section': 'network',
           'message': '네트워크 정보 중 일부를 읽지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Get-NetAdapter,Get-NetRoute,Get-DnsClientServerAddress,Get-NetIPAddress; cause=component_failed; parts='
                       ~ (_w_net_parts_failed | join(',')) ~ '; interfaces=' ~ ((_w_net_topo.interfaces | default([])) | length)
                       ~ (('; error=' ~ _w_net_parts_error) if (_w_net_parts_error | default('', true)) else ''))}]
            if ((_w_net_ok | bool) and ((_w_net_parts_failed | default([])) | length > 0)) else []) }}
  no_log: true

