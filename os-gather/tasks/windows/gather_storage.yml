---
# os-gather/tasks/windows/gather_storage.yml → data.storage fragment
#
# 2026-09-03 (OS/ESXi 전수 검수 후속):
#   - filesystems[] 용량은 정수 MB (종전 float + 부동소수 오차 — B-16). Linux 와 같은 계산(used = total - free).
#   - Normalize-DiskSerial: 디코딩 결과의 **모든 바이트가 인쇄 가능** 할 때만 디코딩 결과를 쓴다.
#     종전 조건("hex 이고 '20' 을 포함") 은 NAA/RAID 계열 32-hex 시리얼을 의미 없는 짧은 문자열로 바꿨다 (B-19).
#   - physical_disks[].health: OK / Warning / Critical / null (Redfish 와 같은 어휘 — B-18).
#   - infiniband[].vendor: 드라이버 공급자 / PnP 제조사에서 읽는다 (종전 'Mellanox' 하드코딩 — B-23).
#     2026-10-17: PnP 폴백 자체를 제거 — 판별은 NdisPhysicalMedium 11 / RdmaTechnology InfiniBand 만 (아래 IB 태스크 주석).
#   - 디스크도 볼륨도 못 읽으면 섹션 failed + 사유 (종전 collected 하드코딩 — B-12).
#
# 2026-10-03 (Windows OS 채널 정합 Phase 2):
#   - C4: BusType / MediaType / HealthStatus / UniqueIdFormat 를 형(型) 정규화 후 판정한다.
#     UInt16(CIM 원값) / Int32 / 숫자 문자열 / 표시 문자열 모두 같은 결과. BusType 표는 MSFT_PhysicalDisk
#     ValueMap 대로 (종전 6→SATA, 11→SCSI 등 오표). protocol 닫힌 enum 에 대응이 없는 값은 null 이고,
#     그렇게 비어 남은 디스크가 있으면 errors[] 1건 (detail=bus_type_raw). 섹션 status 는 그대로.
#   - C3: 어댑터와 매칭되지 않는 initiator port 에 첫 번째 어댑터의 model/vendor/driver/firmware 를
#     붙이던 fallback 제거 (null). ConnectionType 숫자(1/2) 인식, OperationalStatus 다중 값 처리.
#
# 2026-10-03 (P4 — Windows 원격 호출 통합, win_shell 4 → 3):
#   - 종전 "volumes" / "physical disks" 두 호출을 스크립트 하나로 합쳤다. 출력 = JSON 문서 1개,
#     구성요소(volumes / disks) = { ok, error, rows, data }. 구성요소 본문에서 종료 오류가 나면 그 구성요소만
#     ok=false + error 로 남고 나머지는 그대로 채워진다. initiator ports + HBA / infiniband 는 따로 둔다
#     (느리거나 아예 없는 경우가 흔하다). Win32_DiskDrive 열거는 공용 조회(read_disk_drives) 다 — 실패해도
#     disks 는 종전처럼 빈 목록으로 계속 간다 (종전 스크립트의 중간 문장이었다).
#   - "split document" 가 문서를 종전 호출별 register 모양(_w_vol_raw / _w_disk_raw 의 stdout ·
#     stdout_lines · rc) 으로 되돌린다. 그 아래 정규화 · fragment 태스크는 종전 그대로다.
#     rc 는 그 구성요소가 따로 실행됐다면 냈을 값이다 — 스크립트 전체가 실패하면 그 rc,
#     구성요소에서 종료 오류가 났으면 1 (powershell.exe -EncodedCommand 의 종료 코드), 아니면 0.

# volumes + physical disks 스크립트 — PowerShell 주석은 스크립트 밖(여기) 에 둔다. win_shell 은 스크립트를
#   powershell.exe -EncodedCommand 인자(UTF-16 base64) 로 넘기고 그 명령줄은 32,767 자가 한도다 (CreateProcess).
#   종전 physical disks 스크립트만으로 28K 자였다. 코드 줄은 종전 그대로이고, 한도 여유는
#   tests/unit/test_windows_call_consolidation_static.py 가 지킨다.
#
# 아래는 종전 스크립트 안에 있던 주석이다 (값 근거 · 판정 규칙). [ ] 는 그 주석이 붙어 있던 코드 위치.
#    production-audit (2026-04-29): Get-PhysicalDisk(modern) + Win32_DiskDrive(fallback)로
#    MediaType을 HDD/SSD enum으로 정규화. 기존 raw WMI string ("Fixed hard disk media") 누출 차단.
#      Win32_DiskDrive raw "Fixed hard disk media"는 SSD/HDD 정보 부재 → null (잘못된 추정 차단).
#      HealthStatus 매핑 (Healthy/Warning/Unhealthy) → health 필드 (OK/Warning/Critical).
#    2026-10-03 (C4): Get-PhysicalDisk 의 enum 속성은 보통 Storage 모듈(Storage.types.ps1xml) 이 붙인
#      표시 문자열("SAS", "Fibre Channel", "1394" ...) 로 오고, 타입 정의 없이 CIM 원값을 받으면 UInt16 이다.
#      종전 `-is [int]` 검사는 UInt16 을 걸러 숫자 경로가 실제로는 타지 않았고, 숫자 표도 ValueMap 과
#      달랐다 (6→SATA, 11→SCSI, 18→SD, 19→MMC). 표시 문자열 "Fibre Channel" / "1394" / "SD" / "MMC" 도 놓쳤다.
#      값 근거: CIM 스키마 ValueMap (root/Microsoft/Windows/Storage 의 MSFT_PhysicalDisk,
#      learn.microsoft.com "MSFT_PhysicalDisk class") + Storage.types.ps1xml 표시 문자열.
#    serial/wwn 추가 (2026-06-22). serial: Get-PhysicalDisk 우선 → Win32_DiskDrive fallback.
#      일부 드라이브는 SerialNumber 를 hex 인코딩(ASCII)+공백(20) 패딩으로 반환 → 디코딩 정규화.
#      2026-09-03: 디코딩은 모든 바이트가 인쇄 가능(0x20~0x7E) 하고 결과에 hex 밖 문자가 하나라도 있을 때만.
#      그렇지 않으면(NAA 식별자처럼 우연히 hex 인 진짜 시리얼) 원문을 보존한다.
#   [function ConvertTo-CimCode]
#     CIM 열거형 값 → [int] 코드. Int32 / UInt16 / 그 밖의 정수 ValueType 과 숫자 문자열 만 코드로 본다.
#     이름 문자열 / bool / char / $null 은 $null. 이름은 아래 함수들이 이름 표로 먼저 본다
#     (BusType 4 의 표시 문자열 "1394" 가 숫자처럼 보이기 때문이다).
#   [function Get-DiskBusProtocol]
#     MSFT_PhysicalDisk.BusType ValueMap: 0 Unknown, 1 SCSI, 2 ATAPI, 3 ATA, 4 1394, 5 SSA,
#     6 Fibre Channel, 7 USB, 8 RAID, 9 iSCSI, 10 SAS, 11 SATA, 12 SD, 13 MMC, 14 Virtual,
#     15 File Backed Virtual, 16 Storage Spaces, 17 NVMe, 18 SCM, 19 UFS.
#     protocol 은 field_dictionary 의 닫힌 enum 이다 — 대응 항목이 없는 값은 $null (enum 을 늘리지 않는다).
#   [function Get-DiskMediaType]
#     MSFT_PhysicalDisk.MediaType ValueMap: 0 Unspecified, 3 HDD, 4 SSD, 5 SCM
#   [function Get-DiskHealth]
#     MSFT_PhysicalDisk.HealthStatus ValueMap: 0 Healthy, 1 Warning, 2 Unhealthy, 5 Unknown
#     → OK / Warning / Critical / null (Redfish 와 같은 어휘 — B-18)
#   [function Get-UidFormatCode]
#     MSFT_PhysicalDisk.UniqueIdFormat ValueMap: 0 Vendor Specific, 1 Vendor Id, 2 EUI64, 3 FCPH Name,
#     8 SCSI Name String → 코드 (모르면 -1)
#   [disks — Get-PhysicalDisk 루프의 $busUnmapped]
#     enum 대응이 없는 BusType 원값 (코드 또는 표시 문자열) — normalize 단계가 errors[].detail 근거로 쓴다
#   [disks — Get-PhysicalDisk 루프의 $serRaw / $uidRaw]
#     serial/UniqueId(wwn 후보) 캡처
#   [disks — $osDiskNumbers]
#     is_os_disk (2026-07-02): OS 루트($env:SystemDrive) 파티션이 속한 물리 디스크 번호 판정.
#     Get-Partition → DiskNumber (다중 가능). 부재 시 WMI(Win32_DiskPartition.DiskIndex) fallback.
#     Win32_DiskDrive.Index == DiskNumber 매칭. 물리 매칭 0건 → 판정불가(null, 거짓 false 방지).
#     주의: Storage Spaces/동적미러 OS 는 가상 DiskNumber 라 물리 Index 매칭 0 → 전 디스크 null
#     (Linux 의 RAID/LVM 멤버 all-true 와 비대칭 — hardware-RAID/단일디스크만 true/false. field_dictionary 명시).
#   [disks — Win32_LogicalDisk / Win32_DiskPartition fallback]
#     WMI fallback (SystemDrive 형식 가드 — WQL 문자열 주입 방지)
#   [read_disk_drives — $dd = @(Get-CimInstance Win32_DiskDrive)]
#     Win32_DiskDrive 1회 열거(감사 fix: 중복 열거/TOCTOU 제거) — 매칭·emit 공용 스냅샷
#     (P4: 종전 disks 스크립트에서 이 조회는 중간 문장이라 실패해도 다음 줄로 넘어갔다(rc 0). 그래서 disks 를
#     실패시키지 않는 공용 조회로 뺐다 — 실패는 read_disk_drives 의 ok / error 에 남는다.)
#   [disks — 디스크 루프의 if (-not $mt)]
#     Win32_DiskDrive.MediaType fallback — 진짜 SSD 정보만 매핑.
#     "Fixed hard disk media"는 SSD/HDD 구분 안 함 → null (잘못된 HDD 추정 금지).
#   [disks — 디스크 루프의 if (-not $bus)]
#     InterfaceType fallback (Win32_DiskDrive). BusType 이 enum 에 대응되지 않은 디스크(예: 3 ATA →
#     InterfaceType 'IDE') 도 종전처럼 여기서 채워질 수 있다. 채워지면 normalize 단계는 오류를 남기지 않는다.
#   [disks — 디스크 루프의 $serial]
#     serial: Get-PhysicalDisk 우선 → Win32_DiskDrive.SerialNumber fallback → 정규화
#   [disks — 디스크 루프의 $wwn]
#     wwn: UniqueId 가 WWN성 포맷(EUI64=2 / FCPHName=3 / SCSI Name String=8)일 때만 해석.
#     로컬 SATA 는 보통 null (best-effort). (MSFT_PhysicalDisk UniqueIdFormat 값맵)
#   [disks — 디스크 한 행 (rows.Add)]
#     bus_type_raw: BusType 이 protocol enum 에 대응되지 않았을 때만 원값 (아니면 null).
#     normalize 단계 전용 근거 — _w_physical_disks 가 키를 골라 담으므로 envelope 에는 나가지 않는다.
- name: "windows | storage | volumes + physical disks"
  ansible.windows.win_shell: |
    function Invoke-SeComponent($Doc, [string]$Name, [scriptblock]$Body) {
      $c = [ordered]@{ ok = $true; error = $null; rows = (New-Object System.Collections.ArrayList); data = $null }
      $Doc[$Name] = $c
      try { $null = & $Body $c }
      catch { $c.ok = $false; $c.error = [string]$_.Exception.Message; if (-not $c.error) { $c.error = [string]$_ } }
    }
    $doc = [ordered]@{}
    # 2026-10-05 (8차 R5): Get-Volume 의 비종료 오류는 구성요소의 try 가 잡지 못해, 조회 실패가 "볼륨 없음" 과 같게 보였다.
    #   받은 볼륨은 그대로 두고 오류가 있으면 구성요소를 실패로 표시한다(아래 "disk component status" 가 errors[] 로 옮긴다).
    Invoke-SeComponent $doc 'volumes' {
      param($c)
      $volErr = $null
      Get-Volume -ErrorAction SilentlyContinue -ErrorVariable volErr |
      Where-Object { $_.DriveLetter -and $_.FileSystemType -ne 'Unknown' } |
      ForEach-Object {
        [void]$c.rows.Add([PSCustomObject]@{
          drive = [string]$_.DriveLetter
          fs    = $_.FileSystemType
          total = $_.Size
          free  = $_.SizeRemaining
        })
      }
      $real = @($volErr | Where-Object { [string]$_.CategoryInfo.Category -ne 'ObjectNotFound' })
      if ($real) { throw $real[0] }
    }
    function Normalize-DiskSerial($v) {
      if (-not $v) { return $null }
      $s = ([string]$v).Trim()
      if (-not $s) { return $null }
      if ($s.Length -ge 8 -and ($s.Length % 2 -eq 0) -and ($s -match '^[0-9A-Fa-f]+$')) {
        try {
          $sb = New-Object System.Text.StringBuilder
          $allPrintable = $true
          for ($i = 0; $i -lt $s.Length; $i += 2) {
            $b = [Convert]::ToByte($s.Substring($i, 2), 16)
            if ($b -lt 32 -or $b -gt 126) { $allPrintable = $false; break }
            [void]$sb.Append([char]$b)
          }
          if ($allPrintable) {
            $dec = $sb.ToString().Trim()
            if ($dec -and ($dec -notmatch '^[0-9A-Fa-f]+$')) { $s = $dec }
          }
        } catch { }
      }
      $s = $s.Trim()
      if (-not $s -or $s -in @('NA','N/A','None','0','00000000')) { return $null }
      return $s
    }
    function ConvertTo-CimCode($v) {
      if ($null -eq $v) { return $null }
      if ($v -is [string]) {
        $t = $v.Trim()
        if ($t -match '^\d+$') { try { return [int]$t } catch { return $null } }
        return $null
      }
      if ($v -is [bool] -or $v -is [char]) { return $null }
      if ($v -is [ValueType]) { try { return [int]$v } catch { return $null } }
      return $null
    }
    function Get-DiskBusProtocol($v) {
      if ($null -eq $v) { return $null }
      if ($v -is [string]) {
        $byName = switch ($v.Trim()) {
          'SATA'          { 'SATA' }
          'SAS'           { 'SAS' }
          'NVMe'          { 'NVMe' }
          'USB'           { 'USB' }
          'RAID'          { 'RAID' }
          'SCSI'          { 'SCSI' }
          'iSCSI'         { 'iSCSI' }
          'FC'            { 'FibreChannel' }
          'Fibre Channel' { 'FibreChannel' }
          'FibreChannel'  { 'FibreChannel' }
          'SD'            { 'SD' }
          'MMC'           { 'MMC' }
          '1394'          { '1394' }
        }
        if ($byName) { return $byName }
      }
      $code = ConvertTo-CimCode $v
      if ($null -eq $code) { return $null }
      switch ($code) {
        0  { $null }
        1  { 'SCSI' }
        2  { $null }
        3  { $null }
        4  { '1394' }
        5  { $null }
        6  { 'FibreChannel' }
        7  { 'USB' }
        8  { 'RAID' }
        9  { 'iSCSI' }
        10 { 'SAS' }
        11 { 'SATA' }
        12 { 'SD' }
        13 { 'MMC' }
        14 { $null }
        15 { $null }
        16 { $null }
        17 { 'NVMe' }
        18 { $null }
        19 { $null }
        default { $null }
      }
    }
    function Get-DiskMediaType($v) {
      if ($null -eq $v) { return $null }
      if ($v -is [string]) {
        $byName = switch ($v.Trim()) {
          'HDD' { 'HDD' }
          'SSD' { 'SSD' }
          'SCM' { 'SCM' }
        }
        if ($byName) { return $byName }
      }
      $code = ConvertTo-CimCode $v
      if ($null -eq $code) { return $null }
      switch ($code) {
        0 { $null }
        3 { 'HDD' }
        4 { 'SSD' }
        5 { 'SCM' }
        default { $null }
      }
    }
    function Get-DiskHealth($v) {
      if ($null -eq $v) { return $null }
      if ($v -is [string]) {
        $byName = switch ($v.Trim()) {
          'Healthy'   { 'OK' }
          'Warning'   { 'Warning' }
          'Unhealthy' { 'Critical' }
        }
        if ($byName) { return $byName }
      }
      $code = ConvertTo-CimCode $v
      if ($null -eq $code) { return $null }
      switch ($code) {
        0 { 'OK' }
        1 { 'Warning' }
        2 { 'Critical' }
        5 { $null }
        default { $null }
      }
    }
    function Get-UidFormatCode($v) {
      if ($null -eq $v) { return -1 }
      if ($v -is [string]) {
        $byName = switch -Wildcard ($v.Trim()) {
          'EUI64'      { 2 }
          'FCPHName'   { 3 }
          'FCPH Name'  { 3 }
          'SCSIName*'  { 8 }
          'SCSI Name*' { 8 }
        }
        if ($null -ne $byName) { return $byName }
      }
      $code = ConvertTo-CimCode $v
      if ($null -eq $code) { return -1 }
      return $code
    }
    $dd = $null
    # CIM 조회 실패는 비종료 오류라 구성요소의 try 가 잡지 못한다(실측 2026-10-05) — -ErrorVariable 로 받아
    # 결과는 그대로 두고 구성요소만 실패로 표시한다(§5 감사 C-6, 아래 "disk component status" 가 errors[] 로 옮긴다)
    Invoke-SeComponent $doc 'read_disk_drives' {
      param($c)
      $seErr = $null
      $script:dd = @(Get-CimInstance Win32_DiskDrive -ErrorAction SilentlyContinue -ErrorVariable seErr)
      if ($seErr) { throw $seErr[0] }
    }
    Invoke-SeComponent $doc 'disks' {
      param($c)
      $physical_map = @{}
      if (Get-Command Get-PhysicalDisk -ErrorAction SilentlyContinue) {
        try {
          Get-PhysicalDisk | ForEach-Object {
            $btRaw = $_.BusType
            $bus = Get-DiskBusProtocol $btRaw
            $busUnmapped = $null
            if ($null -eq $bus -and $null -ne $btRaw) {
              $btCode = ConvertTo-CimCode $btRaw
              if ($null -ne $btCode) { $busUnmapped = $btCode }
              else {
                $btName = ([string]$btRaw).Trim()
                if ($btName) { $busUnmapped = $btName }
              }
            }
            $mt = Get-DiskMediaType $_.MediaType
            $health = Get-DiskHealth $_.HealthStatus
            $serRaw = [string]$_.SerialNumber
            $uidRaw = [string]$_.UniqueId
            $ufRaw  = $_.UniqueIdFormat
            $physical_map[[string]$_.DeviceId] = @{ media_type = $mt; bus = $bus; bus_unmapped = $busUnmapped; health = $health; serial = $serRaw; unique_id = $uidRaw; uid_fmt = $ufRaw; size = $_.Size }
          }
        } catch { }
      }
      $osDiskNumbers = @()
      $osDetermined = $false
      try {
        $sysDl = ([string]$env:SystemDrive).TrimEnd(':')
        if (Get-Command Get-Partition -ErrorAction SilentlyContinue) {
          $osDiskNumbers = @(Get-Partition -DriveLetter $sysDl -ErrorAction Stop |
                             Select-Object -ExpandProperty DiskNumber -Unique)
          if ($osDiskNumbers.Count -gt 0) { $osDetermined = $true }
        }
      } catch { }
      if (-not $osDetermined -and (([string]$env:SystemDrive) -match '^[A-Za-z]:$')) {
        try {
          $ld = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($env:SystemDrive)'" -ErrorAction Stop
          $parts = Get-CimAssociatedInstance -InputObject $ld -ResultClassName Win32_DiskPartition -ErrorAction Stop
          $nums = @($parts | ForEach-Object { [int]$_.DiskIndex } | Select-Object -Unique)
          if ($nums.Count -gt 0) { $osDiskNumbers = $nums; $osDetermined = $true }
        } catch { }
      }
      if ($osDetermined) {
        $allIdx = @($dd | ForEach-Object { [int]$_.Index })
        if (-not (@($osDiskNumbers | Where-Object { $allIdx -contains [int]$_ }).Count -gt 0)) { $osDetermined = $false }
      }
      $dd | ForEach-Object {
        $idx = [string]$_.Index
        $mt = $null
        $bus = $null
        $health = $null
        $pdSerial = $null
        $pdUid = $null
        $pdUidFmt = $null
        $pdSize = $null
        $busRaw = $null
        if ($physical_map.ContainsKey($idx)) {
          $pdSize = $physical_map[$idx].size
          $mt = $physical_map[$idx].media_type
          $bus = $physical_map[$idx].bus
          $busRaw = $physical_map[$idx].bus_unmapped
          $health = $physical_map[$idx].health
          $pdSerial = $physical_map[$idx].serial
          $pdUid = $physical_map[$idx].unique_id
          $pdUidFmt = $physical_map[$idx].uid_fmt
        }
        if (-not $mt) {
          $rawMt = [string]$_.MediaType
          if ($rawMt -match '(?i)solid state|ssd') { $mt = 'SSD' }
          else { $mt = $null }
        }
        if (-not $bus) {
          $iface = [string]$_.InterfaceType
          $bus = switch -Wildcard ($iface) {
            'SCSI' { 'SCSI' }
            'IDE'  { 'IDE' }
            'USB'  { 'USB' }
            'HDC'  { 'HDC' }
            '1394' { '1394' }
            default { $null }
          }
        }
        $serial = Normalize-DiskSerial $pdSerial
        if (-not $serial) { $serial = Normalize-DiskSerial ([string]$_.SerialNumber) }
        $wwn = $null
        if ($pdUid) {
          $ufInt = Get-UidFormatCode $pdUidFmt
          if ($ufInt -in @(2,3,8)) {
            $w = ([string]$pdUid).Trim()
            if ($w) { $wwn = $w }
          }
        }
        $is_os = $null
        if ($osDetermined) { $is_os = [bool]($osDiskNumbers -contains [int]$_.Index) }
        [void]$c.rows.Add([PSCustomObject]@{
          device = $_.DeviceID
          model  = $_.Model
          serial = $serial
          wwn    = $wwn
          # D-08 (2026-10-10): MSFT_PhysicalDisk.Size 우선 — Win32_DiskDrive.Size 는 디스크 기하값(실린더×헤드×섹터) 계산이라 실제보다 작다
          total  = $(if ($pdSize) { [uint64]$pdSize } else { $_.Size })
          media  = $mt
          protocol = $bus
          health   = $health
          is_os_disk = $is_os
          bus_type_raw = $busRaw
        })
      }
    }
    try { $doc | ConvertTo-Json -Depth 8 -Compress }
    catch { '{"_error":' + (ConvertTo-Json ([string]$_.Exception.Message) -Compress) + '}' }
  register: _w_stor_doc_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | storage | parse document"
  ansible.builtin.set_fact:
    _w_stor_doc: >-
      {{ (_w_stor_doc_raw.stdout | default('') | trim | from_json)
         if (_w_stor_doc_raw.stdout | default('') | trim | length > 0) else {} }}
  no_log: true

# 문서 → 종전 호출별 register 모양 (stdout / stdout_lines / rc — rc 규칙은 파일 머리말).
#   _w_vol_raw  : 종전 "volumes"        — stdout_lines = 볼륨마다 JSON 한 줄
#   _w_disk_raw : 종전 "physical disks" — stdout_lines = 디스크마다 JSON 한 줄
- name: "windows | storage | split document"
  ansible.builtin.set_fact:
    _w_vol_raw: >-
      {%- set d = _w_stor_doc if (_w_stor_doc is mapping) else {} -%}
      {%- set c = d.get('volumes') if (d.get('volumes') is mapping) else {} -%}
      {%- set rows = c.get('rows') -%}
      {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
      {%- set lines = rows | map('to_json') | list -%}
      {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
      {%- if _w_stor_doc_raw.rc is defined -%}
        {%- set r = _w_stor_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
    _w_disk_raw: >-
      {%- set d = _w_stor_doc if (_w_stor_doc is mapping) else {} -%}
      {%- set c = d.get('disks') if (d.get('disks') is mapping) else {} -%}
      {%- set rows = c.get('rows') -%}
      {%- if rows is mapping -%}{%- set rows = [rows] -%}{%- elif rows is string or rows is not iterable -%}{%- set rows = [] -%}{%- endif -%}
      {%- set lines = rows | map('to_json') | list -%}
      {%- set out = {'stdout': (lines | join('\n')), 'stdout_lines': lines} -%}
      {%- if _w_stor_doc_raw.rc is defined -%}
        {%- set r = _w_stor_doc_raw.rc -%}
        {%- set _ = out.update({'rc': (r if (r is none or (r | int) != 0) else (0 if (c.get('ok') is sameas true) else 1))}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

# P4 (cycle 2026-04-29 → 2026-05-29 enrich, hba-ib-csus): FC HBA initiator + MSFC_* 보강.
# Get-InitiatorPort = WWPN/WWNN/상태 (Win2012+ 무 role/feature). MSFC_FCAdapterHBAAttributes /
# MSFC_FibrePortHBAAttributes (root\WMI) = model/vendor/driver/firmware/speed (HBA miniport
# driver 가 T11 FC-HBA API 등록 시만 — try/catch + 부재 시 graceful null). WWN 은 colon-hex 정규화.
# source: MS docs MSFT_InitiatorPort / MSFC_* (EXTERNAL-CONTRACTS §4). lab 부재 — 사이트 실측 시 정정.
# 2026-10-10 (C6) PortSpeed 값맵 — 비트값이지 속도 숫자가 아니다. 근거:
#   1=1G · 2=2G · 4=10G · 8=4G : learn.microsoft.com/windows-hardware/drivers/storage/msfc-hbaportattributesresults-wmi-class
#                                (ValueMap 1,2,4,8 = 1,2,10,4 GBit/sec) · MS-VDS VDS_HBAPORT_SPEED_FLAG (확인 2026-10-10)
#   16=8G · 32=16G             : Microsoft SDK hbaapi.h HBA_FCPHYSPEED_8GBIT=16 · HBA_FCPHYSPEED_16GBIT=32
#                                (github.com/microsoft/win32metadata .../RecompiledIdlHeaders/shared/hbaapi.h, 확인 2026-10-10)
#   2026-10-18 (사용자 결정 2026-10-17 — 16G 넘는 코드도 매핑): 64=32G · 128=20G · 256=40G · 0x200=50G · 0x400=100G · 0x800=25G ·
#                                0x1000=64G · 0x2000=128G — T11 FC-HBA / SNIA HBA API 의 HBA_PORTSPEED_* 비트와 Linux
#                                include/uapi/scsi/scsi_transport_fc.h(FC_PORTSPEED_*) 가 같은 값이다. Windows WMI 제공자(벤더 miniport)가
#                                같은 비트를 쓰는지는 실장비 미확인 — 32G 이상 HBA 사이트 실측 시 정정.
#                                source: https://github.com/torvalds/linux/blob/master/include/scsi/scsi_transport_fc.h
#   미상 코드 → null           : 0(HBA_PORTSPEED_UNKNOWN) · 0x8000(NOT_NEGOTIATED) · 그 밖.
# 2026-10-18 (HBA 전수 점검 — 계약 docs/contract/03-fields.md 6.3.1):
#   - $ErrorActionPreference = 'Stop' 으로 비종료 오류(접근 거부 등)도 catch 에 잡고, 구성요소(initiator_ports / adapter_attrs / port_attrs)마다
#     { scope, ok, absent, type, code, error } 를 components[] 에 남긴다. 종전 빈 catch 는 "HBA 없음" 과 "읽기 실패" 를 글자까지 같게 냈다.
#   - absent = 환경에 없는 것(Get-InitiatorPort cmdlet 없음 · MSFC 클래스/네임스페이스 미등록 · Not supported) — 오류가 아니다.
#     그 밖(접근 거부 · 제공자 오류 · RPC)은 ok=false · absent=false → Jinja 가 storage errors[] 1건을 낸다(섹션 상태는 그대로).
#   - PortState(MSFC_FibrePortHBAAttributes.Attributes.PortState, HBA_PORTSTATE_*: 1 Unknown 2 Online 3 Offline 4 Bypassed 5 Diagnostics
#     6 LinkDown 7 Error 8 Loopback) 는 OperationalStatus 가 Unknown/없음일 때 link_status 보강에 쓴다.
#   lab: FC HBA 부재 — tests/unit/test_windows_storage_powershell_static.py 의 가짜 cmdlet(실제 PowerShell)으로만 검증 (실장비 미검증).
- name: "windows | storage | initiator ports + HBA attrs"
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    function Format-Wwn($v) {
      if (-not $v) { return $null }
      $s = ([string]$v).ToLower() -replace '0x','' -replace '[^0-9a-f]',''
      if ($s.Length -ne 16) { if ([string]$v) { return ([string]$v).ToLower() } else { return $null } }
      return ((0..7 | ForEach-Object { $s.Substring($_*2,2) }) -join ':')
    }
    function Wwn-FromBytes($b) {
      if (-not $b) { return $null }
      return (($b | ForEach-Object { '{0:x2}' -f [int]$_ }) -join ':')
    }
    function Test-Absent($e) {
      $code = ''
      try { $code = [string]$e.Exception.NativeErrorCode } catch { $code = '' }
      if (@('InvalidNamespace','InvalidClass','NotSupported') -contains $code) { return $true }
      return (([string]$e.Exception.Message) -match '0x8004100E|0x80041010|0x8004100C|Invalid namespace|Invalid class|Not supported')
    }
    function New-Comp($scope, $ok, $e) {
      $type = $null; $code = $null; $msg = $null; $absent = $false
      if ($e) {
        $type = $e.Exception.GetType().Name
        try { $code = [string]$e.Exception.NativeErrorCode } catch { $code = $null }
        $msg = (([string]$e.Exception.Message) -replace '[\r\n]+', ' ').Trim()
        $absent = [bool](Test-Absent $e)
      }
      return [PSCustomObject]@{ scope = $scope; ok = [bool]$ok; absent = $absent; type = $type; code = $code; error = $msg }
    }
    $comps = @()
    $ports = @()
    if (Get-Command Get-InitiatorPort -ErrorAction SilentlyContinue) {
      try {
        Get-InitiatorPort | ForEach-Object {
          $ports += [PSCustomObject]@{
            node_addr   = Format-Wwn $_.NodeAddress
            port_addr   = Format-Wwn $_.PortAddress
            conn_type   = [string]$_.ConnectionType
            oper_status = (([string[]]$_.OperationalStatus) -join ',')
          }
        }
        $comps += New-Comp 'initiator_ports' $true $null
      } catch { $comps += New-Comp 'initiator_ports' $false $_ }
    } else {
      $comps += [PSCustomObject]@{ scope = 'initiator_ports'; ok = $false; absent = $true; type = 'CommandNotFound'; code = $null; error = 'Get-InitiatorPort is not available on this host' }
    }
    $adapters = @()
    try {
      Get-CimInstance -Namespace root\WMI -ClassName MSFC_FCAdapterHBAAttributes -ErrorAction Stop | ForEach-Object {
        $adapters += [PSCustomObject]@{
          node_wwn     = Wwn-FromBytes $_.NodeWWN
          manufacturer = [string]$_.Manufacturer
          model        = [string]$_.Model
          driver       = [string]$_.DriverName
          firmware     = [string]$_.FirmwareVersion
        }
      }
      $comps += New-Comp 'adapter_attrs' $true $null
    } catch { $comps += New-Comp 'adapter_attrs' $false $_ }
    $portattrs = @()
    try {
      Get-CimInstance -Namespace root\WMI -ClassName MSFC_FibrePortHBAAttributes -ErrorAction Stop | ForEach-Object {
        $a = $_.Attributes
        $spd = [int]$a.PortSpeed
        $gbps = switch ($spd) { 1 {1} 2 {2} 4 {10} 8 {4} 16 {8} 32 {16} 64 {32} 128 {20} 256 {40} 512 {50} 1024 {100} 2048 {25} 4096 {64} 8192 {128} default {$null} }
        $portattrs += [PSCustomObject]@{
          port_wwn   = Wwn-FromBytes $a.PortWWN
          node_wwn   = Wwn-FromBytes $a.NodeWWN
          speed_gbps = $gbps
          port_state = [int]$a.PortState
        }
      }
      $comps += New-Comp 'port_attrs' $true $null
    } catch { $comps += New-Comp 'port_attrs' $false $_ }
    [PSCustomObject]@{ ports = $ports; adapters = $adapters; port_attrs = $portattrs; components = $comps } | ConvertTo-Json -Depth 6 -Compress
  register: _w_hba_raw
  changed_when: false
  failed_when: false
  no_log: true

# P4 (cycle 2026-05-29 hba-ib-csus): Windows InfiniBand best-effort (구: hardcoded []).
# 2026-10-17 (InfiniBand 전면 검증 — 계약은 docs/contract/03-fields.md 6.3.1, 결정 기록은 ADR-2026-10-17-infiniband-port-decision):
#   - 1차 신호: Get-NetAdapter -IncludeHidden 중 NdisPhysicalMedium 11(Infiniband) 또는 PhysicalMediaType 표시값 'Infiniband'.
#     MSFT_NetAdapter ValueMap 은 Infiniband (11) / 802.3 (14) — Mellanox 이더넷 모드(RoCE) · iWARP NIC 는 802.3 이라 제외된다.
#   - 2차 신호: Get-NetAdapterRdma 의 RdmaAdapterInfo.RdmaTechnology 가 'InfiniBand' 인 어댑터만 추가한다 (NDK 기술 열거값
#     iWARP=1 · InfiniBand=2 · RoCE=3 · RoCEv2=4). RDMA "지원 여부(Enabled)" 는 근거가 아니다. 두는 이유: NVIDIA WinOF-2 known
#     issue 1702662 — Windows Server 2019 의 IPoIB NIC 는 물리 매체가 802.3 으로 보고된다. 이 신호는 실장비 미확인(lab 부재).
#   - 제외: LBFO 팀 멀티플렉서(InterfaceDescription 'Multiplexor' · PnPDeviceID 'MS_IMPLAT'). INF 가 *PhysicalMediaType=14 라
#     1차에 걸리지 않지만 방어로 둔다. 종전 Get-PnpDevice 서비스명(ibbus/ibal/ipoib) 폴백은 제거 — 장치 상태 'OK' 를 링크 up 으로
#     적고 속도도 없는 값이었다(2026-06-22 사이트 오탐이 난 경로).
#   - 속도: ReceiveLinkSpeed(bps, uint64) 가 숫자 원천이고 LinkSpeed 문자열은 원문이다. node_guid/port_guid/펌웨어/물리 포트 번호는
#     표준 API 가 없어 Jinja 에서 null 로 둔다 (벤더 도구 mlx5cmd 는 쓰지 않는다 — 의존성 추가 금지).
#   - Get-NetAdapter 는 1회만 부른다 (두 신호 모두 그 목록에서 고른다).
#   source: https://learn.microsoft.com/en-us/windows/win32/fwp/wmi/netadaptercimprov/msft-netadapter (NdisPhysicalMedium ValueMap ·
#           ReceiveLinkSpeed "bits per second")
#   source: https://learn.microsoft.com/en-us/windows-hardware/drivers/network/oid-gen-physical-medium (NdisPhysicalMediumInfiniband)
#   source: https://learn.microsoft.com/en-us/windows-hardware/drivers/network/inf-requirements-for-ndkpi (*NetworkDirectTechnology 2=InfiniBand)
#   source: NVIDIA WinOF-2 Release Notes, known issue 1702662 (WS2019 IPoIB NdisPhysicalMedium=802.3)
#   lab: 부재 — tests/unit/test_windows_infiniband_detection.py 의 가짜 cmdlet(실제 PowerShell)으로만 검증 (실장비 미검증)
- name: "windows | storage | infiniband adapters (best-effort)"
  ansible.windows.win_shell: |
    $ib = @()
    $all = @()
    try { $all = @(Get-NetAdapter -IncludeHidden -ErrorAction Stop) } catch { $all = @() }
    $cand = @($all | Where-Object {
      ([string]$_.InterfaceDescription -notmatch 'Multiplexor') -and ([string]$_.PnPDeviceID -notmatch 'MS_IMPLAT')
    })
    $how = @{}
    foreach ($a in $cand) {
      if (($a.NdisPhysicalMedium -eq 11) -or ([string]$a.PhysicalMediaType -ieq 'Infiniband')) { $how[[string]$a.Name] = 'physical_medium' }
    }
    try {
      foreach ($r in @(Get-NetAdapterRdma -ErrorAction Stop)) {
        if ($null -eq $r) { continue }
        $n = [string]$r.Name
        if ((-not $how.ContainsKey($n)) -and ([string]$r.RdmaAdapterInfo.RdmaTechnology -ieq 'InfiniBand')) { $how[$n] = 'rdma_technology' }
      }
    } catch { }
    foreach ($a in $cand) {
      $n = [string]$a.Name
      if (-not $how.ContainsKey($n)) { continue }
      $rx = 0
      try { $rx = [uint64]$a.ReceiveLinkSpeed } catch { $rx = 0 }
      $ib += [PSCustomObject]@{
        adapter     = [string]$a.InterfaceDescription
        name        = $n
        link_status = [string]$a.Status
        rate        = [string]$a.LinkSpeed
        rx_bps      = $rx
        vendor      = [string]$a.DriverProvider
        evidence    = [string]$how[$n]
      }
    }
    [PSCustomObject]@{ ib = $ib } | ConvertTo-Json -Depth 5 -Compress
  register: _w_ib_raw
  changed_when: false
  failed_when: false
  no_log: true

# cycle 2026-05-29 (hba-ib-csus): HBA/IB canonical 정규화.
#   - win_shell 단일 JSON object(stdout) 파싱 (구: line-by-line).
#   - FC/iSCSI 만 hbas[] (SAS/Other initiator 제외 — storage controller 영역).
#   - MSFC_* 보강 join (node_wwn → vendor/model/driver/firmware ; port_wwn → speed).
#   - canonical 키 (wwpn/wwnn/model/vendor/driver/firmware/link_status/link_speed_gbps/port_type/source).
# 2026-10-03 (C3):
#   - node WWN 이 맞는 어댑터가 없으면 model/vendor/driver/firmware 는 null. 종전에는 첫 번째 어댑터
#     (adapters[0]) 값을 붙여 다른 HBA 나 iSCSI initiator 에 엉뚱한 모델/펌웨어가 보고됐다. 포트 자체는 남긴다.
#   - join 키(어댑터 node_wwn / 포트 속성 port_wwn) 도 normalize_wwn 으로 맞춘다 — fallback 이 없어진 뒤로는
#     표기 차이(대소문자) 가 곧 매칭 실패가 되기 때문이다.
#   - MSFT_InitiatorPort.ConnectionType ValueMap: 0 Other, 1 Fibre Channel, 2 iSCSI, 3 SAS.
#     Storage 모듈은 표시 문자열을 주지만 CIM 원값(숫자) 도 인식한다. connection 출력은 표시 문자열 그대로이고,
#     숫자로 받으면 같은 표시 문자열("Fibre Channel" / "iSCSI") 로 낸다.
#   - MSFT_InitiatorPort.OperationalStatus (UInt16[]) ValueMap: 1 Unknown, 2 Operational, 3 User Offline,
#     4 Bypassed, 5 In diagnostics mode, 6 Link Down, 7 Port Error, 8 Loopback. 종전 코드값(2=up, 6/7=down) 은
#     이 표와 맞다. 다만 여러 값이 쉼표로 이어 붙으면("6,7") 완전일치 비교가 놓쳤으므로 값 단위로 본다.
#   - 근거: CIM 스키마 ValueMap (root/Microsoft/Windows/Storage 의 MSFT_InitiatorPort) + Storage.types.ps1xml,
#     learn.microsoft.com "MSFT_InitiatorPort class".
# 2026-10-18 (Bug B 차단): rc != 0 이거나 stdout 이 JSON 객체 모양('{' … '}')이 아니면 from_json 을 부르지 않는다 — 종전에는 from_json 예외가
#   이 파일(block/rescue 없음)을 벗어나 play rescue 로 가서 다른 섹션까지 비웠다. 그 사실은 _w_hba_script_failed / _w_ib_script_failed 로 남겨
#   build fragment 가 storage errors[] 1건을 낸다(섹션 상태는 그대로). 빈 stdout + rc 0 은 종전처럼 빈 결과(오류 없음)다.
- name: "windows | storage | parse HBA/IB raw json"
  ansible.builtin.set_fact:
    _w_hba_script_failed: >-
      {%- set so = (_w_hba_raw.stdout | default('') | string | trim) -%}
      {%- set rc = (_w_hba_raw.rc | default(0)) | int -%}
      {{ (rc != 0) or (so != '' and not (so.startswith('{') and so.endswith('}'))) }}
    _w_ib_script_failed: >-
      {%- set so = (_w_ib_raw.stdout | default('') | string | trim) -%}
      {%- set rc = (_w_ib_raw.rc | default(0)) | int -%}
      {{ (rc != 0) or (so != '' and not (so.startswith('{') and so.endswith('}'))) }}
    _w_hba_script_error: >-
      {%- set rc = (_w_hba_raw.rc | default(0)) | int -%}
      {%- set se = ((_w_hba_raw.stderr | default('') | string) | replace('\n', ' ') | replace('\r', ' ') | trim)[:160] -%}
      {%- set so = ((_w_hba_raw.stdout | default('') | string) | replace('\n', ' ') | replace('\r', ' ') | trim)[:160] -%}
      {{ 'rc=' ~ rc ~ '; stderr=' ~ (se or 'none') ~ '; stdout=' ~ (so or 'none') }}
    _w_hba_parsed: >-
      {%- set so = (_w_hba_raw.stdout | default('') | string | trim) -%}
      {%- set rc = (_w_hba_raw.rc | default(0)) | int -%}
      {{ (so | from_json) if (rc == 0 and so.startswith('{') and so.endswith('}')) else {'ports': [], 'adapters': [], 'port_attrs': [], 'components': []} }}
    _w_ib_parsed: >-
      {%- set so = (_w_ib_raw.stdout | default('') | string | trim) -%}
      {%- set rc = (_w_ib_raw.rc | default(0)) | int -%}
      {{ (so | from_json) if (rc == 0 and so.startswith('{') and so.endswith('}')) else {'ib': []} }}
  no_log: true

- name: "windows | storage | build HBA/IB canonical lists"
  ansible.builtin.set_fact:
    _w_hbas: >-
      {%- set out = [] -%}
      {#- PS5.1 ConvertTo-Json 단일 원소 배열 → object collapse 방어: mapping 이면 [wrap] -#}
      {%- set ports = _w_hba_parsed.ports | default([]) -%}
      {%- if ports is mapping -%}{%- set ports = [ports] -%}{%- endif -%}
      {%- set adapters = _w_hba_parsed.adapters | default([]) -%}
      {%- if adapters is mapping -%}{%- set adapters = [adapters] -%}{%- endif -%}
      {%- set pattrs = _w_hba_parsed.port_attrs | default([]) -%}
      {%- if pattrs is mapping -%}{%- set pattrs = [pattrs] -%}{%- endif -%}
      {%- set adp_by_node = {} -%}
      {%- for a in adapters -%}
        {%- set ak = (a.node_wwn | default(none)) | normalize_wwn -%}
        {%- if ak -%}{%- set _ = adp_by_node.update({ak: a}) -%}{%- endif -%}
      {%- endfor -%}
      {%- set pa_by_wwpn = {} -%}
      {%- for pa in pattrs -%}
        {%- set pk = (pa.port_wwn | default(none)) | normalize_wwn -%}
        {%- if pk -%}{%- set _ = pa_by_wwpn.update({pk: pa}) -%}{%- endif -%}
      {%- endfor -%}
      {%- for p in ports -%}
        {%- set ct_raw = p.conn_type | default(none) -%}
        {%- set ct = ((ct_raw if ct_raw is not none else '') | string | trim | lower) -%}
        {%- set is_fc = ('fibre' in ct) or ct == '1' -%}
        {%- set is_iscsi = ('iscsi' in ct) or ct == '2' -%}
        {%- if is_fc or is_iscsi -%}
          {%- set wwpn = (p.port_addr | default(none)) | normalize_wwn -%}
          {%- set wwnn = (p.node_addr | default(none)) | normalize_wwn -%}
          {%- set adp = (adp_by_node.get(wwnn, {}) if wwnn else {}) -%}
          {%- set pa = (pa_by_wwpn.get(wwpn, {}) if wwpn else {}) -%}
          {%- set os = (p.oper_status | default('')) | string | lower -%}
          {%- set os_codes = os.split(',') | map('trim') | list -%}
          {# 2026-10-19 (사용자 결정): link_status 는 up / down 둘뿐 — 값은 항상 들어간다. OperationalStatus 2 Operational → up; 3 User Offline ·
             4 Bypassed · 5 In diagnostics mode · 6 Link Down · 7 Port Error · 8 Loopback → down; 1 Unknown/없음이면 MSFC PortState 2(Online) 만 up 으로
             보강하고 그 밖(PortState 1 · 3~8 · 둘 다 없음)은 down. 2026-10-18 의 null(미제공) 은 폐지. #}
          {%- set os_up = ('oper' in os) or ('2' in os_codes) -%}
          {%- set os_down = (not os_up) and (('down' in os) or ('error' in os) or ('offline' in os) or ('bypass' in os) or ('diagnos' in os) or ('loopback' in os) or ((os_codes | select('in', ['3', '4', '5', '6', '7', '8']) | list | length) > 0)) -%}
          {%- set ps_raw = pa.port_state | default(none) -%}
          {%- set ps = (ps_raw | int) if (ps_raw is not none and (ps_raw | string | trim) != '') else none -%}
          {%- set link = 'up' if (os_up or ((not os_down) and ps == 2)) else 'down' -%}
          {%- set _ = out.append({
            'wwpn':            wwpn if is_fc else none,
            'wwnn':            wwnn if is_fc else none,
            'model':           (adp.model | default(none, true)) or none,
            'vendor':          (adp.manufacturer | default(none, true)) or none,
            'driver':          (adp.driver | default(none, true)) or none,
            'firmware':        (adp.firmware | default(none, true)) or none,
            'link_status':     link,
            'link_speed_gbps': pa.speed_gbps | default(none),
            'port_type':       'FibreChannel' if is_fc else 'iSCSI',
            'connection':      ('Fibre Channel' if ct == '1' else ('iSCSI' if ct == '2' else ct_raw)),
            'source':          'os',
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    # 2026-10-18 (W1): HBA 스크립트 구성요소(initiator_ports / adapter_attrs / port_attrs)별 성패 — absent(cmdlet · WMI 클래스 부재 = 환경)는
    #   오류가 아니고, ok=false 이면서 absent 가 아닌 것(접근 거부 · 제공자 오류 · RPC)만 build fragment 의 storage errors[] 1건 근거다.
    _w_hba_components_failed: >-
      {%- set out = [] -%}
      {%- set comps = _w_hba_parsed.components | default([]) -%}
      {%- if comps is mapping -%}{%- set comps = [comps] -%}{%- endif -%}
      {%- for c in comps -%}
        {%- if c is mapping and ((c.ok | default(true)) is sameas false) and not ((c.absent | default(false)) is sameas true) -%}
          {%- set _ = out.append({'scope': c.scope | default('unknown'), 'type': c.type | default(none), 'code': c.code | default(none),
                                  'error': ((c.error | default('', true)) | string)[:160]}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    # 2026-10-17 (InfiniBand 전면 검증): 항목 1개 = IB 어댑터 1개(물리 포트 번호는 표준 API 가 없어 port=null — 연결 이름을
    #   포트 번호로 적지 않는다). link_status 는 Get-NetAdapter Status 표시값 Up→up · Disconnected→down · 그 외(Disabled ·
    #   Not Present · Unknown …)→unknown. rate 는 LinkSpeed 원문(ReceiveLinkSpeed 가 0 이면 null), rate_gbps 는 up 일 때만
    #   ReceiveLinkSpeed/1e9 (정수면 int, 아니면 2.5 같은 float). note 에 내부 규칙 번호를 적지 않는다.
    _w_ib: >-
      {%- set out = [] -%}
      {%- set ib_list = _w_ib_parsed.ib | default([]) -%}
      {%- if ib_list is mapping -%}{%- set ib_list = [ib_list] -%}{%- endif -%}
      {%- for a in ib_list -%}
        {%- set rx = (a.rx_bps | default(0, true)) | int -%}
        {%- set ls = (a.link_status | default('', true)) | string | trim | lower -%}
        {%- set link = 'up' if ls == 'up' else ('down' if ls == 'disconnected' else 'unknown') -%}
        {%- set gb_raw = (rx / 1000000000) if (link == 'up' and rx > 0) else none -%}
        {%- set gb = ((gb_raw | int) if (gb_raw is not none and gb_raw == (gb_raw | int)) else gb_raw) -%}
        {%- set _ = out.append({
          'adapter':     a.adapter | default(none),
          'port':        none,
          'node_guid':   none,
          'port_guid':   none,
          'link_status': link,
          'rate':        ((a.rate | default(none, true)) or none) if rx > 0 else none,
          'rate_gbps':   gb,
          'model':       a.adapter | default(none),
          'vendor':      (a.vendor | default(none, true)) or none,
          'firmware':    none,
          'source':      'os',
          'note':        'Windows 는 표준 API 로 node_guid/port_guid/펌웨어/물리 포트 번호를 제공하지 않아 null (best-effort).',
        }) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | storage | normalize filesystems"
  ansible.builtin.set_fact:
    _w_norm_filesystems: >-
      {%- set out = [] -%}
      {%- for line in (_w_vol_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set v = line | from_json -%}
          {%- set total_b = (v.total | int) if (v.total is defined and v.total is not none) else 0 -%}
          {%- set free_b  = (v.free  | int) if (v.free  is defined and v.free  is not none) else 0 -%}
          {%- set total_mb = (total_b / 1048576) | round(0, 'floor') | int -%}
          {%- set free_mb  = (free_b  / 1048576) | round(0, 'floor') | int -%}
          {%- if total_mb > 0 -%}
            {%- set used_mb = total_mb - free_mb -%}
            {%- set _ = out.append({
              'device':        v.drive ~ ':',
              'mount_point':   v.drive ~ ':\\',
              'filesystem':    v.fs,
              'total_mb':      total_mb,
              'used_mb':       used_mb,
              'available_mb':  free_mb,
              'usage_percent': (used_mb / total_mb * 100) | round(1),
              'status':        'mounted'
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _w_physical_disks: >-
      {%- set out = [] -%}
      {%- for line in (_w_disk_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set d = line | from_json -%}
          {%- set total_b = (d.total | int) if (d.total is defined and d.total is not none) else 0 -%}
          {%- set total_mb = (total_b / 1048576) | round(0,'floor') | int -%}
          {%- if total_mb > 0 -%}
            {%- set _ = out.append({
              'id':         d.device,
              'device':     d.device,
              'model':      (d.model | default(none, true)) or none,
              'serial':     d.serial | default(none),
              'wwn':        d.wwn | default(none),
              'total_mb':   total_mb,
              'media_type': d.media | default(none),
              'protocol':   d.protocol | default(none),
              'health':     d.health | default(none),
              'is_os_disk': d.is_os_disk | default(none)
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    # 2026-10-03 (C4): BusType 이 protocol enum 에 대응되지 않아 protocol 이 비어 남은 디스크의 원값
    #   (출력 대상 디스크만, 중복 제거, 디스크 순서). InterfaceType 보조 판정이 채운 디스크는 제외한다.
    _w_disk_bus_unmapped: >-
      {%- set out = [] -%}
      {%- for line in (_w_disk_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set d = line | from_json -%}
          {%- set total_b = (d.total | int) if (d.total is defined and d.total is not none) else 0 -%}
          {%- set total_mb = (total_b / 1048576) | round(0,'floor') | int -%}
          {%- set raw = d.bus_type_raw | default(none) -%}
          {%- if total_mb > 0 and (d.protocol | default(none)) is none and raw is not none and raw not in out -%}
            {%- set _ = out.append(raw) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

# cycle-016 (2026-04-29): storage.summary grouping
- name: "windows | storage | compute summary groups"
  ansible.builtin.set_fact:
    _w_stor_summary: >-
      {%- set ns = namespace(groups=[], seen={}, total=0) -%}
      {%- for d in (_w_physical_disks | default([])) -%}
        {%- set cap_gb = ((d.total_mb | default(0)) | int / 1024) | round(0, 'floor') | int -%}
        {%- if cap_gb > 0 -%}
          {%- set mt = d.media_type | default(none) -%}
          {%- set pr = d.protocol | default(none) -%}
          {%- set md = d.model | default(none) -%}
          {%- set key = (cap_gb|string)~'|'~(mt|string)~'|'~(pr|string)~'|'~(md|string) -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set q = ns.groups[idx].quantity + 1 -%}
            {%- set _ = ns.groups[idx].update({'quantity': q, 'group_total_gb': q * cap_gb}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'unit_capacity_gb': cap_gb, 'model': md, 'media_type': mt, 'protocol': pr, 'quantity': 1, 'group_total_gb': cap_gb}) -%}
          {%- endif -%}
          {%- set ns.total = ns.total + cap_gb -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups, 'grand_total_gb': ns.total} }}
    _w_stor_ok: "{{ ((_w_physical_disks | default([])) | length > 0) or ((_w_norm_filesystems | default([])) | length > 0) }}"
    # 2026-10-18 (X6, 사용자 결정 2026-10-18): BusType RAID(protocol 'RAID') 디스크 = RAID 컨트롤러 뒤의 논리 볼륨 — physical_disks 에도 그대로
    #   남긴다(Additive). Windows 표준 API 는 볼륨 ↔ 컨트롤러 · 멤버 디스크를 주지 않아 controller_id null · member_drive_ids [] · raid_level null.
    _w_logical_volumes: >-
      {%- set out = [] -%}
      {%- for d in (_w_physical_disks | default([])) -%}
        {%- if (d.protocol | default(none)) == 'RAID' -%}
          {%- set _ = out.append({'id': d.id, 'name': d.model | default(none), 'controller_id': none, 'member_drive_ids': [], 'raid_level': none,
                                  'total_mb': d.total_mb | default(none), 'health': d.health | default(none), 'state': none, 'boot_volume': none}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

# 2026-10-05 (최종 정비 §5 — 감사 C-6): 볼륨만 읽혀도 섹션이 성공하므로, 물리 디스크 쪽 구성요소(Win32_DiskDrive 조회 ·
#   disks)가 실패해 physical_disks 가 비거나 모자라도 기록이 없었다. 실패한 구성요소를 errors[] 1건으로 남긴다(섹션 상태는 그대로).
- name: "windows | storage | disk component status"
  ansible.builtin.set_fact:
    _w_stor_parts_failed: >-
      {%- set d = _w_stor_doc if (_w_stor_doc is mapping) else {} -%}
      {%- set out = [] -%}
      {%- for k in ['read_disk_drives', 'disks'] -%}
        {%- if (d.get(k) is mapping) and (d.get(k).get('ok') is sameas false) -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    # 2026-10-05 (8차 R5): 파일시스템(Get-Volume) 조회 실패 — 물리 디스크만 읽혀 섹션이 성공해도 filesystems 가 빈 이유를 남긴다
    _w_stor_volumes_failed: >-
      {%- set d = _w_stor_doc if (_w_stor_doc is mapping) else {} -%}
      {{ (d.get('volumes') is mapping) and (d.get('volumes').get('ok') is sameas false) }}
    _w_stor_volumes_error: >-
      {%- set d = _w_stor_doc if (_w_stor_doc is mapping) else {} -%}
      {%- set c = d.get('volumes') if (d.get('volumes') is mapping) else {} -%}
      {{ ((c.get('error') | default('', true) | string) | replace('\n', ' ') | replace('\r', ' '))[:160] }}
  no_log: true

- name: "windows | storage | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      storage:
        filesystems:     "{{ _w_norm_filesystems }}"
        physical_disks:  "{{ _w_physical_disks }}"
        datastores:      []
        controllers:     []
        # 2026-10-18 (X6): BusType RAID 디스크를 논리 볼륨으로도 싣는다 (Redfish 와 같은 키)
        logical_volumes: "{{ _w_logical_volumes | default([]) }}"
        # cycle-016 (2026-04-29): Win32_DiskDrive 기반 group summary
        summary:         "{{ _w_stor_summary | default({'groups': [], 'grand_total_gb': 0}) }}"
        # P4 (cycle 2026-04-29 → 2026-05-29): Get-InitiatorPort + MSFC_* FC HBA / Get-NetAdapter IB
        hbas:            "{{ _w_hbas | default([]) }}"
        infiniband:      "{{ _w_ib | default([]) }}"
    _sections_supported_fragment: ['storage']
    _sections_collected_fragment: "{{ ['storage'] if (_w_stor_ok | bool) else [] }}"
    _sections_failed_fragment:    "{{ [] if (_w_stor_ok | bool) else ['storage'] }}"
    # 2026-10-03 (C4): protocol 이 비어 남은 미분류 BusType 디스크가 있으면 1건 추가 (디스크 수와 무관).
    #   섹션은 collected 그대로 — errors[] 는 status 를 바꾸지 않는다 (build_status.yml 시나리오 B).
    _errors_fragment: >-
      {{ ([] if (_w_stor_ok | bool) else [{
           'section': 'storage',
           'message': '스토리지 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Get-Volume,Win32_DiskDrive; cause=no_output; rc=' ~ (_w_disk_raw.rc | default('none')))}])
         + ([{
           'section': 'storage',
           'message': '스토리지 정보 중 물리 디스크 정보를 읽지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Win32_DiskDrive,Get-PhysicalDisk; cause=component_failed; parts=' ~ (_w_stor_parts_failed | join(',')) ~ '; disks=' ~ ((_w_physical_disks | default([])) | length))}]
            if ((_w_stor_ok | bool) and ((_w_stor_parts_failed | default([])) | length > 0)) else [])
         + ([{
           'section': 'storage',
           'message': '스토리지 정보 중 파일시스템(볼륨) 정보를 읽지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Get-Volume; cause=component_failed; parts=volumes; filesystems=' ~ ((_w_norm_filesystems | default([])) | length)
                       ~ (('; error=' ~ _w_stor_volumes_error) if (_w_stor_volumes_error | default('', true)) else ''))}]
            if ((_w_stor_ok | bool) and (_w_stor_volumes_failed | default(false) | bool)) else [])
         + ([{
           'section': 'storage',
           'message': '일부 디스크의 연결 인터페이스 종류를 분류하지 못해 해당 항목을 비워 두었습니다.',
           'detail':  ('source=Get-PhysicalDisk; cause=unmapped_bus_type; bus_type_raw=[' ~ ((_w_disk_bus_unmapped | default([])) | join(',')) ~ ']')}]
            if ((_w_disk_bus_unmapped | default([])) | length > 0) else [])
         + ([{
           'section': 'storage',
           'message': '스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Get-InitiatorPort,MSFC_FCAdapterHBAAttributes,MSFC_FibrePortHBAAttributes; cause=command_failed; ' ~ (_w_hba_script_error | default('', true)))}]
            if (_w_hba_script_failed | default(false) | bool) else [])
         + ([{
           'section': 'storage',
           'message': '스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  ('source=Get-InitiatorPort,MSFC_FCAdapterHBAAttributes,MSFC_FibrePortHBAAttributes; cause=component_failed; parts='
                       ~ ((_w_hba_components_failed | default([])) | map(attribute='scope') | join(','))
                       ~ '; error=' ~ ((((_w_hba_components_failed | default([])) | first | default({})).error) | default('none', true)))}]
            if ((not (_w_hba_script_failed | default(false) | bool)) and ((_w_hba_components_failed | default([])) | length > 0)) else [])
         + ([{
           'section': 'storage',
           'message': '스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
           'detail':  'source=Get-NetAdapter,Get-NetAdapterRdma; cause=command_failed; scope=infiniband'}]
            if (_w_ib_script_failed | default(false) | bool) else []) }}
  no_log: true

- name: "windows | storage | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
