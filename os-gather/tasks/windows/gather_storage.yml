---
# os-gather/tasks/windows/gather_storage.yml → data.storage fragment

- name: "windows | storage | volumes"
  ansible.windows.win_shell: |
    Get-Volume |
    Where-Object { $_.DriveLetter -and $_.FileSystemType -ne 'Unknown' } |
    ForEach-Object {
      [PSCustomObject]@{
        drive = [string]$_.DriveLetter
        fs    = $_.FileSystemType
        total = $_.Size
        free  = $_.SizeRemaining
      } | ConvertTo-Json -Compress
    }
  register: _w_vol_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | storage | physical disks"
  ansible.windows.win_shell: |
    # Get-PhysicalDisk(modern) + Win32_DiskDrive(fallback)로
    # MediaType을 HDD/SSD enum으로 정규화. 기존 raw WMI string ("Fixed hard disk media") 누출 차단.
    # PS5.1=int / PS7+=enum string 양쪽 BusType 처리.
    #   Win32_DiskDrive raw "Fixed hard disk media"는 SSD/HDD 정보 부재 → null (잘못된 추정 차단).
    #   HealthStatus 매핑 (Healthy/Warning/Unhealthy) → health 필드.
    $physical_map = @{}
    if (Get-Command Get-PhysicalDisk -ErrorAction SilentlyContinue) {
      try {
        Get-PhysicalDisk | ForEach-Object {
          # MSFT_PhysicalDisk.MediaType: PS5.1=int (3=HDD, 4=SSD, 5=SCM, 0=Unspecified)
          # PS7+=string ("HDD", "SSD", "SCM", "Unspecified")
          $mtRaw = $_.MediaType
          $mt = if ($mtRaw -is [int]) {
                  switch ([int]$mtRaw) { 3{'HDD'} 4{'SSD'} 5{'SCM'} default{$null} }
                } else {
                  switch ([string]$mtRaw) { 'HDD'{'HDD'} 'SSD'{'SSD'} 'SCM'{'SCM'} default{$null} }
                }
          # BusType: PS5.1=int (6=SATA, 7=USB, 8=RAID, 10=SAS, 17=NVMe, 11=SCSI)
          # PS7+=enum string ("SATA", "SAS", "NVMe", ...)
          $btRaw = $_.BusType
          $bus = if ($btRaw -is [int]) {
                   switch ([int]$btRaw) {
                     1{'SCSI'} 6{'SATA'} 7{'USB'} 8{'RAID'} 10{'SAS'}
                     11{'SCSI'} 17{'NVMe'} 18{'SD'} 19{'MMC'} default{$null}
                   }
                 } else {
                   $bts = [string]$btRaw
                   switch -Wildcard ($bts) {
                     'SATA'  { 'SATA' }
                     'SAS'   { 'SAS' }
                     'NVMe'  { 'NVMe' }
                     'USB'   { 'USB' }
                     'RAID'  { 'RAID' }
                     'SCSI'  { 'SCSI' }
                     'iSCSI' { 'iSCSI' }
                     'FC'    { 'FibreChannel' }
                     default { $null }
                   }
                 }
          # HealthStatus: "Healthy", "Warning", "Unhealthy", "Unknown"
          $hs = [string]$_.HealthStatus
          $health = switch ($hs) {
            'Healthy'   { 'healthy' }
            'Warning'   { 'warning' }
            'Unhealthy' { 'unhealthy' }
            default     { $null }
          }
          $physical_map[[string]$_.DeviceId] = @{ media_type = $mt; bus = $bus; health = $health }
        }
      } catch { }
    }
    Get-CimInstance Win32_DiskDrive | ForEach-Object {
      $idx = [string]$_.Index
      $mt = $null
      $bus = $null
      $health = $null
      if ($physical_map.ContainsKey($idx)) {
        $mt = $physical_map[$idx].media_type
        $bus = $physical_map[$idx].bus
        $health = $physical_map[$idx].health
      }
      # Win32_DiskDrive.MediaType fallback — 진짜 SSD 정보만 매핑.
      # "Fixed hard disk media"는 SSD/HDD 구분 안 함 → null (잘못된 HDD 추정 금지).
      if (-not $mt) {
        $rawMt = [string]$_.MediaType
        if ($rawMt -match '(?i)solid state|ssd') { $mt = 'SSD' }
        else { $mt = $null }
      }
      # InterfaceType fallback (Win32_DiskDrive)
      if (-not $bus) {
        $iface = [string]$_.InterfaceType
        $bus = switch -Wildcard ($iface) {
          'SCSI' { 'SCSI' }
          'IDE'  { 'IDE' }
          'USB'  { 'USB' }
          'HDC'  { 'HDC' }
          '1394' { '1394' }
          default { $null }
        }
      }
      [PSCustomObject]@{
        device = $_.DeviceID
        model  = $_.Model
        total  = $_.Size
        media  = $mt
        protocol = $bus
        health   = $health
      } | ConvertTo-Json -Compress
    }
  register: _w_disk_raw
  changed_when: false
  failed_when: false
  no_log: true

# FC HBA initiator + MSFC_* 보강.
# Get-InitiatorPort = WWPN/WWNN/상태 (Win2012+ 무 role/feature). MSFC_FCAdapterHBAAttributes /
# MSFC_FibrePortHBAAttributes (root\WMI) = model/vendor/driver/firmware/speed (HBA miniport
# driver 가 T11 FC-HBA API 등록 시만 — try/catch + 부재 시 graceful null). WWN 은 colon-hex 정규화.
# source: MS docs MSFT_InitiatorPort / MSFC_*. lab 부재 — 사이트 실측 시 정정.
- name: "windows | storage | initiator ports + HBA attrs"
  ansible.windows.win_shell: |
    function Format-Wwn($v) {
      if (-not $v) { return $null }
      $s = ([string]$v).ToLower() -replace '0x','' -replace '[^0-9a-f]',''
      if ($s.Length -ne 16) { if ([string]$v) { return ([string]$v).ToLower() } else { return $null } }
      return ((0..7 | ForEach-Object { $s.Substring($_*2,2) }) -join ':')
    }
    function Wwn-FromBytes($b) {
      if (-not $b) { return $null }
      return (($b | ForEach-Object { '{0:x2}' -f [int]$_ }) -join ':')
    }
    $ports = @()
    if (Get-Command Get-InitiatorPort -ErrorAction SilentlyContinue) {
      try {
        Get-InitiatorPort | ForEach-Object {
          $ports += [PSCustomObject]@{
            node_addr   = Format-Wwn $_.NodeAddress
            port_addr   = Format-Wwn $_.PortAddress
            conn_type   = [string]$_.ConnectionType
            oper_status = (([string[]]$_.OperationalStatus) -join ',')
          }
        }
      } catch { }
    }
    $adapters = @()
    try {
      Get-CimInstance -Namespace root\WMI -ClassName MSFC_FCAdapterHBAAttributes -ErrorAction Stop | ForEach-Object {
        $adapters += [PSCustomObject]@{
          node_wwn     = Wwn-FromBytes $_.NodeWWN
          manufacturer = [string]$_.Manufacturer
          model        = [string]$_.Model
          driver       = [string]$_.DriverName
          firmware     = [string]$_.FirmwareVersion
        }
      }
    } catch { }
    $portattrs = @()
    try {
      Get-CimInstance -Namespace root\WMI -ClassName MSFC_FibrePortHBAAttributes -ErrorAction Stop | ForEach-Object {
        $a = $_.Attributes
        $spd = [int]$a.PortSpeed
        # MSFC_FibrePortHBAAttributes.PortSpeed 는 T11 FC-HBA API bitmask: 비트값 → FC 세대 Gbps.
        # 16=10GFC, 32=16GFC, 64=32GFC, 128=64GFC (1/2/4/8 은 그대로 Gb). 비트값 ≠ Gbps 라 매핑 필수.
        $gbps = switch ($spd) { 1 {1} 2 {2} 4 {4} 8 {8} 16 {10} 32 {16} 64 {32} 128 {64} default {$null} }
        $portattrs += [PSCustomObject]@{
          port_wwn   = Wwn-FromBytes $a.PortWWN
          node_wwn   = Wwn-FromBytes $a.NodeWWN
          speed_gbps = $gbps
          port_state = [int]$a.PortState
        }
      }
    } catch { }
    [PSCustomObject]@{ ports = $ports; adapters = $adapters; port_attrs = $portattrs } | ConvertTo-Json -Depth 6 -Compress
  register: _w_hba_raw
  changed_when: false
  failed_when: false
  no_log: true

# Windows InfiniBand best-effort (구: hardcoded []).
# Get-NetAdapter PhysicalMediaType=InfiniBand / NdisPhysicalMedium=11 (authoritative) +
# Get-PnpDevice VEN_15B3 (Mellanox) fallback. node_guid 는 Windows 표준 API 부재 → null (날조 금지).
# source: MS docs Get-NetAdapter / OID_GEN_PHYSICAL_MEDIUM. lab 부재.
- name: "windows | storage | infiniband adapters (best-effort)"
  ansible.windows.win_shell: |
    $ib = @()
    try {
      Get-NetAdapter -IncludeHidden -ErrorAction Stop | Where-Object {
        ([string]$_.PhysicalMediaType -eq 'InfiniBand') -or ($_.NdisPhysicalMedium -eq 11)
      } | ForEach-Object {
        $rdma = $null
        try { $r = Get-NetAdapterRdma -Name $_.Name -ErrorAction Stop; if ($r) { $rdma = [bool]$r.Enabled } } catch { }
        $ib += [PSCustomObject]@{
          adapter     = [string]$_.InterfaceDescription
          name        = [string]$_.Name
          link_status = [string]$_.Status
          rate        = [string]$_.LinkSpeed
          rdma        = $rdma
        }
      }
    } catch { }
    if ($ib.Count -eq 0) {
      try {
        Get-PnpDevice -Class Net -ErrorAction Stop | Where-Object {
          ([string]$_.HardwareID -match 'VEN_15B3') -or ([string]$_.Service -match '^(mlx|ibal|nd)')
        } | ForEach-Object {
          $ib += [PSCustomObject]@{
            adapter     = [string]$_.FriendlyName
            name        = [string]$_.InstanceId
            link_status = [string]$_.Status
            rate        = $null
            rdma        = $null
          }
        }
      } catch { }
    }
    [PSCustomObject]@{ ib = $ib } | ConvertTo-Json -Depth 5 -Compress
  register: _w_ib_raw
  changed_when: false
  failed_when: false
  no_log: true

# HBA/IB canonical 정규화.
#   - win_shell 단일 JSON object(stdout) 파싱 (구: line-by-line).
#   - FC/iSCSI 만 hbas[] (SAS/Other initiator 제외 — storage controller 영역).
#   - MSFC_* 보강 join (node_wwn → vendor/model/driver/firmware ; port_wwn → speed).
#   - canonical 키 (wwpn/wwnn/model/vendor/driver/firmware/link_status/link_speed_gbps/port_type/source).
- name: "windows | storage | parse HBA/IB raw json"
  ansible.builtin.set_fact:
    _w_hba_parsed: "{{ (_w_hba_raw.stdout | default('') | trim | from_json) if (_w_hba_raw.stdout | default('') | trim) else {'ports': [], 'adapters': [], 'port_attrs': []} }}"
    _w_ib_parsed:  "{{ (_w_ib_raw.stdout  | default('') | trim | from_json) if (_w_ib_raw.stdout  | default('') | trim) else {'ib': []} }}"
  no_log: true

- name: "windows | storage | build HBA/IB canonical lists"
  ansible.builtin.set_fact:
    _w_hbas: >-
      {%- set out = [] -%}
      {#- PS5.1 ConvertTo-Json 단일 원소 배열 → object collapse 방어: mapping 이면 [wrap] -#}
      {%- set ports = _w_hba_parsed.ports | default([]) -%}
      {%- if ports is mapping -%}{%- set ports = [ports] -%}{%- endif -%}
      {%- set adapters = _w_hba_parsed.adapters | default([]) -%}
      {%- if adapters is mapping -%}{%- set adapters = [adapters] -%}{%- endif -%}
      {%- set pattrs = _w_hba_parsed.port_attrs | default([]) -%}
      {%- if pattrs is mapping -%}{%- set pattrs = [pattrs] -%}{%- endif -%}
      {%- set adp_by_node = {} -%}
      {%- for a in adapters -%}
        {%- if a.node_wwn -%}{%- set _ = adp_by_node.update({a.node_wwn: a}) -%}{%- endif -%}
      {%- endfor -%}
      {%- set adp_first = (adapters[0] if (adapters | length > 0) else {}) -%}
      {%- set pa_by_wwpn = {} -%}
      {%- for pa in pattrs -%}
        {%- if pa.port_wwn -%}{%- set _ = pa_by_wwpn.update({pa.port_wwn: pa}) -%}{%- endif -%}
      {%- endfor -%}
      {%- for p in ports -%}
        {%- set ct = (p.conn_type | default('')) | lower -%}
        {%- set is_fc = 'fibre' in ct -%}
        {%- set is_iscsi = 'iscsi' in ct -%}
        {%- if is_fc or is_iscsi -%}
          {%- set wwpn = p.port_addr | default(none) -%}
          {%- set wwnn = p.node_addr | default(none) -%}
          {%- set adp = adp_by_node.get(wwnn, adp_first) -%}
          {%- set pa = pa_by_wwpn.get(wwpn, {}) -%}
          {%- set os = (p.oper_status | default('')) | lower -%}
          {%- set link = 'up' if ('oper' in os or os == '2') else ('down' if ('down' in os or os == '6' or 'error' in os or os == '7') else 'unknown') -%}
          {%- set _ = out.append({
            'wwpn':            wwpn if is_fc else none,
            'wwnn':            wwnn if is_fc else none,
            'model':           adp.model | default(none),
            'vendor':          adp.manufacturer | default(none),
            'driver':          adp.driver | default(none),
            'firmware':        adp.firmware | default(none),
            'link_status':     link,
            'link_speed_gbps': pa.speed_gbps | default(none),
            'port_type':       'FibreChannel' if is_fc else 'iSCSI',
            'connection':      p.conn_type | default(none),
            'source':          'os',
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _w_ib: >-
      {%- set out = [] -%}
      {%- set ib_list = _w_ib_parsed.ib | default([]) -%}
      {%- if ib_list is mapping -%}{%- set ib_list = [ib_list] -%}{%- endif -%}
      {%- for a in ib_list -%}
        {%- set raw_rate = a.rate | default(none) -%}
        {%- set rate_gbps = none -%}
        {%- if raw_rate and ('gbps' in (raw_rate | lower)) -%}
          {%- set digits = raw_rate | regex_replace('[^0-9]', '') -%}
          {%- if digits -%}{%- set rate_gbps = digits | int -%}{%- endif -%}
        {%- endif -%}
        {%- set ls = (a.link_status | default('')) | lower -%}
        {%- set _ = out.append({
          'adapter':     a.adapter | default(none),
          'port':        a.name | default(none),
          'node_guid':   none,
          'port_guid':   none,
          'link_status': ('up' if ls in ['up', 'ok'] else ('down' if ls in ['disconnected', 'down'] else (a.link_status | default(none)))),
          'rate':        raw_rate,
          'rate_gbps':   rate_gbps,
          'vendor':      'Mellanox',
          'firmware':    none,
          'source':      'os',
          'note':        'Windows: node_guid 표준 API 부재 → null (best-effort).',
        }) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | storage | normalize filesystems"
  ansible.builtin.set_fact:
    _w_norm_filesystems: >-
      {%- set out = [] -%}
      {%- for line in (_w_vol_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set v = line | from_json -%}
          {%- set total_mb = (v.total | int / 1048576) | round(1) -%}
          {%- set free_mb  = (v.free  | int / 1048576) | round(1) -%}
          {%- if total_mb > 0 -%}
            {%- set _ = out.append({
              'device':        v.drive ~ ':',
              'mount_point':   v.drive ~ ':\\',
              'filesystem':    v.fs,
              'total_mb':      total_mb,
              'used_mb':       total_mb - free_mb,
              'available_mb':  free_mb,
              'usage_percent': ((total_mb - free_mb) / total_mb * 100) | round(1) if total_mb > 0 else 0,
              'status':        'mounted'
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _w_physical_disks: >-
      {%- set out = [] -%}
      {%- for line in (_w_disk_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set d = line | from_json -%}
          {%- set total_mb = (d.total | int / 1048576) | round(0,'floor') | int -%}
          {%- if total_mb > 0 -%}
            {%- set _ = out.append({
              'id':         d.device,
              'device':     d.device,
              'model':      d.model | default(none),
              'total_mb':   total_mb,
              'media_type': d.media | default(none),
              'protocol':   d.protocol | default(none),
              'health':     d.health | default(none)
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

# storage.summary grouping
- name: "windows | storage | compute summary groups"
  ansible.builtin.set_fact:
    _w_stor_summary: >-
      {%- set ns = namespace(groups=[], seen={}, total=0) -%}
      {%- for d in (_w_physical_disks | default([])) -%}
        {%- set cap_gb = ((d.total_mb | default(0)) | int / 1024) | round(0, 'floor') | int -%}
        {%- if cap_gb > 0 -%}
          {%- set mt = d.media_type | default(none) -%}
          {%- set pr = d.protocol | default(none) -%}
          {%- set md = d.model | default(none) -%}
          {%- set key = (cap_gb|string)~'|'~(mt|string)~'|'~(pr|string)~'|'~(md|string) -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set q = ns.groups[idx].quantity + 1 -%}
            {%- set _ = ns.groups[idx].update({'quantity': q, 'group_total_gb': q * cap_gb}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'unit_capacity_gb': cap_gb, 'model': md, 'media_type': mt, 'protocol': pr, 'quantity': 1, 'group_total_gb': cap_gb}) -%}
          {%- endif -%}
          {%- set ns.total = ns.total + cap_gb -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups, 'grand_total_gb': ns.total} }}
  no_log: true

- name: "windows | storage | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      storage:
        filesystems:     "{{ _w_norm_filesystems }}"
        physical_disks:  "{{ _w_physical_disks }}"
        datastores:      []
        controllers:     []
        logical_volumes: []
        # Win32_DiskDrive 기반 group summary
        summary:         "{{ _w_stor_summary | default({'groups': [], 'grand_total_gb': 0}) }}"
        # Get-InitiatorPort + MSFC_* FC HBA / Get-NetAdapter IB
        hbas:            "{{ _w_hbas | default([]) }}"
        infiniband:      "{{ _w_ib | default([]) }}"
    _sections_supported_fragment: ['storage']
    _sections_collected_fragment: ['storage']
    _sections_failed_fragment:    []
    _errors_fragment:             []
  no_log: true

- name: "windows | storage | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
