---
# os-gather/tasks/windows/gather_users.yml → data.users fragment
#
# 2026-10-05 (최종 정비 §5 — 예외 무시 지점 감사 C-1 · C-2): 목록 조회(Get-LocalUser / Win32_UserAccount)의 종료 오류를
#   빈 catch 가 삼켰다. 한 명도 못 읽으면 종료 코드 1 → "미지원"(not_supported)으로, 일부만 읽었으면 잘린 목록이 "성공"으로
#   남았고 둘 다 기록이 없었다. 그룹 조회 실패도 기록이 없어 관리자 그룹 소속으로만 남기는 내장 계정(Administrator 등)이
#   목록에서 조용히 빠졌다. 이제 두 실패를 표식 줄({"_error": "list" | "groups"})로 남기고, 표식은 사용자 목록과 분리해
#   errors[] 로 옮긴다. 명령 자체가 없을 때(CommandNotFound — 모듈 부재 · 32-bit PowerShell 등, F23)만 종전처럼
#   종료 코드 1 로 끝내 "미지원" 으로 둔다(실측: 종전 스크립트도 이 경우 종료 코드 1).
#   수집하는 사용자 · 그룹 데이터는 종전과 같다(그룹 조회는 여전히 SilentlyContinue — 실패 여부만 -ErrorVariable 로 본다).
#   그룹 표식의 detail 은 조회에 실패한 그룹 이름(중복 제거 · 정렬, 그룹 목록 자체가 실패하면 Get-LocalGroup)이다 —
#   흔한 원인(그룹에 남은 삭제된 계정의 SID 등)을 운영자가 찾을 수 있게 errors[].detail 의 groups= 로 옮긴다.

- name: "windows | users | collect"
  timeout: "{{ _win_task_timeout | default(180) }}"   # Plan §6-3 task-level hang 격리 (2026-10-03) — ansible_winrm_read_timeout_sec 70 보다 커야 한다
  ansible.windows.win_shell: |
    $useLocal = $null -ne (Get-Command Get-LocalUser -ErrorAction SilentlyContinue)
    $script:listFail = $null
    $script:listUnsupported = $false
    $script:groupFail = $false
    $script:groupFailNames = @{}
    if ($useLocal) {
      try {
        Get-LocalUser -ErrorAction Stop | ForEach-Object {
          $u = $_; $grps = @()
          try {
            $glErr = $null
            Get-LocalGroup -ErrorAction SilentlyContinue -ErrorVariable glErr | ForEach-Object {
              $gName = [string]$_.Name
              try {
                $gmErr = $null
                $members = Get-LocalGroupMember $_.Name -ErrorAction SilentlyContinue -ErrorVariable gmErr
                if ($gmErr) { $script:groupFail = $true; $script:groupFailNames[$gName] = $true }
                if ($members.Name -contains "$env:COMPUTERNAME\$($u.Name)") { $grps += $_.Name }
              } catch { $script:groupFail = $true; $script:groupFailNames[$gName] = $true }
            }
            if ($glErr) { $script:groupFail = $true; $script:groupFailNames['Get-LocalGroup'] = $true }
          } catch { $script:groupFail = $true; $script:groupFailNames['Get-LocalGroup'] = $true }
          $profile = $null
          try {
            $reg = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$($u.SID.Value)"
            $profile = (Get-ItemProperty $reg -ErrorAction SilentlyContinue).ProfileImagePath
          } catch {}
          $last = $null
          if ($u.LastLogon) { $last = $u.LastLogon.ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") }
          $isSys = $u.Name -in @('Administrator','Guest','DefaultAccount','WDAGUtilityAccount')
          [PSCustomObject]@{ name=$u.Name; uid=$u.SID.Value; groups=($grps -join ',');
            home=$profile; is_system=$isSys; last=$last } | ConvertTo-Json -Compress
        }
      } catch {
        if ($_.Exception -is [System.Management.Automation.CommandNotFoundException]) { $script:listUnsupported = $true }
        else { $script:listFail = 'Get-LocalUser: ' + [string]$_.Exception.Message }
      }
    } else {
      try {
        Get-CimInstance Win32_UserAccount -Filter 'LocalAccount=True' -ErrorAction Stop | ForEach-Object {
          $u=$_; $grps=@(); $profile=$null
          try {
            $reg="HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$($u.SID)"
            $profile=(Get-ItemProperty $reg -ErrorAction SilentlyContinue).ProfileImagePath
          } catch {}
          $isSys=$u.Name -in @('Administrator','Guest','DefaultAccount','WDAGUtilityAccount')
          [PSCustomObject]@{ name=$u.Name; uid=$u.SID; groups=($grps -join ',');
            home=$profile; is_system=$isSys; last=$null } | ConvertTo-Json -Compress
        }
      } catch {
        if ($_.Exception -is [System.Management.Automation.CommandNotFoundException]) { $script:listUnsupported = $true }
        else { $script:listFail = 'Win32_UserAccount: ' + [string]$_.Exception.Message }
      }
    }
    if ($script:listFail) { [PSCustomObject]@{ _error = 'list'; detail = $script:listFail } | ConvertTo-Json -Compress }
    if ($script:groupFail) { [PSCustomObject]@{ _error = 'groups'; detail = ((@($script:groupFailNames.Keys) | Sort-Object) -join ',') } | ConvertTo-Json -Compress }
    if ($script:listUnsupported) { exit 1 }   # F23 — 아래 build fragment 가 "목록 0 + 종료 코드 ≠ 0" 을 미지원으로 분류한다
  register: _w_users_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "windows | users | normalize"
  ansible.builtin.set_fact:
    _w_norm_users_list: >-
      {%- set out = [] -%}
      {%- for line in (_w_users_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set u = line | from_json -%}
          {%- set groups = (u.groups|default('')).split(',')|reject('equalto','')|list -%}
          {%- set is_admin = 'Administrators' in groups -%}
          {%- if ('_error' not in u) and (not (u.is_system|default(true)) or is_admin) -%}
            {%- set _ = out.append({
              'name': u.name, 'uid': u.uid|string, 'groups': groups,
              'home': u.home|default(none), 'last_access_time': u.last|default(none)
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    # 실패 표식(_error 키) — 사용자 목록과 분리. list = 목록 조회 자체가 끊김(빈 목록 또는 잘린 목록), groups = 그룹 조회 실패
    _w_users_marks: >-
      {%- set out = [] -%}
      {%- for line in (_w_users_raw.stdout_lines | default([])) -%}
        {%- if line | trim -%}
          {%- set u = line | from_json -%}
          {%- if (u is mapping) and ('_error' in u) -%}{%- set _ = out.append(u) -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "windows | users | failure marks"
  ansible.builtin.set_fact:
    _w_users_list_fail: "{{ (_w_users_marks | selectattr('_error', 'equalto', 'list') | list | length) > 0 }}"
    _w_users_group_fail: "{{ (_w_users_marks | selectattr('_error', 'equalto', 'groups') | list | length) > 0 }}"
    _w_users_list_detail: >-
      {%- set m = (_w_users_marks | selectattr('_error', 'equalto', 'list') | list) -%}
      {{ ((m[0].detail | default('') | string | replace('\n', ' ') | replace('\r', ' '))[:160]) if m else '' }}
    _w_users_group_detail: >-
      {%- set m = (_w_users_marks | selectattr('_error', 'equalto', 'groups') | list) -%}
      {{ ((m[0].detail | default('') | string | replace('\n', ' ') | replace('\r', ' '))[:160]) if m else '' }}
  no_log: true

# F23 (cycle 2026-05-01): Get-LocalUser / Win32_UserAccount 둘 다 미지원 환경
# (Server Core 일부 lockdown / Nano Server 역사적 환경). win_shell rc != 0
# 이고 결과 list 비어있으면 진짜 미지원 분류 (errors[] noise 차단).
- name: "windows | users | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      users: "{{ _w_norm_users_list }}"
    _sections_supported_fragment: ['users']
    _sections_collected_fragment: >-
      {{ ['users'] if ((_w_norm_users_list | length > 0)
                       or (((_w_users_raw.rc | default(0)) == 0) and not (_w_users_list_fail | bool))) else [] }}
    _sections_failed_fragment: >-
      {{ ['users'] if ((_w_norm_users_list | length == 0) and (_w_users_list_fail | bool)) else [] }}
    _sections_unsupported_fragment: >-
      {{ ['users'] if ((_w_norm_users_list | length == 0)
                       and ((_w_users_raw.rc | default(0)) != 0)) else [] }}
    _errors_fragment: >-
      {{ ([{'section': 'users',
            'message': '사용자 계정 목록 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.',
            'detail': ('cause=command_failed; listed=0; error=' ~ _w_users_list_detail)}]
          if ((_w_users_list_fail | bool) and (_w_norm_users_list | length == 0)) else [])
         + ([{'section': 'users',
              'message': '사용자 계정 목록을 끝까지 읽지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
              'detail': ('cause=command_failed_partial; listed=' ~ (_w_norm_users_list | length) ~ '; error=' ~ _w_users_list_detail)}]
            if ((_w_users_list_fail | bool) and (_w_norm_users_list | length > 0)) else [])
         + ([{'section': 'users',
              'message': '사용자 계정의 그룹 정보를 읽지 못했습니다. 대상 상태와 수집 로그를 확인하세요.',
              'detail': ('source=Get-LocalGroup,Get-LocalGroupMember; cause=command_failed; groups=' ~ _w_users_group_detail ~ '; effect=builtin_admin_may_be_omitted')}]
            if (_w_users_group_fail | bool) else []) }}
  no_log: true

- name: "windows | users | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
