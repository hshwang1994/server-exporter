---
# os-gather/tasks/normalize/require_serial.yml
#
# OS 채널 필수 식별자 규칙 (2026-10-13 사용자 정책, status 시나리오 E) — OS 의 원인 판정만 여기서 하고,
# 판정과 봉투 수정은 공통 규칙 common/tasks/normalize/require_serial.yml 이 한다.
#
# 입력: _output(조립된 봉투), _os_type, _fr_catalog, (있으면) _l_id_diagnostics / _w_id_diagnostics / _l_sudo_mode / _cred_location
# 출력: _output — 공통 규칙의 출력과 같다
# 호출: os-gather/tasks/normalize/build_output.yml 끝(정상 경로) · site.yml linux/windows rescue 의 build_failed_output 뒤.
#       CHECKPOINT 와 schema_version 주입보다 앞이어야 한다 — 콜백 · Layer A 가 CHECKPOINT 의 status 를 그대로 복원한다.
#
# 원인(details.serial_number.cause)은 식별자 진단 fragment(_l_id_diagnostics / _w_id_diagnostics)의 `field=serial_number; cause=<토큰>` 에서
# 문자열 분할로 꺼낸다 — errors[] 상한에 잘리지 않고, 원격 stderr 를 파싱하지 않는다.
#   privilege_unavailable : 권한 없음 (토큰 insufficient_privilege + sudo 가 denied / rejected / unavailable, Windows 는 토큰만으로)
#   read_failed           : 권한은 있었는데 읽기 실패 (토큰 insufficient_privilege + sudo 가 root / nopasswd / password)
#   not_provided          : 대상이 제공하지 않음 · 빈 값 · 자리표시자 (토큰 identifier_not_available)
#   facts_failed          : Windows facts 수집 실패 (토큰 facts_failed)
#   not_collected         : 식별자 단계가 돌지 않음 (진단 fragment 없음)
#   unknown               : 진단은 있는데 토큰을 읽지 못함
#
# 사용자 문장 (2026-11-09 사용자 결정 — 카탈로그 common/vars/failure_reasons.yml):
#   Linux + privilege_unavailable → serial_missing_sudo (sudo NOPASSWD 여부 · Vault sudo 비밀번호 확인 안내)
#   그 밖 (Windows 전부 — sudo 가 없다 · Linux 의 read_failed / not_provided / not_collected / unknown) → serial_missing
#   다른 실패 사유가 이미 있으면 공통 규칙이 기존 문장을 그대로 두므로 어느 문장도 나가지 않는다.
#
# 이 파일의 fact 이름(_rs_os_*)은 공통 규칙의 입력 이름(_rs_cause 등)과 다르다 — 같은 이름을 set_fact 하면 include 인자에 가려진다.

- name: "os | normalize | require_serial | observe"
  ansible.builtin.set_fact:
    _rs_os_evidence: >-
      {%- set diags = ((_l_id_diagnostics | default([])) | select('mapping') | list)
                    + ((_w_id_diagnostics | default([])) | select('mapping') | list) -%}
      {%- set hits = diags | selectattr('detail', 'defined') | map(attribute='detail') | map('string')
                     | select('search', 'field=serial_number') | list -%}
      {%- if (hits | length) > 0 and ('cause=' in hits[0]) -%}
        {{ ((hits[0].split('cause=', 1)[1]).split(';')[0]) | trim }}
      {%- elif (_l_id_diagnostics is defined) or (_w_id_diagnostics is defined) -%}
        unknown
      {%- else -%}
        {{ none }}
      {%- endif -%}
    _rs_os_sudo: >-
      {{ ((_l_sudo_mode | default('', true)) | string | trim | lower) if ((_os_type | default('')) == 'linux') else '' }}
  no_log: true

- name: "os | normalize | require_serial | derive cause"
  ansible.builtin.set_fact:
    _rs_os_cause: >-
      {%- set c = _rs_os_evidence | default(none) -%}
      {%- set s = _rs_os_sudo | default('') -%}
      {%- if c is none -%}not_collected
      {%- elif c == 'facts_failed' -%}facts_failed
      {%- elif c == 'identifier_not_available' -%}not_provided
      {%- elif c == 'insufficient_privilege' and (s in ['root', 'nopasswd', 'password']) -%}read_failed
      {%- elif c == 'insufficient_privilege' -%}privilege_unavailable
      {%- else -%}unknown
      {%- endif -%}
  no_log: true

# 경로는 REPO_ROOT 기준이다 — 이 파일은 os-gather/site.yml 밖의 playbook(tests/fixtures/addon/harness.yml · no_data/harness.yml)에서도
#   build_output.yml 을 거쳐 include 된다 (2026-10-13 CI #53 교훈).
- name: "os | normalize | require_serial | enforce"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/require_serial.yml"
  vars:
    _rs_channel: os
    _rs_error_section: "{{ (_os_type | default('os')) ~ '_gather' }}"
    _rs_cause: "{{ _rs_os_cause }}"
    _rs_sudo: "{{ _rs_os_sudo }}"
    _rs_reason_key: >-
      {{ 'serial_missing_sudo' if (((_os_type | default('')) == 'linux') and (_rs_os_cause == 'privilege_unavailable'))
         else 'serial_missing' }}
    _rs_detail_extra: >-
      {{ (('; evidence=' ~ _rs_os_evidence) if ((_rs_os_evidence | default(none)) is not none) else '')
         ~ (('; sudo=' ~ _rs_os_sudo) if (_rs_os_sudo | default('')) else '') }}
