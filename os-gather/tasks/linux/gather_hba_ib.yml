---
# os-gather/tasks/linux/gather_hba_ib.yml
#
# P4 (cycle 2026-04-29): Linux FC HBA + InfiniBand 정보 수집.
# raw 명령으로 /sys/class/fc_host + /sys/class/infiniband 파싱.
# 미설치 환경에서는 빈 list (graceful degradation, errors 기록 없음).
# 2026-10-03 (Phase 2 C7): 장치는 있는데 sysfs 속성을 읽지 못하면 ERR|<경로> marker →
#   errors[] 1건 (section=storage, 경로 10개까지). 읽기 실패가 없으면 종전처럼 errors 없음.
#
# 출력 sub-key:
#   data.storage.hbas[]       — FC HBA (WWPN, link state, speed) + iSCSI 이니시에이터 (2026-10-19 — iqn · 세션 수 · port_type iSCSI, /sys/class/iscsi_host)
#   data.storage.infiniband[] — InfiniBand 어댑터 (node_guid, link state, rate)
#   data.network.driver_map   — interface → driver 매핑 (P5 NIC 깊이)
#
# 2026-10-03 (Plan §8-2 — 원격 실행 3 → 1, 출력 불변):
#   - fc_host + infiniband 를 raw 1회로 읽는다 (marker · ERR 규칙 · 출력 순서 그대로 — FC 구간 다음 IB 구간).
#   - NIC driver map 은 따로 읽지 않는다. gather_network.yml 의 raw gather 가 같은 스크립트로 내는
#     `NIC|<iface>|<driver>|<vlan>|<master>` 줄(`_l_net_raw`)을 쓴다 (site.yml 순서상 network 가 먼저 돈다).
#     ethtool -i / VLANIF / BOND 줄로 다시 만들지 않은 이유: driver 는 sysfs device/driver 링크
#     이름(mlx4_core 등 ethtool 의 driver 와 다를 수 있다), master 는 bond 뿐 아니라 bridge 도 포함,
#     목록은 lo 를 뺀 /sys/class/net 전부라 그 줄들로는 같은 값을 되살릴 수 없다.
#
# 2026-10-17 (InfiniBand 전면 검증 — 계약은 docs/contract/03-fields.md 6.3.1, 결정 기록은 ADR-2026-10-17-infiniband-port-decision):
#   - storage.infiniband[] 항목 1개 = 실제 InfiniBand 포트 1개. ports/<n>/link_layer 가 InfiniBand 인 포트만 담는다 —
#     /sys/class/infiniband 에는 RoCE(mlx5 이더넷 모드) · iWARP 장치도 등록되고 node_type 은 그것들도 CA 라 구분이 안 된다.
#   - rate_gbps 는 state ACTIVE 일 때만 숫자(소수 보존). 커널 rate_show 는 DOWN 포트에도 기본값(SDR)을 찍으므로 그 값을
#     현재 속도로 쓰지 않는다. rate 원문은 그대로 둔다.
#   - vendor/model 은 lspci(pci.ids) 의 제조사명/장치명. 없으면 vendor=null, model=hca_type(board_id) — 'MT' 접두로
#     Mellanox 를 추정하던 분기는 제거했다.
#   - node_guid/port_guid 는 normalize_ib_guid (소문자 4-hex×4, 형식 오류·all-zero → null). port_guid 는 gids/0 의 하위 64비트.
#   source: https://www.kernel.org/doc/Documentation/ABI/stable/sysfs-class-infiniband (link_layer · state · rate · node_guid · gids)
#   source: https://github.com/torvalds/linux/blob/master/drivers/infiniband/core/sysfs.c (link_layer_show "InfiniBand"/"Ethernet",
#           state_show "%d: %s", rate_show "%d[.5] Gb/sec (%dX %s)" — DOWN 특수처리 없음)
#   source: https://github.com/linux-rdma/rdma-core/blob/master/libibumad/umad.c get_port() (port_guid = gids/0 의 interface_id)
#   source: https://www.rfc-editor.org/rfc/rfc4392 §1.2 (GID = 64-bit subnet prefix + 64-bit port GUID)
#   lab: InfiniBand 장비 부재 — tests/unit/test_linux_hba_ib_markers.py 의 합성 sysfs 트리로만 검증했다 (실장비 미검증).
#
# 2026-10-18 (HBA 전수 점검 — 계약은 docs/contract/03-fields.md 6.3.1 · 6.3.2):
#   - storage.hbas[] 항목 1개 = 물리 FC 포트 1개. NPIV 가상 포트(fc_host port_type 에 NPIV)는 별도 host 로 열거되므로 뺀다.
#   - link_status 는 up / down 둘뿐 — port_state 가 Online · Marginal 이면 up, 그 밖(Offline · Linkdown · Error · Blocked · Bypassed · Loopback ·
#     Diagnostics · Unknown · Deleted · 파일 없음 · 읽기 실패)은 전부 down. 값은 항상 들어간다(사용자 결정 2026-10-19 — 2026-10-18 의 "미확정은 null"
#     규칙 폐지). 읽기 실패(권한)는 값과 별개로 storage errors[] attribute_unreadable 에 남는다.
#   - driver 는 scsi_host/<host>/proc_name(드라이버 이름 — Scsi_Host 장치에는 driver 링크가 없어 종전 경로는 실장비에서 항상 비었다)
#     → PCI 장치(device/..)의 driver 링크 → 종전 경로. 펌웨어/모델은 qla2xxx(model_name · fw_version) 와 lpfc(modelname · fwrev) ·
#     bfa(model) 이름을 모두 본다. 제조사/모델 폴백은 PCI uevent 의 PCI_SLOT_NAME → lspci -mm (IB 구간과 같은 방식, 장치당 1회).
#   - 값 안의 '|' 와 CR/LF 는 지운다(필드 밀림 방지). raw 자체가 실패(rc != 0)하면 storage errors[] 1건(cause=command_failed).
#   - port_type: 소프트웨어/CNA FCoE 드라이버(fcoe · bnx2fc · qedf) 는 FCoE, 그 밖은 FibreChannel. Cisco fnic 은 OS 에 FC HBA 로 보이고
#     ESXi · CIMC 도 FC 로 적으므로 FibreChannel 로 둔다 (채널 간 같은 값).
#   source: https://github.com/torvalds/linux/blob/master/drivers/scsi/scsi_transport_fc.c (fc_port_state_names · fc_port_type_names "NPIV VPORT")
#   source: https://github.com/torvalds/linux/blob/master/drivers/scsi/scsi_sysfs.c (scsi_host proc_name = hostt->proc_name; Scsi_Host 에 driver 링크 없음)
#   source: https://github.com/torvalds/linux/blob/master/drivers/scsi/lpfc/lpfc_attr.c (modelname · fwrev · serialnum · lpfc_drvr_version)
#   source: https://github.com/torvalds/linux/blob/master/drivers/scsi/qla2xxx/qla_attr.c (model_name · fw_version · driver_version · serial_num)
#   lab: FC 호스트 부재 — 합성 sysfs 트리(평면 · 실 링크 모양 둘)로만 검증 (실장비 미검증).

- block:
    # cycle 2026-05-29 (hba-ib-csus, D2): WWNN(node_name) + driver + firmware 보강.
    # 2026-09-03 (B-22/B-24): model 은 scsi_host 의 model_name(있을 때), 없으면 symbolic_name.
    #   manufacturer 가 sysfs 에 있으면 vendor 로. WWN 은 normalize_wwn 으로 소문자 colon-hex.
    # delimiter '|' 15 필드 (앞 11 은 종전 그대로, 뒤 4 는 2026-10-18 추가):
    #   FC|host|wwpn|wwnn|symbolic|state|speed|driver|firmware|model_name|manufacturer|port_type|pci_addr|pci_vendor|pci_device
    # 2026-10-03 (C7): 속성 파일이 있는데 읽지 못하면 빈 값으로 삼키지 않고 ERR|<경로> 를 남긴다
    #   (권한 / 장치 상태로 인한 증거 소실을 드러낸다). 파일이 없는 것은 드라이버가 그 속성을 내지
    #   않는 것이라 실패가 아니다. rd <경로> → $v (실패 시 빈 값 + ERR 줄).
    - name: "linux | hba_ib | enumerate fc_host + infiniband"
      ansible.builtin.raw: |
        rd() {
          v=""
          [ -e "$1" ] || return 0
          if v=$(cat "$1" 2>/dev/null); then :; else v=""; echo "ERR|$1"; fi
        }
        # 2026-10-18: 값 안의 '|' 와 CR/LF 는 구분자 · 줄을 깨므로 지운다 (IB 구간의 tr -d 와 같은 규칙).
        cl() { printf '%s' "$1" | tr -d '|\r\n'; }
        if [ -d /sys/class/fc_host ]; then
          for h in /sys/class/fc_host/host*; do
            [ -d "$h" ] || continue
            host=$(basename "$h")
            rd "$h/port_name"; wwpn=$v
            rd "$h/node_name"; wwnn=$v
            rd "$h/symbolic_name"; sym=$v
            rd "$h/port_state"; state=$v
            rd "$h/speed"; speed=$v
            rd "$h/port_type"; ptype=$v
            sh="$h/device/scsi_host/$host"
            # 2026-10-18: driver = scsi_host proc_name(드라이버 이름) → PCI 장치(device/..) driver 링크 → 종전 경로(Scsi_Host 의 driver 링크 — 실장비엔 없다)
            drv=""
            if [ -f "$sh/proc_name" ]; then rd "$sh/proc_name"; drv=$v; fi
            if [ -z "$drv" ]; then
              for dl in "$h/device/../driver" "$h/device/driver"; do
                [ -e "$dl" ] || continue
                if lnk=$(readlink -f "$dl" 2>/dev/null) && [ -n "$lnk" ]; then drv=$(basename "$lnk" 2>/dev/null); else echo "ERR|$dl"; fi
                [ -n "$drv" ] && break
              done
            fi
            # 펌웨어/모델/제조사: qla2xxx(fw_version · model_name) · lpfc(fwrev · modelname) · bfa(model) 속성명 — 빈 값이면 다음 후보
            fwver=""
            for fwp in "$sh/fw_version" "$sh/fwrev" "$h"/device/scsi_host/*/fw_version "$h"/device/scsi_host/*/fwrev "$h/device/fw_version"; do
              if [ -f "$fwp" ]; then rd "$fwp"; fwver=$v; [ -n "$fwver" ] && break; fi
            done
            mdl=""; mfr=""
            for mp in "$sh/model_name" "$sh/modelname" "$sh/model" "$h"/device/scsi_host/*/model_name "$h"/device/scsi_host/*/modelname "$h/device/model_name"; do
              if [ -f "$mp" ]; then rd "$mp"; mdl=$v; [ -n "$mdl" ] && break; fi
            done
            for vp in "$sh/manufacturer" "$h"/device/scsi_host/*/manufacturer "$h/device/manufacturer"; do
              if [ -f "$vp" ]; then rd "$vp"; mfr=$v; [ -n "$mfr" ] && break; fi
            done
            # PCI 주소(Scsi_Host 의 부모 = PCI 장치의 uevent PCI_SLOT_NAME) → lspci -mm 제조사/장치명 (IB 구간과 같은 방식, 호스트당 1회)
            pci=""; pvn=""; pdv=""
            if [ -f "$h/device/../uevent" ]; then
              rd "$h/device/../uevent"; pci=$(printf '%s\n' "$v" | sed -n 's/^PCI_SLOT_NAME=//p' | head -n 1 | tr -d '|\r')
            fi
            if [ -n "$pci" ] && command -v lspci >/dev/null 2>&1; then
              pl=$(lspci -mm -s "$pci" 2>/dev/null | head -n 1)
              pvn=$(printf '%s\n' "$pl" | awk -F'"' '{print $4}' | tr -d '|\r')
              pdv=$(printf '%s\n' "$pl" | awk -F'"' '{print $6}' | tr -d '|\r')
            fi
            echo "FC|$host|$(cl "$wwpn")|$(cl "$wwnn")|$(cl "$sym")|$(cl "$state")|$(cl "$speed")|$(cl "$drv")|$(cl "$fwver")|$(cl "$mdl")|$(cl "$mfr")|$(cl "$ptype")|$pci|$pvn|$pdv"
          done
        fi
        # 2026-10-19 (사용자 승인 — ADR-2026-10-19-esxi-sensors-and-linux-iscsi): iSCSI 이니시에이터 → storage.hbas[] (port_type iSCSI).
        #   /sys/class/iscsi_host 만 읽는다 (kernel drivers/scsi/scsi_transport_iscsi.c 의 iscsi_host 클래스 속성: initiatorname · ipaddress ·
        #   hwaddress · netdev · port_state("LINK UP"/"LINK DOWN"/"Unknown!") · port_speed) — iscsiadm 과 /etc/iscsi/initiatorname.iscsi 는 root 가
        #   필요하고 sysfs 는 누구나 읽는다. 세션은 host 아래 session*/iscsi_session/<id>/{state,targetname,initiatorname}.
        #   소프트웨어 iSCSI(iscsi_tcp)는 세션마다 host 가 하나씩 생기고 host 속성은 "<empty>" 라 IQN 은 세션의 initiatorname 에서 보충한다 —
        #   파서가 (driver, iqn, hwaddress, netdev) 로 묶어 1건으로 만든다. 하드웨어 오프로드(bnx2i · qla4xxx · be2iscsi · cxgb4i)는 포트마다 host 1개.
        #   ISCSI|host|iqn|ipaddress|hwaddress|netdev|port_state|port_speed|driver|session_count|logged_in_count|pci|pvn|pdv
        if [ -d /sys/class/iscsi_host ]; then
          for ih in /sys/class/iscsi_host/host*; do
            [ -d "$ih" ] || continue
            host=$(basename "$ih")
            rd "$ih/initiatorname"; iqn=$v
            rd "$ih/ipaddress"; ip=$v
            rd "$ih/hwaddress"; hw=$v
            rd "$ih/netdev"; nd=$v
            rd "$ih/port_state"; pst=$v
            rd "$ih/port_speed"; psp=$v
            drv=""
            if [ -f "$ih/device/scsi_host/$host/proc_name" ]; then rd "$ih/device/scsi_host/$host/proc_name"; drv=$v; fi
            scnt=0; lcnt=0; siqn=""
            for s in "$ih"/device/session*; do
              [ -d "$s" ] || continue
              sid=$(basename "$s")
              scnt=$((scnt + 1))
              rd "$s/iscsi_session/$sid/state"; sst=$v
              case "$sst" in LOGGED_IN*) lcnt=$((lcnt + 1)) ;; esac
              if [ -z "$siqn" ]; then rd "$s/iscsi_session/$sid/initiatorname"; siqn=$v; fi
            done
            case "$iqn" in ""|"<empty>"|"(null)") iqn=$siqn ;; esac
            pci=""; pvn=""; pdv=""
            if [ -f "$ih/device/../uevent" ]; then
              rd "$ih/device/../uevent"; pci=$(printf '%s\n' "$v" | sed -n 's/^PCI_SLOT_NAME=//p' | head -n 1 | tr -d '|\r')
            fi
            if [ -n "$pci" ] && command -v lspci >/dev/null 2>&1; then
              pl=$(lspci -mm -s "$pci" 2>/dev/null | head -n 1)
              pvn=$(printf '%s\n' "$pl" | awk -F'"' '{print $4}' | tr -d '|\r')
              pdv=$(printf '%s\n' "$pl" | awk -F'"' '{print $6}' | tr -d '|\r')
            fi
            echo "ISCSI|$host|$(cl "$iqn")|$(cl "$ip")|$(cl "$hw")|$(cl "$nd")|$(cl "$pst")|$(cl "$psp")|$(cl "$drv")|$scnt|$lcnt|$pci|$pvn|$pdv"
          done
        fi
        # cycle 2026-05-29 (hba-ib-csus, D2): per-port GID(port_guid) + rate + fw_ver + hca 보강.
        # 2026-10-17 (InfiniBand 전면 검증): delimiter '|' 13 필드 — 앞 9 는 종전 그대로, 뒤 4 는 추가:
        #   IB|adapter|port|node_guid|gid0|state|rate|firmware|hca|link_layer|pci_addr|pci_vendor|pci_device
        #   - 포트 게이트: ports/<n>/link_layer 가 InfiniBand(rdma-core 는 IB 도 허용) 인 포트만 낸다. Ethernet(RoCE/iWARP) 은
        #     제외, 파일이 없으면 제외(드라이버가 내지 않는 것), 있는데 못 읽으면 ERR| 을 남기고 제외(C7).
        #   - 제조사/장치명: device/uevent 의 PCI_SLOT_NAME 으로 lspci -mm -s (pci.ids 이름). 장치당 1회. lspci 가 없거나
        #     해당 주소를 모르면 빈 값(오류 아님). awk -F'"' 필드는 gather_network.yml 의 ADAPTER| 와 같다 ($4 제조사 / $6 장치명).
        #   - 값 안의 '|' 는 구분자를 깨므로 tr -d 로 지운다.
        # 2026-10-03 (C7): fc_host 와 같은 규칙 — 있는데 읽지 못한 속성은 ERR|<경로>.
        # (§8-2: 같은 raw 안 — 위 FC 구간 다음에 IB 구간. 변수는 매 항목 rd 로 다시 채운다)
        if [ -d /sys/class/infiniband ]; then
          for ib in /sys/class/infiniband/*; do
            [ -d "$ib" ] || continue
            adp=$(basename "$ib")
            rd "$ib/node_guid"; guid=$v
            rd "$ib/fw_ver"; fwver=$v
            rd "$ib/hca_type"; hca=$v
            if [ -z "$hca" ]; then rd "$ib/board_id"; hca=$v; fi
            rd "$ib/device/uevent"; pci=$(printf '%s\n' "$v" | sed -n 's/^PCI_SLOT_NAME=//p' | head -n 1 | tr -d '|\r')
            pvn=""; pdv=""
            if [ -n "$pci" ] && command -v lspci >/dev/null 2>&1; then
              pl=$(lspci -mm -s "$pci" 2>/dev/null | head -n 1)
              pvn=$(printf '%s\n' "$pl" | awk -F'"' '{print $4}' | tr -d '|\r')
              pdv=$(printf '%s\n' "$pl" | awk -F'"' '{print $6}' | tr -d '|\r')
            fi
            for p in "$ib"/ports/*; do
              [ -d "$p" ] || continue
              port=$(basename "$p")
              rd "$p/link_layer"; ll=$(printf '%s\n' "$v" | sed -n '1p' | tr -d '|\r')
              case "$ll" in
                InfiniBand|Infiniband|infiniband|IB|ib) ;;
                *) continue ;;
              esac
              rd "$p/state"; state=$(printf '%s\n' "$v" | awk '{print $2}')
              rd "$p/rate"; rate=$v
              rd "$p/gids/0"; gid0=$(printf '%s\n' "$v" | sed -n '1p')
              echo "IB|$adp|$port|$guid|$gid0|$state|$rate|$fwver|$hca|$ll|$pci|$pvn|$pdv"
            done
          done
        fi
      register: _l_hba_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "linux | hba_ib | parse + build fragment"
      ansible.builtin.set_fact:
        # 2026-10-18: NPIV 가상 포트 제외 · FCoE 드라이버 → FCoE · (2026-10-19) link_status 는 up/down 둘뿐 — Online·Marginal 만 up, 그 밖은 down ·
        #   vendor/model 폴백 = lspci(pci.ids) 이름 (자리표시자 "Vendor 1077" / "Device 2261" 은 빈 값으로 본다 — IB 구간과 같다).
        _l_hbas_list: >-
          {%- set out = [] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- set ptype = ((parts[11] | default('')) | trim | lower) if (parts | length >= 12) else '' -%}
            {%- if parts | length >= 9 and parts[0] == 'FC' and 'npiv' not in ptype -%}
              {# speed 는 "16 Gbit" / "8 Gbit" 처럼 첫 숫자 토큰만 (여러 숫자가 붙는 문자열을 이어붙이지 않는다) #}
              {%- set spfirst = ((parts[6] | default('')) | trim).split(' ')[0] if (parts[6] | default('') | trim) else '' -%}
              {%- set spdig = spfirst | regex_replace('[^0-9]', '') -%}
              {%- set st = (parts[5] | default('')) | trim | lower -%}
              {%- set link = 'up' if st in ['online', 'marginal'] else 'down' -%}
              {%- set drv = (parts[7] | trim) if (parts[7] | trim) else none -%}
              {%- set ptp = 'FCoE' if ((drv or '') | lower) in ['fcoe', 'bnx2fc', 'qedf'] else 'FibreChannel' -%}
              {%- set mdl = (parts[9] | trim) if (parts | length >= 10 and (parts[9] | trim)) else none -%}
              {%- set mfr = (parts[10] | trim) if (parts | length >= 11 and (parts[10] | trim)) else none -%}
              {%- set pvn_raw = (parts[13] | trim) if (parts | length >= 15 and (parts[13] | trim)) else '' -%}
              {%- set pdv_raw = (parts[14] | trim) if (parts | length >= 15 and (parts[14] | trim)) else '' -%}
              {%- set pvn = '' if (pvn_raw is match('^Vendor [0-9a-fA-F]{4}$')) else pvn_raw -%}
              {%- set pdv = '' if (pdv_raw is match('^Device [0-9a-fA-F]{4}$')) else pdv_raw -%}
              {%- set _ = out.append({
                'host':            parts[1],
                'wwpn':            (parts[2] | normalize_wwn) if parts[2] else none,
                'wwnn':            (parts[3] | normalize_wwn) if parts[3] else none,
                'model':           mdl if mdl else (pdv if pdv else (parts[4] if parts[4] else none)),
                'symbolic_name':   parts[4] if parts[4] else none,
                'vendor':          mfr if mfr else (pvn if pvn else none),
                'driver':          drv,
                'firmware':        parts[8] if parts[8] else none,
                'link_status':     link,
                'link_speed_gbps': (spdig | int) if spdig else none,
                'port_type':       ptp,
                'source':          'os',
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        # 2026-10-19 (사용자 승인): iSCSI 이니시에이터 — ISCSI| 줄을 (driver, iqn, hwaddress, netdev) 로 묶어 1건 (소프트웨어 iSCSI 는 세션마다 host 가 생긴다).
        #   link_status 는 up/down 둘뿐: port_state "LINK UP" 또는 로그인된 세션 1개 이상 → up, 그 밖 → down. wwpn/wwnn 은 iSCSI 에 없어 null,
        #   iqn 이 식별자다. link_speed_gbps 는 port_speed("10 Gbps") 첫 숫자. vendor/model 은 하드웨어 오프로드의 PCI 장치(lspci) 이름 — 소프트웨어 iSCSI 는 null.
        #   "<empty>"/"(null)" 자리표시자는 null. session_count 는 묶인 host 의 세션 합.
        _l_iscsi_list: >-
          {%- set groups = {} -%}
          {%- set order = [] -%}
          {%- set ph = ['', '<empty>', '(null)'] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 11 and parts[0] == 'ISCSI' -%}
              {%- set iqn = (parts[2] | trim) if ((parts[2] | trim | lower) not in ph) else none -%}
              {%- set ip = (parts[3] | trim) if ((parts[3] | trim | lower) not in ph) else none -%}
              {%- set hw = (parts[4] | trim | lower) if ((parts[4] | trim | lower) not in ph) else none -%}
              {%- set nd = (parts[5] | trim) if ((parts[5] | trim | lower) not in ph) else none -%}
              {%- set pst = parts[6] | trim | upper -%}
              {%- set spfirst = ((parts[7] | trim).split(' ')[0]) if (parts[7] | trim) else '' -%}
              {%- set spdig = spfirst | regex_replace('[^0-9]', '') -%}
              {%- set drv = (parts[8] | trim) if (parts[8] | trim) else none -%}
              {%- set scnt = ((parts[9] | trim) | int) if ((parts[9] | trim) | regex_replace('[^0-9]', '')) else 0 -%}
              {%- set lcnt = ((parts[10] | trim) | int) if ((parts[10] | trim) | regex_replace('[^0-9]', '')) else 0 -%}
              {%- set pvn_raw = (parts[12] | trim) if (parts | length >= 14 and (parts[12] | trim)) else '' -%}
              {%- set pdv_raw = (parts[13] | trim) if (parts | length >= 14 and (parts[13] | trim)) else '' -%}
              {%- set pvn = '' if (pvn_raw is match('^Vendor [0-9a-fA-F]{4}$')) else pvn_raw -%}
              {%- set pdv = '' if (pdv_raw is match('^Device [0-9a-fA-F]{4}$')) else pdv_raw -%}
              {%- set key = (drv | string) ~ '|' ~ (iqn | string) ~ '|' ~ (hw | string) ~ '|' ~ (nd | string) -%}
              {%- if key not in groups -%}
                {%- set _ = order.append(key) -%}
                {%- set _ = groups.update({key: {
                  'host':            parts[1],
                  'iqn':             iqn,
                  'wwpn':            none,
                  'wwnn':            none,
                  'model':           pdv if pdv else none,
                  'vendor':          pvn if pvn else none,
                  'driver':          drv,
                  'firmware':        none,
                  'link_status':     'down',
                  'link_speed_gbps': (spdig | int) if spdig else none,
                  'port_type':       'iSCSI',
                  'ip_address':      ip,
                  'mac_address':     hw,
                  'netdev':          nd,
                  'session_count':   0,
                  'source':          'os',
                }}) -%}
              {%- endif -%}
              {%- set g = groups[key] -%}
              {%- set up = (pst == 'LINK UP') or (lcnt > 0) -%}
              {%- set _ = g.update({'session_count': g.session_count + scnt,
                                    'link_status': 'up' if (up or g.link_status == 'up') else 'down'}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set out = [] -%}
          {%- for key in order -%}{%- set _ = out.append(groups[key]) -%}{%- endfor -%}
          {{ out }}
        # 2026-10-17: IB 줄은 raw 가 link_layer 로 이미 걸렀다(InfiniBand 포트만). 13 필드 미만(구 형식)은 PCI 값 없음으로 본다.
        #   link_status 는 state 토큰 완전일치 (ACTIVE→up, DOWN→down, INIT/ARMED/ACTIVE_DEFER/없음→unknown).
        #   rate 첫 토큰은 숫자 형식을 검증한 뒤 float 로 읽는다 — Jinja float 필터는 쓰레기를 0.0 으로 삼킨다.
        #   rate_gbps 는 up 일 때만 (정수면 int, 아니면 2.5 같은 float). gids/0 은 4-hex 8묶음일 때만 하위 4묶음이 port_guid.
        #   lspci 가 pci.ids 에 없는 ID 를 만나면 "Device 1021" / "Vendor 15b3" 자리표시자를 낸다 — 이름이 아니므로 빈 값으로 본다.
        _l_ib_list: >-
          {%- set out = [] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 9 and parts[0] == 'IB' -%}
              {%- set st = (parts[5] | default('')) | trim | upper -%}
              {%- set link = 'up' if st == 'ACTIVE' else ('down' if st == 'DOWN' else 'unknown') -%}
              {%- set rate_raw = (parts[6] | default('')) | trim -%}
              {%- set rfirst = rate_raw.split(' ')[0] if rate_raw else '' -%}
              {%- set rvalid = rfirst is match('^[0-9]+(\\.[0-9]+)?$') -%}
              {%- set rv = (rfirst | float) if rvalid else 0 -%}
              {%- set rate = rate_raw if (rate_raw and not (rvalid and rv == 0)) else none -%}
              {%- set rate_gbps = (((rv | int) if rv == (rv | int) else rv) if (rvalid and rv > 0 and link == 'up') else none) -%}
              {%- set gidp = ((parts[4] | default('')) | trim).split(':') -%}
              {%- set gid_ok = (gidp | length == 8) and ((gidp | select('match', '^[0-9a-fA-F]{4}$') | list | length) == 8) -%}
              {%- set pg = ((gidp[-4:] | join(':')) | normalize_ib_guid) if gid_ok else none -%}
              {%- set hca = (parts[8] | trim) if parts[8] else none -%}
              {%- set pvn_raw = (parts[11] | trim) if (parts | length >= 13 and (parts[11] | trim)) else '' -%}
              {%- set pdv_raw = (parts[12] | trim) if (parts | length >= 13 and (parts[12] | trim)) else '' -%}
              {%- set pvn = '' if (pvn_raw is match('^Vendor [0-9a-fA-F]{4}$')) else pvn_raw -%}
              {%- set pdv = '' if (pdv_raw is match('^Device [0-9a-fA-F]{4}$')) else pdv_raw -%}
              {%- set _ = out.append({
                'adapter':     parts[1],
                'port':        parts[2],
                'node_guid':   parts[3] | normalize_ib_guid,
                'port_guid':   pg,
                'link_status': link,
                'rate':        rate,
                'rate_gbps':   rate_gbps,
                'model':       pdv if pdv else hca,
                'vendor':      pvn if pvn else none,
                'firmware':    parts[7] if parts[7] else none,
                'source':      'os',
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        # 2026-10-03 (C7): 읽지 못한 sysfs 속성 경로 (ERR|<경로>) — 중복 제거, 나온 순서 유지 (FC 구간 → IB 구간).
        _l_hba_read_errors: >-
          {%- set out = [] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- if line.startswith('ERR|') -%}
              {%- set path = line[4:] | trim -%}
              {%- if path and path not in out -%}{%- set _ = out.append(path) -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        # §8-2: NIC| 줄은 gather_network.yml raw gather 가 낸다 (_l_net_raw). 없으면(network 미실행) 빈 목록.
        _l_nic_drivers: >-
          {%- set out = [] -%}
          {%- for line in ((_l_net_raw | default({})).stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 5 and parts[0] == 'NIC' -%}
              {%- set _ = out.append({
                'name':        parts[1],
                'driver':      parts[2] if parts[2] | length > 0 else none,
                'vlan_id':     (parts[3] | regex_replace('[^0-9]', '') | int) if (parts[3] | regex_replace('[^0-9]', '') | length > 0) else none,
                'bond_master': parts[4] if parts[4] | length > 0 else none,
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      no_log: true

    - name: "linux | hba_ib | merge into storage/network fragments"
      ansible.builtin.set_fact:
        _data_fragment:
          storage:
            hbas:       "{{ _l_hbas_list + _l_iscsi_list }}"
            infiniband: "{{ _l_ib_list }}"
          network:
            driver_map: "{{ _l_nic_drivers }}"
        _sections_supported_fragment: ['storage', 'network']
        _sections_collected_fragment: >-
          {{ (['storage'] if _l_hbas_list or _l_iscsi_list or _l_ib_list else [])
             + (['network'] if _l_nic_drivers else []) }}
        _sections_failed_fragment:    []
        # 2026-10-03 (C7): fc_host / infiniband 속성을 읽지 못했으면 1건 (경로는 10개까지 + 나머지 수).
        #   섹션 판정은 종전 그대로 (목록이 있으면 collected) — 값이 빈 항목의 근거만 남긴다.
        # 2026-10-18: raw 자체가 실패(rc != 0 — 셸 오류 · 전송 오류)했으면 1건 더 (cause=command_failed). 종전에는 빈 출력이 "HBA 없음" 과 같았다.
        _errors_fragment: >-
          {%- set paths = _l_hba_read_errors | default([]) -%}
          {%- set rc = (_l_hba_raw.rc | default(0)) | int -%}
          {%- set out = [] -%}
          {%- if rc != 0 -%}
            {%- set se = (((_l_hba_raw.stderr | default('')) | string) | replace('\n', ' ') | replace('\r', ' ') | trim)[:160] -%}
            {%- set _ = out.append({'section':'storage','message':'스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('scope=fc_host,iscsi_host,infiniband; cause=command_failed; rc=' ~ rc ~ '; stderr=' ~ (se or 'none'))}) -%}
          {%- endif -%}
          {%- if (paths | length) > 0 -%}
            {%- set scope = ((['fc_host'] if (paths | select('search', '/fc_host/') | list | length) > 0 else []) + (['iscsi_host'] if (paths | select('search', '/iscsi_host/') | list | length) > 0 else []) + (['infiniband'] if (paths | select('search', '/infiniband/') | list | length) > 0 else [])) | join(',') -%}
            {%- set more = (' 외 ' ~ ((paths | length) - 10) ~ '건') if (paths | length) > 10 else '' -%}
            {%- set _ = out.append({'section':'storage','message':'스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('scope=' ~ (scope or 'fc_host,iscsi_host,infiniband') ~ '; cause=attribute_unreadable; count=' ~ (paths | length) ~ '; paths=' ~ (paths[:10] | join(',')) ~ more)}) -%}
          {%- endif -%}
          {{ out }}
      no_log: true
  rescue:
    - name: "linux | hba_ib | rescue (best-effort skip)"
      ansible.builtin.set_fact:
        _data_fragment:
          storage:
            hbas:       []
            infiniband: []
          network:
            driver_map: []
        _sections_supported_fragment: []
        _sections_collected_fragment: []
        _sections_failed_fragment:    []
        # M1 / NEW-3 (2026-08-12): message 는 사용자 문장으로, 기술 근거는 detail 문자열로.
        #   section 은 schema 11 섹션 이름을 쓴다 (종전 linux_hba_ib 는 Portal 이 섹션별로
        #   오류를 묶을 때 어디에도 붙지 않았다). detail 은 빈 문자열 대신 none 을 쓴다.
        _errors_fragment:
          - section: storage
            message: "스토리지 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
            detail: >-
              {{ 'scope=fc_host,iscsi_host,infiniband,nic_driver_map; cause=task_failed; msg='
                 ~ ((ansible_failed_result.msg | default('') | string | trim) or 'none') }}
      no_log: true

- name: "linux | hba_ib | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
