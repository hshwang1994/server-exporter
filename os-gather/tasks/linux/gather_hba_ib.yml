---

- block:
    - name: "linux | hba_ib | enumerate fc_host + infiniband"
      ansible.builtin.raw: |
        rd() {
          v=""
          [ -e "$1" ] || return 0
          if v=$(cat "$1" 2>/dev/null); then :; else v=""; echo "ERR|$1"; fi
        }
        cl() { printf '%s' "$1" | tr -d '|\r\n'; }
        if [ -d /sys/class/fc_host ]; then
          for h in /sys/class/fc_host/host*; do
            [ -d "$h" ] || continue
            host=$(basename "$h")
            rd "$h/port_name"; wwpn=$v
            rd "$h/node_name"; wwnn=$v
            rd "$h/symbolic_name"; sym=$v
            rd "$h/port_state"; state=$v
            rd "$h/speed"; speed=$v
            rd "$h/port_type"; ptype=$v
            sh="$h/device/scsi_host/$host"
            drv=""
            if [ -f "$sh/proc_name" ]; then rd "$sh/proc_name"; drv=$v; fi
            if [ -z "$drv" ]; then
              for dl in "$h/device/../driver" "$h/device/driver"; do
                [ -e "$dl" ] || continue
                if lnk=$(readlink -f "$dl" 2>/dev/null) && [ -n "$lnk" ]; then drv=$(basename "$lnk" 2>/dev/null); else echo "ERR|$dl"; fi
                [ -n "$drv" ] && break
              done
            fi
            fwver=""
            for fwp in "$sh/fw_version" "$sh/fwrev" "$h"/device/scsi_host/*/fw_version "$h"/device/scsi_host/*/fwrev "$h/device/fw_version"; do
              if [ -f "$fwp" ]; then rd "$fwp"; fwver=$v; [ -n "$fwver" ] && break; fi
            done
            mdl=""; mfr=""
            for mp in "$sh/model_name" "$sh/modelname" "$sh/model" "$h"/device/scsi_host/*/model_name "$h"/device/scsi_host/*/modelname "$h/device/model_name"; do
              if [ -f "$mp" ]; then rd "$mp"; mdl=$v; [ -n "$mdl" ] && break; fi
            done
            for vp in "$sh/manufacturer" "$h"/device/scsi_host/*/manufacturer "$h/device/manufacturer"; do
              if [ -f "$vp" ]; then rd "$vp"; mfr=$v; [ -n "$mfr" ] && break; fi
            done
            pci=""; pvn=""; pdv=""
            if [ -f "$h/device/../uevent" ]; then
              rd "$h/device/../uevent"; pci=$(printf '%s\n' "$v" | sed -n 's/^PCI_SLOT_NAME=//p' | head -n 1 | tr -d '|\r')
            fi
            if [ -n "$pci" ] && command -v lspci >/dev/null 2>&1; then
              pl=$(lspci -mm -s "$pci" 2>/dev/null | head -n 1)
              pvn=$(printf '%s\n' "$pl" | awk -F'"' '{print $4}' | tr -d '|\r')
              pdv=$(printf '%s\n' "$pl" | awk -F'"' '{print $6}' | tr -d '|\r')
            fi
            echo "FC|$host|$(cl "$wwpn")|$(cl "$wwnn")|$(cl "$sym")|$(cl "$state")|$(cl "$speed")|$(cl "$drv")|$(cl "$fwver")|$(cl "$mdl")|$(cl "$mfr")|$(cl "$ptype")|$pci|$pvn|$pdv"
          done
        fi
        if [ -d /sys/class/infiniband ]; then
          for ib in /sys/class/infiniband/*; do
            [ -d "$ib" ] || continue
            adp=$(basename "$ib")
            rd "$ib/node_guid"; guid=$v
            rd "$ib/fw_ver"; fwver=$v
            rd "$ib/hca_type"; hca=$v
            if [ -z "$hca" ]; then rd "$ib/board_id"; hca=$v; fi
            rd "$ib/device/uevent"; pci=$(printf '%s\n' "$v" | sed -n 's/^PCI_SLOT_NAME=//p' | head -n 1 | tr -d '|\r')
            pvn=""; pdv=""
            if [ -n "$pci" ] && command -v lspci >/dev/null 2>&1; then
              pl=$(lspci -mm -s "$pci" 2>/dev/null | head -n 1)
              pvn=$(printf '%s\n' "$pl" | awk -F'"' '{print $4}' | tr -d '|\r')
              pdv=$(printf '%s\n' "$pl" | awk -F'"' '{print $6}' | tr -d '|\r')
            fi
            for p in "$ib"/ports/*; do
              [ -d "$p" ] || continue
              port=$(basename "$p")
              rd "$p/link_layer"; ll=$(printf '%s\n' "$v" | sed -n '1p' | tr -d '|\r')
              case "$ll" in
                InfiniBand|Infiniband|infiniband|IB|ib) ;;
                *) continue ;;
              esac
              rd "$p/state"; state=$(printf '%s\n' "$v" | awk '{print $2}')
              rd "$p/rate"; rate=$v
              rd "$p/gids/0"; gid0=$(printf '%s\n' "$v" | sed -n '1p')
              echo "IB|$adp|$port|$guid|$gid0|$state|$rate|$fwver|$hca|$ll|$pci|$pvn|$pdv"
            done
          done
        fi
      register: _l_hba_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "linux | hba_ib | parse + build fragment"
      ansible.builtin.set_fact:
        _l_hbas_list: >-
          {%- set out = [] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- set ptype = ((parts[11] | default('')) | trim | lower) if (parts | length >= 12) else '' -%}
            {%- if parts | length >= 9 and parts[0] == 'FC' and 'npiv' not in ptype -%}
              {%- set spfirst = ((parts[6] | default('')) | trim).split(' ')[0] if (parts[6] | default('') | trim) else '' -%}
              {%- set spdig = spfirst | regex_replace('[^0-9]', '') -%}
              {%- set st = (parts[5] | default('')) | trim | lower -%}
              {%- set link = 'up' if st in ['online', 'marginal'] else 'down' -%}
              {%- set drv = (parts[7] | trim) if (parts[7] | trim) else none -%}
              {%- set ptp = 'FCoE' if ((drv or '') | lower) in ['fcoe', 'bnx2fc', 'qedf'] else 'FibreChannel' -%}
              {%- set mdl = (parts[9] | trim) if (parts | length >= 10 and (parts[9] | trim)) else none -%}
              {%- set mfr = (parts[10] | trim) if (parts | length >= 11 and (parts[10] | trim)) else none -%}
              {%- set pvn_raw = (parts[13] | trim) if (parts | length >= 15 and (parts[13] | trim)) else '' -%}
              {%- set pdv_raw = (parts[14] | trim) if (parts | length >= 15 and (parts[14] | trim)) else '' -%}
              {%- set pvn = '' if (pvn_raw is match('^Vendor [0-9a-fA-F]{4}$')) else pvn_raw -%}
              {%- set pdv = '' if (pdv_raw is match('^Device [0-9a-fA-F]{4}$')) else pdv_raw -%}
              {%- set _ = out.append({
                'host':            parts[1],
                'wwpn':            (parts[2] | normalize_wwn) if parts[2] else none,
                'wwnn':            (parts[3] | normalize_wwn) if parts[3] else none,
                'model':           mdl if mdl else (pdv if pdv else (parts[4] if parts[4] else none)),
                'symbolic_name':   parts[4] if parts[4] else none,
                'vendor':          mfr if mfr else (pvn if pvn else none),
                'driver':          drv,
                'firmware':        parts[8] if parts[8] else none,
                'link_status':     link,
                'link_speed_gbps': (spdig | int) if spdig else none,
                'port_type':       ptp,
                'source':          'os',
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _l_ib_list: >-
          {%- set out = [] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 9 and parts[0] == 'IB' -%}
              {%- set st = (parts[5] | default('')) | trim | upper -%}
              {%- set link = 'up' if st == 'ACTIVE' else ('down' if st == 'DOWN' else 'unknown') -%}
              {%- set rate_raw = (parts[6] | default('')) | trim -%}
              {%- set rfirst = rate_raw.split(' ')[0] if rate_raw else '' -%}
              {%- set rvalid = rfirst is match('^[0-9]+(\\.[0-9]+)?$') -%}
              {%- set rv = (rfirst | float) if rvalid else 0 -%}
              {%- set rate = rate_raw if (rate_raw and not (rvalid and rv == 0)) else none -%}
              {%- set rate_gbps = (((rv | int) if rv == (rv | int) else rv) if (rvalid and rv > 0 and link == 'up') else none) -%}
              {%- set gidp = ((parts[4] | default('')) | trim).split(':') -%}
              {%- set gid_ok = (gidp | length == 8) and ((gidp | select('match', '^[0-9a-fA-F]{4}$') | list | length) == 8) -%}
              {%- set pg = ((gidp[-4:] | join(':')) | normalize_ib_guid) if gid_ok else none -%}
              {%- set hca = (parts[8] | trim) if parts[8] else none -%}
              {%- set pvn_raw = (parts[11] | trim) if (parts | length >= 13 and (parts[11] | trim)) else '' -%}
              {%- set pdv_raw = (parts[12] | trim) if (parts | length >= 13 and (parts[12] | trim)) else '' -%}
              {%- set pvn = '' if (pvn_raw is match('^Vendor [0-9a-fA-F]{4}$')) else pvn_raw -%}
              {%- set pdv = '' if (pdv_raw is match('^Device [0-9a-fA-F]{4}$')) else pdv_raw -%}
              {%- set _ = out.append({
                'adapter':     parts[1],
                'port':        parts[2],
                'node_guid':   parts[3] | normalize_ib_guid,
                'port_guid':   pg,
                'link_status': link,
                'rate':        rate,
                'rate_gbps':   rate_gbps,
                'model':       pdv if pdv else hca,
                'vendor':      pvn if pvn else none,
                'firmware':    parts[7] if parts[7] else none,
                'source':      'os',
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _l_hba_read_errors: >-
          {%- set out = [] -%}
          {%- for line in (_l_hba_raw.stdout_lines | default([])) -%}
            {%- if line.startswith('ERR|') -%}
              {%- set path = line[4:] | trim -%}
              {%- if path and path not in out -%}{%- set _ = out.append(path) -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _l_nic_drivers: >-
          {%- set out = [] -%}
          {%- for line in ((_l_net_raw | default({})).stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 5 and parts[0] == 'NIC' -%}
              {%- set _ = out.append({
                'name':        parts[1],
                'driver':      parts[2] if parts[2] | length > 0 else none,
                'vlan_id':     (parts[3] | regex_replace('[^0-9]', '') | int) if (parts[3] | regex_replace('[^0-9]', '') | length > 0) else none,
                'bond_master': parts[4] if parts[4] | length > 0 else none,
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      no_log: true

    - name: "linux | hba_ib | merge into storage/network fragments"
      ansible.builtin.set_fact:
        _data_fragment:
          storage:
            hbas:       "{{ _l_hbas_list }}"
            infiniband: "{{ _l_ib_list }}"
          network:
            driver_map: "{{ _l_nic_drivers }}"
        _sections_supported_fragment: ['storage', 'network']
        _sections_collected_fragment: >-
          {{ (['storage'] if _l_hbas_list or _l_ib_list else [])
             + (['network'] if _l_nic_drivers else []) }}
        _sections_failed_fragment:    []
        _errors_fragment: >-
          {%- set paths = _l_hba_read_errors | default([]) -%}
          {%- set rc = (_l_hba_raw.rc | default(0)) | int -%}
          {%- set out = [] -%}
          {%- if rc != 0 -%}
            {%- set se = (((_l_hba_raw.stderr | default('')) | string) | replace('\n', ' ') | replace('\r', ' ') | trim)[:160] -%}
            {%- set _ = out.append({'section':'storage','message':'스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('scope=fc_host,infiniband; cause=command_failed; rc=' ~ rc ~ '; stderr=' ~ (se or 'none'))}) -%}
          {%- endif -%}
          {%- if (paths | length) > 0 -%}
            {%- set scope = ((['fc_host'] if (paths | select('search', '/fc_host/') | list | length) > 0 else []) + (['infiniband'] if (paths | select('search', '/infiniband/') | list | length) > 0 else [])) | join(',') -%}
            {%- set more = (' 외 ' ~ ((paths | length) - 10) ~ '건') if (paths | length) > 10 else '' -%}
            {%- set _ = out.append({'section':'storage','message':'스토리지 어댑터 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('scope=' ~ (scope or 'fc_host,infiniband') ~ '; cause=attribute_unreadable; count=' ~ (paths | length) ~ '; paths=' ~ (paths[:10] | join(',')) ~ more)}) -%}
          {%- endif -%}
          {{ out }}
      no_log: true
  rescue:
    - name: "linux | hba_ib | rescue (best-effort skip)"
      ansible.builtin.set_fact:
        _data_fragment:
          storage:
            hbas:       []
            infiniband: []
          network:
            driver_map: []
        _sections_supported_fragment: []
        _sections_collected_fragment: []
        _sections_failed_fragment:    []
        _errors_fragment:
          - section: storage
            message: "스토리지 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
            detail: >-
              {{ 'scope=fc_host,infiniband,nic_driver_map; cause=task_failed; msg='
                 ~ ((ansible_failed_result.msg | default('') | string | trim) or 'none') }}
      no_log: true

- name: "linux | hba_ib | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
