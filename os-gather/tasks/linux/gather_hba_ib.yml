---
# os-gather/tasks/linux/gather_hba_ib.yml
#
# P4 (cycle 2026-04-29): Linux FC HBA + InfiniBand 정보 수집.
# raw 명령으로 /sys/class/fc_host + /sys/class/infiniband 파싱.
# 미설치 환경에서는 빈 list (graceful degradation, errors 기록 없음).
#
# 출력 sub-key:
#   data.storage.hbas[]       — FC HBA (WWPN, link state, speed)
#   data.storage.infiniband[] — InfiniBand 어댑터 (node_guid, link state, rate)
#   data.network.driver_map   — interface → driver 매핑 (P5 NIC 깊이)

- block:
    # cycle 2026-05-29 (hba-ib-csus, D2): WWNN(node_name) + driver + firmware 보강.
    # 2026-09-03 (B-22/B-24): model 은 scsi_host 의 model_name(있을 때), 없으면 symbolic_name.
    #   manufacturer 가 sysfs 에 있으면 vendor 로. WWN 은 normalize_wwn 으로 소문자 colon-hex.
    # delimiter '|' 11 필드: FC|host|wwpn|wwnn|symbolic|state|speed|driver|firmware|model_name|manufacturer
    - name: "linux | hba_ib | enumerate fc_host"
      ansible.builtin.raw: |
        if [ -d /sys/class/fc_host ]; then
          for h in /sys/class/fc_host/host*; do
            [ -d "$h" ] || continue
            host=$(basename "$h")
            wwpn=$(cat "$h/port_name" 2>/dev/null)
            wwnn=$(cat "$h/node_name" 2>/dev/null)
            sym=$(cat "$h/symbolic_name" 2>/dev/null)
            state=$(cat "$h/port_state" 2>/dev/null)
            speed=$(cat "$h/speed" 2>/dev/null)
            drv=""
            if [ -e "$h/device/driver" ]; then
              drv=$(basename "$(readlink -f "$h/device/driver" 2>/dev/null)" 2>/dev/null)
            fi
            fwver=""
            for fwp in "$h/device/fw_version" "$h"/device/scsi_host/*/fw_version; do
              if [ -f "$fwp" ]; then fwver=$(cat "$fwp" 2>/dev/null); break; fi
            done
            mdl=""; mfr=""
            for mp in "$h/device/scsi_host/$host/model_name" "$h"/device/scsi_host/*/model_name "$h/device/model_name"; do
              if [ -f "$mp" ]; then mdl=$(cat "$mp" 2>/dev/null); break; fi
            done
            for vp in "$h/device/scsi_host/$host/manufacturer" "$h"/device/scsi_host/*/manufacturer "$h/device/manufacturer"; do
              if [ -f "$vp" ]; then mfr=$(cat "$vp" 2>/dev/null); break; fi
            done
            echo "FC|$host|$wwpn|$wwnn|$sym|$state|$speed|$drv|$fwver|$mdl|$mfr"
          done
        fi
      register: _l_fc_raw
      changed_when: false
      failed_when: false
      no_log: true

    # cycle 2026-05-29 (hba-ib-csus, D2): per-port GID(port_guid) + rate + fw_ver + hca(vendor) 보강.
    # delimiter '|' 9 필드: IB|adapter|port|node_guid|gid0|state|rate|firmware|hca
    - name: "linux | hba_ib | enumerate infiniband"
      ansible.builtin.raw: |
        if [ -d /sys/class/infiniband ]; then
          for ib in /sys/class/infiniband/*; do
            [ -d "$ib" ] || continue
            adp=$(basename "$ib")
            guid=$(cat "$ib/node_guid" 2>/dev/null)
            fwver=$(cat "$ib/fw_ver" 2>/dev/null)
            hca=$(cat "$ib/hca_type" 2>/dev/null)
            [ -z "$hca" ] && hca=$(cat "$ib/board_id" 2>/dev/null)
            for p in "$ib"/ports/*; do
              [ -d "$p" ] || continue
              port=$(basename "$p")
              state=$(awk '{print $2}' "$p/state" 2>/dev/null)
              rate=$(cat "$p/rate" 2>/dev/null)
              gid0=$(sed -n '1p' "$p/gids/0" 2>/dev/null)
              echo "IB|$adp|$port|$guid|$gid0|$state|$rate|$fwver|$hca"
            done
          done
        fi
      register: _l_ib_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "linux | hba_ib | NIC driver map"
      ansible.builtin.raw: |
        if [ -d /sys/class/net ]; then
          for n in /sys/class/net/*; do
            [ -d "$n" ] || continue
            iface=$(basename "$n")
            [ "$iface" = "lo" ] && continue
            drv=""
            if [ -L "$n/device/driver" ]; then
              drv=$(basename "$(readlink "$n/device/driver")" 2>/dev/null)
            fi
            vlan=""
            if [ -f "/proc/net/vlan/$iface" ]; then
              vlan=$(awk -F'[ |]' '/VID:/ {print $2; exit}' "/proc/net/vlan/$iface" 2>/dev/null)
            fi
            bond_master=""
            if [ -f "$n/master/uevent" ]; then
              bond_master=$(basename "$(readlink "$n/master")" 2>/dev/null)
            fi
            echo "NIC|$iface|$drv|$vlan|$bond_master"
          done
        fi
      register: _l_nicdrv_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: "linux | hba_ib | parse + build fragment"
      ansible.builtin.set_fact:
        _l_hbas_list: >-
          {%- set out = [] -%}
          {%- for line in (_l_fc_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 9 and parts[0] == 'FC' -%}
              {# speed 는 "16 Gbit" / "8 Gbit" 처럼 첫 숫자 토큰만 (여러 숫자가 붙는 문자열을 이어붙이지 않는다) #}
              {%- set spfirst = ((parts[6] | default('')) | trim).split(' ')[0] if (parts[6] | default('') | trim) else '' -%}
              {%- set spdig = spfirst | regex_replace('[^0-9]', '') -%}
              {%- set st = (parts[5] | default('')) | lower -%}
              {%- set mdl = (parts[9] | trim) if (parts | length >= 10 and (parts[9] | trim)) else none -%}
              {%- set mfr = (parts[10] | trim) if (parts | length >= 11 and (parts[10] | trim)) else none -%}
              {%- set _ = out.append({
                'host':            parts[1],
                'wwpn':            (parts[2] | normalize_wwn) if parts[2] else none,
                'wwnn':            (parts[3] | normalize_wwn) if parts[3] else none,
                'model':           mdl if mdl else (parts[4] if parts[4] else none),
                'symbolic_name':   parts[4] if parts[4] else none,
                'vendor':          mfr,
                'driver':          parts[7] if parts[7] else none,
                'firmware':        parts[8] if parts[8] else none,
                'link_status':     ('up' if 'online' in st else ('down' if ('offline' in st or 'linkdown' in st or 'down' in st) else 'unknown')),
                'link_speed_gbps': (spdig | int) if spdig else none,
                'port_type':       'FibreChannel',
                'source':          'os',
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _l_ib_list: >-
          {%- set out = [] -%}
          {%- for line in (_l_ib_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 9 and parts[0] == 'IB' -%}
              {%- set gidp = (parts[4] | default('')).split(':') -%}
              {%- set pg = (gidp[-4:] | join(':')) if (gidp | length >= 8) else none -%}
              {%- set rate = parts[6] | default('') -%}
              {%- set rfirst = (rate.split(' ')[0]) if rate else '' -%}
              {%- set rdig = rfirst | regex_replace('[^0-9]', '') -%}
              {%- set st = (parts[5] | default('')) | lower -%}
              {# hca_type/board_id 는 모델 식별자(MT4123 / MT_0000000223) 이지 제조사가 아니다.
                 제조사는 그 접두로만 판정(MT → Mellanox) 하고, 원문은 model 로 보존한다. #}
              {%- set hca = (parts[8] | trim) if parts[8] else none -%}
              {%- set _ = out.append({
                'adapter':     parts[1],
                'port':        parts[2],
                'node_guid':   parts[3] if parts[3] else none,
                'port_guid':   pg,
                'link_status': ('up' if 'active' in st else ('down' if 'down' in st else 'unknown')),
                'rate':        rate if rate else none,
                'rate_gbps':   (rdig | int) if rdig else none,
                'model':       hca,
                'vendor':      ('Mellanox' if (hca and (hca | upper).startswith('MT')) else none),
                'firmware':    parts[7] if parts[7] else none,
                'source':      'os',
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _l_nic_drivers: >-
          {%- set out = [] -%}
          {%- for line in (_l_nicdrv_raw.stdout_lines | default([])) -%}
            {%- set parts = line.split('|') -%}
            {%- if parts | length >= 5 and parts[0] == 'NIC' -%}
              {%- set _ = out.append({
                'name':        parts[1],
                'driver':      parts[2] if parts[2] | length > 0 else none,
                'vlan_id':     (parts[3] | regex_replace('[^0-9]', '') | int) if (parts[3] | regex_replace('[^0-9]', '') | length > 0) else none,
                'bond_master': parts[4] if parts[4] | length > 0 else none,
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      no_log: true

    - name: "linux | hba_ib | merge into storage/network fragments"
      ansible.builtin.set_fact:
        _data_fragment:
          storage:
            hbas:       "{{ _l_hbas_list }}"
            infiniband: "{{ _l_ib_list }}"
          network:
            driver_map: "{{ _l_nic_drivers }}"
        _sections_supported_fragment: ['storage', 'network']
        _sections_collected_fragment: >-
          {{ (['storage'] if _l_hbas_list or _l_ib_list else [])
             + (['network'] if _l_nic_drivers else []) }}
        _sections_failed_fragment:    []
        _errors_fragment:             []
      no_log: true
  rescue:
    - name: "linux | hba_ib | rescue (best-effort skip)"
      ansible.builtin.set_fact:
        _data_fragment:
          storage:
            hbas:       []
            infiniband: []
          network:
            driver_map: []
        _sections_supported_fragment: []
        _sections_collected_fragment: []
        _sections_failed_fragment:    []
        # M1 / NEW-3 (2026-08-12): message 는 사용자 문장으로, 기술 근거는 detail 문자열로.
        #   section 은 schema 11 섹션 이름을 쓴다 (종전 linux_hba_ib 는 Portal 이 섹션별로
        #   오류를 묶을 때 어디에도 붙지 않았다). detail 은 빈 문자열 대신 none 을 쓴다.
        _errors_fragment:
          - section: storage
            message: "스토리지 정보 중 일부를 수집하지 못했습니다. 대상 상태와 수집 로그를 확인하세요."
            detail: >-
              {{ 'scope=fc_host,infiniband,nic_driver_map; cause=task_failed; msg='
                 ~ ((ansible_failed_result.msg | default('') | string | trim) or 'none') }}
      no_log: true

- name: "linux | hba_ib | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
