---
# os-gather/tasks/linux/gather_system.yml
# OS 기본 정보 수집 → data.system + data.hardware fragment 생성
#
# 2026-09-03 (OS/ESXi 전수 검수 후속 — B-01/02/03/05/07/08/12/14/31/32/33):
#   - raw gather 는 **두 경로 모두** 실행한다. python 경로는 setup facts 를 1순위로 쓰고
#     같은 raw 결과를 fallback 으로 쓴다 → 같은 필드가 경로에 따라 다른 의미를 갖지 않는다.
#   - system.hostname = OS 가 설정한 짧은 이름(nodename 의 첫 label). system.fqdn = hostname +
#     domain, 도메인이 없으면 **null**. 어느 쪽도 IP 로 대체하지 않는다.
#   - data.hardware(vendor/model/serial/uuid/bios_version/bios_date) 를 Linux 도 emit 한다
#     (Windows/ESXi 와 같은 계약). 종전에는 raw 경로가 읽고도 버렸다.
#   - hosting_type 판정식은 한 벌 (systemd-detect-virt 1순위, facts 보조) — 경로 무관 동일 답.
#   - selinux 는 모드(enforcing/permissive/disabled/null) — schema/fields/os.yml 과 일치.
#   - system.runtime 은 이 파일이 **단일 구현**이다 (gather_runtime.yml 은 삭제). 모르면 null,
#     목록 절단 없음, 도구별 enum 차이 없음(active/inactive/null).
#   - 값을 못 구하면 null. 0 / '' / IP / 'unknown' 문자열로 대체하지 않는다.
#
# 출력:
#   _data_fragment               → {system: {...}, hardware: {...}}
#   _sections_supported_fragment → ['system', 'hardware']
#   _sections_collected_fragment → 실제 수집 결과에 따라
#   _sections_failed_fragment    → 실제 수집 결과에 따라
#   _errors_fragment             → [] (정상) or [식별자 진단 / 수집 실패 errors]

- name: "linux | system | init fallback vars"
  ansible.builtin.set_fact:
    _l_fb: {}
  no_log: true

# =============================================================================
# Python 경로: setup facts (1순위)
# =============================================================================
- name: "linux | system | setup"
  when: _l_python_mode == 'python_ok'
  ansible.builtin.setup:
    gather_subset: ['hardware', 'network', 'virtual', 'distribution']
  vars:
    ansible_python_interpreter: "{{ _l_python | default('python3') }}"
  register: _l_setup_result
  failed_when: false
  no_log: true

# setup 이 실제로 facts 를 돌려줬는지 (python_ok 인데 setup 만 실패하는 경우가 있다 —
# 그때도 아래 raw 결과가 같은 필드를 같은 의미로 채운다).
- name: "linux | system | setup 성공 판정"
  ansible.builtin.set_fact:
    _l_setup_ok: >-
      {{ (_l_python_mode == 'python_ok')
         and ((_l_setup_result | default({})).ansible_facts is defined) }}
  no_log: true

# =============================================================================
# Raw gather — 두 경로 공통 (os-release / uname / hostname / selinux / DMI sysfs)
# =============================================================================
- name: "linux | system | raw gather (os-release/uname/hostname/dmi)"
  become: true
  ansible.builtin.raw: |
    export LANG=C LC_ALL=C
    . /etc/os-release 2>/dev/null || true
    echo "OS_ID=${ID:-}"
    echo "OS_ID_LIKE=${ID_LIKE:-}"
    echo "OS_VERSION=${VERSION_ID:-}"
    echo "OS_PRETTY=${PRETTY_NAME:-}"
    echo "KERNEL=$(uname -r 2>/dev/null)"
    echo "ARCH=$(uname -m 2>/dev/null)"
    # hostname: 커널 nodename (resolver 무관 — OS 에 설정된 값 그대로). 짧은 이름/도메인은
    # Jinja 에서 첫 label 로 나눈다. domain 은 nodename 에 점이 없을 때만 resolver 에 묻는다.
    echo "NODENAME=$(uname -n 2>/dev/null)"
    echo "DOMAIN=$(hostname -d 2>/dev/null)"
    echo "UPTIME=$(awk '{print int($1)}' /proc/uptime 2>/dev/null)"
    if command -v getenforce >/dev/null 2>&1; then
      echo "SELINUX=$(getenforce 2>/dev/null | tr '[:upper:]' '[:lower:]')"
    elif [ -f /etc/selinux/config ]; then
      echo "SELINUX=$(grep -m1 '^SELINUX=' /etc/selinux/config 2>/dev/null | cut -d= -f2 | tr '[:upper:]' '[:lower:]')"
    else
      echo "SELINUX="
    fi
    if command -v systemd-detect-virt >/dev/null 2>&1; then
      echo "SDV=$(systemd-detect-virt 2>/dev/null)"
    else
      echo "SDV="
    fi
    for f in product_serial product_uuid sys_vendor product_name bios_version bios_date; do
      v=""
      if [ -r /sys/class/dmi/id/$f ]; then
        v=$(cat /sys/class/dmi/id/$f 2>/dev/null)
      elif command -v sudo >/dev/null 2>&1; then
        v=$(sudo -n cat /sys/class/dmi/id/$f 2>/dev/null || true)
      fi
      echo "DMI_$(echo $f | tr '[:lower:]' '[:upper:]')=$v"
    done
  register: _l_raw_sys_result
  changed_when: false
  failed_when: false
  no_log: true

- name: "linux | system | parse raw results"
  ansible.builtin.set_fact:
    _l_raw_sys: >-
      {{ dict(_l_raw_sys_result.stdout_lines | default([])
              | select('search', '=')
              | map('split', '=', 1)
              | list) }}
  no_log: true

# =============================================================================
# system.runtime — 단일 구현 (timezone / ntp / firewall / listen / swap)
# 두 경로 모두 raw 모듈 — timedatectl/systemctl 같은 명령은 raw 가 가장 robust.
# 모르면 null: 명령 부재 시 값을 비워 보낸다 (0 / false 로 단정하지 않는다).
# =============================================================================
- name: "linux | system | gather runtime (timezone/ntp/firewall/listen/swap)"
  become: true
  ansible.builtin.raw: |
    export LANG=C LC_ALL=C
    TZ=$(timedatectl show -p Timezone --value 2>/dev/null || cat /etc/timezone 2>/dev/null || (readlink /etc/localtime 2>/dev/null | sed 's|.*/zoneinfo/||') || echo "")
    echo "TZ=${TZ}"
    NTPSYNC=$(timedatectl show -p NTPSynchronized --value 2>/dev/null || echo "")
    echo "NTPSYNC=${NTPSYNC}"
    if command -v systemctl >/dev/null 2>&1; then
      NTPACTIVE="no"
      for svc in chronyd chrony ntpd systemd-timesyncd ntp; do
        if systemctl is-active $svc 2>/dev/null | grep -q "^active$"; then
          NTPACTIVE="yes"; break
        fi
      done
    else
      NTPACTIVE=""
    fi
    echo "NTPACTIVE=${NTPACTIVE}"
    FW_TOOL=""
    FW_STATE=""
    if command -v firewall-cmd >/dev/null 2>&1 && systemctl is-active firewalld 2>/dev/null | grep -q "^active$"; then
      FW_TOOL="firewalld"; FW_STATE="active"
    elif command -v ufw >/dev/null 2>&1; then
      UFW_OUT=$(sudo -n ufw status 2>/dev/null | head -1 || true)
      if echo "$UFW_OUT" | grep -qi "Status: active"; then FW_TOOL="ufw"; FW_STATE="active"
      elif echo "$UFW_OUT" | grep -qi "Status: inactive"; then FW_TOOL="ufw"; FW_STATE="inactive"
      fi
    elif command -v nft >/dev/null 2>&1; then
      RULESET=$(sudo -n nft list ruleset 2>/dev/null || true)
      if [ -n "$RULESET" ]; then FW_TOOL="nftables"; FW_STATE="active"
      else FW_TOOL="nftables"; FW_STATE="inactive"
      fi
    elif command -v iptables >/dev/null 2>&1; then
      FW_TOOL="iptables"
      IPT_OUT=$(sudo -n iptables -L -n 2>/dev/null | head -5 || true)
      if [ -n "$IPT_OUT" ]; then FW_STATE="active"; else FW_STATE="inactive"; fi
    fi
    echo "FW_TOOL=${FW_TOOL}"
    echo "FW_STATE=${FW_STATE}"
    echo "PORTS_BEGIN"
    if command -v ss >/dev/null 2>&1; then
      ss -tlnH 2>/dev/null | awk '{print $4}' | awk -F: '{print $NF}' | grep -E '^[0-9]+$' | sort -un
    elif command -v netstat >/dev/null 2>&1; then
      netstat -tln 2>/dev/null | awk 'NR>2 {print $4}' | awk -F: '{print $NF}' | grep -E '^[0-9]+$' | sort -un
    fi
    echo "PORTS_END"
    if command -v free >/dev/null 2>&1; then
      SWAP_LINE=$(free -m 2>/dev/null | awk 'tolower($1) ~ /^swap/' || true)
      if [ -z "$SWAP_LINE" ]; then SWAP_LINE="Swap: 0 0 0"; fi
      echo "SWAP_TOTAL=$(echo $SWAP_LINE | awk '{print $2}')"
      echo "SWAP_USED=$(echo $SWAP_LINE | awk '{print $3}')"
      echo "SWAP_FREE=$(echo $SWAP_LINE | awk '{print $4}')"
    else
      echo "SWAP_TOTAL="
      echo "SWAP_USED="
      echo "SWAP_FREE="
    fi
  register: _l_runtime_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "linux | system | parse runtime"
  ansible.builtin.set_fact:
    _l_runtime: >-
      {%- set lines = _l_runtime_raw.stdout_lines | default([]) -%}
      {%- set ns = namespace(in_ports=false, ports=[], kv={}) -%}
      {%- for line in lines -%}
        {%- set s = line | trim -%}
        {%- if s == 'PORTS_BEGIN' -%}{%- set ns.in_ports = true -%}
        {%- elif s == 'PORTS_END' -%}{%- set ns.in_ports = false -%}
        {%- elif ns.in_ports -%}
          {%- if s and s.isdigit() -%}{%- set _ = ns.ports.append(s | int) -%}{%- endif -%}
        {%- elif '=' in s -%}
          {%- set k, _, v = s.partition('=') -%}
          {%- set _ = ns.kv.update({k: v}) -%}
        {%- endif -%}
      {%- endfor -%}
      {# Round 17 #7: listening_ports 계약은 str[] (field_dictionary + 전 baseline ["22","53"]).
         int 로 모아 숫자정렬 후 map('string') 으로 str[] 변환 (정렬은 수치, 출력은 문자열). #}
      {%- set _ = ns.kv.update({'PORTS': ns.ports | sort | unique | map('string') | list}) -%}
      {{ ns.kv }}
  no_log: true

# =============================================================================
# raw 파생값 — 두 경로 공통 (python 경로에서는 setup facts 의 fallback)
# =============================================================================
- name: "linux | system | set raw-derived variables"
  ansible.builtin.set_fact:
    _l_fb:
      DIST: >-
        {%- set id = (_l_raw_sys.OS_ID | default('')) | trim -%}
        {%- if id == 'rhel' -%}RedHat
        {%- elif id == 'rocky' -%}Rocky
        {%- elif id == 'ubuntu' -%}Ubuntu
        {%- elif id == 'centos' -%}CentOS
        {%- elif id == 'debian' -%}Debian
        {%- elif id == 'fedora' -%}Fedora
        {%- elif id == 'almalinux' -%}AlmaLinux
        {%- elif id == 'ol' -%}OracleLinux
        {%- elif id == 'sles' -%}SLES
        {%- elif id in ['opensuse-leap', 'opensuse-tumbleweed', 'opensuse'] -%}openSUSE
        {%- elif id == 'amzn' -%}Amazon
        {%- elif id -%}{{ id | title }}
        {%- else -%}{{ (_l_raw_sys.OS_PRETTY | default('')) | trim }}
        {%- endif -%}
      OS_FAMILY: >-
        {%- set like = (_l_raw_sys.OS_ID_LIKE | default('')) | trim | lower -%}
        {%- set id = (_l_raw_sys.OS_ID | default('')) | trim | lower -%}
        {%- if 'rhel' in like or 'fedora' in like or id in ['rhel','centos','rocky','almalinux','fedora','ol','oracle','amzn'] -%}RedHat
        {%- elif 'debian' in like or id in ['debian','ubuntu','mint'] -%}Debian
        {%- elif 'suse' in like or id in ['sles','opensuse','opensuse-leap','opensuse-tumbleweed'] -%}Suse
        {%- elif like -%}{{ like.split()[0] | title }}
        {%- elif id -%}{{ id | title }}
        {%- else -%}{{ none }}
        {%- endif -%}
      OS_VERSION: "{{ ((_l_raw_sys.OS_VERSION | default('')) | trim) or none }}"
      KERNEL: "{{ ((_l_raw_sys.KERNEL | default('')) | trim) or none }}"
      ARCH: "{{ ((_l_raw_sys.ARCH | default('')) | trim) or none }}"
      UPTIME: "{{ ((_l_raw_sys.UPTIME | default('')) | trim) or none }}"
      NODENAME: "{{ ((_l_raw_sys.NODENAME | default('')) | trim) or none }}"
      DOMAIN: "{{ ((_l_raw_sys.DOMAIN | default('')) | trim) or none }}"
      SELINUX: >-
        {%- set sel = (_l_raw_sys.SELINUX | default('')) | trim | lower -%}
        {%- if sel in ['enforcing', 'permissive', 'disabled'] -%}{{ sel }}
        {%- else -%}{{ none }}
        {%- endif -%}
      SDV: "{{ ((_l_raw_sys.SDV | default('')) | trim | lower) or none }}"
    _l_raw_serial: >-
      {%- set s = (_l_raw_sys.DMI_PRODUCT_SERIAL | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System Serial Number', 'Default string', '0', '00000000'] -%}
      {{ s if s not in sentinel else none }}
    _l_raw_uuid: >-
      {%- set u = (_l_raw_sys.DMI_PRODUCT_UUID | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified'] -%}
      {{ u if u not in sentinel else none }}
    _l_raw_vendor: >-
      {%- set v = (_l_raw_sys.DMI_SYS_VENDOR | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System manufacturer', 'Default string'] -%}
      {{ v if v not in sentinel else none }}
    _l_raw_model: >-
      {%- set m = (_l_raw_sys.DMI_PRODUCT_NAME | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System Product Name', 'Default string'] -%}
      {{ m if m not in sentinel else none }}
    _l_raw_bios_version: >-
      {%- set b = (_l_raw_sys.DMI_BIOS_VERSION | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'Default string'] -%}
      {{ b if b not in sentinel else none }}
    _l_raw_bios_date: "{{ ((_l_raw_sys.DMI_BIOS_DATE | default('')) | trim) or none }}"
  no_log: true

# raw-only 경로: setup fact 가 없으므로 raw DMI 값이 곧 "setup 값" 자리에 들어간다
# (identifier diagnostics 는 python 경로에서만 돌기 때문에 이 변수는 resolve 단계 입력이다).
- name: "linux | system | identifiers from raw (no setup facts)"
  when: not (_l_setup_ok | bool)
  ansible.builtin.set_fact:
    _l_serial_from_setup: "{{ _l_raw_serial | default(none) }}"
    _l_uuid_from_setup: "{{ _l_raw_uuid | default(none) }}"
    _l_id_diagnostics: []
  no_log: true

# =============================================================================
# hosting_type — 한 벌의 판정식 (경로 무관)
#   1) systemd-detect-virt: 가상화 종류 → virtual, 'none' → baremetal
#   2) (python) ansible_virtualization_type/role 보조: guest → virtual, host → baremetal
#   3) 그 외 → unknown (근거 부족)
# =============================================================================
- name: "linux | system | determine hosting_type"
  ansible.builtin.set_fact:
    _l_hosting_type: >-
      {%- set sdv = (_l_fb.SDV | default('', true)) | lower -%}
      {%- set vtype = (ansible_virtualization_type | default('')) | lower -%}
      {%- set vrole = (ansible_virtualization_role | default('')) | lower -%}
      {%- set vm_signals = ['vmware', 'kvm', 'qemu', 'xen', 'hyperv', 'microsoft', 'oracle', 'parallels', 'bhyve', 'lxc', 'lxc-libvirt', 'docker', 'podman', 'openvz', 'virtualbox', 'bochs', 'uml', 'systemd-nspawn', 'wsl', 'zvm', 'powervm', 'amazon', 'google', 'apple', 'sre', 'acrn', 'rkt', 'proot', 'pouch'] -%}
      {%- if sdv in vm_signals -%}virtual
      {%- elif sdv == 'none' -%}baremetal
      {%- elif vtype in vm_signals and vrole == 'guest' -%}virtual
      {%- elif vrole == 'host' -%}baremetal
      {%- else -%}unknown
      {%- endif -%}
  no_log: true

# =============================================================================
# Python 경로 식별자 — setup fact → DMI direct-read(become) → raw DMI
# =============================================================================
- name: "linux | system | DMI serial precheck"
  when: _l_python_mode == 'python_ok'
  ansible.builtin.command: test -r /sys/class/dmi/id/product_serial
  register: _l_dmi_serial_access
  changed_when: false
  failed_when: false
  no_log: true

- name: "linux | system | DMI uuid precheck"
  when: _l_python_mode == 'python_ok'
  ansible.builtin.command: test -r /sys/class/dmi/id/product_uuid
  register: _l_dmi_uuid_access
  changed_when: false
  failed_when: false
  no_log: true

- name: "linux | system | check setup fact identifiers"
  when: _l_setup_ok | bool
  ansible.builtin.set_fact:
    _l_serial_from_setup: >-
      {{ none if (ansible_product_serial | default('')) in ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System Serial Number', 'Default string', '0', '00000000']
         else (ansible_product_serial | default(none)) }}
    _l_uuid_from_setup: >-
      {{ none if (ansible_product_uuid | default('')) in ['', 'NA', 'None', 'Not Specified']
         else (ansible_product_uuid | default(none)) }}
  no_log: true

# DMI direct-read fallback (become 필요)
- name: "linux | system | DMI direct-read fallback"
  when: >
    _l_python_mode == 'python_ok' and
    ((_l_serial_from_setup | default(none)) is none or
     (_l_uuid_from_setup | default(none)) is none)
  block:
    - name: "linux | system | DMI direct-read serial"
      when: (_l_serial_from_setup | default(none)) is none  # rule 95 R1 R5 ok: serial raw fallback 진입
      ansible.builtin.command: cat /sys/class/dmi/id/product_serial
      become: true
      register: _l_dmi_serial_direct
      changed_when: false
      failed_when: false
      no_log: true

    - name: "linux | system | DMI direct-read uuid"
      when: (_l_uuid_from_setup | default(none)) is none  # rule 95 R1 R5 ok: uuid raw fallback 진입
      ansible.builtin.command: cat /sys/class/dmi/id/product_uuid
      become: true
      register: _l_dmi_uuid_direct
      changed_when: false
      failed_when: false
      no_log: true
  rescue:
    - name: "linux | system | DMI fallback failed (become unavailable)"
      ansible.builtin.set_fact:
        _l_dmi_fallback_failed: true
      no_log: true

# 최종 식별자 결정 — setup fact → DMI direct-read → raw DMI(sudo -n) → null
- name: "linux | system | resolve identifiers"
  ansible.builtin.set_fact:
    _l_serial_val: >-
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System Serial Number', 'Default string', '0', '00000000'] -%}
      {%- if (_l_serial_from_setup | default(none)) is not none -%}
        {{ _l_serial_from_setup }}
      {%- elif (_l_dmi_serial_direct is defined) and (_l_dmi_serial_direct.rc | default(1)) == 0
              and (_l_dmi_serial_direct.stdout | default('') | trim) not in sentinel
              and (_l_dmi_serial_direct.stdout | default('') | trim | length) > 0 -%}
        {{ _l_dmi_serial_direct.stdout | trim }}
      {%- elif (_l_raw_serial | default(none)) is not none -%}
        {{ _l_raw_serial }}
      {%- else -%}
        {{ none }}
      {%- endif -%}
    _l_uuid_val: >-
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified'] -%}
      {%- if (_l_uuid_from_setup | default(none)) is not none -%}
        {{ _l_uuid_from_setup }}
      {%- elif (_l_dmi_uuid_direct is defined) and (_l_dmi_uuid_direct.rc | default(1)) == 0
              and (_l_dmi_uuid_direct.stdout | default('') | trim) not in sentinel
              and (_l_dmi_uuid_direct.stdout | default('') | trim | length) > 0 -%}
        {{ _l_dmi_uuid_direct.stdout | trim }}
      {%- elif (_l_raw_uuid | default(none)) is not none -%}
        {{ _l_raw_uuid }}
      {%- else -%}
        {{ none }}
      {%- endif -%}
  no_log: true

# 하드웨어 식별 — setup fact(sentinel 적용) → raw DMI. hardware 섹션과 시리얼 정규화 힌트 공용.
#   bios_date: DMI/setup 은 MM/DD/YYYY — ISO(YYYY-MM-DD) 로 정규화 (Windows/ESXi 와 같은 형식).
- name: "linux | system | resolve hardware identity"
  ansible.builtin.set_fact:
    _l_hw_vendor: >-
      {%- set v = (ansible_system_vendor | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System manufacturer', 'Default string'] -%}
      {{ v if (v not in sentinel) else (_l_raw_vendor | default(none)) }}
    _l_hw_model: >-
      {%- set m = (ansible_product_name | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'System Product Name', 'Default string'] -%}
      {{ m if (m not in sentinel) else (_l_raw_model | default(none)) }}
    _l_hw_bios_version: >-
      {%- set b = (ansible_bios_version | default('')) | trim -%}
      {%- set sentinel = ['', 'NA', 'None', 'Not Specified', 'To Be Filled By O.E.M.', 'Default string'] -%}
      {{ b if (b not in sentinel) else (_l_raw_bios_version | default(none)) }}
    _l_hw_bios_date: >-
      {%- set d = ((ansible_bios_date | default('')) | trim) or (_l_raw_bios_date | default('', true)) -%}
      {%- set d = d | string | trim -%}
      {%- if d | regex_search('^[0-9]{2}/[0-9]{2}/[0-9]{4}$') is not none -%}
        {{ d[6:10] ~ '-' ~ d[0:2] ~ '-' ~ d[3:5] }}
      {%- elif d | regex_search('^[0-9]{4}-[0-9]{2}-[0-9]{2}') is not none -%}
        {{ d[0:10] }}
      {%- elif d -%}{{ d }}
      {%- else -%}{{ none }}
      {%- endif -%}
  no_log: true

# nPartition 접미사 정규화 (2026-08-27)
#   HPE Compute Scale-up Server 3200 은 OS 안에서 읽는 SMBIOS Type 1 System Serial 이
#   "<물리 시리얼>-<파티션번호 3자리>" 형식이다 (SGHD3TLNDD-000). 자산 관리 기준은 물리
#   시리얼이라 접미사를 뗀다. vendor + model + 접미사 패턴 셋을 모두 만족할 때만 동작하고,
#   그 외에는 입력을 글자 그대로 돌려준다 (filter_plugins/serial_normalizer.py).
- name: "linux | system | normalize serial (nPartition 접미사)"
  vars:
    # 판정 힌트: resolve hardware identity 결과 → setup fact(sys_vendor / product_name) → raw sysfs
    _l_vendor_hint: >-
      {{ _l_hw_vendor | default(ansible_system_vendor | default(_l_raw_vendor | default('', true), true), true) }}
    _l_model_hint: >-
      {{ _l_hw_model | default(ansible_product_name | default(_l_raw_model | default('', true), true), true) }}
  ansible.builtin.set_fact:
    _l_serial_val: "{{ _l_serial_val | normalize_os_serial(_l_vendor_hint, _l_model_hint) }}"
  no_log: true

# identifier diagnostics (Python 경로에서만 상세 진단)
- name: "linux | system | identifier diagnostics 빌드"
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/linux/build_identifier_diagnostics.yml"

# =============================================================================
# hostname / fqdn — nodename 기반 (resolver 결과가 아니다)
#   short  = nodename 첫 label
#   domain = nodename 에 점이 있으면 그 뒤, 없으면 resolver(ansible_domain / hostname -d)
#   fqdn   = short.domain — domain 이 없으면 null (짧은 이름을 FQDN 자리에 넣지 않는다)
# =============================================================================
- name: "linux | system | resolve hostname / fqdn"
  ansible.builtin.set_fact:
    _l_hostname_short: >-
      {%- set n = ((ansible_nodename | default('')) | trim) or (_l_fb.NODENAME | default('', true)) -%}
      {%- set n = (n | string | trim) -%}
      {{ (n.split('.')[0]) if n else none }}
    _l_fqdn: >-
      {%- set n = ((ansible_nodename | default('')) | trim) or (_l_fb.NODENAME | default('', true)) -%}
      {%- set n = (n | string | trim) -%}
      {%- set short = (n.split('.')[0]) if n else '' -%}
      {%- set dom = (n.split('.', 1)[1]) if ('.' in n) else (((ansible_domain | default('')) | trim) or (_l_fb.DOMAIN | default('', true))) -%}
      {%- set dom = (dom | string | trim) -%}
      {{ (short ~ '.' ~ dom) if (short and dom) else none }}
  no_log: true

# =============================================================================
# fragment 조립 + merge
# =============================================================================
# N13: system 섹션 수집 성공 판정 — collected / failed / errors 세 자리가 이 변수 하나를 본다.
- name: "linux | system | 수집 성공 판정"
  ansible.builtin.set_fact:
    _l_sys_ok: >-
      {{ (ansible_distribution is defined)
         or ((_l_fb.DIST | default('', true)) | string | length > 0) }}
    _l_hw_ok: >-
      {{ (_l_hw_vendor | default(none)) is not none
         or (_l_hw_model | default(none)) is not none
         or (_l_serial_val | default(none)) is not none
         or (_l_uuid_val | default(none)) is not none
         or (_l_hw_bios_version | default(none)) is not none }}
  no_log: true

- name: "linux | system | build fragment"
  ansible.builtin.set_fact:
    _data_fragment:
      system:
        os_family:      "{{ ansible_os_family      | default(_l_fb.OS_FAMILY | default(none)) }}"
        distribution:   "{{ ansible_distribution   | default(_l_fb.DIST | default(none)) }}"
        version:        "{{ ansible_distribution_version | default(_l_fb.OS_VERSION | default(none)) }}"
        kernel:         "{{ ansible_kernel         | default(_l_fb.KERNEL | default(none)) }}"
        architecture:   "{{ ansible_architecture   | default(_l_fb.ARCH | default(none)) }}"
        hostname:       "{{ _l_hostname_short | default(none) }}"
        fqdn:           "{{ _l_fqdn | default(none) }}"
        hosting_type:   "{{ (_l_hosting_type | default('', true) | trim) or none }}"
        uptime_seconds: >-
          {%- set u = ansible_uptime_seconds | default(_l_fb.UPTIME | default(none)) -%}
          {%- set us = (u | string | trim) if u is not none else '' -%}
          {{ (us | int) if us.isdigit() else none }}
        # selinux 모드 (enforcing / permissive / disabled / null). python 경로는 ansible_selinux 의
        # mode(활성 시) / status(disabled), raw 경로는 getenforce — 같은 어휘.
        selinux: >-
          {%- set st = ((ansible_selinux | default({})).status | default('')) | lower -%}
          {%- set md = ((ansible_selinux | default({})).mode | default('')) | lower -%}
          {%- if st == 'enabled' and md in ['enforcing', 'permissive'] -%}{{ md }}
          {%- elif st == 'disabled' -%}disabled
          {%- else -%}{{ _l_fb.SELINUX | default(none) }}
          {%- endif -%}
        serial_number:  "{{ _l_serial_val | default(none) }}"
        system_uuid:    "{{ (_l_uuid_val | default(none)) | normalize_uuid }}"
        # vendor: hardware.vendor 와 같은 값 (종전 호환 — envelope.vendor 는 hardware.vendor 를 쓴다).
        vendor:         "{{ _l_hw_vendor | default(none) }}"
        runtime:
          timezone: >-
            {%- set tz = (_l_runtime.TZ | default('')) | trim -%}
            {{ tz if tz else none }}
          ntp_active: >-
            {%- set v = (_l_runtime.NTPACTIVE | default('')) | trim -%}
            {%- if v == 'yes' -%}{{ true }}
            {%- elif v == 'no' -%}{{ false }}
            {%- else -%}{{ none }}
            {%- endif -%}
          ntp_synchronized: >-
            {%- set v = (_l_runtime.NTPSYNC | default('')) | trim -%}
            {%- if v == 'yes' -%}{{ true }}
            {%- elif v == 'no' -%}{{ false }}
            {%- else -%}{{ none }}
            {%- endif -%}
          firewall_tool: >-
            {%- set v = (_l_runtime.FW_TOOL | default('')) | trim -%}
            {{ v if v else none }}
          firewall_state: >-
            {%- set v = (_l_runtime.FW_STATE | default('')) | trim -%}
            {{ v if v in ['active', 'inactive'] else none }}
          listening_ports: "{{ _l_runtime.PORTS | default([]) }}"
          swap_total_mb: >-
            {%- set v = (_l_runtime.SWAP_TOTAL | default('')) | trim -%}
            {{ (v | int) if v.isdigit() else none }}
          swap_used_mb: >-
            {%- set v = (_l_runtime.SWAP_USED | default('')) | trim -%}
            {{ (v | int) if v.isdigit() else none }}
          swap_free_mb: >-
            {%- set v = (_l_runtime.SWAP_FREE | default('')) | trim -%}
            {{ (v | int) if v.isdigit() else none }}
      # 2026-09-03: Linux 도 hardware 섹션을 emit — Windows(gather_hardware.yml)/ESXi 와 같은 키.
      hardware:
        vendor:       "{{ _l_hw_vendor | default(none) }}"
        model:        "{{ _l_hw_model | default(none) }}"
        serial:       "{{ _l_serial_val | default(none) }}"
        uuid:         "{{ (_l_uuid_val | default(none)) | normalize_uuid }}"
        bios_version: "{{ _l_hw_bios_version | default(none) }}"
        bios_date:    "{{ _l_hw_bios_date | default(none) }}"
    _sections_supported_fragment: ['system', 'hardware']
    _sections_collected_fragment: >-
      {{ (['system'] if (_l_sys_ok | bool) else []) + (['hardware'] if (_l_hw_ok | bool) else []) }}
    _sections_failed_fragment: >-
      {{ ([] if (_l_sys_ok | bool) else ['system']) + ([] if (_l_hw_ok | bool) else ['hardware']) }}
    # 식별자 진단(python 경로) + 섹션 실패 사유. 실패인데 errors 가 비는 결과를 만들지 않는다.
    _errors_fragment: "{{ (_l_id_diagnostics | default([])) + ([{'section': 'system', 'message': '서버 기본 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.', 'detail': 'field=distribution; cause=os_release_and_setup_fact_unavailable'}] if not (_l_sys_ok | bool) else []) + ([{'section': 'hardware', 'message': '하드웨어 정보 수집에 실패했습니다. 수집 계정의 권한을 확인하세요.', 'detail': 'field=vendor,model,serial,uuid,bios_version; cause=dmi_unavailable; tried=setup_fact,dmi_sysfs'}] if not (_l_hw_ok | bool) else []) }}"
  no_log: true

- name: "linux | system | merge fragment"
  ansible.builtin.include_tasks:
    file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/merge_fragment.yml"
