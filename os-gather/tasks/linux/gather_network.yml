---
# os-gather/tasks/linux/gather_network.yml
# 네트워크 인터페이스 수집 → data.network fragment
#
# 2026-09-03 (OS/ESXi 전수 검수 후속 — B-12/26/27/29/30):
#   - Python / raw 두 경로가 **같은 raw 명령 + 같은 판정식**을 쓴다. 종전 python 경로는
#     ansible_interfaces 중 IPv4 를 가진 것만 interfaces[] 에 넣어(NIC 4포트 중 IP 없는 3포트가
#     인벤토리에서 사라짐) link_status 를 관리 up 플래그로 판정했고(케이블 빠져도 up), raw 경로는
#     sysfs 전수 + operstate 였다. 이제 두 경로 모두 sysfs + ip 명령이다.
#   - mac 은 normalize_mac (소문자 콜론) — Windows/ESXi 와 같은 형식.
#   - IPv6 scope 는 `ip -o -6 addr` 의 scope 토큰 (global/link/host/site) — 주소 앞자리로 추정하지 않는다.
#   - adapters[].name 에 'Unknown' 리터럴을 넣지 않는다 (없으면 null).
#   - 섹션 status 는 실제 결과로 (interfaces 나 dns 가 하나라도 있어야 success).
#
# bond/vlan/bridge/team 토폴로지는 아래 _l_net_collector 스크립트(POSIX sh)가
# '|' 구분 라인으로 emit → filter_plugins/network_topology.py(build_linux_network)
# 가 파싱·정규화. RHEL/Rocky/Alma/CentOS/Oracle/Ubuntu/Debian/SUSE 공통
# (sysfs+procfs+ip 다중 소스, 일부 부재해도 graceful).

# =============================================================================
# Shared: bond/vlan/bridge/team 토폴로지 수집 스크립트 (단일 정의)
# =============================================================================
- name: "linux | network | define topology collector"
  ansible.builtin.set_fact:
    _l_net_collector: |
      export LANG=C LC_ALL=C
      # --- Bond masters: config from sysfs (모든 배포판 공통 — bonding 드라이버) ---
      for bp in /sys/class/net/*/bonding; do
        [ -d "$bp" ] || continue
        b=$(basename "$(dirname "$bp")")
        mode=$(cat "$bp/mode" 2>/dev/null | awk '{print $1}')
        active=$(cat "$bp/active_slave" 2>/dev/null | tr -d '\n')
        miimon=$(cat "$bp/miimon" 2>/dev/null | tr -d '\n')
        lacp=$(cat "$bp/lacp_rate" 2>/dev/null | awk '{print $1}')
        xmit=$(cat "$bp/xmit_hash_policy" 2>/dev/null | awk '{print $1}')
        primary=$(cat "$bp/primary" 2>/dev/null | tr -d '\n')
        adsel=$(cat "$bp/ad_select" 2>/dev/null | awk '{print $1}')
        slaves=$(cat "$bp/slaves" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//')
        echo "BOND|${b}|${mode}|${active}|${miimon}|${lacp}|${xmit}|${primary}|${adsel}|${slaves}"
      done
      # --- Per-slave detail from /proc/net/bonding (speed/perm/lfc/mii + AB state) ---
      for pf in /proc/net/bonding/*; do
        [ -f "$pf" ] || continue
        b=$(basename "$pf")
        awk -v b="$b" '
          /^Currently Active Slave:/ {act=$NF}
          /^Slave Interface:/ {sl=$3; mii=""; spd=""; lfc=""; perm=""}
          /^MII Status:/ && sl!="" {mii=$3}
          /^Speed:/ && sl!="" {spd=$2}
          /^Link Failure Count:/ && sl!="" {lfc=$NF}
          /^Permanent HW addr:/ && sl!="" {perm=$NF}
          /^Slave queue ID:/ && sl!="" {
            st=(sl==act)?"active":"backup";
            print "BSLAVE|" b "|" sl "|" st "|" mii "|" perm "|" spd "|" lfc;
            sl=""
          }
        ' "$pf" 2>/dev/null
      done
      # --- Authoritative per-slave state (전 모드, incl 802.3ad) from `ip -d link` ---
      ip -d link show 2>/dev/null | awk '
        /^[0-9]+:/ {ifc=$2; sub(/:$/,"",ifc); sub(/@.*/,"",ifc)}
        /bond_slave/ {for(i=1;i<=NF;i++) if($i=="state"){print "SLSTATE|" ifc "|" tolower($(i+1))}}
      '
      # --- Per-slave sysfs meta (proc 부재 시에도 동작 — proc-missing/sysfs-only 방어) ---
      for d in /sys/class/net/*; do
        [ -e "$d/master" ] || continue
        [ -d "$d/bonding" ] && continue
        sl=$(basename "$d")
        m=$(readlink "$d/master" 2>/dev/null); m=$(basename "$m")
        [ -d "/sys/class/net/$m/bonding" ] || continue
        mtu=$(cat "$d/mtu" 2>/dev/null | tr -d '\n')
        oper=$(cat "$d/operstate" 2>/dev/null | tr -d '\n')
        spd=$(cat "$d/speed" 2>/dev/null | tr -d '\n'); [ "$spd" = "-1" ] && spd=""
        perm=$(cat "$d/bonding_slave/perm_hwaddr" 2>/dev/null | tr -d '\n')
        echo "SLMETA|${m}|${sl}|${mtu}|${oper}|${spd}|${perm}"
      done
      # --- VLAN from /proc/net/vlan/config (parent + id) ---
      if [ -f /proc/net/vlan/config ]; then
        awk -F'\|' 'NR>2 {
          n=$1; v=$2; p=$3;
          gsub(/^ +| +$/,"",n); gsub(/^ +| +$/,"",v); gsub(/^ +| +$/,"",p);
          if (n!="") print "VLANIF|" n "|" p "|" v
        }' /proc/net/vlan/config 2>/dev/null
      fi
      # --- VLAN from `ip -d link` (netlink-only VLAN, /proc/net/vlan 부재 보완) ---
      ip -d link show 2>/dev/null | awk '
        /^[0-9]+:/ {ifc=$2; par=""; sub(/:$/,"",ifc);
                    if (index(ifc,"@")>0){n=index(ifc,"@"); par=substr(ifc,n+1); ifc=substr(ifc,1,n-1)}}
        /vlan protocol/ {for(i=1;i<=NF;i++) if($i=="id"){print "VLANIF|" ifc "|" par "|" $(i+1)}}
      '
      # --- Bridges + member ports ---
      for brp in /sys/class/net/*/bridge; do
        [ -d "$brp" ] || continue
        br=$(basename "$(dirname "$brp")")
        mem=""
        for sp in /sys/class/net/"$br"/brif/*; do
          [ -e "$sp" ] && mem="${mem} $(basename "$sp")"
        done
        mem=$(echo "$mem" | sed 's/^ *//')
        echo "BRIDGE|${br}|${mem}"
      done
      # --- Linux teamd 팀 (드묾; master + member via sysfs) ---
      for tp in /sys/class/net/*/team; do
        [ -d "$tp" ] || continue
        t=$(basename "$(dirname "$tp")")
        mem=""
        for d in /sys/class/net/*; do
          [ -e "$d/master" ] || continue
          m=$(readlink "$d/master" 2>/dev/null); m=$(basename "$m")
          [ "$m" = "$t" ] && mem="${mem} $(basename "$d")"
        done
        echo "TEAM|${t}||$(echo "$mem" | sed 's/^ *//')"
      done
      # --- Per-address records (bond alias / secondary IP 포함) — Linux 공통 다중 소스 ---
      # 우선순위: ip -j addr show (1순위) > ip -o addr show (2순위) > ifconfig -a (3순위).
      # nmcli / ifcfg 파일 비의존 (NetworkManager 부재·배포판 차이에 강건).
      # bond alias(bond1:1)는 새 인터페이스가 아니라 parent bond 의 추가 IP label →
      # filter(merge_linux_addresses)가 parent 의 addresses[] 로 병합 (interfaces 신규 생성 안 함).
      if command -v ip >/dev/null 2>&1 && ip -j addr show >/dev/null 2>&1; then
        echo "ADDRJSON|$(ip -j addr show 2>/dev/null | tr -d '\r\n')"
      elif command -v ip >/dev/null 2>&1; then
        ip -o addr show 2>/dev/null | while IFS= read -r __al; do
          echo "ADDRO|${__al}"
        done
      elif command -v ifconfig >/dev/null 2>&1; then
        ifconfig -a 2>/dev/null | while IFS= read -r __al; do
          echo "ADDRIFC|${__al}"
        done
      fi
  no_log: true

# =============================================================================
# 수집 — 두 경로 공통 (ip 명령 + /sys/class/net + /etc/resolv.conf + lspci + ethtool)
# =============================================================================
- name: "linux | network | raw gather"
  ansible.builtin.raw: |
    export LANG=C LC_ALL=C
    # --- DNS (systemd-resolved 우회 — 127.0.0.53 stub 회피) ---
    if command -v resolvectl >/dev/null 2>&1; then
      resolvectl status 2>/dev/null | awk '/Current DNS Server:/{print "DNS_REAL="$4}'
    fi
    if [ -f /run/systemd/resolve/resolv.conf ]; then
      awk '/^nameserver/{print "DNS_REAL="$2}' /run/systemd/resolve/resolv.conf
    fi
    grep -v '^[#;]' /etc/resolv.conf 2>/dev/null | awk '/^nameserver/{print "DNS="$2}'
    # --- Default gateway ---
    dg=$(ip route show default 2>/dev/null | head -1)
    if [ -n "$dg" ]; then
      echo "GW=$(echo "$dg" | awk '{print $3}')"
      echo "GW_DEV=$(echo "$dg" | awk '{print $5}')"
    fi
    # --- Interfaces (IP 유무와 무관하게 전수 — bond slave / bridge port 는 토폴로지 필터가 채운다) ---
    for dev in $(ls /sys/class/net/ 2>/dev/null); do
      case "$dev" in lo|docker*|br-*|veth*|virbr*|vir*|cni*|flannel*|cali*|tunl*|dummy*|kube-*) continue;; esac
      if [ -e "/sys/class/net/$dev/master" ] && [ ! -d "/sys/class/net/$dev/bridge" ] && [ ! -d "/sys/class/net/$dev/bonding" ]; then
        continue
      fi
      mac=$(cat /sys/class/net/$dev/address 2>/dev/null)
      [ -z "$mac" ] || [ "$mac" = "00:00:00:00:00:00" ] && continue
      mtu=$(cat /sys/class/net/$dev/mtu 2>/dev/null || echo "")
      speed=$(cat /sys/class/net/$dev/speed 2>/dev/null || echo "")
      [ "$speed" = "-1" ] && speed=""
      state=$(cat /sys/class/net/$dev/operstate 2>/dev/null || echo unknown)
      addr_line=$(ip -o -4 addr show dev "$dev" 2>/dev/null | head -1)
      cidr=$(echo "$addr_line" | awk '{print $4}')
      addr=$(echo "$cidr" | cut -d/ -f1)
      prefix=$(echo "$cidr" | cut -sd/ -f2)
      echo "IF=${dev}|${mac}|${mtu}|${speed}|${state}|${addr:-}|${prefix:-}"
      # IPv6 (link-local + global, ::1 제외). scope 는 ip 가 준 값 그대로 (global/link/host/site).
      ip -o -6 addr show dev "$dev" 2>/dev/null | awk -v d="$dev" '{
        a=""; sc="";
        for (i=1;i<=NF;i++) { if ($i=="inet6") a=$(i+1); if ($i=="scope") sc=$(i+1) }
        if (a=="" ) next;
        n=split(a, ap, "/");
        if (ap[1]=="::1") next;
        print "IF6=" d "|" ap[1] "|" ap[2] "|" sc
      }'
    done
    # --- hardware NIC (lspci -mm) + driver. awk -F'"' field: $2=class / $4=vendor / $6=device ---
    if command -v lspci >/dev/null 2>&1; then
      lspci -k -mm -d ::0200 | while IFS= read -r line; do
        slot=$(echo "$line" | awk -F'"' '{print $1}' | tr -d ' ')
        vendor=$(echo "$line" | awk -F'"' '{print $4}')
        device=$(echo "$line" | awk -F'"' '{print $6}')
        driver=$(lspci -k -s "$slot" 2>/dev/null | awk '/Kernel driver in use:/{print $5}')
        echo "ADAPTER|${slot}|${vendor}|${device}|${driver}"
      done
    fi
    # --- NIC firmware (ethtool -i), bus-info 도메인 strip → adapters[].pci 매칭 ---
    for d in $(ls /sys/class/net 2>/dev/null); do
      [ -e "/sys/class/net/$d/device" ] || continue
      inf=$(ethtool -i "$d" 2>/dev/null)
      bi=$(printf '%s\n' "$inf" | sed -n 's/^bus-info: //p')
      fw=$(printf '%s\n' "$inf" | sed -n 's/^firmware-version: //p')
      [ -n "$bi" ] || continue
      echo "ETHFW|$(echo "$bi" | sed 's/^0000://')|${fw}"
    done
    # bond/vlan/bridge/team 토폴로지 — 단일 정의 스크립트 주입
    {{ _l_net_collector }}
  register: _l_net_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "linux | network | parse raw"
  ansible.builtin.set_fact:
    _l_raw_dns: >-
      {%- set real = [] -%}
      {%- set fallback = [] -%}
      {%- for line in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('DNS_REAL=') -%}
          {%- set s = line[9:] | trim -%}
          {%- if s and not s.startswith('127.') and s not in real -%}
            {%- set _ = real.append(s) -%}
          {%- endif -%}
        {%- elif line.startswith('DNS=') -%}
          {%- set s = line[4:] | trim -%}
          {%- if s and not s.startswith('127.') and s not in fallback -%}
            {%- set _ = fallback.append(s) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ real if real else fallback }}
    _l_raw_gw: >-
      {%- for line in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('GW=') -%}{{ line[3:] | trim }}{% endif -%}
      {%- endfor -%}
    _l_raw_gw_dev: >-
      {%- for line in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('GW_DEV=') -%}{{ line[7:] | trim }}{% endif -%}
      {%- endfor -%}
    # IF6 (IPv6 addresses by device) — scope 는 ip 명령 값 (global/link/host/site)
    _l_raw_ipv6_by_dev: >-
      {%- set m = {} -%}
      {%- for line in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('IF6=') -%}
          {%- set parts = line[4:].split('|') -%}
          {%- if parts | length >= 4 -%}
            {%- set dev = parts[0] | trim -%}
            {%- set v6  = parts[1] | trim -%}
            {%- set pfx = parts[2] | trim -%}
            {%- set scope = (parts[3] | trim) or none -%}
            {%- if dev not in m -%}{%- set _ = m.update({dev: []}) -%}{%- endif -%}
            {%- set _ = m[dev].append({
              'family': 'ipv6',
              'address': v6,
              'prefix_length': (pfx | int) if pfx.isdigit() else none,
              'subnet_mask': none,
              'gateway': none,
              'scope': scope
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ m }}
    # ADAPTER (lspci PCI NIC) + ETHFW (ethtool firmware) — id, name, manufacturer, model, driver, firmware_version, pci
    _l_raw_adapters: >-
      {%- set out = [] -%}
      {%- set fwmap = {} -%}
      {%- for fl in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if fl.startswith('ETHFW|') -%}
          {%- set fp = fl.split('|') -%}
          {%- if fp | length >= 3 -%}{%- set _ = fwmap.update({fp[1]: (fp[2] | trim) or none}) -%}{%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for line in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('ADAPTER|') -%}
          {%- set parts = line.split('|') -%}
          {%- if parts | length >= 5 -%}
            {%- set slot   = parts[1] | trim -%}
            {%- set vendor = parts[2] | trim -%}
            {%- set device = parts[3] | trim -%}
            {%- set driver = parts[4] | trim -%}
            {%- if slot -%}
              {%- set _ = out.append({
                'id':           slot,
                'name':         device or none,
                'manufacturer': vendor or none,
                'model':        device or none,
                'driver':       driver or none,
                'firmware_version': fwmap.get(slot, none),
                'pci':          slot,
              }) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _l_raw_ifaces: >-
      {%- set out = [] -%}
      {%- for line in (_l_net_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('IF=') -%}
          {%- set parts = line[3:].split('|') -%}
          {%- if parts | length >= 7 -%}
            {%- set dev_name    = parts[0] | trim -%}
            {%- set mac_addr    = parts[1] | trim -%}
            {%- set mtu_str     = parts[2] | trim -%}
            {%- set speed_str   = parts[3] | trim -%}
            {%- set state_str   = parts[4] | trim -%}
            {%- set ip_addr     = parts[5] | trim -%}
            {%- set prefix_str  = parts[6] | trim -%}
            {%- set mtu_val     = (mtu_str | int) if mtu_str.isdigit() else none -%}
            {%- set speed_val   = (speed_str | int) if (speed_str.isdigit() and (speed_str | int) > 0) else none -%}
            {%- set prefix_val  = (prefix_str | int) if prefix_str.isdigit() else none -%}
            {%- set mask = none -%}
            {%- if prefix_val is not none -%}
              {%- set octets = [] -%}
              {%- set ns = namespace(remain=prefix_val) -%}
              {%- for _ in range(4) -%}
                {%- if ns.remain >= 8 -%}
                  {%- set _ = octets.append(255) -%}
                  {%- set ns.remain = ns.remain - 8 -%}
                {%- elif ns.remain > 0 -%}
                  {%- set _ = octets.append(256 - (2 ** (8 - ns.remain))) -%}
                  {%- set ns.remain = 0 -%}
                {%- else -%}
                  {%- set _ = octets.append(0) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set mask = octets | join('.') -%}
            {%- endif -%}
            {%- set ls = 'up' if state_str == 'up' else ('down' if state_str == 'down' else 'unknown') -%}
            {%- set addrs = [] -%}
            {%- if ip_addr -%}
              {%- set _ = addrs.append({
                'family':        'ipv4',
                'address':       ip_addr,
                'prefix_length': prefix_val,
                'subnet_mask':   mask,
                'gateway':       none
              }) -%}
            {%- endif -%}
            {%- set _ = out.append({
              'id':          dev_name,
              'name':        dev_name,
              'kind':        'os_nic',
              'mac':         mac_addr | normalize_mac,
              'mtu':         mtu_val if (mtu_val is not none and mtu_val > 0) else none,
              'speed_mbps':  speed_val,
              'link_status': ls,
              'is_primary':  false,
              'addresses':   addrs
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "linux | network | raw mark primary + inject gateway + merge IPv6"
  ansible.builtin.set_fact:
    _l_norm_interfaces_raw: >-
      {%- set gw     = (_l_raw_gw     | default('')) | trim -%}
      {%- set gw_dev = (_l_raw_gw_dev | default('')) | trim -%}
      {%- set v6_map = (_l_raw_ipv6_by_dev | default({})) -%}
      {%- set out = [] -%}
      {%- for iface in (_l_raw_ifaces | default([])) -%}
        {%- set is_primary = (gw_dev | length > 0) and (iface.id == gw_dev) -%}
        {%- set addrs = [] -%}
        {%- for a in (iface.addresses | default([])) -%}
          {%- set _ = addrs.append(a | combine({'gateway': gw if (is_primary and gw) else none})) -%}
        {%- endfor -%}
        {%- for v6 in (v6_map[iface.id] | default([])) -%}
          {%- set _ = addrs.append(v6) -%}
        {%- endfor -%}
        {%- set _ = out.append(iface | combine({
          'is_primary': is_primary,
          'addresses':  addrs
        })) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

# network.summary group 산출 (speed_mbps 기준). speed 미보고(가상 NIC/bond) 는 집계 제외.
- name: "linux | network | compute summary groups (raw)"
  ansible.builtin.set_fact:
    _l_net_summary_r: >-
      {%- set ns = namespace(groups=[], seen={}) -%}
      {%- for n in (_l_norm_interfaces_raw | default([])) -%}
        {%- set sp = n.speed_mbps | default(none) -%}
        {%- if sp is not none and (sp | int) > 0 -%}
          {%- set link_up = (n.link_status | default('') | lower) in ['up','linkup'] -%}
          {%- set key = sp | string -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set _ = ns.groups[idx].update({'quantity': ns.groups[idx].quantity + 1, 'link_up_count': ns.groups[idx].link_up_count + (1 if link_up else 0)}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'speed_mbps': sp, 'link_type': none, 'quantity': 1, 'link_up_count': 1 if link_up else 0}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups} }}
  no_log: true

# N12 (2026-08-12): 수집 성공 판정을 한 곳에서 결정한다 — collected / failed / errors 세 자리가 이 변수를 본다.
- name: "linux | network | raw 수집 성공 판정"
  ansible.builtin.set_fact:
    _l_net_raw_ok: >-
      {{ ((_l_norm_interfaces_raw | default([]) | length) > 0)
         or ((_l_raw_dns | default([]) | length) > 0) }}
  no_log: true

# bond/vlan/bridge/team 토폴로지 정규화 (filter_plugins/network_topology.py).
# merge_linux_addresses: bond alias / secondary IP 를 parent addresses[] 에 병합.
- name: "linux | network | normalize topology (raw)"
  ansible.builtin.set_fact:
    _l_net_topo_raw: >-
      {{ ((_l_norm_interfaces_raw | default([]))
          | merge_linux_addresses(_l_net_raw.stdout_lines | default([])))
         | build_linux_network(_l_net_raw.stdout_lines | default([])) }}
  no_log: true

- name: "linux | network | build fragment (raw)"
  ansible.builtin.set_fact:
    _data_fragment:
      network:
        dns_servers: "{{ _l_raw_dns | default([]) }}"
        default_gateways: >-
          {%- set out = [] -%}
          {%- set gw = (_l_raw_gw | default('')) | trim -%}
          {%- if gw -%}
            {%- set _ = out.append({'family':'ipv4','address':gw}) -%}
          {%- endif -%}
          {{ out }}
        interfaces: "{{ _l_net_topo_raw.interfaces }}"
        # bond/vlan/bridge/team 토폴로지 (Additive — 기존 필드 불변)
        bonds:    "{{ _l_net_topo_raw.bonds }}"
        bridges:  "{{ _l_net_topo_raw.bridges }}"
        teams:    "{{ _l_net_topo_raw.teams }}"
        adapters:    "{{ _l_raw_adapters | default([]) }}"
        ports:       []
        summary: "{{ _l_net_summary_r | default({'groups': []}) }}"
    _sections_supported_fragment: ['network']
    _sections_collected_fragment: "{{ ['network'] if (_l_net_raw_ok | default(false) | bool) else [] }}"
    _sections_failed_fragment:    "{{ [] if (_l_net_raw_ok | default(false) | bool) else ['network'] }}"
    # N12: 섹션이 failed 가 되는 바로 그 조건에서 errors 1건. LOW-9/H4: lspci stderr 가 비어있지 않으면
    # 권한 부족/partial enumeration 의심 경고 1건 (섹션은 success 유지 — 시나리오 B).
    _errors_fragment: "{{ ([] if (_l_net_raw_ok | default(false) | bool) else [{'section':'network','message':'네트워크 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('source=ip,sysfs,resolv_conf; cause=no_interface_and_no_dns; rc=' ~ (_l_net_raw.rc | default('none')))}]) + ([{'section':'network','message':'네트워크 카드 상세 정보 중 일부를 수집하지 못했습니다. 수집 계정의 권한을 확인하세요.','detail':('source=lspci; stderr=' ~ ((_l_net_raw.stderr | default('') | replace('\n', ' ') | trim | truncate(500, true)) or 'none'))}] if (('lspci' in (_l_net_raw.stderr | default(''))) and (_l_net_raw_ok | default(false) | bool)) else []) }}"
  no_log: true

