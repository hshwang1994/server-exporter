---
# os-gather/tasks/linux/gather_storage.yml
# lsblk(물리 디스크) + df(파일시스템) + lspci(컨트롤러) → data.storage fragment
#
# 2026-09-03 (OS/ESXi 전수 검수 후속 — B-12/17/18/22):
#   - Python / raw 두 경로가 **같은 raw 명령 + 같은 판정식**을 쓴다. 종전에는 python 경로가
#     ansible_mounts(used = total - available, tmpfs/overlay 포함) 를, raw 경로가 df(Used 컬럼,
#     /dev/ 만) 를 써서 같은 서버의 used_mb 가 예약 블록만큼(1 TB ext4 ≈ 50 GB) 달랐다.
#     이제 두 경로 모두 `df -P -T -k` — used_mb = df Used, usage_percent = df Use%.
#   - filesystems 채택 기준: 장치가 /dev/ 로 시작(단 /dev/loop 제외) 하거나 루트(/) 이거나
#     네트워크/클러스터 파일시스템(nfs/nfs4/cifs/smbfs/zfs/btrfs/gfs2/ocfs2/glusterfs/lustre).
#     tmpfs/devtmpfs/squashfs/overlay 는 자산 인벤토리 대상이 아니라 제외.
#   - media_type: lsblk ROTA 가 null 이면 null (종전: default('1') 가 null 을 못 잡아 SSD 로 단정).
#   - controllers[].controller_manufacturer: lspci -mm 의 vendor (종전 하드코딩 null).
#   - 값을 못 구하면 null. 섹션 status 는 실제 결과로.
#
# 2026-10-03 (Phase 2 C2 — lsblk 실패 은폐 제거):
#   - LSBLK_RC / LSBLK_ERR / SYS_BLOCK_COUNT marker, rc != 0 이면 구형 fallback 1회 (LSBLK_TXT|).
#   - JSON 손상은 block/rescue 로 흡수 (호스트 수집 계속), lsblk 이상은 errors[] 1건 (detail 에 state).
#   - df 는 timeout 20 으로 감싼다 (-l 은 쓰지 않는다 — NFS 포함). multipath 처리는 변경 없음 (보류).

- name: "linux | storage | raw gather (lsblk/udevadm/findmnt/lspci/df)"
  timeout: "{{ _os_task_timeout | default(120) }}"   # Plan §6-3 task-level hang 격리 (2026-10-03)
  ansible.builtin.raw: |
    export LANG=C LC_ALL=C
    # --- physical disks (JSON) ---
    # 2026-10-03 (C2): lsblk 실패를 빈 JSON 으로 가리지 않는다. 종료 코드와 stderr 첫 줄을
    #   LSBLK_RC / LSBLK_ERR 로 남긴다 (명령이 없으면 127). JSON 은 변수로 받아 줄 끝을 보장한다.
    #   stderr 는 mktemp 파일로만 받는다 (mktemp 가 없으면 버린다 — 예측 가능한 /tmp 경로는 쓰지 않는다).
    lsblk_rc=127; lsblk_err=""; lsblk_json=""
    if command -v lsblk >/dev/null 2>&1; then
      lsblk_ef=$(mktemp 2>/dev/null) || lsblk_ef=""
      lsblk_json=$(lsblk -J -b -d -o NAME,SIZE,TYPE,ROTA,MODEL,TRAN,SERIAL,WWN 2>"${lsblk_ef:-/dev/null}")
      lsblk_rc=$?
      if [ -n "$lsblk_ef" ]; then
        lsblk_err=$(head -n 1 "$lsblk_ef" 2>/dev/null | tr -d '|\r')
        rm -f "$lsblk_ef"
      fi
    fi
    echo "LSBLK_BEGIN"
    [ -n "$lsblk_json" ] && printf '%s\n' "$lsblk_json"
    echo "LSBLK_END"
    echo "LSBLK_RC=$lsblk_rc"
    echo "LSBLK_ERR=$lsblk_err"
    # 구형 util-linux (-J / TRAN / WWN 미지원) 용 1회 fallback — 오래된 판에도 있는 열만 쓴다.
    #   LSBLK_TXT|name|size(bytes)|type|rota|model  (model 은 공백을 품을 수 있어 5번째 열 이후 전부)
    if [ "$lsblk_rc" -ne 0 ] && [ "$lsblk_rc" -ne 127 ]; then
      lsblk -b -d -n -o NAME,SIZE,TYPE,ROTA,MODEL 2>/dev/null | awk '{
        m = ""; for (i = 5; i <= NF; i++) m = m (i > 5 ? " " : "") $i;
        gsub(/[|]/, "_", m);
        printf "LSBLK_TXT|%s|%s|%s|%s|%s\n", $1, $2, $3, $4, m
      }'
    fi
    # 완전성 근거: /sys/block 항목 수 (loop / ram 제외) — lsblk 의 disk 수와 견줄 수 있게 detail 에만 쓴다.
    if [ -d /sys/block ]; then
      n=0
      for b in /sys/block/*; do
        [ -e "$b" ] || continue
        case "${b##*/}" in loop*|ram*) continue ;; esac
        n=$((n + 1))
      done
      echo "SYS_BLOCK_COUNT=$n"
    else
      echo "SYS_BLOCK_COUNT="
    fi
    # serial/wwn 보강 (2026-06-22): lsblk 값이 비는 경우(virtio) / Ubuntu 20.04 SERIAL↔WWN 혼동 버그
    #   (Launchpad #1950793) / RAID short-WWN 대비, udev 원천(ID_SERIAL_SHORT/ID_WWN)을 직접 조회.
    for d in $(lsblk -dn -o NAME 2>/dev/null); do
      p=$(udevadm info --query=property --name="/dev/$d" 2>/dev/null)
      s=$(printf '%s\n' "$p" | sed -n 's/^ID_SERIAL_SHORT=//p' | head -1)
      w=$(printf '%s\n' "$p" | sed -n 's/^ID_WWN=//p' | head -1)
      echo "UDEV|/dev/$d|$s|$w"
    done
    # is_os_disk (2026-07-02): OS 루트(/) 가 올라간 물리 디스크 — findmnt → lsblk -s 역추적.
    #   -l(list) + awk 글리프 strip. btrfs SOURCE 의 [/@subvol] 접미사 strip. 0건 → 판정불가(null).
    src=$(findmnt -n -o SOURCE / 2>/dev/null)
    if [ -z "$src" ]; then src=$(awk '$2=="/"{print $1; exit}' /proc/mounts 2>/dev/null); fi
    src=${src%%\[*}
    if [ -n "$src" ]; then
      rsrc=$(readlink -f "$src" 2>/dev/null || echo "$src")
      lsblk -s -l -n -o NAME,TYPE "$rsrc" 2>/dev/null | awk '$2=="disk"{n=$1; sub(/^[^A-Za-z0-9]+/,"",n); print "OSDISK|/dev/"n}'
    fi
    # --- storage controllers: lspci -mm (vendor/device 분리) + -k (driver) ---
    #   CTRL|<pci>|<class>|<vendor>|<device>|<driver>|<subsystem vendor>|<subsystem device>
    if command -v lspci >/dev/null 2>&1; then
      lspci -Dmm 2>/dev/null | awk -F'"' '
        $2 ~ /RAID bus controller|SATA controller|SAS controller|Serial Attached SCSI|Non-Volatile memory controller|SCSI storage controller|Mass storage controller/ {
          slot=$1; gsub(/ /,"",slot);
          printf "CTRL|%s|%s|%s|%s|", slot, $2, $4, $6;
          cmd = "lspci -ks " slot " 2>/dev/null";
          drv="";
          while ((cmd | getline line) > 0) { if (line ~ /Kernel driver in use:/) { n=split(line, a, ":"); drv=a[n]; gsub(/^ +| +$/,"",drv) } }
          close(cmd);
          printf "%s|%s|%s\n", drv, $8, $10
        }'
    fi
    # --- filesystems (df) — NFS/cifs idle mount 는 '-' 를 출력 → 숫자만 남긴다 ---
    #   2026-10-03 (C2): 응답 없는 네트워크 마운트에서 df 가 멈추지 않게, timeout 이 있고
    #   'timeout 초 명령' 형식을 받으면(구형 busybox 는 -t 형식) 20초로 감싼다.
    #   -l(로컬만)은 쓰지 않는다 — NFS 등 네트워크 파일시스템도 수집 대상이다.
    if command -v timeout >/dev/null 2>&1 && timeout 20 true >/dev/null 2>&1; then
      timeout 20 df -P -T -k 2>/dev/null
    else
      df -P -T -k 2>/dev/null
    fi | tail -n +2 | awk '{
      gsub(/[^0-9]/,"",$3); gsub(/[^0-9]/,"",$4); gsub(/[^0-9]/,"",$5);
      total=int($3/1024); used=int($4/1024); avail=int($5/1024);
      pct=$6; gsub(/%/,"",pct); gsub(/[^0-9]/,"",pct);
      printf "FS=%s|%s|%s|%d|%d|%d|%s\n", $1, $7, $2, total, used, avail, pct
    }'
  register: _l_stor_raw
  changed_when: false
  failed_when: false
  no_log: true

# 2026-10-03 (C2): lsblk JSON 해석을 별도 block 으로 뺐다. JSON 이 깨져 있으면(잘린 출력 등)
#   from_json 이 예외를 내고, 종전에는 그 예외가 set_fact 를 실패시켜 linux 블록 전체가 rescue 로
#   빠졌다 (정상 수집한 다른 섹션까지 status=failed). 이제 rescue 가 빈 문서 + 실패 표시만 남긴다.
#   LSBLK_RC 가 0 이 아니면 JSON 을 읽지 않는다 (구형 fallback 줄을 쓴다). marker 가 없는 출력은
#   종전처럼 JSON 만 본다.
- name: "linux | storage | parse lsblk json"
  block:
    - name: "linux | storage | parse lsblk json (from_json)"
      ansible.builtin.set_fact:
        _l_lsblk_doc: >-
          {%- set ns = namespace(in_json=false, json_lines=[], rc='') -%}
          {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
            {%- if line | trim == 'LSBLK_BEGIN' -%}{%- set ns.in_json = true -%}
            {%- elif line | trim == 'LSBLK_END' -%}{%- set ns.in_json = false -%}
            {%- elif ns.in_json -%}{%- set _ = ns.json_lines.append(line) -%}
            {%- elif line.startswith('LSBLK_RC=') -%}{%- set ns.rc = line[9:] | trim -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set raw_json = ns.json_lines | join('\n') -%}
          {{ (raw_json | from_json) if (ns.rc in ['', '0'] and (raw_json | trim | length) > 0) else {} }}
        _l_lsblk_json_failed: false
      no_log: true
  rescue:
    - name: "linux | storage | lsblk json malformed (호스트 수집은 계속)"
      ansible.builtin.set_fact:
        _l_lsblk_doc: {}
        _l_lsblk_json_failed: true
      no_log: true

# Round 16: lsblk 가 virtio/일부 가상 disk 에 "model": null 방출 → truthy 체크로 None/''/undefined 를 none 으로.
# 2026-10-03 (C2): JSON 장치가 없으면 구형 util-linux 용 LSBLK_TXT 줄로 만든다. serial / wwn 은
#   JSON 경로와 같은 udev 보강값(있을 때만), protocol 은 TRAN 열이 없어 null.
- name: "linux | storage | normalize physical disks"
  ansible.builtin.set_fact:
    _l_norm_physical_disks: >-
      {%- set out = [] -%}
      {%- set doc = _l_lsblk_doc | default({}) -%}
      {%- set devs = doc.blockdevices if (doc is mapping and doc.blockdevices is defined and doc.blockdevices is sequence and doc.blockdevices is not string and doc.blockdevices is not mapping) else [] -%}
      {%- set udev = {} -%}
      {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('UDEV|') -%}
          {%- set p = line.split('|') -%}
          {%- if p | length >= 4 -%}
            {%- set _ = udev.update({p[1]: {'serial': (p[2] | trim) or none, 'wwn': (p[3] | trim) or none}}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set osdisks = [] -%}
      {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('OSDISK|') -%}{%- set _ = osdisks.append(line.split('|')[1] | trim) -%}{%- endif -%}
      {%- endfor -%}
      {%- set os_known = (osdisks | length) > 0 -%}
      {%- if (devs | length) > 0 -%}
        {%- for dev in devs -%}
          {%- if (dev.type | default('')) in ['disk'] and ((dev.size | default(0)) | int) > 0 -%}
            {%- set _dev_path = '/dev/' ~ dev.name -%}
            {%- set _tran = (dev.tran | default('') | string | lower) -%}
            {%- set _proto = none -%}
            {%- if _tran == 'sata' -%}{%- set _proto = 'SATA' -%}
            {%- elif _tran == 'sas' -%}{%- set _proto = 'SAS' -%}
            {%- elif _tran == 'nvme' -%}{%- set _proto = 'NVMe' -%}
            {%- elif _tran == 'usb' -%}{%- set _proto = 'USB' -%}
            {%- elif _tran == 'fc' -%}{%- set _proto = 'FibreChannel' -%}
            {%- elif _tran == 'iscsi' -%}{%- set _proto = 'iSCSI' -%}
            {%- endif -%}
            {# ROTA: 1/true=HDD, 0/false=SSD, null=미제공(null) — 근거 없이 SSD 로 단정하지 않는다 #}
            {%- set _rota = dev.rota | default(none) -%}
            {%- set _media = none -%}
            {%- if _rota is not none -%}
              {%- set _media = 'HDD' if ((_rota | string | lower) in ['1', 'true']) else 'SSD' -%}
            {%- endif -%}
            {%- set _u = udev.get(_dev_path, {}) -%}
            {%- set _serial = (dev.serial | trim) if dev.serial else (_u.serial | default(none)) -%}
            {%- set _wwn = (dev.wwn | trim) if dev.wwn else (_u.wwn | default(none)) -%}
            {%- set _ = out.append({
              'id':         _dev_path,
              'device':     _dev_path,
              'model':      (dev.model | trim) if dev.model else none,
              'serial':     _serial,
              'wwn':        _wwn,
              'total_mb':   ((dev.size | int) / 1048576) | round(0, 'floor') | int,
              'media_type': _media,
              'protocol':   _proto,
              'health':     none,
              'is_os_disk': (_dev_path in osdisks) if os_known else none
            }) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- else -%}
        {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
          {%- if line.startswith('LSBLK_TXT|') -%}
            {%- set p = line.split('|') -%}
            {%- set _size = (p[2] | default('')) | trim -%}
            {%- if (p | length) >= 6 and (p[3] | trim) == 'disk' and _size.isdigit() and (_size | int) > 0 -%}
              {%- set _dev_path = '/dev/' ~ (p[1] | trim) -%}
              {%- set _rota = (p[4] | trim) | lower -%}
              {%- set _u = udev.get(_dev_path, {}) -%}
              {%- set _ = out.append({
                'id':         _dev_path,
                'device':     _dev_path,
                'model':      (p[5] | trim) or none,
                'serial':     _u.serial | default(none),
                'wwn':        _u.wwn | default(none),
                'total_mb':   ((_size | int) / 1048576) | round(0, 'floor') | int,
                'media_type': (('HDD' if _rota in ['1', 'true'] else 'SSD') if _rota in ['0', '1', 'true', 'false'] else none),
                'protocol':   none,
                'health':     none,
                'is_os_disk': (_dev_path in osdisks) if os_known else none
              }) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ out }}
  no_log: true

# 2026-10-03 (C2): lsblk 결과 분류 — errors[] 판정과 detail 근거.
#   state: ok / empty (오류 아님) | unknown (127 미설치 또는 그 밖의 rc) / unsupported (구형 옵션·열)
#          / permission / malformed (rc 0 인데 JSON 이 아니거나 blockdevices 목록이 없음)
#   값은 dict 로 둔다 (문자열 fact 는 엔진에 따라 숫자로 바뀔 수 있다).
- name: "linux | storage | classify lsblk result"
  ansible.builtin.set_fact:
    _l_lsblk_info: >-
      {%- set ns = namespace(rc='', err='', sysb='') -%}
      {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('LSBLK_RC=') -%}{%- set ns.rc = line[9:] | trim -%}
        {%- elif line.startswith('LSBLK_ERR=') -%}{%- set ns.err = line[10:] | trim -%}
        {%- elif line.startswith('SYS_BLOCK_COUNT=') -%}{%- set ns.sysb = line[16:] | trim -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set doc = _l_lsblk_doc | default({}) -%}
      {%- set has_list = doc is mapping and doc.blockdevices is defined and doc.blockdevices is sequence and doc.blockdevices is not string and doc.blockdevices is not mapping -%}
      {%- set err_l = ns.err | lower -%}
      {%- if ns.rc == '127' -%}{%- set state = 'unknown' -%}
      {%- elif ns.rc not in ['', '0'] -%}
        {%- if ('invalid option' in err_l) or ('unrecognized option' in err_l) or ('unknown column' in err_l) -%}{%- set state = 'unsupported' -%}
        {%- elif 'permission denied' in err_l -%}{%- set state = 'permission' -%}
        {%- else -%}{%- set state = 'unknown' -%}
        {%- endif -%}
      {%- elif _l_lsblk_json_failed | default(false) | bool -%}{%- set state = 'malformed' -%}
      {%- elif not has_list -%}{%- set state = 'malformed' if ns.rc == '0' else 'unknown' -%}
      {%- elif (doc.blockdevices | length) == 0 -%}{%- set state = 'empty' -%}
      {%- else -%}{%- set state = 'ok' -%}
      {%- endif -%}
      {{ {'rc': ns.rc or 'none', 'err': ns.err[:200] or 'none', 'sys_block': ns.sysb or 'unknown', 'state': state} }}
  no_log: true

- name: "linux | storage | normalize filesystems"
  ansible.builtin.set_fact:
    _l_norm_filesystems: >-
      {%- set net_fs = ['nfs', 'nfs4', 'cifs', 'smbfs', 'zfs', 'gfs2', 'ocfs2', 'glusterfs', 'fuse.glusterfs', 'lustre', 'ceph'] -%}
      {%- set out = [] -%}
      {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('FS=') -%}
          {%- set parts = line[3:].split('|') -%}
          {%- if parts | length >= 7 -%}
            {%- set dev = parts[0] | trim -%}
            {%- set mnt = parts[1] | trim -%}
            {%- set fs = parts[2] | trim -%}
            {%- set is_real_dev = dev.startswith('/dev/') and not dev.startswith('/dev/loop') -%}
            {%- if is_real_dev or mnt == '/' or (fs | lower) in net_fs -%}
              {%- set total = (parts[3] | trim) -%}
              {%- set used  = (parts[4] | trim) -%}
              {%- set avail = (parts[5] | trim) -%}
              {%- set pct   = (parts[6] | trim) -%}
              {%- set _ = out.append({
                'device':        dev,
                'mount_point':   mnt,
                'filesystem':    fs,
                'total_mb':      (total | int) if total.isdigit() else none,
                'used_mb':       (used | int) if used.isdigit() else none,
                'available_mb':  (avail | int) if avail.isdigit() else none,
                'usage_percent': (pct | float) if pct.isdigit() else none,
                'status':        'mounted'
              }) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

# cycle-016 (2026-04-29): storage.summary group 산출 (namespace 사용 — Jinja2 loop scoping fix)
- name: "linux | storage | compute summary groups"
  ansible.builtin.set_fact:
    _l_stor_summary: >-
      {%- set ns = namespace(groups=[], seen={}, total=0) -%}
      {%- for d in (_l_norm_physical_disks | default([])) -%}
        {%- set cap_gb = ((d.total_mb | default(0)) | int / 1024) | round(0, 'floor') | int -%}
        {%- if cap_gb > 0 -%}
          {%- set mt = d.media_type | default(none) -%}
          {%- set pr = d.protocol | default(none) -%}
          {%- set md = d.model | default(none) -%}
          {%- set key = (cap_gb|string)~'|'~(mt|string)~'|'~(pr|string)~'|'~(md|string) -%}
          {%- if key in ns.seen -%}
            {%- set idx = ns.seen[key] -%}
            {%- set q = ns.groups[idx].quantity + 1 -%}
            {%- set _ = ns.groups[idx].update({'quantity': q, 'group_total_gb': q * cap_gb}) -%}
          {%- else -%}
            {%- set _ = ns.seen.update({key: ns.groups | length}) -%}
            {%- set _ = ns.groups.append({'unit_capacity_gb': cap_gb, 'model': md, 'media_type': mt, 'protocol': pr, 'quantity': 1, 'group_total_gb': cap_gb}) -%}
          {%- endif -%}
          {%- set ns.total = ns.total + cap_gb -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'groups': ns.groups, 'grand_total_gb': ns.total} }}
  no_log: true

# 2026-06-22 T1: CTRL| 라인 → controllers[] (ESXi/Redfish 와 동일 shape)
- name: "linux | storage | normalize controllers"
  ansible.builtin.set_fact:
    _l_norm_controllers: >-
      {%- set out = [] -%}
      {%- for line in (_l_stor_raw.stdout_lines | default([])) -%}
        {%- if line.startswith('CTRL|') -%}
          {%- set p = line.split('|') -%}
          {%- if p | length >= 6 -%}
            {%- set cl = (p[2] | default('')) | lower -%}
            {%- set ct = 'RAID' if 'raid' in cl else ('NVMe' if 'non-volatile' in cl else ('SAS' if ('sas' in cl or 'serial attached' in cl) else ('SATA' if 'sata' in cl else ('SCSI' if 'scsi' in cl else none)))) -%}
            {%- set vendor = (p[3] | trim) or none -%}
            {%- set device = (p[4] | trim) or none -%}
            {%- set subsys_dev = (p[7] | trim) if (p | length >= 8) else '' -%}
            {%- set _ = out.append({
              'id': p[1],
              'name': subsys_dev if subsys_dev else device,
              'controller_model': device,
              'controller_manufacturer': vendor,
              'driver': (p[5] | trim) or none,
              'controller_type': ct,
              'pci': p[1],
              'health': none,
              'drives': []
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "linux | storage | build fragment"
  ansible.builtin.set_fact:
    _l_stor_ok: >-
      {{ ((_l_norm_physical_disks | default([])) | length > 0)
         or ((_l_norm_filesystems | default([])) | length > 0) }}
    _data_fragment:
      storage:
        filesystems:     "{{ _l_norm_filesystems | default([]) }}"
        physical_disks:  "{{ _l_norm_physical_disks | default([]) }}"
        datastores:      []
        controllers:     "{{ _l_norm_controllers | default([]) }}"
        logical_volumes: []
        summary:         "{{ _l_stor_summary | default({'groups': [], 'grand_total_gb': 0}) }}"
    _sections_supported_fragment: ['storage']
    _sections_collected_fragment: "{{ ['storage'] if (((_l_norm_physical_disks | default([])) | length > 0) or ((_l_norm_filesystems | default([])) | length > 0)) else [] }}"
    _sections_failed_fragment:    "{{ [] if (((_l_norm_physical_disks | default([])) | length > 0) or ((_l_norm_filesystems | default([])) | length > 0)) else ['storage'] }}"
    # 2026-10-03 (C2): lsblk 이상(미설치 / 구형 / 권한 / JSON 손상)은 섹션 결과와 별개로 1건 남긴다.
    #   파일시스템만 수집돼도 섹션은 success (섹션 기준 판정) + 이 1건 — 문서화된 "success + errors".
    #   섹션 자체가 비면 기존 문장 1건만 내고 lsblk 근거는 그 detail 에 합친다 (같은 사건 2건 금지).
    _errors_fragment: >-
      {%- set disks = _l_norm_physical_disks | default([]) -%}
      {%- set fss = _l_norm_filesystems | default([]) -%}
      {%- set info = _l_lsblk_info | default({}) -%}
      {%- set state = info.state | default('unknown') -%}
      {%- set lsblk_bad = state in ['unknown', 'unsupported', 'permission', 'malformed'] -%}
      {%- set lsblk_detail = 'lsblk_rc=' ~ (info.rc | default('none')) ~ '; state=' ~ state ~ '; disks=' ~ (disks | length) ~ '; sys_block=' ~ (info.sys_block | default('unknown')) ~ '; stderr=' ~ (info.err | default('none')) -%}
      {%- if (disks | length) == 0 and (fss | length) == 0 -%}{{ [{'section':'storage','message':'스토리지 정보 수집에 실패했습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('source=lsblk,df; cause=no_output; rc=' ~ (_l_stor_raw.rc | default('none')) ~ (('; ' ~ lsblk_detail) if lsblk_bad else ''))}] }}
      {%- elif lsblk_bad and state == 'permission' -%}{{ [{'section':'storage','message':'물리 디스크 정보 수집에 실패한 항목이 있습니다. 수집 계정의 권한을 확인하세요.','detail':('source=lsblk; ' ~ lsblk_detail)}] }}
      {%- elif lsblk_bad -%}{{ [{'section':'storage','message':'물리 디스크 정보 수집에 실패한 항목이 있습니다. 대상 상태와 수집 로그를 확인하세요.','detail':('source=lsblk; ' ~ lsblk_detail)}] }}
      {%- else -%}{{ [] }}
      {%- endif -%}
  no_log: true

