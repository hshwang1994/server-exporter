---
# os-gather/tasks/linux/preflight.yml
#
# Linux 호스트 사전 점검 — Python 버전 감지 + 명령 존재 확인
# 모든 태스크는 ansible.builtin.raw 사용 (Python 불필요)
#
# 출력 변수:
#   _l_python_mode    : str  — 'python_ok' | 'python_missing' | 'python_incompatible' | 'raw_forced'
#   _l_python_version : str  — Python 버전 문자열 (예: '3.9.16', 없으면 '')
#   _l_python         : str  — setup 모듈이 사용할 Python 경로 (backward compat)

- name: "linux | preflight | detect python + commands"
  ansible.builtin.raw: |
    py_path="none"
    py_ver=""
    for cmd in python3 python; do
      p=$(command -v "$cmd" 2>/dev/null) && py_path="$p" && break
    done
    if [ "$py_path" != "none" ]; then
      py_ver=$("$py_path" --version 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      [ -z "$py_ver" ] && py_ver="0.0.0"
    fi
    echo "PY_PATH=$py_path"
    echo "PY_VER=$py_ver"
    echo "HAS_LSBLK=$(command -v lsblk >/dev/null 2>&1 && echo 1 || echo 0)"
    echo "HAS_DMIDECODE=$(command -v dmidecode >/dev/null 2>&1 && echo 1 || echo 0)"
    echo "HAS_LAST=$(command -v last >/dev/null 2>&1 && echo 1 || echo 0)"
    echo "HAS_LASTLOG=$(command -v lastlog >/dev/null 2>&1 && echo 1 || echo 0)"
    echo "HAS_LSCPU=$(command -v lscpu >/dev/null 2>&1 && echo 1 || echo 0)"
    echo "HAS_IP=$(command -v ip >/dev/null 2>&1 && echo 1 || echo 0)"
    echo "OS_NAME=$( . /etc/os-release 2>/dev/null; echo "$NAME" )"
    # 잠금 정책 (2026-10-13, 권한 상승 비밀번호 후보의 거부 예산 — 비특권으로 읽을 수 있는 파일만 본다. 못 읽으면 값이 비어 보수적 예산으로 간다)
    pamfiles=""
    for f in /etc/pam.d/sudo /etc/pam.d/system-auth /etc/pam.d/password-auth /etc/pam.d/common-auth; do
      [ -r "$f" ] && pamfiles="$pamfiles $f"
    done
    echo "LOCK_PAM_FILES=$(echo $pamfiles | wc -w)"
    lockmod=""
    [ -n "$pamfiles" ] && lockmod=$(grep -hE '^[^#]*pam_(faillock|tally2)\.so' $pamfiles 2>/dev/null | head -5)
    echo "LOCK_MODULE=$( [ -n "$lockmod" ] && echo 1 || echo 0 )"
    echo "LOCK_DENY_INLINE=$(printf '%s\n' "$lockmod" | grep -oE 'deny=[0-9]+' | head -1 | cut -d= -f2)"
    echo "LOCK_ROOT_INLINE=$(printf '%s\n' "$lockmod" | grep -q 'even_deny_root' && echo 1 || echo 0)"
    echo "LOCK_UNLOCK_INLINE=$(printf '%s\n' "$lockmod" | grep -oE 'unlock_time=[0-9]+' | head -1 | cut -d= -f2)"
    if [ -r /etc/security/faillock.conf ]; then
      echo "LOCK_CONF=1"
      echo "LOCK_DENY_CONF=$(grep -E '^[[:space:]]*deny[[:space:]]*=' /etc/security/faillock.conf | tail -1 | cut -d= -f2 | tr -d ' \t')"
      echo "LOCK_ROOT_CONF=$(grep -qE '^[[:space:]]*even_deny_root' /etc/security/faillock.conf && echo 1 || echo 0)"
      echo "LOCK_UNLOCK_CONF=$(grep -E '^[[:space:]]*unlock_time[[:space:]]*=' /etc/security/faillock.conf | tail -1 | cut -d= -f2 | tr -d ' \t')"
      echo "LOCK_INTERVAL_CONF=$(grep -E '^[[:space:]]*fail_interval[[:space:]]*=' /etc/security/faillock.conf | tail -1 | cut -d= -f2 | tr -d ' \t')"
    else
      echo "LOCK_CONF=0"
    fi
  register: _l_preflight_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "linux | preflight | parse results"
  ansible.builtin.set_fact:
    _l_pf: >-
      {{ dict(_l_preflight_raw.stdout_lines | default([])
              | select('search', '=')
              | map('split', '=', 1)
              | list) }}
  no_log: true

- name: "linux | preflight | set python mode + command flags"
  ansible.builtin.set_fact:
    _l_python_version: "{{ (_l_pf.PY_VER  | default(''))     | trim }}"
    _l_python_mode: >-
      {%- set force_raw = lookup('env', 'SE_FORCE_LINUX_RAW_FALLBACK') | default('') | lower -%}
      {%- set py_path   = (_l_pf.PY_PATH | default('none')) | trim -%}
      {%- set py_ver    = (_l_pf.PY_VER  | default(''))     | trim -%}
      {%- if force_raw in ['1', 'true', 'yes'] -%}raw_forced
      {%- elif py_path == 'none' or py_ver == '' -%}python_missing
      {%- elif py_ver is version('3.9', '>=') -%}python_ok
      {%- else -%}python_incompatible
      {%- endif -%}
    # backward compat — setup 모듈의 ansible_python_interpreter 용
    _l_python: "{{ (_l_pf.PY_PATH | default('python3')) | trim }}"
    # 2026-06-22 fix: adapter 선택용 distribution (os-release NAME — raw-safe, gather_system 전에 필요).
    #   ansible_distribution 은 이 시점 미정의 + "RedHat"(공백X) 형식이라 패턴("Red Hat") 불일치 → os-release NAME 사용.
    _l_distro_name: "{{ (_l_pf.OS_NAME | default('')) | trim }}"
    # 명령 존재 플래그
  no_log: true

# 잠금 방지 예산 (2026-10-13) — sudo 비밀번호 후보가 거부될 수 있는 횟수. 이 횟수의 거부에 닿으면 try_sudo.yml 이 멈춘다.
#   사용자 카운터는 로그인 비밀번호(방금 SSH 를 통과한 값)로는 올라가지 않으므로, 예산은 "root 가 잠길 수 있는가" 와 deny 로 정한다:
#     잠금 모듈(pam_faillock / pam_tally2) 없음 → 3 · 있지만 even_deny_root 없음(root 는 잠기지 않음) → 3
#     even_deny_root 있음 → max(1, min(3, deny - 2)) (직전 수집 1회 여유), unlock_time=0(영구)이면 1 더 줄임(최소 1)
#     pam 파일을 하나도 읽지 못함 → 1 (가장 보수적)
#   deny 는 pam 줄 inline 값 우선, 없으면 faillock.conf, 둘 다 없으면 faillock 기본 3.
- name: "linux | preflight | sudo lockout policy"
  ansible.builtin.set_fact:
    _l_sudo_policy:
      pam_files:      "{{ (_l_pf.LOCK_PAM_FILES | default('0')) | trim | int }}"
      lock_module:    "{{ ((_l_pf.LOCK_MODULE | default('0')) | trim) == '1' }}"
      deny: >-
        {%- set i = (_l_pf.LOCK_DENY_INLINE | default('')) | trim -%}
        {%- set c = (_l_pf.LOCK_DENY_CONF | default('')) | trim -%}
        {{ (i | int) if i.isdigit() else ((c | int) if c.isdigit() else 3) }}
      even_deny_root: "{{ (((_l_pf.LOCK_ROOT_INLINE | default('0')) | trim) == '1') or (((_l_pf.LOCK_ROOT_CONF | default('0')) | trim) == '1') }}"
      unlock_time: >-
        {%- set i = (_l_pf.LOCK_UNLOCK_INLINE | default('')) | trim -%}
        {%- set c = (_l_pf.LOCK_UNLOCK_CONF | default('')) | trim -%}
        {{ (i | int) if i.isdigit() else ((c | int) if c.isdigit() else none) }}
      fail_interval: >-
        {%- set c = (_l_pf.LOCK_INTERVAL_CONF | default('')) | trim -%}
        {{ (c | int) if c.isdigit() else none }}
  no_log: true

- name: "linux | preflight | sudo max rejections"
  ansible.builtin.set_fact:
    _l_sudo_max_rejections: >-
      {%- set pol = _l_sudo_policy | default({}) -%}
      {%- set files = (pol.pam_files | default(0)) | int -%}
      {%- set deny = (pol.deny | default(3)) | int -%}
      {%- set unlock = pol.unlock_time | default(none) -%}
      {%- if files == 0 -%}
        {{ 1 }}
      {%- elif not (pol.lock_module | default(false) | bool) -%}
        {{ 3 }}
      {%- elif not (pol.even_deny_root | default(false) | bool) -%}
        {{ 3 }}
      {%- else -%}
        {%- set base = [1, [3, deny - 2] | min] | max -%}
        {{ ([1, base - 1] | max) if (unlock is not none and (unlock | int) == 0) else base }}
      {%- endif -%}
  no_log: true
