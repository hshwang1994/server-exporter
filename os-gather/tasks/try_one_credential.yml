---

- when:
    - not (_os_auth_ok | default(false) | bool)
    - not (_os_cred_stopped | default(false) | bool)
  block:

    - name: "os | try_one_credential | count attempt"
      ansible.builtin.set_fact:
        _os_cred_tries: "{{ (_os_cred_tries | default(0) | int) + 1 }}"
      no_log: true

    - name: "os | try_one_credential | apply candidate to hostvars"
      ansible.builtin.set_fact:
        ansible_user:        "{{ _try_cred.username | default('') }}"
        ansible_password:    "{{ _try_cred.password | default('') }}"
        ansible_become_pass: "{{ (_cred_become_password | string) if (_os_type == 'linux' and _cred_become_password is defined and _cred_become_password is not none and (_cred_become_password | string | length) > 0) else (_try_cred.password | default('')) }}"
      no_log: true

    - name: "os | try_one_credential | reset connection"
      ansible.builtin.meta: reset_connection

    - name: "os | try_one_credential | linux ssh probe"
      when: _os_type == 'linux'
      ansible.builtin.raw: "echo __auth_ok__"
      register: _os_probe_linux
      failed_when: false
      changed_when: false
      ignore_unreachable: true
      no_log: true

    - name: "os | try_one_credential | windows winrm probe"
      when: _os_type == 'windows'
      ansible.windows.win_ping:
      register: _os_probe_windows
      failed_when: false
      ignore_unreachable: true
      no_log: true

    - name: "os | try_one_credential | evaluate"
      ansible.builtin.set_fact:
        _os_probe_ok: >-
          {{ (_os_type == 'linux'
              and (_os_probe_linux is defined)
              and ((_os_probe_linux.rc | default(1)) == 0)
              and ('__auth_ok__' in (_os_probe_linux.stdout | default('')))
             )
             or
             (_os_type == 'windows'
              and (_os_probe_windows is defined)
              and (_os_probe_windows.ping | default('') == 'pong')
             ) }}
      no_log: true

    - name: "os | try_one_credential | promote on success"
      when: _os_probe_ok | bool
      ansible.builtin.set_fact:
        _os_auth_ok: true
        _os_used_account:
          username: "{{ _try_cred.username }}"
          label:    "{{ _try_cred.label    | default('unlabeled') }}"
          role:     "{{ _try_cred.role     | default('primary') }}"
      no_log: true

    - name: "os | try_one_credential | recheck management port after failure"
      when: not (_os_probe_ok | bool)
      ansible.builtin.wait_for:
        host:    "{{ ansible_host | default(inventory_hostname) }}"
        port:    "{{ (ansible_port | default(22 if _os_type == 'linux' else 5985)) | int }}"
        timeout: "{{ _cred_port_recheck_timeout | default(10) | int }}"
        state:   started
      delegate_to: localhost
      register: _os_port_recheck
      failed_when: false
      changed_when: false

    - name: "os | try_one_credential | log failure (advisory)"
      when: not (_os_probe_ok | bool)
      ansible.builtin.debug:
        msg: >-
          {{ _os_type }} auth attempt failed —
          label={{ _try_cred.label | default('unlabeled') }},
          role={{ _try_cred.role   | default('primary') }}

    - name: "os | try_one_credential | stop candidates when the port does not connect"
      when:
        - not (_os_probe_ok | bool)
        - (_os_port_recheck.state | default('')) != 'started'
      ansible.builtin.set_fact:
        _os_cred_stopped: true
