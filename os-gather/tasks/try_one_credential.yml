---
# os-gather/tasks/try_one_credential.yml
#
# P1 (cycle 2026-04-28): 후보 자격증명 1개로 인증 시도. _os_auth_ok=true 면 skip.
#
# 동작:
#   1. set_fact 으로 ansible_user/password 갱신 (host_vars 영구 갱신)
#   2. meta: reset_connection 으로 cached SSH/WinRM 세션 해제
#   3. probe (Linux=raw echo / Windows=win_ping) 로 인증 검증
#   4. 성공 시 _os_auth_ok=true 설정 → 이후 후보 skip
#      실패 시 다음 후보가 새 set_fact 로 host_vars 덮어씀
#
# 입력:
#   _try_cred : { username, password, label, role }
#   _os_type  : 'linux' | 'windows'

# 2026-10-06 (9차): include_tasks 의 loop when 은 반복을 시작하기 전에 한꺼번에 평가된다 — 앞 시도가 켠 중단 표식은 이 block 조건만 본다.
- when:
    - not (_os_auth_ok | default(false) | bool)
    - not (_os_cred_stopped | default(false) | bool)
  block:

    # ── 1. host_vars 영구 갱신 ───────────────────────────────────────────
    # 2026-10-10 (C10): sudo 비밀번호 — Linux 는 Vault 의 별도 become 값(_cred_become_password)이 비어 있지 않으면 그 값을, 없거나 비었으면
    #   지금 고른 로그인 후보의 비밀번호를 쓴다. 종전에는 이 set_fact 가 언제나 로그인 비밀번호로 덮어써(set_fact 가 play var 보다 우선)
    #   별도 sudo 비밀번호가 쓰이지 않았다. 값을 다듬지(trim) 않고, 후보 순서 · 개수 · 인증 정책은 그대로다. Windows 는 종전 그대로다.
    - name: "os | try_one_credential | apply candidate to hostvars"
      ansible.builtin.set_fact:
        ansible_user:        "{{ _try_cred.username | default('') }}"
        ansible_password:    "{{ _try_cred.password | default('') }}"
        ansible_become_pass: "{{ (_cred_become_password | string) if (_os_type == 'linux' and _cred_become_password is defined and _cred_become_password is not none and (_cred_become_password | string | length) > 0) else (_try_cred.password | default('')) }}"
      no_log: true

    # ── 2. cached connection 해제 — 새 자격으로 재인증 강제 ─────────────
    - name: "os | try_one_credential | reset connection"
      ansible.builtin.meta: reset_connection

    # ── 3. probe ─────────────────────────────────────────────────────────
    # ignore_unreachable: SSH 인증 실패는 'failed' 가 아니라 'unreachable' 로 분류됨.
    # failed_when:false 는 unreachable 을 잡지 못해, 누락 시 host 가 block/rescue 를
    # 우회하고 OUTPUT 없이 play 에서 제거됨(빌드 #29 161/165 0 envelope, #26 27/53 host
    # silent drop). ignore_unreachable:true 로 host 를 보존 → evaluate 가 false 처리 →
    # 다음 후보 시도 → 전부 실패 시 site.yml 'abort if all credentials failed' fail →
    # rescue → build_failed_output → 정상 failed envelope.
    - name: "os | try_one_credential | linux ssh probe"
      when: _os_type == 'linux'
      ansible.builtin.raw: "echo __auth_ok__"
      register: _os_probe_linux
      failed_when: false
      changed_when: false
      ignore_unreachable: true
      no_log: true

    - name: "os | try_one_credential | windows winrm probe"
      when: _os_type == 'windows'
      ansible.windows.win_ping:
      register: _os_probe_windows
      failed_when: false
      ignore_unreachable: true
      no_log: true

    # ── 4. 평가 + 승격 ───────────────────────────────────────────────────
    - name: "os | try_one_credential | evaluate"
      ansible.builtin.set_fact:
        _os_probe_ok: >-
          {{ (_os_type == 'linux'
              and (_os_probe_linux is defined)
              and ((_os_probe_linux.rc | default(1)) == 0)
              and ('__auth_ok__' in (_os_probe_linux.stdout | default('')))
             )
             or
             (_os_type == 'windows'
              and (_os_probe_windows is defined)
              and (_os_probe_windows.ping | default('') == 'pong')
             ) }}
      no_log: true

    - name: "os | try_one_credential | promote on success"
      when: _os_probe_ok | bool
      ansible.builtin.set_fact:
        _os_auth_ok: true
        _os_used_account:
          username: "{{ _try_cred.username }}"
          label:    "{{ _try_cred.label    | default('unlabeled') }}"
          role:     "{{ _try_cred.role     | default('primary') }}"
      no_log: true

    # 2026-10-06 (9차 W06): 실패 뒤 고른 관리 포트에 TCP 연결을 1회 다시 확인한다. 연결되지 않으면(대상 측 통신 끊김 · 포트 닫힘)
    #   남은 자격 후보를 보내지 않는다 — 오류 문자열로 거부를 추측하지 않고(CLAUDE.md §8) 관측으로만 가린다. 연결되면(자격 거부일 수
    #   있다) 종전대로 다음 후보로 간다. 결과 문구와 인증 판정은 그대로다(통신 실패는 "원인 미확정").
    - name: "os | try_one_credential | recheck management port after failure"
      when: not (_os_probe_ok | bool)
      ansible.builtin.wait_for:
        host:    "{{ ansible_host | default(inventory_hostname) }}"
        port:    "{{ (ansible_port | default(22 if _os_type == 'linux' else 5985)) | int }}"
        timeout: "{{ _cred_port_recheck_timeout | default(10) | int }}"
        state:   started
      delegate_to: localhost
      register: _os_port_recheck
      failed_when: false
      changed_when: false

    - name: "os | try_one_credential | log failure (advisory)"
      when: not (_os_probe_ok | bool)
      ansible.builtin.debug:
        msg: >-
          {{ _os_type }} auth attempt failed —
          label={{ _try_cred.label | default('unlabeled') }},
          role={{ _try_cred.role   | default('primary') }}

    # 이 표식은 block 조건(위)이 본다 — 켜지는 순간 같은 block 의 남은 태스크도 건너뛰므로 **마지막** 태스크로 둔다
    #   (실패 근거 기록 · 로그 · 간격이 먼저 끝나야 한다).
    - name: "os | try_one_credential | stop candidates when the port does not connect"
      when:
        - not (_os_probe_ok | bool)
        - (_os_port_recheck.state | default('')) != 'started'
      ansible.builtin.set_fact:
        _os_cred_stopped: true
