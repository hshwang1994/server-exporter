---
# =============================================================================
# os-gather / site.yml  — orchestration 전용
#
# 입력:
#   INVENTORY_JSON = [{"ip": "10.x.x.1"}]
#   REPO_ROOT      = vault / common 경로 기준
#
# 출력 (json_only callback):
#   확정 스키마 JSON (schema_version: "1")
#
# 흐름:
#   Play1:   포트 감지 → _os_linux / _os_windows / _os_failed 그룹으로 분류 (add_host)
#   Play1.5: _os_failed (포트 미응답) host별 독립 OUTPUT (strategy: free)
#   Play2:   Linux  → preflight → adapter 선택 → gather → meta → build_output
#   Play3:   Windows → adapter 선택 → gather → meta → build_output
#
# 실패 처리:
#   포트 감지 실패 → Play1 이 _os_failed 그룹 등록 → Play1.5 에서 OUTPUT (diagnosis 포함)
#   수집 예외 → block/rescue → build_failed_output.yml (단일 호출)
# =============================================================================

# ── PLAY 1: OS 타입 감지 ─────────────────────────────────────────────────────

- name: "os-gather | detect"
  hosts: all
  gather_facts: no
  connection: local
  # 주의: PLAY 1은 add_host (run_once + loop) 사용으로 strategy: free 불가 (#23 빌드 실패)
  # connection: local + 짧은 포트 probe라 linear여도 wave 막힘 영향 작음. perf는 _probe_timeout 단축으로 대응.
  # 2026-08-10 (Phase 3-A): 포트 감지는 공통 precheck 로 통합됐다 (종전 wait_for 3연타).

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # 포트 감지 타임아웃 (초) — 2026-04-30 perf: 5→2 (200 dead host 시나리오에서 host당 15→6초)
    # 진짜 느린 LAN host는 probe_timeout 변수로 override 가능
    _probe_timeout: "{{ probe_timeout | default(2) }}"

  tasks:

    # ── 2026-08-10 (Phase 3-A): 공통 precheck 로 통합 ─────────────────────
    # 종전에는 wait_for 3연타(5986 → 5985 → 22)로 OS 전용 감지를 했다. 다른 두 채널이
    # 쓰는 common/tasks/precheck/run_precheck.yml 과 구조가 달라 진단 값도 별도 하드코딩
    # 이었고(아래 PLAY 1.5), 실패 종류(거부 / 시간 초과 / 주소 해석 실패)를 구분하지 못했다.
    #
    # 보존한 것 (구조만 바꾸고 동작은 유지):
    #   - 포트 순서 5986 → 5985 → 22  : precheck_bundle.CHANNEL_DEFAULT_PORTS['os'] 가 동일 순서
    #   - 첫 성공에서 중단             : _check_ports 가 성공 즉시 break
    #   - OS 판정 규칙                : _detect_os_from_port (22=linux / 5985·5986=windows)
    #   - 포트당 타임아웃 2초          : timeout_port 로 명시 전달 (모듈 기본값 3.0 을 쓰지 않는다)
    #   - 관측 위치                   : connection: local + delegate_to: localhost 모두 controller
    #   - 재시도 없음                 : _check_ports 는 포트당 1회 시도
    #   - 프로토콜 미검증             : probe_protocol=false (SSH/WinRM 실제 handshake 는 다음 Phase)
    #
    # 달라진 것 (의도된 개선):
    #   - 실패 종류를 구조화해 관측 → failure_stage / failure_code 가 실제 관측을 반영
    #   - checked_ports 가 실제 probe 한 포트만 담음
    #   - 포트별 사유가 _fail_error_detail 로 보존됨
    - name: "detect | 공통 precheck (관리 포트 순차 확인)"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/precheck/run_precheck.yml"
      vars:
        _precheck_host:            "{{ ansible_host | default(inventory_hostname) }}"
        _precheck_channel:         "os"
        _precheck_timeout_port:    "{{ _probe_timeout }}"
        # 2026-08-10 (Phase 3-B): 포트가 열렸다는 사실만으로 OS 를 확정하지 않는다.
        # 각 후보에서 실제 SSH identification / WinRM WS-Management 응답까지 확인한다.
        _precheck_probe_protocol:  true
        # 프로토콜 확인용 bounded timeout. 포트 probe 예산(2초)과 별개이며, 살아 있는
        # 포트에만 적용된다(죽은 호스트는 TCP 단계에서 끝나 추가 대기가 없다).
        _precheck_timeout_protocol: "{{ _probe_protocol_timeout | default(5) }}"
        # 종전 wait_for 는 timeout 예산 안에서 sleep=1 간격으로 **반복 확인**했다.
        # 단발 시도로 바꾸면 "probe 시작 시점엔 닫혀 있지만 예산 안에 기동되는 서비스"가
        # 실패로 바뀐다. wait_for 기본값 sleep=1 을 그대로 써서 그 의미를 보존한다.
        _precheck_port_poll_interval: "{{ _probe_poll_interval | default(1) }}"

    # add_host 가 쓰는 세 fact 는 이름/타입 모두 종전과 동일하게 유지한다
    # (_winrm_port 는 문자열 — ansible_port 전달 형태를 바꾸지 않기 위함).
    - name: "detect | set os_type"
      ansible.builtin.set_fact:
        _detected_os:  "{{ (_precheck_raw.detected_os | default('')) or 'unknown' }}"
        _winrm_port:   "{{ '5986' if ((_precheck_raw.detected_port | default(0)) == 5986) else '5985' }}"
        _winrm_scheme: "{{ (_precheck_raw.winrm_scheme | default('')) or 'http' }}"
      no_log: true

    # ── add_host 는 인벤토리 조작 모듈이므로 암시적 run_once 동작.
    #    loop + run_once: true 로 모든 호스트를 한 번에 등록한다.
    # 2026-04-30 perf: port-fail OUTPUT 처리는 _os_failed 그룹에 등록 후 별도 PLAY 1.5 (strategy: free)에서.
    # PLAY 1 linear에서 200 dead host의 OUTPUT/build_failed_output 누적 처리(11분)를 회피.
    - name: "detect | register failed hosts"
      ansible.builtin.add_host:
        name:               "{{ item }}"
        groups:             _os_failed
        ansible_host:       "{{ hostvars[item].ansible_host | default(item) }}"
        ansible_connection: local
        _os_type:           unknown
      loop: "{{ ansible_play_hosts_all }}"
      when: (hostvars[item]._detected_os | default('') | trim) == 'unknown'
      run_once: true
      no_log: true

    - name: "detect | register linux hosts"
      ansible.builtin.add_host:
        name:                    "{{ item }}"
        groups:                  _os_linux
        ansible_host:            "{{ hostvars[item].ansible_host | default(item) }}"
        ansible_connection:      ssh
        ansible_port:            22
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o ConnectTimeout=15 -o ServerAliveInterval=10
        _os_type:                linux
      loop: "{{ ansible_play_hosts_all }}"
      when: (hostvars[item]._detected_os | default('') | trim) == 'linux'
      run_once: true
      no_log: true

    - name: "detect | register windows hosts"
      ansible.builtin.add_host:
        name:                                  "{{ item }}"
        groups:                                _os_windows
        ansible_host:                          "{{ hostvars[item].ansible_host | default(item) }}"
        ansible_connection:                    winrm
        ansible_port:                          "{{ hostvars[item]._winrm_port | default('5985') }}"
        ansible_winrm_scheme:                  "{{ hostvars[item]._winrm_scheme | default('http') }}"
        ansible_winrm_transport:               ntlm
        ansible_winrm_server_cert_validation:  ignore
        ansible_winrm_operation_timeout_sec:   60
        ansible_winrm_read_timeout_sec:        70
        _os_type:                              windows
      loop: "{{ ansible_play_hosts_all }}"
      when: (hostvars[item]._detected_os | default('') | trim) == 'windows'
      run_once: true
      no_log: true


# ── PLAY 1.5: Port-fail OUTPUT (host별 독립, 200 dead host 14분→수초) ──────
# 2026-04-30 perf: PLAY 1 (linear, add_host 호환)에서 분리.
# 각 dead host의 build_failed_output 처리가 독립 wave로 진행되어 wall-clock 단축.

- name: "os-gather | failed-output"
  hosts: _os_failed
  gather_facts: no
  connection: local
  strategy: free

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:

    - name: "failed-output | set port-fail vars"
      ansible.builtin.set_fact:
        _out_target_type:       "os"
        _out_collection_method: "agent"
        _out_ip:                "{{ ansible_host | default(inventory_hostname) }}"
        _out_vendor:            null
        _fail_sec_supported:    "{{ ['system','cpu','memory','storage','network','users'] }}"
        _fail_error_section:    "os_detect"
        _fail_error_message:    "SSH(22)/WinRM(5985, 5986) 포트가 모두 응답하지 않습니다. 대상 서버의 방화벽, SSH/WinRM 서비스 상태, 네트워크 연결을 확인하세요."

    # 2026-08-10 (Phase 3-A): 종전에는 이 자리에서 _diagnosis 를 통째로 하드코딩했다.
    # 이제 PLAY 1 의 공통 precheck 가 만든 진단(_diagnosis)이 host fact 로 그대로 넘어오므로
    # 재작성하지 않는다 — reachable / port_open / failure_stage / failure_code /
    # details.checked_ports 모두 **실제 관측 결과**다.
    #   - 전 포트 무응답      → stage=reachable, code=TCP_CONNECT_FAILED
    #   - RST 를 하나라도 관측 → stage=port,      code=TCP_CONNECTION_REFUSED
    #   - 주소 해석 실패      → stage=reachable, code=DNS_RESOLUTION_FAILED
    # auth_success 는 인증을 시도하지 않으므로 null 유지 (모듈 초기값).
    #
    # failure_reason 만 OS 문맥에 맞게 덮어쓴다. 공통 문구는 어느 포트를 봤는지 알려주지 못하고,
    # 종전 문구("모두 응답이 없습니다")는 RST 를 관측한 경우 사실과 달라지기 때문이다.
    - name: "failed-output | Portal 표시용 failure_reason 을 OS 문맥으로"
      ansible.builtin.set_fact:
        _diagnosis: >-
          {%- set d = _diagnosis | default({}, true) -%}
          {%- set d = d if (d is mapping) else {} -%}
          {{ d | combine({'failure_reason':
                 ('대상 서버의 주소를 확인하지 못했습니다. 호스트 이름과 DNS 설정을 확인하세요.'
                  if (d.failure_code | default('')) == 'DNS_RESOLUTION_FAILED'
                  else ('SSH(22)/WinRM(5985, 5986) 관리 포트에 연결하지 못했습니다. 일부 연결 시도에서 연결 거부 응답이 확인되었습니다. 서비스 기동 상태와 네트워크 정책을 확인하세요.'
                        if (d.failure_stage | default('')) == 'port'
                        else ('관리 포트에는 연결되었지만 예상한 SSH 또는 WinRM 응답을 확인하지 못했습니다. SSH와 WinRM 서비스 설정을 확인하세요.'
                              if (d.failure_stage | default('')) == 'protocol'
                              else 'SSH(22)/WinRM(5985, 5986) 모두 응답이 없습니다. 서버 전원, 네트워크, 서비스 상태를 확인하세요.')))}) }}

    - name: "failed-output | init fragments"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

    - name: "failed-output | build_failed_output"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

    - name: "failed-output | inject schema_version"
      ansible.builtin.set_fact:
        _output: "{{ _output | combine({'schema_version': '1'}) }}"

    - name: OUTPUT
      ansible.builtin.debug:
        msg: "{{ _output | to_json }}"


# ── PLAY 2: Linux 수집 ───────────────────────────────────────────────────────

- name: "os-gather | linux"
  hosts: _os_linux
  gather_facts: no
  become: no
  # 2026-04-30 perf: stuck host (SSH connect timeout) 가 wave 막지 않도록 host별 독립 진행
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/vault/linux.yml"

  vars:
    _ip:      "{{ ansible_host | default(inventory_hostname) }}"
    _os_type: "linux"
    # SSH 비밀번호를 sudo 비밀번호로 전달 (DMI 식별자 읽기에 필요)
    # vault에 ansible_become_pass가 별도 정의되면 그 값이 우선됨
    ansible_become_pass: "{{ ansible_become_password | default(ansible_password | default(omit)) }}"

  tasks:

    - name: "linux | gather"
      block:

        # P1 (cycle 2026-04-28): vault accounts 후보 순차 시도.
        # 성공 시 ansible_user/password 갱신 후 본 gather 진행.
        # 실패 시 _os_auth_ok=false → block 안에서 fail → rescue 진입.
        - name: "linux | try credentials"
          ansible.builtin.include_tasks: tasks/try_credentials.yml
          vars:
            _os_type:     "linux"
            _os_accounts: "{{ accounts | default([]) }}"

        - name: "linux | abort if all credentials failed"
          ansible.builtin.fail:
            msg: >-
              Linux SSH 자격증명 후보 {{ _os_accounts | default([]) | length }}개가 모두 실패했습니다.
              vault/linux.yml 의 accounts 와 대상 서버의 sshd 설정을 확인하세요.
          when:
            - (_os_accounts | default([])) | length > 0
            - not (_os_auth_ok | default(false) | bool)
          vars:
            _os_accounts: "{{ accounts | default([]) }}"

        - name: "linux | preflight"
          ansible.builtin.include_tasks: tasks/linux/preflight.yml

        - name: "linux | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        # ── adapter 선택 ─────────────────────────────────────────────────
        - name: "linux | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {# 2026-06-22 fix: _l_distro_name(os-release NAME, preflight) 우선 — adapter 선택 시점에
                 ansible_distribution 은 미정의(facts 미수집) + "RedHat" 형식이라 패턴 불일치 → 전 Linux 가
                 rhel tie-break 로 오선택되던 버그. os-release NAME("Ubuntu"/"Red Hat Enterprise Linux") 사용. #}
              {{ lookup('adapter_loader',
                         channel='os',
                         facts={'os_type': 'linux',
                                'distribution': (_l_distro_name | default('')) or (ansible_distribution | default(''))},
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "linux | gather system"
          ansible.builtin.include_tasks: tasks/linux/gather_system.yml

        - name: "linux | gather cpu"
          ansible.builtin.include_tasks: tasks/linux/gather_cpu.yml

        - name: "linux | gather memory"
          ansible.builtin.include_tasks: tasks/linux/gather_memory.yml

        - name: "linux | gather storage"
          ansible.builtin.include_tasks: tasks/linux/gather_storage.yml

        - name: "linux | gather network"
          ansible.builtin.include_tasks: tasks/linux/gather_network.yml

        - name: "linux | gather users"
          ansible.builtin.include_tasks: tasks/linux/gather_users.yml

        # P4 (cycle 2026-04-29): FC HBA / InfiniBand / NIC driver/VLAN/bond
        - name: "linux | gather hba_ib"
          ansible.builtin.include_tasks: tasks/linux/gather_hba_ib.yml

        # P5 (cycle 2026-04-28): 운영 런타임 (NTP/firewall/listening ports/swap)
        - name: "linux | gather runtime"
          ansible.builtin.include_tasks: tasks/linux/gather_runtime.yml

        # ── diagnosis (성공 경로) ───────────────────────────────────────
        - name: "linux | build diagnosis (success path)"
          ansible.builtin.set_fact:
            _diagnosis:
              reachable:          true
              port_open:          true
              protocol_supported: true
              auth_success:       true
              failure_stage:      null
              # 2026-08-10 (Phase 2): 정상 결과에서도 키는 존재하고 값만 null (shape 고정).
              failure_code:       null
              failure_reason:     null
              details:
                channel:           "os"
                adapter_candidate: "{{ (_selected_adapter | default({})).adapter_id | default(none) }}"
                detected_os:       "linux"
                selected_port:     22
                # 2026-08-10 (Phase 3-A): PLAY 1 의 공통 precheck 가 **실제 probe 한 포트**를
                # 그대로 쓴다. linux 로 분류되려면 5986 실패 → 5985 실패 → 22 성공 순으로
                # 3개 모두 시도됐어야 하므로 fallback 값도 같다.
                checked_ports:     "{{ _precheck_raw.checked_ports | default([5986, 5985, 22]) }}"
                gather_mode:       "{{ _l_python_mode | default('python_ok') }}"
                python_version:    "{{ _l_python_version | default('') }}"
                # P1: meta.auth — 사용자 결정 #3 (fallback_used 노출)
                auth:              "{{ _os_attempts_meta | default({}) }}"

        # ── meta & correlation ───────────────────────────────────────────
        # 2026-04-29 fix B80 (final): vendor 정규화는 _merged_data.system.vendor (gather_system 의 emit) 기반.
        # 이 set_fact 결과는 build_output.yml의 'os | normalize | set output meta (defaults preserve)' 에서 보존됨.
        - name: "linux | set output meta vars"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"
            # rule 12 R1 Allowed: vendor name → canonical alias 정규화 매핑.
            # '분기 코드'가 아니라 vendor 이름 추출 dict (DMI sys_vendor → adapter 정규화 alias).
            # vendor_aliases.yml의 Ansible-runtime 외 등가물 (Linux raw fallback 컨텍스트).
            _out_vendor: >-
              {%- set v = ((_merged_data | default({})).system | default({})).vendor | default('') | string | lower | trim -%}
              {%- if 'dell' in v -%}dell{# nosec rule12-r1 #}
              {%- elif 'hpe' in v or 'hewlett' in v -%}hp{# nosec rule12-r1 — 출력 표시값 hpe→hp (vendor_aliases.vendor_output_display mirror, 2026-06-04) #}
              {%- elif 'lenovo' in v or v == 'ibm' -%}lenovo{# nosec rule12-r1 #}
              {%- elif 'cisco' in v -%}cisco{# nosec rule12-r1 #}
              {%- elif 'supermicro' in v or 'smci' in v -%}supermicro{# nosec rule12-r1 #}
              {%- elif 'vmware' in v -%}vmware
              {%- elif 'qemu' in v or 'kvm' in v or 'red hat' in v -%}qemu
              {%- elif 'microsoft' in v -%}microsoft
              {%- elif 'xen' in v -%}xen
              {%- elif 'fujitsu' in v -%}fujitsu
              {%- elif 'inspur' in v -%}inspur
              {%- endif -%}

        - name: "linux | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "linux | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"

        - name: "linux | build output"
          ansible.builtin.include_tasks: tasks/normalize/build_output.yml

        # schema_version 주입
        - name: "linux | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      rescue:
        # ── Portal Grid 계약 (2026-08-10 사용자 확인) ────────────────────
        # Portal 은 실패 Grid 에 **diagnosis.failure_reason 만** 표시한다. 그런데 OS 채널은
        # _diagnosis 를 **성공 경로에서만** set 하고 있어(위 "build diagnosis (success path)"),
        # 자격 실패 / 수집 예외로 rescue 에 들어오면 build_failed_output.yml:79 의
        # `_diagnosis | default(none)` 이 발동해 **diagnosis 전체가 null** 이 됐다.
        # → Portal 은 빈 칸을 보여주고, 소비자가 diagnosis.* 를 참조하면 null 역참조.
        #
        # 값 근거 (확정 가능한 것만 적는다):
        #   reachable / port_open = true  — PLAY 1 wait_for 가 TCP 연결 성공을 실제 관측(:40-69)
        #   protocol_supported            — 자격 probe 가 통과했으면 SSH 로 명령이 실제 실행된
        #                                   것이므로 true, 아니면 "관측 못 함"이라 false
        #   auth_success                  — 통과 시 true. **실패 시 false 가 아니라 null**:
        #                                   try_one_credential.yml:59-69 의 판정식은 잘못된 자격 /
        #                                   연결 끊김 / timeout / 제한 쉘(nologin, rc≠0) 을 구분하지
        #                                   못한다 → 인증 거부를 관측했다고 말할 수 없다
        #   failure_stage                 — 실행이 멈춘 단계. 자격 probe 단계면 'auth'.
        #                                   그 뒤(수집) 단계는 현재 enum 에 표현값이 없어 null 유지
        - name: "linux | rescue | Portal 표시용 diagnosis 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set ok = _os_auth_ok | default(false) | bool -%}
              {{ {'reachable': true, 'port_open': true,
                  'protocol_supported': ok,
                  'auth_success': (true if ok else none),
                  'failure_stage': ('gather' if ok else 'auth'),
                  'failure_code': ('GATHER_FAILED' if ok else 'AUTH_PROBE_FAILED'),
                  'failure_reason': ('Linux 정보를 수집하는 중 오류가 발생했습니다. 수집 로그를 확인하세요.' if ok
                                     else 'Linux 서버에 SSH로 접속하지 못했습니다. 자격증명, SSH 설정, 네트워크 상태를 확인하세요.'),
                  'details': {'channel': 'os', 'detected_os': 'linux',
                              'selected_port': 22,
                              'checked_ports': (_precheck_raw.checked_ports | default([5986, 5985, 22])),
                              'auth': (_os_attempts_meta | default({}))}
                    | combine(((_diagnosis | default({}, true)).details)
                              if (((_diagnosis | default({}, true)).details) is mapping) else {})} }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "linux | rescue | build failed output"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"
            _out_vendor:            null
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','cpu','memory','storage','network','users']) }}"
            _fail_error_section:    "linux_gather"
            _fail_error_message:    "{{ ansible_failed_result.msg | default('Linux 수집 예외') }}"

        - name: "linux | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "linux | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        # rule 13 R5 / rule 20 R1: 호출자는 13 필드 envelope을 보장받음. _output 미생성 시도 13 필드 모두 채운다.
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'os',
                       'collection_method': 'agent',
                       'ip': _ip | default(none),
                       'hostname': _ip | default(none),
                       'vendor': none,
                       'status': 'failed',
                       'sections': {},
                       'diagnosis': {'reachable': none, 'port_open': none, 'protocol_supported': none, 'auth_success': none, 'failure_stage': 'fallback', 'failure_code': 'OUTPUT_BUILD_FAILED', 'failure_reason': '수집 결과를 생성하지 못했습니다. 수집기 내부 오류이므로 실행 로그를 확인하세요.', 'details': {'gather_mode': 'fallback', 'reason': '_output 미생성 (block/rescue 모두 실패)'}},
                       'meta': {},
                       'correlation': {},
                       'errors': [{'section':'gather','message':'수집 결과를 생성하지 못했습니다. 수집기 내부 오류이므로 실행 로그를 확인하세요.'}],
                       'data': {}
                     })) | to_json }}"


# ── PLAY 3: Windows 수집 ─────────────────────────────────────────────────────

- name: "os-gather | windows"
  hosts: _os_windows
  gather_facts: no
  # 2026-04-30 perf: stuck host (WinRM read/op timeout) 가 wave 막지 않도록 host별 독립 진행
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/vault/windows.yml"

  vars:
    _ip:      "{{ ansible_host | default(inventory_hostname) }}"
    _os_type: "windows"

  tasks:

    - name: "windows | gather"
      block:

        # P1 (cycle 2026-04-28): vault accounts 후보 순차 시도 (WinRM).
        - name: "windows | try credentials"
          ansible.builtin.include_tasks: tasks/try_credentials.yml
          vars:
            _os_type:     "windows"
            _os_accounts: "{{ accounts | default([]) }}"

        - name: "windows | abort if all credentials failed"
          ansible.builtin.fail:
            msg: >-
              Windows WinRM 자격증명 후보 {{ _os_accounts | default([]) | length }}개가 모두 실패했습니다.
              vault/windows.yml 의 accounts 와 대상 서버의 WinRM 설정을 확인하세요.
          when:
            - (_os_accounts | default([])) | length > 0
            - not (_os_auth_ok | default(false) | bool)
          vars:
            _os_accounts: "{{ accounts | default([]) }}"

        - name: "windows | setup"
          ansible.builtin.setup:
            gather_subset: ['hardware', 'network']
          register:    _w_setup
          failed_when: false
          no_log: true

        - name: "windows | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        # ── adapter 선택 ─────────────────────────────────────────────────
        - name: "windows | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {# Round 17 #10: ansible_os_product_type 은 SKU(server/workstation) 라
                 version_patterns(2019/2022, 10.0.NNNNN build)와 절대 안 맞아 generation
                 adapter 가 죽고 windows_generic 만 선택됨. ansible_kernel(=빌드 10.0.20348.0)
                 을 넘겨 windows_2019/2022 가 올바로 매칭되게 한다. #}
              {{ lookup('adapter_loader',
                         channel='os',
                         facts={'os_type': 'windows',
                                'version': ansible_kernel | default('')},
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "windows | gather system"
          ansible.builtin.include_tasks: tasks/windows/gather_system.yml

        # cycle-016 Phase O: Windows hardware section 활성화
        - name: "windows | gather hardware"
          ansible.builtin.include_tasks: tasks/windows/gather_hardware.yml

        - name: "windows | gather cpu"
          ansible.builtin.include_tasks: tasks/windows/gather_cpu.yml

        - name: "windows | gather memory"
          ansible.builtin.include_tasks: tasks/windows/gather_memory.yml

        - name: "windows | gather storage"
          ansible.builtin.include_tasks: tasks/windows/gather_storage.yml

        - name: "windows | gather network"
          ansible.builtin.include_tasks: tasks/windows/gather_network.yml

        - name: "windows | gather users"
          ansible.builtin.include_tasks: tasks/windows/gather_users.yml

        # P5 sub-phase b (cycle 2026-04-29): Windows runtime
        - name: "windows | gather runtime"
          ansible.builtin.include_tasks: tasks/windows/gather_runtime.yml

        # ── diagnosis (성공 경로) ───────────────────────────────────────
        - name: "windows | build diagnosis (success path)"
          ansible.builtin.set_fact:
            _diagnosis:
              reachable:          true
              port_open:          true
              protocol_supported: true
              auth_success:       true
              failure_stage:      null
              # 2026-08-10 (Phase 2): 정상 결과에서도 키는 존재하고 값만 null (shape 고정).
              failure_code:       null
              failure_reason:     null
              details:
                channel:           "os"
                adapter_candidate: "{{ (_selected_adapter | default({})).adapter_id | default(none) }}"
                detected_os:       "windows"
                # selected_port 는 정수 — checked_ports([5985,5986]) / Linux SSH 경로(22) /
                # precheck 모듈(int) 과 타입 일관. 구: 문자열 "5986" (2026-06-30 실측 불일치).
                selected_port:     "{{ ansible_port | default(5986) | int }}"
                # 2026-08-10 (B-4): PLAY 1 은 5986 을 먼저 시도하고 성공하면 **거기서 멈춘다**
                # (:49-50 의 when: _probe_winrm_https is failed). 따라서 5986 으로 붙었으면
                # 검사한 포트는 [5986] 하나뿐이고, 5985 로 붙었을 때만 [5986, 5985] 다.
                # 종전 [5985, 5986] 은 순서도 내용도 실제와 달랐다.
                checked_ports:     "{{ _precheck_raw.checked_ports | default([5986] if ((ansible_port | default(5986) | int) == 5986) else [5986, 5985]) }}"
                # P1: meta.auth — 사용자 결정 #3 (fallback_used 노출)
                auth:              "{{ _os_attempts_meta | default({}) }}"

        # ── meta & correlation ───────────────────────────────────────────
        # 2026-04-30 fix B80(win): Windows도 envelope.vendor 정규화 적용.
        # Linux와 달리 Windows는 data.hardware.vendor에 system manufacturer가 emit됨
        # (Win32_ComputerSystem.Manufacturer 또는 Win32_BaseBoard).
        # rule 12 R1 Allowed: vendor name → canonical alias 정규화 (분기 코드 아님).
        - name: "windows | set output meta vars"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"
            _out_vendor: >-
              {%- set v = ((_merged_data | default({})).hardware | default({})).vendor | default('') | string | lower | trim -%}
              {%- if 'dell' in v -%}dell{# nosec rule12-r1 #}
              {%- elif 'hpe' in v or 'hewlett' in v -%}hp{# nosec rule12-r1 — 출력 표시값 hpe→hp (vendor_aliases.vendor_output_display mirror, 2026-06-04) #}
              {%- elif 'lenovo' in v or v == 'ibm' -%}lenovo{# nosec rule12-r1 #}
              {%- elif 'cisco' in v -%}cisco{# nosec rule12-r1 #}
              {%- elif 'supermicro' in v or 'smci' in v -%}supermicro{# nosec rule12-r1 #}
              {%- elif 'vmware' in v -%}vmware
              {%- elif 'qemu' in v or 'kvm' in v -%}qemu
              {%- elif 'microsoft' in v -%}microsoft
              {%- elif 'xen' in v -%}xen
              {%- elif 'fujitsu' in v -%}fujitsu
              {%- elif 'inspur' in v -%}inspur
              {%- endif -%}

        - name: "windows | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "windows | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"

        - name: "windows | build output"
          ansible.builtin.include_tasks: tasks/normalize/build_output.yml

        - name: "windows | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      rescue:
        # Portal Grid 계약 — linux rescue 와 동일 취지 / 동일 근거 (위 주석 참조).
        # 차이: 접속 포트는 PLAY 1 이 확정한 ansible_port(5986 우선), 검사 이력도 그에 따름.
        - name: "windows | rescue | Portal 표시용 diagnosis 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set ok = _os_auth_ok | default(false) | bool -%}
              {%- set port = ansible_port | default(5986) | int -%}
              {{ {'reachable': true, 'port_open': true,
                  'protocol_supported': ok,
                  'auth_success': (true if ok else none),
                  'failure_stage': ('gather' if ok else 'auth'),
                  'failure_code': ('GATHER_FAILED' if ok else 'AUTH_PROBE_FAILED'),
                  'failure_reason': ('Windows 정보를 수집하는 중 오류가 발생했습니다. 수집 로그를 확인하세요.' if ok
                                     else 'Windows 서버에 WinRM으로 접속하지 못했습니다. 자격증명과 WinRM 설정을 확인하세요.'),
                  'details': {'channel': 'os', 'detected_os': 'windows',
                              'selected_port': port,
                              'checked_ports': (_precheck_raw.checked_ports
                                                 | default([5986] if port == 5986 else [5986, 5985])),
                              'auth': (_os_attempts_meta | default({}))}
                    | combine(((_diagnosis | default({}, true)).details)
                              if (((_diagnosis | default({}, true)).details) is mapping) else {})} }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "windows | rescue | set failed vars"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"
            _out_vendor:            null
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','cpu','memory','storage','network','users']) }}"
            _fail_error_section:    "windows_gather"
            _fail_error_message:    "{{ ansible_failed_result.msg | default('Windows 수집 예외') }}"

        - name: "windows | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "windows | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        # rule 13 R5 / rule 20 R1: 호출자는 13 필드 envelope을 보장받음. _output 미생성 시도 13 필드 모두 채운다.
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'os',
                       'collection_method': 'agent',
                       'ip': _ip | default(none),
                       'hostname': _ip | default(none),
                       'vendor': none,
                       'status': 'failed',
                       'sections': {},
                       'diagnosis': {'reachable': none, 'port_open': none, 'protocol_supported': none, 'auth_success': none, 'failure_stage': 'fallback', 'failure_code': 'OUTPUT_BUILD_FAILED', 'failure_reason': '수집 결과를 생성하지 못했습니다. 수집기 내부 오류이므로 실행 로그를 확인하세요.', 'details': {'gather_mode': 'fallback', 'reason': '_output 미생성 (block/rescue 모두 실패)'}},
                       'meta': {},
                       'correlation': {},
                       'errors': [{'section':'gather','message':'수집 결과를 생성하지 못했습니다. 수집기 내부 오류이므로 실행 로그를 확인하세요.'}],
                       'data': {}
                     })) | to_json }}"
