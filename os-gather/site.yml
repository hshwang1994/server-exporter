---


- name: "os-gather | detect"
  hosts: all
  gather_facts: false
  connection: local

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _probe_timeout: "{{ probe_timeout | default(10) }}"

  tasks:

    - name: "detect | 공통 precheck (관리 포트 순차 확인)"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/precheck/run_precheck.yml"
      vars:
        _precheck_host:            "{{ ansible_host | default(inventory_hostname) }}"
        _precheck_channel:         "os"
        _precheck_timeout_port:    "{{ _probe_timeout }}"
        _precheck_probe_protocol:  true
        _precheck_timeout_protocol: "{{ _probe_protocol_timeout | default(60) }}"
        _precheck_port_poll_interval: "{{ _probe_poll_interval | default(0) }}"

    - name: "detect | set os_type"
      ansible.builtin.set_fact:
        _detected_os:  "{{ (_precheck_raw.detected_os | default('')) or 'unknown' }}"
        _winrm_port:   "{{ '5986' if ((_precheck_raw.detected_port | default(0)) == 5986) else '5985' }}"
        _winrm_scheme: "{{ (_precheck_raw.winrm_scheme | default('')) or 'http' }}"
      no_log: true

    - name: "detect | register failed hosts"
      ansible.builtin.add_host:
        name:               "{{ item }}"
        groups:             _os_failed
        ansible_host:       "{{ hostvars[item].ansible_host | default(item) }}"
        ansible_connection: local
        _os_type:           unknown
      loop: "{{ ansible_play_hosts_all }}"
      when: (hostvars[item]._detected_os | default('') | trim) == 'unknown'
      run_once: true
      no_log: true

    - name: "detect | register linux hosts"
      ansible.builtin.add_host:
        name:                    "{{ item }}"
        groups:                  _os_linux
        ansible_host:            "{{ hostvars[item].ansible_host | default(item) }}"
        ansible_connection:      ssh
        ansible_port:            22
        ansible_timeout:         60
        ansible_ssh_use_tty:     true
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o ConnectTimeout=60 -o ServerAliveInterval=10
        _os_type:                linux
      loop: "{{ ansible_play_hosts_all }}"
      when: (hostvars[item]._detected_os | default('') | trim) == 'linux'
      run_once: true
      no_log: true

    - name: "detect | register windows hosts"
      ansible.builtin.add_host:
        name:                                  "{{ item }}"
        groups:                                _os_windows
        ansible_host:                          "{{ hostvars[item].ansible_host | default(item) }}"
        ansible_connection:                    winrm
        ansible_port:                          "{{ hostvars[item]._winrm_port | default('5985') }}"
        ansible_winrm_scheme:                  "{{ hostvars[item]._winrm_scheme | default('http') }}"
        ansible_winrm_transport:               ntlm
        ansible_winrm_server_cert_validation:  ignore
        ansible_winrm_operation_timeout_sec:   60
        ansible_winrm_read_timeout_sec:        70
        _os_type:                              windows
      loop: "{{ ansible_play_hosts_all }}"
      when: (hostvars[item]._detected_os | default('') | trim) == 'windows'
      run_once: true
      no_log: true



- name: "os-gather | failed-output"
  hosts: _os_failed
  gather_facts: false
  connection: local
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/failure_reasons.yml"

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:

    - name: "failed-output | set port-fail vars"
      ansible.builtin.set_fact:
        _out_target_type:       "os"
        _out_collection_method: "agent"
        _out_ip:                "{{ ansible_host | default(inventory_hostname) }}"
        _out_vendor:            null
        _fail_sec_supported:    "{{ ['system','hardware','cpu','memory','storage','network','users'] }}"
        _fail_error_section:    "os_detect"
        _fail_error_message:    "확인한 관리 포트: WinRM 5986, WinRM 5985, SSH 22"


    - name: "failed-output | init fragments"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

    - name: "failed-output | build_failed_output"
      ansible.builtin.include_tasks:
        file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

    - name: "failed-output | inject schema_version"
      ansible.builtin.set_fact:
        _output: "{{ _output | combine({'schema_version': '1'}) }}"

    - name: OUTPUT
      ansible.builtin.debug:
        msg: "{{ _output | to_json }}"



- name: "os-gather | linux"
  hosts: _os_linux
  gather_facts: false
  become: false
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/failure_reasons.yml"

  vars:
    _ip:      "{{ ansible_host | default(inventory_hostname) }}"
    _os_type: "linux"
    ansible_become_pass: "{{ _cred_become_password | default(ansible_password | default(omit)) }}"

  tasks:

    - name: "linux | gather"
      block:

        - name: "linux | resolve credentials"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/resolve_and_load.yml"
          vars:
            _cred_target_type: "os"
            _cred_os_type:     "linux"

        - name: "linux | abort if credential set unavailable"
          ansible.builtin.fail:
            msg: >-
              Credential set 을 열 수 없습니다 (scope={{ _cred_scope | default('') | ternary(_cred_scope, _cred_reason) }},
              outcome={{ _cred_load_outcome | default('not_resolved') }}).
              se_location 값과 해당 Location 의 vault 파일, ansible-vault 복호화 키를 확인하세요.
          when: _cred_load_outcome | default('not_resolved') in
                ['not_resolved', 'credential_set_missing', 'credential_set_undecryptable']

        - name: "linux | try credentials"
          ansible.builtin.include_tasks: tasks/try_credentials.yml
          vars:
            _os_type:     "linux"
            _os_accounts: "{{ _cred_accounts | default([]) }}"

        - name: "linux | abort if all credentials failed"
          ansible.builtin.fail:
            msg: >-
              Linux SSH 자격증명 후보 {{ _os_accounts | default([]) | length }}개가 모두 실패했습니다.
              credential scope={{ _cred_scope | default('') }} 의 accounts 와 대상 서버의 sshd 설정을 확인하세요.
          when:
            - (_os_accounts | default([])) | length > 0
            - not (_os_auth_ok | default(false) | bool)
          vars:
            _os_accounts: "{{ _cred_accounts | default([]) }}"

        - name: "linux | preflight"
          ansible.builtin.include_tasks: tasks/linux/preflight.yml

        - name: "linux | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        - name: "linux | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {{ lookup('adapter_loader',
                         channel='os',
                         facts={'os_type': 'linux',
                                'distribution': (_l_distro_name | default('')) or (ansible_distribution | default(''))},
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "linux | gather system"
          ansible.builtin.include_tasks: tasks/linux/gather_system.yml

        - name: "linux | gather cpu"
          ansible.builtin.include_tasks: tasks/linux/gather_cpu.yml

        - name: "linux | gather memory"
          ansible.builtin.include_tasks: tasks/linux/gather_memory.yml

        - name: "linux | gather storage"
          ansible.builtin.include_tasks: tasks/linux/gather_storage.yml

        - name: "linux | gather network"
          ansible.builtin.include_tasks: tasks/linux/gather_network.yml

        - name: "linux | gather users"
          ansible.builtin.include_tasks: tasks/linux/gather_users.yml

        - name: "linux | gather hba_ib"
          ansible.builtin.include_tasks: tasks/linux/gather_hba_ib.yml


        - name: "linux | build diagnosis (success path)"
          ansible.builtin.set_fact:
            _diagnosis:
              reachable:          true
              port_open:          true
              protocol_supported: true
              auth_success:       true
              failure_stage:      null
              failure_code:       null
              failure_reason:     null
              details:
                channel:           "os"
                adapter_candidate: "{{ (_selected_adapter | default({})).adapter_id | default(none) }}"
                detected_os:       "linux"
                credential_scope:  "{{ (_cred_scope | default('')) or none }}"
                selected_port:     22
                checked_ports:     "{{ _precheck_raw.checked_ports | default([5986, 5985, 22]) }}"
                gather_mode:       "{{ _l_python_mode | default('python_ok') }}"
                python_version:    "{{ _l_python_version | default('') }}"
                auth:              "{{ _os_attempts_meta | default({}) }}"

        - name: "linux | set output meta vars"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"

        - name: "linux | resolve vendor"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/resolve_vendor.yml"

        - name: "linux | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "linux | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"

        - name: "linux | build output"
          ansible.builtin.include_tasks: tasks/normalize/build_output.yml

        - name: "linux | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

        - name: CHECKPOINT
          ansible.builtin.debug:
            msg: "{{ _output | to_json }}"

        - name: "linux | addon"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/addon/run_addon.yml"
          vars:
            _addon_target: linux
          when: lookup('env', 'ADDON_DIR') | length > 0

      rescue:
        - name: "linux | rescue | Portal 표시용 diagnosis 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set ok = (_os_auth_ok | default(false) | bool)
                           or ((_all_sec_collected | default([]) | length) > 0) -%}
              {%- set lo = _cred_load_outcome | default('') -%}
              {%- set cred_na = (not ok)
                                and (lo in ['not_resolved', 'credential_set_missing',
                                            'credential_set_undecryptable']) -%}
              {%- if ok -%}
                {%- set reason_key = 'gather_after_auth' -%}
              {%- elif (_cred_reason | default('')) == 'unknown_location' -%}
                {%- set reason_key = 'loc_unregistered' -%}
              {%- elif lo == 'credential_set_missing' -%}
                {%- set reason_key = ('loc_vault_no_account'
                                      if (_cred_location_vault_exists | default(false) | bool)
                                      else 'loc_vault_missing') -%}
              {%- elif lo == 'credential_set_undecryptable' -%}
                {%- set reason_key = 'loc_vault_unreadable' -%}
              {%- elif lo == 'not_resolved' -%}
                {%- set reason_key = 'loc_vault_missing' -%}
              {%- elif lo == 'empty_accounts' -%}
                {%- set reason_key = 'loc_vault_no_account' -%}
              {%- else -%}
                {%- set reason_key = 'auth_unconfirmed' -%}
              {%- endif -%}
              {{ {'reachable': true, 'port_open': true,
                  'protocol_supported': true,
                  'auth_success': (true if ok else none),
                  'failure_stage': ('gather' if ok else 'auth'),
                  'failure_code': ('GATHER_FAILED' if ok
                                   else ('CREDENTIAL_SET_UNAVAILABLE' if cred_na
                                         else 'AUTH_PROBE_FAILED')),
                  'failure_reason': (_fr_catalog | failure_reason(
                                       reason_key, 'os',
                                       _cred_location | default(se_location | default('')))),
                  'details': {'channel': 'os', 'detected_os': 'linux',
                              'credential_scope': (_cred_scope | default('')) or none,
                              'selected_port': 22,
                              'checked_ports': (_precheck_raw.checked_ports | default([5986, 5985, 22])),
                              'auth': (_os_attempts_meta | default({}))}
                    | combine(((_diagnosis | default({}, true)).details | default({}))
                              if (((_diagnosis | default({}, true)).details | default({}))
                                  is mapping) else {})} }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "linux | rescue | resolve vendor"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/resolve_vendor.yml"

        - name: "linux | rescue | build failed output"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','hardware','cpu','memory','storage','network','users']) }}"
            _fail_error_section:    "linux_gather"
            _fail_error_message:    "[task: {{ ansible_failed_task.name | default('unknown') }}] {{ ansible_failed_result.msg | default('Linux 수집 예외') }}"

        - name: "linux | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "linux | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'os',
                       'collection_method': 'agent',
                       'ip': _ip | default(none),
                       'hostname': none,
                       'vendor': none,
                       'status': 'failed',
                       'sections': {'system': 'failed', 'hardware': 'failed', 'bmc': 'not_supported', 'cpu': 'failed', 'memory': 'failed', 'storage': 'failed', 'network': 'failed', 'firmware': 'not_supported', 'users': 'failed', 'power': 'not_supported', 'thermal': 'not_supported'},
                       'diagnosis': {'reachable': none, 'port_open': none, 'protocol_supported': none, 'auth_success': none, 'failure_stage': 'fallback', 'failure_code': 'OUTPUT_BUILD_FAILED', 'failure_reason': _fr_catalog.output_build_failed.default, 'details': {'gather_mode': 'fallback', 'reason': '_output 미생성 (block/rescue 모두 실패)'}},
                       'meta': {'started_at': none, 'finished_at': none, 'duration_ms': none, 'adapter_id': none, 'adapter_version': none, 'ansible_version': none},
                       'correlation': {'serial_number': none, 'system_uuid': none, 'bmc_ip': none, 'host_ip': _ip | default(none)},
                       'errors': [{'section':'gather','message': _fr_catalog.output_build_failed.default,'detail':'_output 미생성 (block/rescue 모두 실패)'}],
                       'data': {'system': none, 'hardware': none, 'bmc': none, 'cpu': none, 'memory': none, 'storage': {'filesystems': [], 'physical_disks': [], 'datastores': [], 'controllers': [], 'logical_volumes': [], 'hbas': [], 'infiniband': [], 'summary': {'groups': [], 'grand_total_gb': 0}}, 'network': {'dns_servers': [], 'default_gateways': [], 'interfaces': [], 'adapters': [], 'ports': [], 'virtual_switches': [], 'portgroups': [], 'driver_map': [], 'summary': {'groups': []}}, 'users': [], 'firmware': [], 'power': none, 'thermal': {'temperatures': [], 'fans': []}}
                     })) | to_json }}"



- name: "os-gather | windows"
  hosts: _os_windows
  gather_facts: false
  strategy: free

  vars_files:
    - "{{ lookup('env','REPO_ROOT') }}/common/vars/failure_reasons.yml"

  vars:
    _ip:      "{{ ansible_host | default(inventory_hostname) }}"
    _os_type: "windows"

  tasks:

    - name: "windows | gather"
      block:

        - name: "windows | resolve credentials"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/credential/resolve_and_load.yml"
          vars:
            _cred_target_type: "os"
            _cred_os_type:     "windows"

        - name: "windows | abort if credential set unavailable"
          ansible.builtin.fail:
            msg: >-
              Credential set 을 열 수 없습니다 (scope={{ _cred_scope | default('') | ternary(_cred_scope, _cred_reason) }},
              outcome={{ _cred_load_outcome | default('not_resolved') }}).
              se_location 값과 해당 Location 의 vault 파일, ansible-vault 복호화 키를 확인하세요.
          when: _cred_load_outcome | default('not_resolved') in
                ['not_resolved', 'credential_set_missing', 'credential_set_undecryptable']

        - name: "windows | try credentials"
          ansible.builtin.include_tasks: tasks/try_credentials.yml
          vars:
            _os_type:     "windows"
            _os_accounts: "{{ _cred_accounts | default([]) }}"

        - name: "windows | abort if all credentials failed"
          ansible.builtin.fail:
            msg: >-
              Windows WinRM 자격증명 후보 {{ _os_accounts | default([]) | length }}개가 모두 실패했습니다.
              credential scope={{ _cred_scope | default('') }} 의 accounts 와 대상 서버의 WinRM 설정을 확인하세요.
          when:
            - (_os_accounts | default([])) | length > 0
            - not (_os_auth_ok | default(false) | bool)
          vars:
            _os_accounts: "{{ _cred_accounts | default([]) }}"

        - name: "windows | setup"
          ansible.builtin.setup:
            gather_subset: ['hardware', 'network']
            gather_timeout: 1800
          register:    _w_setup
          failed_when: false
          no_log: true

        - name: "windows | setup result"
          ansible.builtin.set_fact:
            _w_setup_ok: "{{ ((_w_setup.ansible_facts | default({})) | length) > 0 }}"
            _w_setup_detail: >-
              {{ (_w_setup.msg | default('', true) | string | replace('\n', ' ') | replace('\r', ' ') | trim)[:160] }}
          no_log: true

        - name: "windows | init fragments"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/init_fragments.yml"

        - name: "windows | select adapter"
          ansible.builtin.set_fact:
            _selected_adapter: >-
              {{ lookup('adapter_loader',
                         channel='os',
                         facts={'os_type': 'windows',
                                'version': ansible_kernel | default('')},
                         repo_root=lookup('env','REPO_ROOT')) }}
          no_log: true

        - name: "windows | gather system"
          ansible.builtin.include_tasks: tasks/windows/gather_system.yml

        - name: "windows | gather hardware"
          ansible.builtin.include_tasks: tasks/windows/gather_hardware.yml

        - name: "windows | gather cpu"
          ansible.builtin.include_tasks: tasks/windows/gather_cpu.yml

        - name: "windows | gather memory"
          ansible.builtin.include_tasks: tasks/windows/gather_memory.yml

        - name: "windows | gather storage"
          ansible.builtin.include_tasks: tasks/windows/gather_storage.yml

        - name: "windows | gather network"
          ansible.builtin.include_tasks: tasks/windows/gather_network.yml

        - name: "windows | gather users"
          ansible.builtin.include_tasks: tasks/windows/gather_users.yml

        - name: "windows | gather runtime"
          ansible.builtin.include_tasks: tasks/windows/gather_runtime.yml

        - name: "windows | build diagnosis (success path)"
          ansible.builtin.set_fact:
            _diagnosis:
              reachable:          true
              port_open:          true
              protocol_supported: true
              auth_success:       true
              failure_stage:      null
              failure_code:       null
              failure_reason:     null
              details:
                channel:           "os"
                adapter_candidate: "{{ (_selected_adapter | default({})).adapter_id | default(none) }}"
                detected_os:       "windows"
                credential_scope:  "{{ (_cred_scope | default('')) or none }}"
                selected_port:     "{{ ansible_port | default(5986) | int }}"
                checked_ports:     "{{ _precheck_raw.checked_ports | default([5986] if ((ansible_port | default(5986) | int) == 5986) else [5986, 5985]) }}"
                auth:              "{{ _os_attempts_meta | default({}) }}"

        - name: "windows | set output meta vars"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"

        - name: "windows | resolve vendor"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/resolve_vendor.yml"

        - name: "windows | build_meta"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_meta.yml"

        - name: "windows | build_correlation"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_correlation.yml"

        - name: "windows | build output"
          ansible.builtin.include_tasks: tasks/normalize/build_output.yml

        - name: "windows | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

        - name: CHECKPOINT
          ansible.builtin.debug:
            msg: "{{ _output | to_json }}"

        - name: "windows | addon"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/addon/run_addon.yml"
          vars:
            _addon_target: windows
          when: lookup('env', 'ADDON_DIR') | length > 0

      rescue:
        - name: "windows | rescue | Portal 표시용 diagnosis 보장"
          ansible.builtin.set_fact:
            _diagnosis: >-
              {%- set ok = (_os_auth_ok | default(false) | bool)
                           or ((_all_sec_collected | default([]) | length) > 0) -%}
              {%- set port = ansible_port | default(5986) | int -%}
              {%- set lo = _cred_load_outcome | default('') -%}
              {%- set cred_na = (not ok)
                                and (lo in ['not_resolved', 'credential_set_missing',
                                            'credential_set_undecryptable']) -%}
              {%- if ok -%}
                {%- set reason_key = 'gather_after_auth' -%}
              {%- elif (_cred_reason | default('')) == 'unknown_location' -%}
                {%- set reason_key = 'loc_unregistered' -%}
              {%- elif lo == 'credential_set_missing' -%}
                {%- set reason_key = ('loc_vault_no_account'
                                      if (_cred_location_vault_exists | default(false) | bool)
                                      else 'loc_vault_missing') -%}
              {%- elif lo == 'credential_set_undecryptable' -%}
                {%- set reason_key = 'loc_vault_unreadable' -%}
              {%- elif lo == 'not_resolved' -%}
                {%- set reason_key = 'loc_vault_missing' -%}
              {%- elif lo == 'empty_accounts' -%}
                {%- set reason_key = 'loc_vault_no_account' -%}
              {%- else -%}
                {%- set reason_key = 'auth_unconfirmed' -%}
              {%- endif -%}
              {{ {'reachable': true, 'port_open': true,
                  'protocol_supported': true,
                  'auth_success': (true if ok else none),
                  'failure_stage': ('gather' if ok else 'auth'),
                  'failure_code': ('GATHER_FAILED' if ok
                                   else ('CREDENTIAL_SET_UNAVAILABLE' if cred_na
                                         else 'AUTH_PROBE_FAILED')),
                  'failure_reason': (_fr_catalog | failure_reason(
                                       reason_key, 'os',
                                       _cred_location | default(se_location | default('')))),
                  'details': {'channel': 'os', 'detected_os': 'windows',
                              'credential_scope': (_cred_scope | default('')) or none,
                              'selected_port': port,
                              'checked_ports': (_precheck_raw.checked_ports
                                                 | default([5986] if port == 5986 else [5986, 5985])),
                              'auth': (_os_attempts_meta | default({}))}
                    | combine(((_diagnosis | default({}, true)).details | default({}))
                              if (((_diagnosis | default({}, true)).details | default({}))
                                  is mapping) else {})} }}
          when: ((_diagnosis | default({}, true)).failure_reason | default(none)) is none

        - name: "windows | rescue | resolve vendor"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/resolve_vendor.yml"

        - name: "windows | rescue | set failed vars"
          ansible.builtin.set_fact:
            _out_target_type:       "os"
            _out_collection_method: "agent"
            _out_ip:                "{{ _ip }}"
            _fail_sec_supported:    "{{ ((_selected_adapter | default({})).capabilities | default({})).sections_supported
                                        | default(['system','hardware','cpu','memory','storage','network','users']) }}"
            _fail_error_section:    "windows_gather"
            _fail_error_message:    "[task: {{ ansible_failed_task.name | default('unknown') }}] {{ ansible_failed_result.msg | default('Windows 수집 예외') }}"

        - name: "windows | rescue | build_failed_output"
          ansible.builtin.include_tasks:
            file: "{{ lookup('env','REPO_ROOT') }}/common/tasks/normalize/build_failed_output.yml"

        - name: "windows | rescue | inject schema_version"
          ansible.builtin.set_fact:
            _output: "{{ _output | combine({'schema_version': '1'}) }}"

      always:
        - name: OUTPUT
          ansible.builtin.debug:
            msg: "{{ (_output | default({
                       'schema_version': '1',
                       'target_type': 'os',
                       'collection_method': 'agent',
                       'ip': _ip | default(none),
                       'hostname': none,
                       'vendor': none,
                       'status': 'failed',
                       'sections': {'system': 'failed', 'hardware': 'failed', 'bmc': 'not_supported', 'cpu': 'failed', 'memory': 'failed', 'storage': 'failed', 'network': 'failed', 'firmware': 'not_supported', 'users': 'failed', 'power': 'not_supported', 'thermal': 'not_supported'},
                       'diagnosis': {'reachable': none, 'port_open': none, 'protocol_supported': none, 'auth_success': none, 'failure_stage': 'fallback', 'failure_code': 'OUTPUT_BUILD_FAILED', 'failure_reason': _fr_catalog.output_build_failed.default, 'details': {'gather_mode': 'fallback', 'reason': '_output 미생성 (block/rescue 모두 실패)'}},
                       'meta': {'started_at': none, 'finished_at': none, 'duration_ms': none, 'adapter_id': none, 'adapter_version': none, 'ansible_version': none},
                       'correlation': {'serial_number': none, 'system_uuid': none, 'bmc_ip': none, 'host_ip': _ip | default(none)},
                       'errors': [{'section':'gather','message': _fr_catalog.output_build_failed.default,'detail':'_output 미생성 (block/rescue 모두 실패)'}],
                       'data': {'system': none, 'hardware': none, 'bmc': none, 'cpu': none, 'memory': none, 'storage': {'filesystems': [], 'physical_disks': [], 'datastores': [], 'controllers': [], 'logical_volumes': [], 'hbas': [], 'infiniband': [], 'summary': {'groups': [], 'grand_total_gb': 0}}, 'network': {'dns_servers': [], 'default_gateways': [], 'interfaces': [], 'adapters': [], 'ports': [], 'virtual_switches': [], 'portgroups': [], 'driver_map': [], 'summary': {'groups': []}}, 'users': [], 'firmware': [], 'power': none, 'thermal': {'temperatures': [], 'fans': []}}
                     })) | to_json }}"
